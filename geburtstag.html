<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NILS IS 15 - THE LEGEND UNLEASHED</title>
    <style>
        /* Basis Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505; /* Tieferes Schwarz */
            color: #eee;
            font-family: 'Orbitron', sans-serif; /* Cooler Tech-Font */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px; /* Für den 3D-Effekt */
        }

        /* Animierter Matrix-Code Hintergrund */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            opacity: 0.1; /* Sehr subtil, aber da */
            overflow: hidden;
            background: linear-gradient(to bottom, #050505 0%, #000319 100%);
        }
        
        canvas {
            display: block;
        }

        /* Haupt-Container */
        .main-container {
            max-width: 800px;
            width: 90%;
            padding: 50px;
            background: rgba(15, 15, 30, 0.85);
            border: 1px solid #141428;
            border-radius: 25px;
            box-shadow: 0 15px 50px rgba(0, 229, 255, 0.2), 0 5px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease-out;
            transform-style: preserve-3d;
        }
        
        .main-container:hover {
            transform: rotateX(2deg) rotateY(-2deg);
            box-shadow: 0 20px 70px rgba(0, 229, 255, 0.3), 0 8px 25px rgba(0,0,0,0.6);
        }

        /* Neon-Überschrift mit 3D-Tilt */
        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            color: #00e5ff; /* Neon Cyan */
            text-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff, 0 0 30px #00e5ff, 0 0 40px #003399;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            transform: translateZ(30px);
        }

        h1:hover {
            color: #ff00e6; /* Neon Pink beim Hover */
            text-shadow: 0 0 10px #ff00e6, 0 0 20px #ff00e6, 0 0 30px #ff00e6, 0 0 40px #990055;
            transform: translateZ(50px);
        }

        .subtitle {
            font-size: 1.5rem;
            color: #888;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transform: translateZ(15px);
        }

        /* Das Bild-Grid */
        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 40px;
            transform: translateZ(20px);
        }

        .img-container {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 1/1;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 2px solid #141428;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .img-container:hover {
            transform: scale(1.05) rotateZ(1deg);
            box-shadow: 0 10px 25px rgba(0, 229, 255, 0.4);
            border-color: #00e5ff;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .img-container:hover img {
            transform: scale(1.1);
        }
        
        .img-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 15px;
            color: #00e5ff;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Cyber-Button */
        .cyber-btn {
            background-color: #050505;
            color: #00e5ff;
            border: 2px solid #00e5ff;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            margin-top: 20px;
            transform: translateZ(25px);
            z-index: 2;
        }
        
        .cyber-btn::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            width: calc(100% + 10px);
            height: calc(100% + 10px);
            background: linear-gradient(45deg, #00e5ff, #ff00e6);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cyber-btn:hover {
            color: #fff;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.7);
        }
        
        .cyber-btn:hover::before {
            opacity: 1;
        }

        /* Easter Egg Console Log & Alert */
        #console-msg {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: #0f0;
            border: 1px solid #0f0;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            z-index: 100;
        }

    </style>
</head>
<body>

    <!-- Background Canvas -->
    <div id="matrix-bg">
        <canvas id="q"></canvas>
    </div>

    <div class="main-container">
        <h1 onclick="triggerAlert()">NILS IS 15! 🚀</h1>
        <div class="subtitle">LEVEL 15 UNLOCKED. READY PLAYER ONE?</div>

        <div class="gallery">
            <div class="img-container">
                <!-- FÜG DEIN BILD HIER EIN: nils1.jpg -->
                <img src="nils1.jpg" alt="Nils #1">
                <div class="img-overlay">DER BOSS</div>
            </div>
            <div class="img-container">
                <!-- FÜG DEIN BILD HIER EIN: nils2.jpg -->
                <img src="nils2.jpg" alt="Nils #2">
                <div class="img-overlay">LEGEND MODE</div>
            </div>
        </div>

        <button class="cyber-btn" onclick="activateHack()">EPIC GREETING SENDEN</button>
    </div>

    <div id="console-msg">
        &gt; SYSTEM//GREETING_SENT_TO_NILS...<br>
        &gt; STATUS: EPICNESS_CONFIRMED.
    </div>

    <!-- Matrix Background Script -->
    <script>
        var c = document.getElementById("q");
        var ctx = c.getContext("2d");

        c.height = window.innerHeight;
        c.width = window.innerWidth;

        var matrix = "15NILSGANGLEGENDARYGAMINGCODEBIRTHDAYDARKNEONCYBERHACKER";
        matrix = matrix.split("");

        var font_size = 14;
        var columns = c.width / font_size;
        var drops = [];

        for(var x = 0; x < columns; x++)
            drops[x] = 1; 

        function draw() {
            ctx.fillStyle = "rgba(5, 5, 5, 0.05)";
            ctx.fillRect(0, 0, c.width, c.height);

            ctx.fillStyle = "#00e5ff"; // Neon Cyan für Matrix
            ctx.font = font_size + "px arial";

            for(var i = 0; i < drops.length; i++) {
                var text = matrix[Math.floor(Math.random()*matrix.length)];
                ctx.fillText(text, i * font_size, drops[i] * font_size);

                if(drops[i] * font_size > c.height && Math.random() > 0.975)
                    drops[i] = 0;

                drops[i]++;
            }
        }

        setInterval(draw, 35);

        window.addEventListener('resize', resizeCanvas, false);
        function resizeCanvas() {
            c.height = window.innerHeight;
            c.width = window.innerWidth;
            columns = c.width / font_size;
            drops = [];
            for(var x = 0; x < columns; x++) drops[x] = 1;
        }

        // Easter Egg 1: Titel klicken
        function triggerAlert() {
            alert("🚨 SYSTEM_ALERT: Nils hat den ultimativen Button gefunden! Respekt, Digga! 🚨");
        }

        // Easter Egg 2: Button klicken
        function activateHack() {
            const msg = document.getElementById('console-msg');
            msg.style.display = 'block';
            setTimeout(() => {
                msg.style.display = 'none';
            }, 4000);
            console.log("Yo Nils, wenn du das liest, bist du ne Legende! Alles Gute zum 15.! 🎂");
        }
    </script>

</body>
</html>
