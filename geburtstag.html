<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NILS SYSTEM ACCESS</title>
    <style>
        body { background: #050505; color: #00ff00; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; margin: 0; }
        .box { background: #111; border: 2px solid #333; padding: 20px; border-radius: 10px; text-align: center; width: 90%; max-width: 400px; }
        button { background: #00ff00; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-top: 10px; font-family: inherit; width: 100%; }
        input { padding: 10px; width: 80%; background: #000; border: 1px solid #333; color: #fff; text-align: center; font-family: inherit; }
        .hidden { display: none; }
        img { width: 100%; border: 2px solid #00ff00; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Schritt 1: Rätsel -->
    <div id="step1" class="box">
        <p>SYSTEM-CHECK: Wie alt wird der Legende Nils heute?</p>
        <input type="text" id="ageInput" placeholder="Zahl eingeben...">
        <br><button onclick="checkAge()">WEITER 🔒</button>
    </div>

    <!-- Schritt 2: Captcha Fake -->
    <div id="step2" class="box hidden">
        <p>HUMAN VERIFICATION:</p>
        <p>Wähle das Bild aus, auf dem der BOSS zu sehen ist:</p>
        <img src="nils2.jpg" alt="Captcha" onclick="successCaptcha()">
        <p><small>(Klick auf das Bild um dich als Mensch zu verifizieren)</small></p>
    </div>

    <!-- Schritt 3: Rickroll -->
    <div id="step3" class="box hidden">
        <p>STREAM WIRD GELADEN...</p>
        <div id="videoContainer">
            <button onclick="startRickroll()" style="background: #ff0000; color: #fff; margin-bottom: 10px;">▶ STREAM STARTEN (SICHERHEITSHINWEIS)</button>
        </div>
        <br><button onclick="showFinal()">WEITER ➡️</button>
    </div>

    <!-- Finale -->
    <div id="step4" class="box hidden">
        <h1>HERZLICHEN GLÜCKWUNSCH! 🎉</h1>
        <p>Du bist offiziell 15, Bro! Lass krachen!</p>
        <img src="nils1.heic" alt="Nils Foto" style="cursor: default;">
    </div>

    <script>
        function checkAge() {
            if(document.getElementById('ageInput').value.trim() === "15") {
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            } else {
                alert("Falsch, Digga! 💀 Denk nochmal nach!");
            }
        }

        function successCaptcha() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
        }

        function startRickroll() {
            // Ersetzt den Button durch das Video, das jetzt garantiert mit Ton startet (auch in Safari)
            document.getElementById('videoContainer').innerHTML = '<iframe id="rickVideo" width="100%" height="200" src="https://www.youtube.com/embed/xvFZjo5PgG0?autoplay=1" allow="autoplay; encrypted-media" style="border:none;"></iframe>';
        }

        function showFinal() {
            let video = document.getElementById('rickVideo');
            if(video) video.src = ""; // Video stoppen
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('step4').classList.remove('hidden');
        }
    </script>
</body>
</html>
