<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quapsattack - Modpack Vorschläge</title>

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #0a0e17;
      --card-bg: #161c2d;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
      --success-color: #10b981;
      --error-color: #ef4444;
      --pulse-speed: 2s;
      --bar-color: #10b981;
      --curseforge-color: #f16436;
      --curseforge-hover: #e04e1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 20px;
    }

    /* CURSEFORGE LINK BUTTON STYLES */
    .curseforge-btn-container {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }

    .curseforge-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #f16436 0%, #e04e1b 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(241, 100, 54, 0.3);
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .curseforge-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(241, 100, 54, 0.5);
      background: linear-gradient(135deg, #ff7344 0%, #f16436 100%);
    }

    .curseforge-btn:active {
      transform: translateY(0);
    }

    .curseforge-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* TIMER CONTAINER & ANIMATION */
    .timer-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 30px;
    }

    .timer-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .timer-display {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      animation: pulse var(--pulse-speed) infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.75; text-shadow: 0 0 15px rgba(255, 255, 255, 0.4); }
      100% { transform: scale(1); opacity: 1; }
    }

    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      margin-top: 15px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background-color: var(--bar-color);
      border-radius: 6px;
      transition: width 1s linear, background-color 1s ease;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
      font-size: 0.95rem;
    }

    input[type="text"], input[type="url"], select {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus, input[type="url"]:focus, select:focus {
      border-color: var(--accent-color);
    }

    select option {
      background-color: var(--card-bg);
      color: var(--text-main);
    }

    .btn {
      width: 100%;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn:disabled {
      background: #374151;
      color: #9ca3af;
      cursor: not-allowed;
    }

    #statusMessage {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      display: none;
    }

    #statusMessage.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success-color);
      color: #6ee7b7;
      display: block;
    }

    #statusMessage.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error-color);
      color: #fca5a5;
      display: block;
    }

    /* Liste der eingereichten Mods */
    .mod-list-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid var(--border-color);
    }

    .mod-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .mod-list-section h2 {
      font-size: 1.3rem;
      color: #ffffff;
    }

    .sort-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-container label {
      margin-bottom: 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .sort-container select {
      padding: 8px 12px;
      font-size: 0.85rem;
      width: auto;
      cursor: pointer;
    }

    .mod-card {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .mod-card-info {
      flex: 1;
    }

    .mod-card-info h3 {
      font-size: 1.05rem;
      color: #ffffff;
    }

    .mod-card-info a {
      color: var(--accent-color);
      text-decoration: none;
      font-size: 0.85rem;
      word-break: break-all;
    }

    .mod-card-info a:hover {
      text-decoration: underline;
    }

    .mod-card-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    /* Löschen X Button Styling */
    .delete-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: var(--error-color);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .delete-btn:hover {
      background: var(--error-color);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Minecraft Modpack Vorschläge</h1>
      <p class="subtitle">Reiche deine Lieblings-Mods von CurseForge oder Modrinth ein!</p>
      
      <!-- STYLISHER CURSEFORGE BUTTON -->
      <div class="curseforge-btn-container">
        <a href="https://www.curseforge.com/minecraft/modpacks/chillcraft-only-relax" target="_blank" rel="noopener noreferrer" class="curseforge-btn">
          <svg viewBox="0 0 24 24">
            <path d="M18.812 10.125s1.438-1.782.938-4.125c-.438 1.563-1.813 2.125-1.813 2.125s-.375-2.875-2.875-3.813c.875 1.563.313 3.313.313 3.313s-1.813-1.063-3.688-.25c1.188.75 1.438 2.063 1.438 2.063s-1.875-.375-3.188.625c1.125.438 1.5 1.625 1.5 1.625s-2.938.125-3.625 2.125c-.25.75-.188 1.625 0 2.375-1.375-.625-1.938-2.063-1.938-2.063s-.688 1.813.5 3.563c1.188 1.75 3.313 2.125 3.313 2.125s-1.125 1.063-.5 2.125c.625 1.063 2.188.688 2.188.688s.063 1.188 1.125 1.5c1.063.313 2.063-.375 2.063-.375s.563.813 1.563.688c1-.125 1.313-1.125 1.313-1.125s1.25.125 1.75-.75c.5-.875-.125-1.75-.125-1.75s1.375-.5 1.375-1.875c0-1.375-1.25-1.875-1.25-1.875s1.438-.938 1.125-2.563c-.313-1.625-1.813-1.875-1.813-1.875z"/>
          </svg>
          <span>Chillcraft Modpack auf CurseForge</span>
        </a>
      </div>
    </div>

    <!-- LIVE COUNTDOWN TIMER -->
    <div class="timer-card">
      <div class="timer-title">Einsendeschluss: Morgen 15:00 Uhr</div>
      <div class="timer-display" id="timerDisplay">00h 00m 00s</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <!-- EINGABEFORMULAR -->
    <form id="modForm">
      <div class="form-group">
        <label for="modName">Mod Name (Pflichtfeld)</label>
        <input type="text" id="modName" placeholder="z. B. Create, Mekanism, JEI" required>
      </div>

      <div class="form-group">
        <label for="modUrl">CurseForge oder Modrinth Link (Pflichtfeld)</label>
        <input type="url" id="modUrl" placeholder="https://www.curseforge.com/minecraft/mc-mods/..." required>
      </div>

      <button type="submit" class="btn" id="submitBtn">Mod einreichen 🚀</button>
    </form>

    <div id="statusMessage"></div>

    <!-- LISTE BEREITS EINGEREICHTER MODS -->
    <div class="mod-list-section">
      <div class="mod-list-header">
        <h2>Eingereichte Mods</h2>
        <div class="sort-container">
          <label for="sortSelect">Sortieren:</label>
          <select id="sortSelect">
            <option value="newest">Neueste zuerst</option>
            <option value="alpha-asc">Alphabetisch (A-Z)</option>
            <option value="alpha-desc">Alphabetisch (Z-A)</option>
          </select>
        </div>
      </div>
      <div id="modList">Lädt Mods...</div>
    </div>
  </div>

  <script>
    // Supabase Konfiguration
    const SUPABASE_URL = "https://xibaufkxapezpuvszpxf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpYmF1Zmt4YXBlenB1dnN6cHhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjEwNzUsImV4cCI6MjEwMzkzNzA3NX0.Tv3IKj95iBsGy5TGTosb7mMT-d_sySuu7QZ4RpNhB5E";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("modForm");
    const modNameInput = document.getElementById("modName");
    const modUrlInput = document.getElementById("modUrl");
    const submitBtn = document.getElementById("submitBtn");
    const statusMessage = document.getElementById("statusMessage");
    const modList = document.getElementById("modList");
    const sortSelect = document.getElementById("sortSelect");

    const timerDisplay = document.getElementById("timerDisplay");
    const progressBar = document.getElementById("progressBar");

    // --- COUNTDOWN LOGIK (Berlin Zeitzone, Ziel: Morgen 15:00 Uhr) ---
    function getTargetDeadline() {
      const now = new Date();
      // Heutigen Tag um 15:00 Uhr Berliner Zeit berechnen
      const berlinOffsetMinutes = -now.getTimezoneOffset(); // Berücksichtigt Sommer/Winterzeit des Browsers
      
      let deadline = new Date();
      deadline.setDate(now.getDate() + 1); // Morgen
      deadline.setHours(15, 0, 0, 0);      // 15:00 Uhr

      return deadline;
    }

    const startTime = new Date().getTime();
    const targetDeadline = getTargetDeadline().getTime();
    const totalDuration = targetDeadline - startTime;

    let isExpired = false;

    function updateTimer() {
      const now = new Date().getTime();
      const distance = targetDeadline - now;

      if (distance <= 0) {
        isExpired = true;
        timerDisplay.textContent = "ABGELAUFEN 💀";
        document.documentElement.style.setProperty('--pulse-speed', '0s');
        progressBar.style.width = "0%";
        progressBar.style.backgroundColor = "#ef4444";

        // Formular deaktivieren
        modNameInput.disabled = true;
        modUrlInput.disabled = true;
        submitBtn.disabled = true;
        submitBtn.textContent = "Einsendeschluss vorbei 🔒";

        statusMessage.textContent = "Der Einsendeschluss ist erreicht. Es können keine neuen Mods mehr eingereicht werden!";
        statusMessage.className = "error";
        return;
      }

      // Zeit-Berechnungen
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      const formattedH = String(hours).padStart(2, '0');
      const formattedM = String(minutes).padStart(2, '0');
      const formattedS = String(seconds).padStart(2, '0');

      timerDisplay.textContent = `${formattedH}h ${formattedM}m ${formattedS}s`;

      // Dynamische Pulsations-Geschwindigkeit
      if (distance < 60 * 1000) { // Unter 1 Min
        document.documentElement.style.setProperty('--pulse-speed', '0.2s');
      } else if (distance < 10 * 60 * 1000) { // Unter 10 Min
        document.documentElement.style.setProperty('--pulse-speed', '0.5s');
      } else if (distance < 60 * 60 * 1000) { // Unter 1 Std
        document.documentElement.style.setProperty('--pulse-speed', '1s');
      } else {
        document.documentElement.style.setProperty('--pulse-speed', '2s');
      }

      // Fortschrittsbalken & Farbverlauf
      const progressPercent = Math.max(0, Math.min(100, (distance / totalDuration) * 100));
      progressBar.style.width = `${progressPercent}%`;

      // Farbänderung des Balkens (Grün -> Hellgrün -> Gelb -> Orange -> Rot)
      if (progressPercent > 75) {
        progressBar.style.backgroundColor = "#10b981"; // Grün
      } else if (progressPercent > 50) {
        progressBar.style.backgroundColor = "#84cc16"; // Hellgrün
      } else if (progressPercent > 25) {
        progressBar.style.backgroundColor = "#eab308"; // Gelb
      } else if (progressPercent > 10) {
        progressBar.style.backgroundColor = "#f97316"; // Orange
      } else {
        progressBar.style.backgroundColor = "#ef4444"; // Rot
      }
    }

    // Timer initialisieren und jede Sekunde updaten
    updateTimer();
    setInterval(updateTimer, 1000);

    // Mods aus Supabase laden und anzeigen
    async function fetchMods() {
      try {
        let query = supabaseClient.from("modpack_suggestions").select("*");

        const sortOption = sortSelect.value;
        if (sortOption === "alpha-asc") {
          query = query.order("mod_name", { ascending: true });
        } else if (sortOption === "alpha-desc") {
          query = query.order("mod_name", { ascending: false });
        } else {
          query = query.order("created_at", { ascending: false });
        }

        const { data, error } = await query;

        if (error) throw error;

        if (data.length === 0) {
          modList.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem;">Noch keine Mods eingereicht. Sei der Erste! 😎</p>`;
          return;
        }

        modList.innerHTML = data.map(mod => {
          let platform = "Link";
          if (mod.mod_url.includes("curseforge.com")) platform = "CurseForge";
          if (mod.mod_url.includes("modrinth.com")) platform = "Modrinth";

          return `
            <div class="mod-card">
              <div class="mod-card-info">
                <h3>${escapeHtml(mod.mod_name)}</h3>
                <a href="${escapeHtml(mod.mod_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(mod.mod_url)}</a>
              </div>
              <div class="mod-card-actions">
                <span class="badge">${platform}</span>
                <button class="delete-btn" onclick="deleteMod('${mod.id}')" title="Mod löschen">✕</button>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Fehler beim Laden:", err);
        modList.innerHTML = `<p style="color: var(--error-color);">Fehler beim Laden der Mods.</p>`;
      }
    }

    // Mod aus Supabase löschen
    async function deleteMod(id) {
      if (!confirm("Möchtest du diese Mod wirklich aus der Liste entfernen? 💀")) {
        return;
      }

      try {
        const { error } = await supabaseClient
          .from("modpack_suggestions")
          .delete()
          .eq("id", id);

        if (error) throw error;

        fetchMods();

      } catch (err) {
        console.error("Fehler beim Löschen:", err);
        alert("Fehler beim Löschen der Mod!");
      }
    }

    // Event Listener für Sortierung
    sortSelect.addEventListener("change", () => {
      fetchMods();
    });

    // Formular Absenden
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      if (isExpired) {
        alert("Die Frist ist leider abgelaufen! 💀");
        return;
      }

      statusMessage.style.display = "none";

      const modName = modNameInput.value.trim();
      const modUrl = modUrlInput.value.trim();

      if (!modName || !modUrl) {
        statusMessage.textContent = "Bitte alle Felder ausfüllen!";
        statusMessage.className = "error";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Wird gespeichert...";

      try {
        const { error } = await supabaseClient
          .from("modpack_suggestions")
          .insert([{ mod_name: modName, mod_url: modUrl }]);

        if (error) throw error;

        statusMessage.textContent = "Mod-Vorschlag erfolgreich eingereicht! 🔥";
        statusMessage.className = "success";
        form.reset();
        
        fetchMods();

      } catch (err) {
        console.error("Fehler beim Speichern:", err);
        statusMessage.textContent = "Fehler beim Einreichen. Bitte erneut versuchen!";
        statusMessage.className = "error";
      } finally {
        if (!isExpired) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Mod einreichen 🚀";
        }
      }
    });

    // Hilfsfunktion gegen XSS
    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // Beim Start Mods laden
    fetchMods();
  </script>
</body>
</html>
