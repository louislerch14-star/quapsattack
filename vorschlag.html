<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quapsattack - Modpack Vorschläge</title>

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #0a0e17;
      --card-bg: #161c2d;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
      --success-color: #10b981;
      --error-color: #ef4444;
      --curseforge-color: #f16436;
      --curseforge-hover: #e04e1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 20px;
    }

    /* CURSEFORGE LINK BUTTON STYLES */
    .curseforge-btn-container {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }

    .curseforge-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #f16436 0%, #e04e1b 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(241, 100, 54, 0.3);
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .curseforge-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(241, 100, 54, 0.5);
      background: linear-gradient(135deg, #ff7344 0%, #f16436 100%);
    }

    .curseforge-btn:active {
      transform: translateY(0);
    }

    .curseforge-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* TIMER CONTAINER */
    .timer-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 30px;
    }

    .timer-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-color);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .timer-display {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      margin-top: 15px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background-color: var(--accent-color);
      border-radius: 6px;
      transition: width 1s linear;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
      font-size: 0.95rem;
    }

    input[type="text"], input[type="url"], select {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus, input[type="url"]:focus, select:focus {
      border-color: var(--accent-color);
    }

    .btn {
      width: 100%;
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn:disabled {
      background: #374151;
      color: #9ca3af;
      cursor: not-allowed;
      transform: none;
    }

    #statusMessage {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      display: none;
    }

    #statusMessage.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success-color);
      color: #6ee7b7;
    }

    #statusMessage.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error-color);
      color: #fca5a5;
    }

    /* Liste der eingereichten Mods */
    .mod-list-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid var(--border-color);
    }

    .mod-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .mod-list-section h2 {
      font-size: 1.3rem;
      color: #ffffff;
    }

    .sort-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-container label {
      margin-bottom: 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .sort-container select {
      padding: 8px 12px;
      font-size: 0.85rem;
      width: auto;
      cursor: pointer;
    }

    .mod-card {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .mod-card-info {
      flex: 1;
    }

    .mod-card-info h3 {
      font-size: 1.05rem;
      color: #ffffff;
    }

    .mod-card-info a {
      color: var(--accent-color);
      text-decoration: none;
      font-size: 0.85rem;
      word-break: break-all;
    }

    .mod-card-info a:hover {
      text-decoration: underline;
    }

    .mod-card-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    /* Löschen X Button Styling */
    .delete-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: var(--error-color);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .delete-btn:hover {
      background: var(--error-color);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Minecraft Modpack Vorschläge</h1>
      <p class="subtitle">Reiche deine Wunsch-Mods für das Modpack ein!</p>
      
      <!-- STYLISHER CURSEFORGE BUTTON -->
      <div class="curseforge-btn-container">
        <a href="https://www.curseforge.com/minecraft/modpacks/chillcraft-only-relax" target="_blank" rel="noopener noreferrer" class="curseforge-btn">
          <svg viewBox="0 0 24 24">
            <path d="M18.812 10.125s1.438-1.782.938-4.125c-.438 1.563-1.813 2.125-1.813 2.125s-.375-2.875-2.875-3.813c.875 1.563.313 3.313.313 3.313s-1.813-1.063-3.688-.25c1.188.75 1.438 2.063 1.438 2.063s-1.875-.375-3.188.625c1.125.438 1.5 1.625 1.5 1.625s-2.938.125-3.625 2.125c-.25.75-.188 1.625 0 2.375-1.375-.625-1.938-2.063-1.938-2.063s-.688 1.813.5 3.563c1.188 1.75 3.313 2.125 3.313 2.125s-1.125 1.063-.5 2.125c.625 1.063 2.188.688 2.188.688s.063 1.188 1.125 1.5c1.063.313 2.063-.375 2.063-.375s.563.813 1.563.688c1-.125 1.313-1.125 1.313-1.125s1.25.125 1.75-.75c.5-.875-.125-1.75-.125-1.75s1.375-.5 1.375-1.875c0-1.375-1.25-1.875-1.25-1.875s1.438-.938 1.125-2.563c-.313-1.625-1.813-1.875-1.813-1.875z"/>
          </svg>
          <span>Chillcraft Modpack auf CurseForge</span>
        </a>
      </div>
    </div>

    <!-- TIMER CARD -->
    <div class="timer-card">
      <div class="timer-title" id="timerTitle">Einsendeschluss in</div>
      <div class="timer-display" id="timerDisplay">00d 00h 00m 00s</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <!-- EINGABEFORMULAR -->
    <form id="modForm">
      <div class="form-group">
        <label for="modName">Mod Name</label>
        <input type="text" id="modName" placeholder="z. B. Create, Applied Energistics 2..." required>
      </div>

      <div class="form-group">
        <label for="modUrl">CurseForge oder Modrinth Link</label>
        <input type="url" id="modUrl" placeholder="https://www.curseforge.com/minecraft/mc-mods/..." required>
      </div>

      <button type="submit" class="btn" id="submitBtn">Mod einreichen 🚀</button>
    </form>

    <div id="statusMessage"></div>

    <!-- LISTE BEREITS EINGEREICHTER MODS -->
    <div class="mod-list-section">
      <div class="mod-list-header">
        <h2>Eingereichte Mods</h2>
        <div class="sort-container">
          <label for="sortSelect">Sortieren:</label>
          <select id="sortSelect">
            <option value="newest">Neueste zuerst</option>
            <option value="alpha-asc">Alphabetisch (A-Z)</option>
            <option value="alpha-desc">Alphabetisch (Z-A)</option>
          </select>
        </div>
      </div>
      <div id="modList">Lädt Mods...</div>
    </div>
  </div>

  <script>
    // Supabase Konfiguration
    const SUPABASE_URL = "https://xibaufkxapezpuvszpxf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpYmF1Zmt4YXBlenB1dnN6cHhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjEwNzUsImV4cCI6MjEwMzkzNzA3NX0.Tv3IKj95iBsGy5TGTosb7mMT-d_sySuu7QZ4RpNhB5E";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const modForm = document.getElementById("modForm");
    const modNameInput = document.getElementById("modName");
    const modUrlInput = document.getElementById("modUrl");
    const submitBtn = document.getElementById("submitBtn");
    const statusMessage = document.getElementById("statusMessage");
    const modList = document.getElementById("modList");
    const sortSelect = document.getElementById("sortSelect");

    // Timer Konfiguration (Passe das Enddatum hier an!)
    const COUNTDOWN_TARGET = new Date("2026-10-01T23:59:59").getTime(); 
    const COUNTDOWN_START = new Date("2026-09-01T00:00:00").getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const distance = COUNTDOWN_TARGET - now;
      const totalDuration = COUNTDOWN_TARGET - COUNTDOWN_START;

      if (distance < 0) {
        document.getElementById("timerTitle").innerText = "EINSENDESCHLUSS ERREICHT";
        document.getElementById("timerTitle").style.color = "var(--error-color)";
        document.getElementById("timerDisplay").innerText = "ABGELAUFEN 🔒";
        document.getElementById("progressBar").style.width = "0%";
        document.getElementById("progressBar").style.backgroundColor = "var(--error-color)";
        
        modNameInput.disabled = true;
        modUrlInput.disabled = true;
        submitBtn.disabled = true;
        submitBtn.innerText = "Einsendeschluss vorbei 🔒";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("timerDisplay").innerText = 
        `${String(days).padStart(2, '0')}d ${String(hours).padStart(2, '0')}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;

      const progressPercent = Math.max(0, Math.min(100, (distance / totalDuration) * 100));
      document.getElementById("progressBar").style.width = progressPercent + "%";
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    // Formular Absenden
    modForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const modName = modNameInput.value.trim();
      const modUrl = modUrlInput.value.trim();

      if (!modName || !modUrl) return;

      submitBtn.disabled = true;
      submitBtn.innerText = "Wird gesendet...";
      statusMessage.className = "";
      statusMessage.innerText = "";

      try {
        const { data, error } = await supabaseClient
          .from("modpack_suggestions")
          .insert([{ mod_name: modName, mod_url: modUrl }]);

        if (error) throw error;

        statusMessage.className = "success";
        statusMessage.innerText = "Mod erfolgreich eingereicht! 🔥";
        modForm.reset();
        fetchMods();

      } catch (err) {
        console.error("Fehler beim Einsenden:", err);
        statusMessage.className = "error";
        statusMessage.innerText = "Fehler beim Einreichen. Bitte versuche es erneut! 💀";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Mod einreichen 🚀";
      }
    });

    // Mods aus Supabase laden und anzeigen
    async function fetchMods() {
      try {
        let query = supabaseClient.from("modpack_suggestions").select("*");

        const sortOption = sortSelect.value;
        if (sortOption === "alpha-asc") {
          query = query.order("mod_name", { ascending: true });
        } else if (sortOption === "alpha-desc") {
          query = query.order("mod_name", { ascending: false });
        } else {
          query = query.order("created_at", { ascending: false });
        }

        const { data, error } = await query;

        if (error) throw error;

        if (!data || data.length === 0) {
          modList.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem;">Noch keine Mods eingereicht. Sei der Erste! 😉</p>`;
          return;
        }

        modList.innerHTML = data.map(mod => {
          let platform = "Link";
          if (mod.mod_url.includes("curseforge.com")) platform = "CurseForge";
          if (mod.mod_url.includes("modrinth.com")) platform = "Modrinth";

          return `
            <div class="mod-card">
              <div class="mod-card-info">
                <h3>${escapeHtml(mod.mod_name)}</h3>
                <a href="${escapeHtml(mod.mod_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(mod.mod_url)}</a>
              </div>
              <div class="mod-card-actions">
                <span class="badge">${platform}</span>
                <button class="delete-btn" onclick="deleteMod('${mod.id}')" title="Mod löschen">✕</button>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Fehler beim Laden:", err);
        modList.innerHTML = `<p style="color: var(--error-color);">Fehler beim Laden der Mods.</p>`;
      }
    }

    // Mod aus Supabase löschen
    async function deleteMod(id) {
      if (!confirm("Möchtest du diese Mod wirklich aus der Liste entfernen? 💀")) {
        return;
      }

      try {
        const { error } = await supabaseClient
          .from("modpack_suggestions")
          .delete()
          .eq("id", id);

        if (error) throw error;

        fetchMods();

      } catch (err) {
        console.error("Fehler beim Löschen:", err);
        alert("Fehler beim Löschen der Mod!");
      }
    }

    // Event Listener für Sortierung
    sortSelect.addEventListener("change", () => {
      fetchMods();
    });

    // Hilfsfunktion gegen XSS
    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // Beim Start Mods laden
    fetchMods();
  </script>
</body>
</html>
