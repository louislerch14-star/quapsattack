<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request | Quaps Evolved</title>
    <link rel="icon" type="image/x-icon" href="quaps-evoluted.jpg">
    <style>
        :root { --accent: #00d4ff; }
        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: #050507; color: white;
            display: flex; flex-direction: column; min-height: 100vh;
        }
        .main-flex { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        
        .form-card {
            background: #0c0c0e;
            padding: 60px; border-radius: 10px; width: 100%; max-width: 450px;
            border: 1px solid #1a1a1c;
        }
        h2 { font-size: 2rem; font-weight: 900; margin-bottom: 40px; text-align: center; }
        
        label { display: block; font-size: 0.7rem; color: #555; text-transform: uppercase; margin-bottom: 10px; font-weight: bold; letter-spacing: 1px; }
        
        input, textarea {
            width: 100%; padding: 18px; background: #050507;
            border: 1px solid #1a1a1c; border-radius: 5px; color: white; box-sizing: border-box;
            margin-bottom: 25px; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); outline: none; }
        
        button {
            width: 100%; padding: 20px; background: #fff; color: #000;
            border: none; font-weight: 900; text-transform: uppercase; cursor: pointer;
            transition: 0.3s; letter-spacing: 1px;
        }
        button:hover { background: var(--accent); color: #fff; }

        footer { background: #000; padding: 30px; text-align: center; color: #222; font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>
    <nav style="padding: 30px; text-align: center;">
        <a href="evoluted.html" style="color: #444; text-decoration: none; font-size: 0.8rem; font-weight: bold;">← BACK TO PORTAL</a>
    </nav>

    <div class="main-flex">
        <div class="form-card">
            <h2>MOD REQUEST</h2>
            <form action="https://formspree.io/f/xdabgyro" method="POST">
                <label>Username</label>
                <input type="text" name="name" required>
                
                <label>Mod Title</label>
                <input type="text" name="mod" required>
                
                <label>Official Link</label>
                <input type="url" name="url" required>
                
                <label>Description</label>
                <textarea name="desc" rows="3"></textarea>
                
                <button type="submit">Submit Request</button>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2026 QUAPS ATTACK OFFICIAL
    </footer>
</body>
</html>
