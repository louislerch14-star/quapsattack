<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quaps Evolved | Official Portal</title>
    <link rel="icon" type="image/x-icon" href="quaps-evoluted.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-blue: #00d4ff;
            --accent-purple: #7000ff;
            --bg-dark: #050507;
            --card-bg: rgba(20, 20, 25, 0.7);
            --locked: #333;
        }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background: #000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(5, 5, 7, 0.6), rgba(5, 5, 7, 0.9)), 
                        url('quaps-evoluted.jpg') center/cover no-repeat fixed;
            z-index: -1;
        }

        nav {
            position: fixed;
            top: 0; width: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            padding: 20px 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        nav a {
            color: #888;
            text-decoration: none;
            margin: 0 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            transition: 0.3s;
        }

        nav a:hover { color: var(--accent-blue); }

        .content {
            position: relative;
            z-index: 10;
            padding: 140px 20px 60px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            margin: 0;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff 30%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 50px;
        }

        /* DOWNLOAD SECTION */
        .download-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--accent-blue);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 50px;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .download-status {
            font-size: 0.8rem;
            color: #ff4444;
            margin-bottom: 20px;
            font-weight: bold;
            display: block;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .dl-btn {
            display: inline-block;
            padding: 18px 40px;
            border-radius: 8px;
            font-weight: 900;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.4s;
            background: var(--locked);
            color: #555;
            pointer-events: none;
            border: 1px solid transparent;
        }

        .dl-btn.active {
            background: var(--accent-blue);
            color: #000;
            pointer-events: auto;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            cursor: pointer;
        }

        .dl-btn.active:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        /* PLAYER TABLE */
        .crew-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 50px 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            margin-top: 50px;
        }

        .player-table {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 30px;
            justify-items: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .player-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-box {
            width: 80px; height: 80px;
            background: #111;
            border: 2px solid var(--accent-blue);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 15px;
        }

        .avatar-box img {
            width: 100%; height: 100%;
            image-rendering: pixelated;
            border-radius: 4px;
            object-fit: cover;
        }

        .username { font-weight: 900; text-transform: uppercase; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="bg-wrapper"></div>

    <nav>
        <a href="index.html">Vanilla</a>
        <a href="evoluted.html" style="color: white;">Portal</a>
        <a href="upload.html">Requests</a>
    </nav>

    <div class="content">
        <h1>QUAPS EVOLVED</h1>
        
        <div class="download-box">
            <span id="dl-status" class="download-status">SYSTEM LOCKED // RELEASE: 08.07.2026 - 17:00 UHR</span>
            <a href="https://drive.google.com/file/d/1er1o1_eXLc3kDnW_8orwYWvCtLrDdJMp/view?usp=drive_link" 
               id="download-btn" class="dl-btn" target="_blank">
               Download Modpack
            </a>
        </div>

        <div class="crew-section">
            <div class="player-table">
                <div class="player-cell">
                    <div class="avatar-box"><img src="https://skinmc.net/api/v1/renders/skins/3f470272-6f03-4dab-882f-f24e189cc1de/tools/grayscale/head"></div>
                    <div class="username">Lois_7</div>
                </div>
                </div>
        </div>
    </div>

    <script>
        function checkRelease() {
            const now = new Date();
            // NEUES DATUM: 08. Juli 2026, 17:00:00 Uhr
            // Jahr, Monat (6 = Juli), Tag (8), Stunde (17)
            const releaseDate = new Date(2026, 6, 8, 17, 0, 0); 
            
            const btn = document.getElementById('download-btn');
            const status = document.getElementById('dl-status');

            if (now >= releaseDate) {
                btn.classList.add('active');
                status.innerText = "ACCESS GRANTED // DOWNLOAD READY";
                status.style.color = "#00ff88";
            } else {
                btn.classList.remove('active');
                status.innerText = "SYSTEM LOCKED // AVAILABLE: 08.07.2026 - 17:00 UHR";
                status.style.color = "#ff4444";
            }
        }
        
        checkRelease();
        setInterval(checkRelease, 30000);
    </script>

</body>
</html>
