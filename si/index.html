<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>QuapsSI — AI Workspace</title>
  <link rel="icon" type="image/jpeg" href="/unnamed.jpg" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
        --bg-main: #0a0a12;
        --glass-bg: rgba(20, 20, 35, 0.92);
        --glass-border: rgba(255, 255, 255, 0.15);
        --demo-box-bg: rgba(255, 255, 255, 0.05);
        --demo-box-border: rgba(255, 255, 255, 0.12);
        --accent: #ef4444;
        --accent-glow: rgba(239, 68, 68, 0.4);
        --text-main: #ffffff;
        --text-sub: rgba(255, 255, 255, 0.72);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg-main);
        background-image: 
            radial-gradient(circle at 15% 20%, rgba(239, 68, 68, 0.15) 0%, transparent 45%),
            radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 45%);
        background-attachment: fixed;
        color: var(--text-main);
        height: 100dvh;
        min-height: 100dvh;
        display: flex;
        overflow: hidden;
        padding-bottom: env(safe-area-inset-bottom);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    pre { background: #0f172a; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; border: 1px solid #1e293b; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }

    /* Auth Overlay */
    #auth-screen {
        position: fixed;
        inset: 0;
        background: var(--bg-main);
        background-image: inherit;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .auth-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 20px;
        padding: 35px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .glass-input {
        width: 100%;
        background: var(--demo-box-bg);
        border: 1px solid var(--demo-box-border);
        border-radius: 12px;
        padding: 12px 16px;
        color: #fff;
        font-size: 16px;
        outline: none;
        transition: all 0.2s ease;
    }
    .glass-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 15px var(--accent-glow);
    }

    .btn-primary {
        background: var(--accent);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 12px;
        padding: 12px 24px;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        box-shadow: 0 4px 25px var(--accent-glow);
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-block;
        width: 100%;
        text-align: center;
        touch-action: manipulation;
    }
    .btn-primary:hover {
        background: #dc2626;
        box-shadow: 0 4px 35px rgba(239, 68, 68, 0.6);
        transform: translateY(-1px);
    }

    /* Custom Dropdown Styling */
    .custom-dropdown {
        position: relative;
        user-select: none;
    }

    .dropdown-btn {
        background: var(--demo-box-bg);
        border: 1px solid var(--demo-box-border);
        border-radius: 12px;
        padding: 9px 14px;
        color: #fff;
        font-size: 0.85rem;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        min-width: 260px;
        touch-action: manipulation;
    }
    .dropdown-btn:hover {
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.08);
    }

    .dropdown-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        width: 100%;
        min-width: 290px;
        background: #141423;
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        z-index: 50;
        display: none;
        overflow: hidden;
    }
    .dropdown-menu.show {
        display: block;
    }

    .dropdown-item {
        padding: 11px 14px;
        font-size: 0.85rem;
        color: var(--text-sub);
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
    }
    .dropdown-item:hover {
        background: rgba(239, 68, 68, 0.15);
        color: #fff;
    }
    .dropdown-item.active {
        background: rgba(239, 68, 68, 0.25);
        color: #fff;
        font-weight: 600;
    }

    /* Sidebar & Main */
    #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 260px;
        background: var(--glass-bg);
        border-right: 1px solid var(--glass-border);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        z-index: 40;
        display: flex;
        flex-direction: column;
        transition: transform 0.28s ease;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
    }

    @media (max-width: 768px) {
        #sidebar {
            transform: translateX(-100%);
        }
        #sidebar.open {
            transform: translateX(0);
        }
    }

    #sidebar.collapsed {
        transform: translateX(-100%);
    }

    #main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        min-height: 0;
        margin-left: 260px;
        transition: margin-left 0.28s ease;
        width: calc(100% - 260px);
    }

    @media (max-width: 768px) {
        #main-content {
            margin-left: 0 !important;
            width: 100% !important;
        }
    }

    @media (min-width: 769px) and (max-width: 1180px) {
        #sidebar {
            width: 235px;
        }
        #main-content {
            margin-left: 235px;
            width: calc(100% - 235px);
        }
        #main-content.expanded {
            margin-left: 0;
            width: 100%;
        }
        .dropdown-btn {
            min-width: 235px;
            font-size: 0.82rem;
        }
    }

    #main-content.expanded {
        margin-left: 0;
        width: 100%;
    }

    .glass-header {
        background: var(--glass-bg);
        border-bottom: 1px solid var(--glass-border);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }

    .glass-footer {
        background: var(--glass-bg);
        border-top: 1px solid var(--glass-border);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding-bottom: max(1rem, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body>

  <!-- AUTH OVERLAY -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="mb-6 text-center flex flex-col items-center">
        <img src="/unnamed.jpg" alt="Logo" class="w-14 h-14 rounded-2xl object-cover mb-3 border border-white/20 shadow-lg" onerror="this.style.display='none'" />
        <h1 class="text-3xl font-black tracking-tight text-white mb-1">Quaps<span>SI</span></h1>
        <p class="text-xs text-[var(--text-sub)]">Dein privates AI-Workspace</p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-[var(--text-sub)] mb-1">E-Mail</label>
          <input id="auth-email" type="email" placeholder="name@quapsattack.airbusfan.de" class="glass-input" />
        </div>
        <div>
          <label class="block text-xs font-medium text-[var(--text-sub)] mb-1">Passwort</label>
          <input id="auth-password" type="password" placeholder="••••••••" class="glass-input" />
        </div>
        <p id="auth-error" class="text-xs text-red-400 hidden"></p>
        <div class="pt-2">
          <button type="button" onclick="secureLogin()" class="btn-primary">Anmelden</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="p-4 flex items-center justify-between border-b border-[var(--glass-border)]">
      <div class="flex items-center gap-3">
        <img src="/unnamed.jpg" alt="Logo" class="w-9 h-9 rounded-xl object-cover border border-white/20" onerror="this.style.display='none'" />
        <span class="font-black text-lg tracking-tight">Quaps<span style="color:var(--accent);">SI</span></span>
      </div>
      <button onclick="toggleSidebar()" class="p-2 rounded-xl hover:bg-white/10 text-[var(--text-sub)] hover:text-white transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>

    <div class="p-4">
      <button onclick="createNewChat()" class="w-full bg-white/10 hover:bg-white/20 border border-white/20 text-white font-semibold text-xs py-3 px-4 rounded-xl flex items-center gap-2 transition shadow-md">
        <span class="text-base font-bold">+</span> Neuer Chat
      </button>
    </div>

    <div class="px-4 pb-2 text-[10px] font-semibold text-[var(--text-sub)] tracking-wider uppercase">Deine Chats</div>
    
    <div id="chat-list" class="flex-1 overflow-y-auto px-3 space-y-1 pb-4"></div>

    <div class="p-4 border-t border-[var(--glass-border)] flex items-center justify-between text-xs text-[var(--text-sub)]">
      <span id="user-email-display" class="truncate max-w-[130px]"></span>
      <button onclick="handleLogout()" class="text-red-400 hover:text-red-300 font-semibold">Logout</button>
    </div>
  </aside>

  <!-- MAIN CHAT AREA -->
  <main id="main-content">
    <header class="h-16 shrink-0 glass-header px-4 md:px-6 flex items-center justify-between z-30">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="p-2 rounded-xl hover:bg-white/10 text-[var(--text-sub)] hover:text-white transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>

        <!-- CUSTOM DROPDOWN -->
        <div class="custom-dropdown" id="model-dropdown">
          <div class="dropdown-btn" onclick="toggleDropdown()">
            <span id="selected-model-text">Groq: Auto-Modell (Schnell & Stark)</span>
            <svg class="w-4 h-4 text-slate-400 transition-transform duration-200" id="dropdown-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
          <div class="dropdown-menu" id="dropdown-menu-box">
            <div class="dropdown-item active" onclick="selectModel('groq:auto', 'Groq: Auto-Modell (Schnell & Stark)')">Groq: Auto-Modell (Schnell & Stark)</div>
            <div class="dropdown-item" onclick="selectModel('groq:llama-3.3-70b-versatile', 'Groq: Llama 3.3 70B')">Groq: Llama 3.3 70B</div>
            <div class="dropdown-item" onclick="selectModel('gemini:gemini-2.5-flash', 'Gemini 2.5 Flash')">Gemini 2.5 Flash</div>
            <div class="dropdown-item" onclick="selectModel('image-flux', 'Bild-Generator (FLUX Free)')">Bild-Generator (FLUX Free)</div>
          </div>
        </div>
      </div>
    </header>

    <!-- MESSAGES -->
    <div id="messages-container" class="flex-1 min-h-0 overflow-y-auto p-4 md:p-6 space-y-5">
      <div class="text-center text-[var(--text-sub)] text-sm mt-20 md:mt-32">
        QuapsSI ist am Start, digger! 💀<br>
        Frag mich was zu Quapspedia, den Playern oder einfach los. 😉
      </div>
    </div>

    <!-- INPUT -->
    <div class="p-3 md:p-5 shrink-0 glass-footer">
      <form onsubmit="sendMessage(event)" class="max-w-4xl mx-auto flex gap-2.5 md:gap-3">
        <input id="prompt-input" type="text" placeholder="Nachricht an QuapsSI schreiben..." autocomplete="off" class="glass-input flex-1 py-3 px-4" />
        <button id="send-btn" type="submit" class="btn-primary w-auto px-5 md:px-6 py-3 shrink-0">Senden</button>
      </form>
    </div>
  </main>

  <script>
    // === SUPABASE & API KEYS ===
    const SUPABASE_URL = "https://xibaufkxapezpuvszpxf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpYmF1Zmt4YXBlenB1dnN6cHhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjEwNzUsImV4cCI6MjEwMzkzNzA3NX0.Tv3IKj95iBsGy5TGTosb7mMT-d_sySuu7QZ4RpNhB5E";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const GEMINI_KEY = "AQ.Ab8RN6K2I-hsLsO513OcUYYYn4hknAn97DE7w8hdCRcSPnjTNQ";
    const GROQ_KEY = "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";

    // Kurz, direkt, ohne Geplapper, mit Quapspedia-Fokus
    const BASE_SYSTEM_PROMPT = `Du bist QuapsSI für QuapsAttack / Quapspedia.
Regeln:
1. Antworte IMMER auf Deutsch, außer der Nutzer verlangt ausdrücklich eine andere Sprache.
2. Sei kurz, direkt und plappere nicht unnötig rum.
3. Nutze Jugendsprache (digger, bro, bruder, ich checke) und passende Emojis (💀, 😢, 😉).
4. Nutze die Player-Daten aus der Supabase-Tabelle quaps_players (Quapspedia), wenn es um Spieler oder Quapspedia geht.`;

    let currentUser = null;
    let currentChatId = null;
    let selectedModelValue = "groq:auto";

    window.addEventListener("DOMContentLoaded", () => {
      const savedEmail = localStorage.getItem("quapssi_user");
      if (savedEmail) {
        initApp({ id: savedEmail, email: savedEmail });
      }

      window.addEventListener("click", (e) => {
        const dropdown = document.getElementById("model-dropdown");
        if (dropdown && !dropdown.contains(e.target)) {
          closeDropdown();
        }
      });
    });

    function toggleDropdown() {
      const menu = document.getElementById("dropdown-menu-box");
      const arrow = document.getElementById("dropdown-arrow");
      if (!menu) return;
      menu.classList.toggle("show");
      if (arrow) arrow.style.transform = menu.classList.contains("show") ? "rotate(180deg)" : "rotate(0deg)";
    }

    function closeDropdown() {
      const menu = document.getElementById("dropdown-menu-box");
      const arrow = document.getElementById("dropdown-arrow");
      if (menu) menu.classList.remove("show");
      if (arrow) arrow.style.transform = "rotate(0deg)";
    }

    function selectModel(value, label) {
      selectedModelValue = value;
      const modelText = document.getElementById("selected-model-text");
      if (modelText) modelText.textContent = label;
      
      const items = document.querySelectorAll(".dropdown-item");
      items.forEach(item => {
        if (item.textContent === label) {
          item.classList.add("active");
        } else {
          item.classList.remove("active");
        }
      });

      closeDropdown();
    }

    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const main = document.getElementById("main-content");
      if (!sidebar || !main) return;
      if (window.innerWidth <= 768) {
        sidebar.classList.toggle("open");
      } else {
        sidebar.classList.toggle("collapsed");
        main.classList.toggle("expanded");
      }
    }

    async function secureLogin() {
      const emailInput = document.getElementById("auth-email");
      const passwordInput = document.getElementById("auth-password");
      if (!emailInput || !passwordInput) return;
      
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;
      
      if (!email || !password) return showAuthError("E-Mail und Passwort fehlen, digger! 💀");

      const { data: userRecord, error: fetchError } = await sb.from("allowed_users").select("*").eq("email", email).single();

      if (fetchError || !userRecord) return showAuthError("❌ E-Mail nicht freigeschaltet, digger! 😢");

      if (!userRecord.password) {
        await sb.from("allowed_users").update({ password: password }).eq("email", email);
      } else {
        if (userRecord.password !== password) return showAuthError("❌ Falsches Passwort, digger! 😢");
      }

      localStorage.setItem("quapssi_user", email);
      initApp({ id: email, email: email });
    }

    function handleLogout() {
      localStorage.removeItem("quapssi_user");
      location.reload();
    }

    function showAuthError(msg) {
      const el = document.getElementById("auth-error");
      if (!el) return;
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    async function initApp(user) {
      currentUser = user;
      const authScreen = document.getElementById("auth-screen");
      if (authScreen) authScreen.style.display = "none";
      const emailDisplay = document.getElementById("user-email-display");
      if (emailDisplay) emailDisplay.textContent = user.email;
      try {
        await loadChats();
      } catch (err) {
        console.log("Fehler beim Init:", err);
      }
    }

    async function loadChats() {
      if (!currentUser) return;
      const { data, error } = await sb.from("chats").select("*").eq("user_id", currentUser.id).order("created_at", { ascending: false });
      if (error) {
        console.error("Ladefehler Chats:", error);
        return;
      }
      const list = document.getElementById("chat-list");
      if (!list) return;
      list.innerHTML = "";
      if (!data || data.length === 0) return;

      data.forEach(chat => {
        const wrapper = document.createElement("div");
        wrapper.className = `flex items-center justify-between px-3 py-2 rounded-xl text-sm transition group ${chat.id === currentChatId ? "bg-white/15 text-white border border-white/20" : "text-[var(--text-sub)] hover:bg-white/5 hover:text-white"}`;
        
        const titleSpan = document.createElement("span");
        titleSpan.className = "truncate flex-1 cursor-pointer font-medium";
        titleSpan.textContent = chat.title;
        titleSpan.onclick = () => {
          selectChat(chat.id, chat.model);
          if (window.innerWidth <= 768) {
            const sbElem = document.getElementById("sidebar");
            if (sbElem) sbElem.classList.remove("open");
          }
        };

        const delBtn = document.createElement("button");
        delBtn.className = "opacity-80 md:opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-300 p-1 transition";
        delBtn.innerHTML = "🗑️";
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteChat(chat.id);
        };

        wrapper.appendChild(titleSpan);
        wrapper.appendChild(delBtn);
        list.appendChild(wrapper);
      });

      if (!currentChatId && data.length > 0) {
        selectChat(data[0].id, data[0].model);
      }
    }

    async function deleteChat(chatId) {
      if (!confirm("Chat löschen, digger?")) return;
      await sb.from("messages").delete().eq("chat_id", chatId);
      await sb.from("chats").delete().eq("id", chatId);
      if (currentChatId === chatId) {
        currentChatId = null;
        const msgContainer = document.getElementById("messages-container");
        if (msgContainer) msgContainer.innerHTML = `<div class="text-center text-[var(--text-sub)] text-sm mt-20">Gelöscht, bro! 💀</div>`;
      }
      await loadChats();
    }

    async function createNewChat() {
      const model = selectedModelValue;
      const { data, error } = await sb.from("chats").insert({
        user_id: currentUser.id,
        title: "Neuer Chat",
        model: model
      }).select().single();

      if (!error && data) {
        currentChatId = data.id;
        await loadChats();
        const msgContainer = document.getElementById("messages-container");
        if (msgContainer) msgContainer.innerHTML = "";
        if (window.innerWidth <= 768) {
          const sbElem = document.getElementById("sidebar");
          if (sbElem) sbElem.classList.remove("open");
        }
      }
    }

    async function selectChat(chatId, model) {
      currentChatId = chatId;
      if (model) {
        selectedModelValue = model;
        const items = document.querySelectorAll(".dropdown-item");
        items.forEach(item => {
          if (item.getAttribute("onclick") && item.getAttribute("onclick").includes(model)) {
            selectModel(model, item.textContent);
          }
        });
      }
      await loadChats();

      const { data } = await sb.from("messages").select("*").eq("chat_id", chatId).order("created_at", { ascending: true });
      const container = document.getElementById("messages-container");
      if (!container) return;
      container.innerHTML = "";
      if (data) data.forEach(msg => renderMessage(msg));
    }

    async function buildDatabaseContext() {
      try {
        const { data: players, error } = await sb
          .from("quaps_players")
          .select("*")
          .limit(50);

        if (error || !players || players.length === 0) {
          return "\n\n[Quapspedia / quaps_players: Keine Player-Einträge gefunden oder Tabelle leer.]";
        }

        const formattedPlayers = players
          .map(p => JSON.stringify(p))
          .join("\n");

        return `\n\n[Quapspedia Player-Daten aus quaps_players]\n${formattedPlayers}`;
      } catch (e) {
        return "";
      }
    }

    async function callGroq(preferredModel, promptText, systemPrompt) {
      const candidates = [];
      if (preferredModel && preferredModel !== "auto") {
        candidates.push(preferredModel);
      }

      try {
        const modelsRes = await fetch("https://api.groq.com/openai/v1/models", {
          headers: { "Authorization": `Bearer ${GROQ_KEY}` }
        });
        const modelsJson = await modelsRes.json();
        if (modelsJson && Array.isArray(modelsJson.data)) {
          for (const m of modelsJson.data) {
            if (m.id && !candidates.includes(m.id) && !m.id.includes("whisper") && !m.id.includes("guard")) {
              candidates.push(m.id);
            }
          }
        }
      } catch (e) {}

      let lastError = "Kein passendes Groq-Modell gefunden.";
      for (const modelId of candidates) {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: modelId,
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: promptText }
            ]
          })
        });
        const json = await res.json();
        if (!json.error && json.choices?.[0]?.message?.content) {
          return json.choices[0].message.content;
        }
        lastError = json.error?.message || "Groq API Fehler";
      }
      throw new Error(lastError);
    }

    async function callGemini(modelId, promptText, systemPrompt) {
      const candidates = ["gemini-2.5-flash", "gemini-2.0-flash", modelId];
      let lastError = "Gemini API Fehler";

      for (const m of candidates) {
        if (!m) continue;
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${GEMINI_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemPrompt }] },
            contents: [{ parts: [{ text: promptText }] }]
          })
        });
        const json = await res.json();
        if (!json.error && json.candidates?.[0]?.content?.parts?.[0]?.text) {
          return json.candidates[0].content?.parts?.[0]?.text;
        }
        lastError = json.error?.message || "Gemini API Fehler";
      }
      throw new Error(lastError);
    }

    function buildImageUrl(promptText, seedOverride) {
      const seed = seedOverride || Math.floor(Math.random() * 100000000);
      const safePrompt = encodeURIComponent(`${promptText}, digital art, clean composition, high detail`);
      return `https://image.pollinations.ai/prompt/${safePrompt}?width=768&height=768&nologo=true&seed=${seed}`;
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById("prompt-input");
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;

      const model = selectedModelValue;
      input.value = "";

      if (!currentChatId) {
        const { data: newChat, error: chatErr } = await sb.from("chats").insert({
          user_id: currentUser.id,
          title: text.slice(0, 30),
          model: model
        }).select().single();
        
        if (chatErr) {
          console.error("Chat erstellen fehlgeschlagen:", chatErr);
          return;
        }
        if (newChat) currentChatId = newChat.id;
        await loadChats();
      }

      const userMsg = { chat_id: currentChatId, user_id: currentUser.id, role: "user", content: text };
      await sb.from("messages").insert(userMsg);
      renderMessage(userMsg);

      if (model === "image-flux") {
        const imageUrl = buildImageUrl(text);
        const aiMsg = {
          chat_id: currentChatId,
          user_id: currentUser.id,
          role: "assistant",
          content: `Bild zu **${text}**, digger! 😉 [Neu laden](${buildImageUrl(text, Date.now() + 7)})`,
          image_url: imageUrl
        };
        await sb.from("messages").insert(aiMsg);
        renderMessage(aiMsg);
        return;
      }

      const loadingId = "loading-" + Date.now();
      renderLoading(loadingId);

      try {
        const dbContext = await buildDatabaseContext();
        const fullSystemPrompt = BASE_SYSTEM_PROMPT + dbContext;
        let replyText = "";

        if (model.startsWith("gemini:")) {
          const geminiModel = model.replace("gemini:", "");
          replyText = await callGemini(geminiModel, text, fullSystemPrompt);
        } else {
          const groqModel = model.replace("groq:", "");
          replyText = await callGroq(groqModel, text, fullSystemPrompt);
        }

        document.getElementById(loadingId)?.remove();

        const aiMsg = {
          chat_id: currentChatId,
          user_id: currentUser.id,
          role: "assistant",
          content: replyText,
          image_url: null
        };

        await sb.from("messages").insert(aiMsg);
        renderMessage(aiMsg);

      } catch (err) {
        document.getElementById(loadingId)?.remove();
        renderMessage({ role: "assistant", content: `⚠️ Fehler, bro: ${err.message} 😢` });
      }
    }

    function renderLoading(id) {
      const container = document.getElementById("messages-container");
      if (!container) return;
      const div = document.createElement("div");
      div.id = id;
      div.className = "text-xs text-[var(--text-sub)] animate-pulse pl-2";
      div.textContent = "Checke Quapspedia, digger... 💀";
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function renderMessage(msg) {
      const container = document.getElementById("messages-container");
      if (!container) return;
      const wrapper = document.createElement("div");
      wrapper.className = `flex ${msg.role === "user" ? "justify-end" : "justify-start"}`;

      const bubble = document.createElement("div");
      bubble.className = `max-w-[85%] md:max-w-2xl rounded-2xl px-4 py-3 text-sm leading-relaxed ${
        msg.role === "user" ? "bg-blue-600 text-white shadow-lg shadow-blue-600/20" : "bg-[var(--glass-bg)] border border-[var(--glass-border)] text-slate-100 backdrop-blur-md"
      }`;

      bubble.innerHTML = marked.parse(msg.content || "");

      if (msg.image_url) {
        const img = document.createElement("img");
        img.src = msg.image_url;
        img.className = "mt-3 rounded-xl max-h-80 border border-white/10";
        img.onerror = () => {
          if (!img.dataset.retried) {
            img.dataset.retried = "1";
            img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent("a cool artwork")}?width=768&height=768&nologo=true&seed=${Date.now()}`;
          } else {
            img.style.display = "none";
          }
        };
        bubble.appendChild(img);
      }

      wrapper.appendChild(bubble);
      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
