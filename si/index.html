<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuapsSI — AI Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
        --bg-main: #0a0a12;
        --glass-bg: rgba(20, 20, 35, 0.9);
        --glass-border: rgba(255, 255, 255, 0.15);
        --demo-box-bg: rgba(255, 255, 255, 0.05);
        --demo-box-border: rgba(255, 255, 255, 0.1);
        --accent: #ef4444;
        --accent-glow: rgba(239, 68, 68, 0.4);
        --text-main: #ffffff;
        --text-sub: rgba(255, 255, 255, 0.7);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-main);
        background-image: 
            radial-gradient(circle at 15% 20%, rgba(239, 68, 68, 0.15) 0%, transparent 45%),
            radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 45%);
        background-attachment: fixed;
        color: var(--text-main);
        height: 100vh;
        display: flex;
        overflow: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    pre { background: #0f172a; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; border: 1px solid #1e293b; }
    code { font-family: monospace; font-size: 0.9em; }

    /* Auth Overlay */
    #auth-screen {
        position: fixed;
        inset: 0;
        background: var(--bg-main);
        background-image: inherit;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .auth-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(16px);
        border-radius: 20px;
        padding: 35px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .glass-input {
        width: 100%;
        background: var(--demo-box-bg);
        border: 1px solid var(--demo-box-border);
        border-radius: 12px;
        padding: 12px 16px;
        color: #fff;
        font-size: 0.9rem;
        outline: none;
        transition: all 0.2s ease;
    }
    .glass-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 15px var(--accent-glow);
    }

    .btn-primary {
        background: var(--accent);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 12px;
        padding: 12px 24px;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        box-shadow: 0 4px 25px var(--accent-glow);
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-block;
        width: 100%;
        text-align: center;
    }
    .btn-primary:hover {
        background: #dc2626;
        box-shadow: 0 4px 35px rgba(239, 68, 68, 0.6);
        transform: translateY(-2px);
    }

    /* Gemini Layout Sidebar & Main */
    #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 280px;
        background: var(--glass-bg);
        border-right: 1px solid var(--glass-border);
        backdrop-filter: blur(16px);
        z-index: 40;
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease;
    }

    @media (max-width: 768px) {
        #sidebar {
            transform: translateX(-100%);
        }
        #sidebar.open {
            transform: translateX(0);
        }
    }

    #sidebar.collapsed {
        transform: translateX(-100%);
    }

    #main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100vh;
        margin-left: 280px;
        transition: margin-left 0.3s ease;
        width: calc(100% - 280px);
    }

    @media (max-width: 768px) {
        #main-content {
            margin-left: 0 !important;
            width: 100% !important;
        }
    }

    #main-content.expanded {
        margin-left: 0;
        width: 100%;
    }

    .glass-header {
        background: var(--glass-bg);
        border-bottom: 1px solid var(--glass-border);
        backdrop-filter: blur(16px);
    }
  </style>
</head>
<body>

  <!-- AUTH OVERLAY -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="mb-6 text-center flex flex-col items-center">
        <img src="/unnamed.jpg" alt="Logo" class="w-14 h-14 rounded-2xl object-cover mb-3 border border-white/20 shadow-lg" onerror="this.style.display='none'" />
        <h1 class="text-3xl font-black tracking-tight text-white mb-1">Quaps<span>SI</span></h1>
        <p class="text-xs text-[var(--text-sub)]">Dein privates AI-Workspace</p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-[var(--text-sub)] mb-1">E-Mail</label>
          <input id="auth-email" type="email" placeholder="name@quapsattack.airbusfan.de" class="glass-input" />
        </div>
        <div>
          <label class="block text-xs font-medium text-[var(--text-sub)] mb-1">Passwort</label>
          <input id="auth-password" type="password" placeholder="••••••••" class="glass-input" />
        </div>
        <p id="auth-error" class="text-xs text-red-400 hidden"></p>
        <div class="pt-2">
          <button type="button" onclick="secureLogin()" class="btn-primary">Anmelden</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SIDEBAR (GEMINI STYLE) -->
  <aside id="sidebar">
    <div class="p-4 flex items-center justify-between border-b border-[var(--glass-border)]">
      <div class="flex items-center gap-3">
        <img src="/unnamed.jpg" alt="Logo" class="w-9 h-9 rounded-xl object-cover border border-white/20" onerror="this.style.display='none'" />
        <span class="font-black text-lg tracking-tight">Quaps<span style="color:var(--accent);">SI</span></span>
      </div>
      <button onclick="toggleSidebar()" class="p-2 rounded-xl hover:bg-white/10 text-[var(--text-sub)] hover:text-white transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>

    <div class="p-4">
      <button onclick="createNewChat()" class="w-full bg-white/10 hover:bg-white/20 border border-white/20 text-white font-semibold text-xs py-3 px-4 rounded-xl flex items-center gap-2 transition shadow-md">
        <span class="text-base font-bold">+</span> Neuer Chat
      </button>
    </div>

    <div class="px-4 pb-2 text-[10px] font-semibold text-[var(--text-sub)] tracking-wider uppercase">Deine Chats</div>
    
    <div id="chat-list" class="flex-1 overflow-y-auto px-3 space-y-1 pb-4">
      <!-- Chats werden hier geladen -->
    </div>

    <div class="p-4 border-t border-[var(--glass-border)] flex items-center justify-between text-xs text-[var(--text-sub)]">
      <span id="user-email-display" class="truncate max-w-[140px]"></span>
      <button onclick="handleLogout()" class="text-red-400 hover:text-red-300 font-semibold">Logout</button>
    </div>
  </aside>

  <!-- MAIN CHAT AREA -->
  <main id="main-content">
    <!-- TOP BAR -->
    <header class="h-16 glass-header px-4 md:px-6 flex items-center justify-between z-30">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="p-2 rounded-xl hover:bg-white/10 text-[var(--text-sub)] hover:text-white transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <select id="model-select" onchange="checkSelectedModelStatus()" class="glass-input py-1.5 px-3 text-xs w-auto">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash (Text, Code, PDF)</option>
          <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B Free (OpenRouter)</option>
          <option value="deepseek/deepseek-r1:free">DeepSeek R1 Free (OpenRouter)</option>
          <option value="qwen/qwen-2.5-coder-32b-instruct:free">Qwen 2.5 Coder 32B Free</option>
          <option value="image-flux">Bild-Generator (FLUX Free)</option>
        </select>
      </div>
      <div id="cooldown-banner" class="hidden text-xs bg-red-500/10 border border-red-500/30 text-red-400 px-3 py-1.5 rounded-xl font-medium"></div>
    </header>

    <!-- MESSAGES -->
    <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
      <div class="text-center text-[var(--text-sub)] text-sm mt-32">
        Wähle dein Modell und schreib los, Bruder! 💀<br>
        Tipp: Schreib <b>"Erstell ein PDF über..."</b> oder wähle den <b>Bild-Generator</b>!
      </div>
    </div>

    <!-- INPUT -->
    <div class="p-4 md:p-6 glass-header">
      <form onsubmit="sendMessage(event)" class="max-w-4xl mx-auto flex gap-3">
        <input id="prompt-input" type="text" placeholder="Nachricht an QuapsSI schreiben..." autocomplete="off" class="glass-input flex-1 py-3 px-4" />
        <button id="send-btn" type="submit" class="btn-primary w-auto px-6 py-3">Senden</button>
      </form>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://xibaufkxapezpuvszpxf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpYmF1Zmt4YXBlenB1dnN6cHhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjEwNzUsImV4cCI6MjEwMzkzNzA3NX0.Tv3IKj95iBsGy5TGTosb7mMT-d_sySuu7QZ4RpNhB5E";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentChatId = null;
    let cooldowns = {};

    window.addEventListener("DOMContentLoaded", () => {
      const savedEmail = localStorage.getItem("quapssi_user");
      if (savedEmail) {
        initApp({ id: savedEmail, email: savedEmail });
      }
    });

    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const main = document.getElementById("main-content");
      if (window.innerWidth <= 768) {
        sidebar.classList.toggle("open");
      } else {
        sidebar.classList.toggle("collapsed");
        main.classList.toggle("expanded");
      }
    }

    async function secureLogin() {
      const emailInput = document.getElementById("auth-email");
      const passwordInput = document.getElementById("auth-password");
      if (!emailInput || !passwordInput) return;
      
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;
      
      if (!email || !password) return showAuthError("Bitte E-Mail und Passwort eingeben, Bruder!");

      const { data: userRecord, error: fetchError } = await sb.from("allowed_users").select("*").eq("email", email).single();

      if (fetchError || !userRecord) return showAuthError("❌ E-Mail nicht freigeschaltet, Bruder!");

      if (!userRecord.password) {
        await sb.from("allowed_users").update({ password: password }).eq("email", email);
      } else {
        if (userRecord.password !== password) return showAuthError("❌ Falsches Passwort, Bruder!");
      }

      localStorage.setItem("quapssi_user", email);
      initApp({ id: email, email: email });
    }

    function handleLogout() {
      localStorage.removeItem("quapssi_user");
      location.reload();
    }

    function showAuthError(msg) {
      const el = document.getElementById("auth-error");
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    async function initApp(user) {
      currentUser = user;
      document.getElementById("auth-screen").style.display = "none";
      document.getElementById("user-email-display").textContent = user.email;
      try {
        await loadCooldowns();
        await loadChats();
      } catch (err) {}
    }

    async function loadCooldowns() {
      const { data } = await sb.from("model_cooldowns").select("*");
      cooldowns = {};
      if (data) {
        data.forEach(row => {
          if (row.locked_until && new Date(row.locked_until) > new Date()) {
            cooldowns[row.model_id] = row.locked_until;
          }
        });
      }
      checkSelectedModelStatus();
    }

    function checkSelectedModelStatus() {
      const model = document.getElementById("model-select").value;
      const banner = document.getElementById("cooldown-banner");
      const sendBtn = document.getElementById("send-btn");
      const input = document.getElementById("prompt-input");

      if (cooldowns[model] && new Date(cooldowns[model]) > new Date()) {
        const timeStr = new Date(cooldowns[model]).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
        banner.textContent = `Tokens leer! Ab ${timeStr} Uhr wieder da.`;
        banner.classList.remove("hidden");
        sendBtn.disabled = true;
        input.disabled = true;
      } else {
        banner.classList.add("hidden");
        sendBtn.disabled = false;
        input.disabled = false;
      }
    }

    async function loadChats() {
      const { data } = await sb.from("chats").select("*").eq("user_id", currentUser.id).order("created_at", { ascending: false });
      const list = document.getElementById("chat-list");
      list.innerHTML = "";
      if (!data || data.length === 0) return;

      data.forEach(chat => {
        const wrapper = document.createElement("div");
        wrapper.className = `flex items-center justify-between px-3 py-2 rounded-xl text-sm transition group ${chat.id === currentChatId ? "bg-white/15 text-white border border-white/20" : "text-[var(--text-sub)] hover:bg-white/5 hover:text-white"}`;
        
        const titleSpan = document.createElement("span");
        titleSpan.className = "truncate flex-1 cursor-pointer font-medium";
        titleSpan.textContent = chat.title;
        titleSpan.onclick = () => {
          selectChat(chat.id, chat.model);
          if (window.innerWidth <= 768) document.getElementById("sidebar").classList.remove("open");
        };

        const delBtn = document.createElement("button");
        delBtn.className = "opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-300 p-1 transition";
        delBtn.innerHTML = "🗑️";
        delBtn.title = "Chat löschen";
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteChat(chat.id);
        };

        wrapper.appendChild(titleSpan);
        wrapper.appendChild(delBtn);
        list.appendChild(wrapper);
      });

      if (!currentChatId && data.length > 0) {
        selectChat(data[0].id, data[0].model);
      }
    }

    async function deleteChat(chatId) {
      if (!confirm("Chat wirklich löschen, Bruder?")) return;
      await sb.from("messages").delete().eq("chat_id", chatId);
      await sb.from("chats").delete().eq("id", chatId);
      if (currentChatId === chatId) {
        currentChatId = null;
        document.getElementById("messages-container").innerHTML = `<div class="text-center text-[var(--text-sub)] text-sm mt-32">Chat gelöscht, wähle einen neuen aus!</div>`;
      }
      await loadChats();
    }

    async function createNewChat() {
      const model = document.getElementById("model-select").value;
      const { data, error } = await sb.from("chats").insert({
        user_id: currentUser.id,
        title: "Neuer Chat",
        model: model
      }).select().single();

      if (!error && data) {
        currentChatId = data.id;
        await loadChats();
        document.getElementById("messages-container").innerHTML = "";
        if (window.innerWidth <= 768) document.getElementById("sidebar").classList.remove("open");
      }
    }

    async function selectChat(chatId, model) {
      currentChatId = chatId;
      if (model) document.getElementById("model-select").value = model;
      checkSelectedModelStatus();
      await loadChats();

      const { data } = await sb.from("messages").select("*").eq("chat_id", chatId).order("created_at", { ascending: true });
      const container = document.getElementById("messages-container");
      container.innerHTML = "";
      if (data) data.forEach(msg => renderMessage(msg));
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById("prompt-input");
      const text = input.value.trim();
      if (!text) return;

      const model = document.getElementById("model-select").value;
      input.value = "";

      if (!currentChatId) {
        const { data } = await sb.from("chats").insert({
          user_id: currentUser.id,
          title: text.slice(0, 30),
          model: model
        }).select().single();
        if (data) currentChatId = data.id;
        await loadChats();
      }

      const userMsg = { chat_id: currentChatId, user_id: currentUser.id, role: "user", content: text };
      await sb.from("messages").insert(userMsg);
      renderMessage(userMsg);

      if (model === "image-flux") {
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=1024&height=1024&nologo=true&seed=${Date.now()}`;
        const aiMsg = { chat_id: currentChatId, user_id: currentUser.id, role: "assistant", content: `Hier ist dein Bild zu: **${text}**`, image_url: imageUrl };
        await sb.from("messages").insert(aiMsg);
        renderMessage(aiMsg);
        return;
      }

      const loadingId = "loading-" + Date.now();
      renderLoading(loadingId);

      try {
        const { data, error } = await sb.functions.invoke("quapssi-chat", {
          body: { prompt: text, model: model }
        });

        document.getElementById(loadingId)?.remove();

        if (error || data?.rate_limited) {
          const resetTime = data?.locked_until || new Date(Date.now() + 60 * 60 * 1000).toISOString();
          cooldowns[model] = resetTime;
          checkSelectedModelStatus();
          const timeStr = new Date(resetTime).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
          renderMessage({ role: "assistant", content: `⚠️ Bruder, Tokens für **${model}** leer! Erst ab **${timeStr} Uhr** wieder da.` });
          return;
        }

        let replyText = data.reply || "Keine Antwort.";
        let pdfPayload = null;

        const pdfMatch = replyText.match(/```pdf-json\s*([\s\S]*?)```/);
        if (pdfMatch) {
          try {
            pdfPayload = JSON.parse(pdfMatch[1]);
            replyText = replyText.replace(pdfMatch[0], "").trim();
          } catch (err) {}
        }

        const aiMsg = {
          chat_id: currentChatId,
          user_id: currentUser.id,
          role: "assistant",
          content: replyText,
          pdf_data: pdfPayload
        };
        await sb.from("messages").insert(aiMsg);
        renderMessage(aiMsg);

      } catch (err) {
        document.getElementById(loadingId)?.remove();
        renderMessage({ role: "assistant", content: "Verbindungsfehler zum Backend, Bruder." });
      }
    }

    function renderLoading(id) {
      const container = document.getElementById("messages-container");
      const div = document.createElement("div");
      div.id = id;
      div.className = "text-xs text-[var(--text-sub)] animate-pulse pl-2";
      div.textContent = "QuapsSI denkt nach...";
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function renderMessage(msg) {
      const container = document.getElementById("messages-container");
      const wrapper = document.createElement("div");
      wrapper.className = `flex ${msg.role === "user" ? "justify-end" : "justify-start"}`;

      const bubble = document.createElement("div");
      bubble.className = `max-w-2xl rounded-2xl px-4 py-3 text-sm leading-relaxed ${
        msg.role === "user" ? "bg-blue-600 text-white shadow-lg shadow-blue-600/20" : "bg-[var(--glass-bg)] border border-[var(--glass-border)] text-slate-100 backdrop-blur-md"
      }`;

      bubble.innerHTML = marked.parse(msg.content || "");

      if (msg.image_url) {
        const img = document.createElement("img");
        img.src = msg.image_url;
        img.className = "mt-3 rounded-xl max-h-80 border border-white/10";
        bubble.appendChild(img);
      }

      if (msg.pdf_data) {
        const pdfBtn = document.createElement("button");
        pdfBtn.className = "mt-3 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-4 py-2 rounded-xl flex items-center gap-2 transition shadow-lg shadow-emerald-600/20 cursor-pointer";
        pdfBtn.textContent = `📄 PDF herunterladen: ${msg.pdf_data.filename || "Dokument.pdf"}`;
        pdfBtn.onclick = () => downloadGeneratedPDF(msg.pdf_data);
        bubble.appendChild(pdfBtn);
      }

      wrapper.appendChild(bubble);
      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    }

    function downloadGeneratedPDF(pdfData) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(16);
      doc.text(pdfData.title || "QuapsSI Dokument", 15, 20);
      doc.setFontSize(11);
      const lines = doc.splitTextToSize(pdfData.body || "", 180);
      doc.text(lines, 15, 32);
      doc.save(pdfData.filename || "QuapsSI_Dokument.pdf");
    }
  </script>
</body>
</html>
