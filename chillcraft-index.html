<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Chillcraft | Dashboard</title>
    <link rel="icon" type="image/png" href="chillcraft.png">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        
        /* Animation: Bild bewegt sich langsam */
        #bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('chillcraft.png') no-repeat center center;
            background-size: cover; z-index: -1;
            animation: moveBg 30s infinite alternate ease-in-out;
        }
        @keyframes moveBg { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* Musik-Player Design */
        .player-container {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px);
            padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
            color: white; display: flex; align-items: center; gap: 15px;
        }
        input[type=range] { cursor: pointer; }
        button { background: #5bc0de; border: none; padding: 10px 20px; border-radius: 5px; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="bg"></div>

<div class="player-container">
    <button id="playBtn" onclick="togglePlay()">Play</button>
    <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5" oninput="setVolume(this.value)">
    <span>Volume</span>
    <audio id="hymne" src="chillcraft.mp3"></audio>
</div>

<script>
    const audio = document.getElementById("hymne");
    const btn = document.getElementById("playBtn");

    function togglePlay() {
        if (audio.paused) {
            audio.play();
            btn.innerText = "Pause";
        } else {
            audio.pause();
            btn.innerText = "Play";
        }
    }

    function setVolume(val) { audio.volume = val; }
</script>

</body>
</html>
