<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Chillcraft | Portal</title>
    <link rel="icon" type="image/png" href="chillcraft.png">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; }
        
        /* Hintergrund & Animation */
        #bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('chillcraft.png') no-repeat center center;
            background-size: cover; z-index: -1;
            animation: moveBg 40s infinite alternate ease-in-out;
        }
        @keyframes moveBg { from { transform: scale(1); } to { transform: scale(1.15); } }

        /* Layout */
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: rgba(0,0,0,0.4); }
        .info-box { background: rgba(0,0,0,0.6); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid #5bc0de; text-align: center; max-width: 500px; }
        h1 { color: #5bc0de; text-transform: uppercase; margin-bottom: 10px; }
        
        /* Musik-Player mit Animation */
        .player { margin-top: 20px; display: flex; align-items: center; gap: 10px; justify-content: center; }
        .bar { width: 5px; height: 20px; background: #5bc0de; animation: sound 0.8s infinite alternate; }
        @keyframes sound { from { height: 10px; } to { height: 30px; } }
    </style>
</head>
<body>

<div id="bg"></div>

<div class="container">
    <div class="info-box">
        <h1>Chillcraft</h1>
        <p>Willkommen auf dem entspanntesten Server. Fokus auf Technik, Community und Spaß.</p>
        <p><strong>IP:</strong> play.chillcraft.de</p>
        <p><strong>Version:</strong> 1.21.1</p>

        <div class="player">
            <div class="bar"></div><div class="bar" style="animation-delay: 0.2s"></div><div class="bar" style="animation-delay: 0.4s"></div>
            <button onclick="togglePlay()">Play/Pause</button>
            <input type="range" min="0" max="1" step="0.1" value="0.5" oninput="audio.volume = this.value">
        </div>
        <audio id="hymne" src="chillcraft.mp3"></audio>
    </div>
</div>

<script>
    const audio = document.getElementById("hymne");
    function togglePlay() { audio.paused ? audio.play() : audio.pause(); }
</script>

</body>
</html>
