<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Chillcraft | Official</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* Video als Hintergrund */
        #bg-video {
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%;
            z-index: -1; object-fit: cover; filter: brightness(40%);
        }

        .content {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: white;
        }

        .btn-play {
            background: #5bc0de; border: none; padding: 15px 30px; border-radius: 50px;
            cursor: pointer; font-weight: bold; font-size: 1.2em; transition: 0.3s;
        }
        .btn-play:hover { background: #fff; color: #5bc0de; }
    </style>
</head>
<body>

<!-- Dein Hintergrund-Video (muss im selben Ordner liegen) -->
<video autoplay muted loop id="bg-video">
    <source src="minecraft_loop.mp4" type="video/mp4">
</video>

<!-- Audio-Datei -->
<audio id="hymne" src="chillcraft.mp3" loop></audio>

<div class="content">
    <h1>Chillcraft</h1>
    <p>Der offizielle Soundtrack läuft...</p>
    <button class="btn-play" onclick="playMusic()">Musik starten</button>
</div>

<script>
    function playMusic() {
        const audio = document.getElementById("hymne");
        audio.play();
    }
</script>

</body>
</html>
