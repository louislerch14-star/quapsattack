<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuapsAttack — Command & Community Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-base: #0a0a12;
      --glass-opacity: 0.85;
      --glass-bg: rgba(20, 20, 35, var(--glass-opacity));
      --glass-border: rgba(255, 255, 255, 0.2);
      --box-bg: rgba(255, 255, 255, 0.05);
      --box-border: rgba(255, 255, 255, 0.1);
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --accent-glow: rgba(239, 68, 68, 0.4);
      --gold-start: #f5c518;
      --gold-end: #ff9900;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.7);
      --status-green: #10b981;
      --radius-card: 20px;
      --radius-box: 14px;
      --radius-btn: 12px;
      --font-scale: 1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: calc(14px * var(--font-scale));
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 14% 18%, color-mix(in srgb, var(--accent) 18%, transparent) 0%, transparent 45%),
        radial-gradient(circle at 86% 82%, rgba(59, 130, 246, 0.15) 0%, transparent 48%);
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), background-image 0.35s ease;
    }

    .app-shell.theme-cozy {
      background-image:
        radial-gradient(circle at 16% 20%, rgba(251, 146, 60, 0.2) 0%, transparent 48%),
        radial-gradient(circle at 84% 80%, rgba(245, 197, 24, 0.14) 0%, transparent 50%);
    }

    .app-shell.theme-cyber {
      background-image:
        radial-gradient(circle at 15% 15%, rgba(6, 182, 212, 0.22) 0%, transparent 46%),
        radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.18) 0%, transparent 48%);
    }

    .app-shell.overdrive-mode {
      background-image:
        radial-gradient(circle at 20% 20%, rgba(245, 197, 24, 0.25) 0%, transparent 48%),
        radial-gradient(circle at 80% 80%, color-mix(in srgb, var(--accent) 28%, transparent) 0%, transparent 50%);
    }

    .app-shell.barrel-roll {
      transform: rotate(360deg);
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
    }

    .nested-box {
      background: var(--box-bg);
      border: 1px solid var(--box-border);
      border-radius: var(--radius-box);
      transition: all 0.2s ease;
    }

    .nested-box:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.075);
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, var(--gold-start), var(--gold-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: var(--radius-btn);
      padding: 9px 15px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 4px 18px var(--accent-glow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 6px 24px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-btn);
      padding: 8px 13px;
      font-weight: 500;
      font-size: 12.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.24);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: var(--radius-btn);
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.28);
    }

    .input-field, .select-field, .textarea-field {
      width: 100%;
      background: rgba(10, 10, 18, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-btn);
      padding: 10px 13px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-field:focus, .select-field:focus, .textarea-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    .select-field option {
      background: #141423;
      color: #ffffff;
    }

    .textarea-field {
      resize: vertical;
      min-height: 74px;
    }

    .custom-scroll {
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
    }

    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    .top-bar {
      height: 52px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 10, 18, 0.92);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .brand-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.03em;
      cursor: pointer;
      user-select: none;
    }

    .brand-emblem {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), #450a0a);
      box-shadow: 0 0 16px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .brand-badge:hover .brand-emblem {
      transform: scale(1.06);
    }

    .main-layout {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 16px;
      padding: 16px;
    }

    .sidebar {
      width: 274px;
      min-width: 274px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
    }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 13px;
      border-radius: var(--radius-btn);
      border: 1px solid transparent;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      font-weight: 500;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
    }

    .nav-btn.active {
      border-color: color-mix(in srgb, var(--accent) 55%, transparent);
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 25%, transparent), color-mix(in srgb, var(--accent) 7%, transparent));
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .badge-red {
      background: var(--accent);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .badge-gold {
      background: rgba(245, 197, 24, 0.16);
      color: #f5c518;
      border: 1px solid rgba(245, 197, 24, 0.35);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .badge-green {
      background: rgba(16, 185, 129, 0.16);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.35);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .content-area {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 10, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .toast-banner {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 160;
      padding: 12px 16px;
      border-radius: var(--radius-box);
      background: rgba(20, 20, 35, 0.96);
      border: 1px solid var(--accent);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      font-size: 13px;
      max-width: 390px;
      transition: all 0.25s ease;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 12px;
    }

    .pill-tab {
      padding: 6px 11px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-tab.active {
      background: color-mix(in srgb, var(--accent) 25%, transparent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .avatar-circle {
      border-radius: 11px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.18);
      flex-shrink: 0;
    }

    .vu-bar-bg {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .vu-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #10b981, #f5c518, var(--accent));
      transition: width 0.06s linear;
    }

    .swatch-btn {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .swatch-btn.active {
      transform: scale(1.14);
      border-color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
    }

    .reply-quote-bar {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(0, 0, 0, 0.28);
      border-left: 2px solid #f5c518;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .context-menu {
      position: fixed;
      z-index: 250;
      min-width: 205px;
      padding: 6px;
      border-radius: 14px;
      background: rgba(16, 16, 28, 0.97);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .context-item {
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 9px;
      padding: 8px 11px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
      transition: background 0.14s ease;
    }

    .context-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .context-item.danger {
      color: #fca5a5;
    }

    .context-item.danger:hover {
      background: rgba(239, 68, 68, 0.22);
    }

    .context-sep {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 3px 4px;
    }
  </style>
</head>

      if (!role) return false;
      const r = String(role).toLowerCase().trim();
      return ['management', 'admin', 'owner', 'leader', 'leitung', 'mod', 'moderator'].includes(r);

    async function syncUserSettingsToCloud(userId, patchObj) {
      if (!userId || !patchObj) return;
      try {
        await supabase
          .from('profiles')
          .update({ ...patchObj, updated_at: new Date().toISOString() })
          .eq('id', userId);
      } catch {}
    }

    // =========================================================================
    // 2. RECHTSKLICK-KONTEXTMENÜ
    // =========================================================================
    function ContextMenuPopup({ menuState, onClose }) {
      if (!menuState || !menuState.items || menuState.items.length === 0) return null;

      const menuWidth = 215;
      const menuHeight = menuState.items.length * 36 + 18;
      const left = Math.min(menuState.x, window.innerWidth - menuWidth - 12);
      const top = Math.min(menuState.y, window.innerHeight - menuHeight - 12);

      return React.createElement(
        'div',
        {
          className: 'context-menu',
          style: { left: Math.max(8, left), top: Math.max(8, top) },
          onClick: (e) => e.stopPropagation(),
          onContextMenu: (e) => e.preventDefault()
        },
        menuState.title && React.createElement(
          'div',
          {
            style: {
              fontSize: 10.5,
              fontWeight: 700,
              color: '#f5c518',
              padding: '4px 10px 5px',
              borderBottom: '1px solid rgba(255,255,255,0.08)',
              marginBottom: 2,
              whiteSpace: 'nowrap',
              overflow: 'hidden',
              textOverflow: 'ellipsis'
            }
          },
          menuState.title
        ),
        menuState.items.map((item, idx) =>
          item.separator
            ? React.createElement('div', { key: 'sep-' + idx, className: 'context-sep' })
            : React.createElement(
                'button',
                {
                  key: item.label + idx,
                  type: 'button',
                  className: `context-item ${item.danger ? 'danger' : ''}`,
                  onClick: () => {
                    onClose();
                    item.onClick();
                  }
                },
                React.createElement('span', { style: { width: 18, textAlign: 'center' } }, item.icon || '•'),
                React.createElement('span', null, item.label)
              )
        )
      );
    }

    // =========================================================================
    // 3. DESIGN-CUSTOMIZER
    // =========================================================================
    const DESIGN_KEY = 'quaps_design_v1';
    const ACCENT_PRESETS = [
      { name: 'Crimson Red', hex: '#ef4444', hover: '#dc2626', glow: 'rgba(239, 68, 68, 0.42)' },
      { name: 'Solar Gold', hex: '#f59e0b', hover: '#d97706', glow: 'rgba(245, 158, 11, 0.42)' },
      { name: 'Emerald Squad', hex: '#10b981', hover: '#059669', glow: 'rgba(16, 185, 129, 0.42)' },

    ];

    const DEFAULT_DESIGN = {
      accentHex: '#ef4444',
      accentHover: '#dc2626',
      accentGlow: 'rgba(239, 68, 68, 0.42)',
      bgMood: 'night',
      glassOpacity: 0.85,
      radiusStyle: 'modern',
      fontScale: 1.0
    };

    function getSavedDesign() {
      try {
        const raw = localStorage.getItem(DESIGN_KEY);
        if (raw) return { ...DEFAULT_DESIGN, ...JSON.parse(raw) };
      } catch {}
      return { ...DEFAULT_DESIGN };
    }

    function applyDesignToDom(design) {
      const root = document.documentElement;
      root.style.setProperty('--accent', design.accentHex);
      root.style.setProperty('--accent-hover', design.accentHover);
      root.style.setProperty('--accent-glow', design.accentGlow);
      root.style.setProperty('--glass-opacity', String(design.glassOpacity));
      root.style.setProperty('--font-scale', String(design.fontScale));

      const baseMap = {
        night: '#0a0a12',
        cozy: '#140f0c',
        cyber: '#070c16'
      };
      root.style.setProperty('--bg-base', baseMap[design.bgMood] || '#0a0a12');

      if (design.radiusStyle === 'sharp') {
        root.style.setProperty('--radius-card', '10px');
        root.style.setProperty('--radius-box', '8px');
        root.style.setProperty('--radius-btn', '7px');
      } else if (design.radiusStyle === 'soft') {
        root.style.setProperty('--radius-card', '28px');
        root.style.setProperty('--radius-box', '20px');
        root.style.setProperty('--radius-btn', '18px');
      } else {
        root.style.setProperty('--radius-card', '20px');
        root.style.setProperty('--radius-box', '14px');
        root.style.setProperty('--radius-btn', '12px');
      }
    }

    // =========================================================================

    const MEDIA_PREFS_KEY = 'quaps_media_devices_v1';

    function getSavedMediaPrefs() {
      try {

        if (raw) return JSON.parse(raw);
      } catch {}
      return { audioInputId: '', videoInputId: '', audioOutputId: '', echoCancellation: true, noiseSuppression: true };
    }

    function saveMediaPrefs(next, userId = null) {
      try {
        localStorage.setItem(MEDIA_PREFS_KEY, JSON.stringify(next));

      if (userId) {

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.userId = null;
        this.settings = this.load();
        this.listeners = new Set();
      }

      setUserId(uid) {
        this.userId = uid || null;
      }

      load() {
        try {
          const raw = localStorage.getItem('quaps_sound_v2');
          if (raw) {
            const p = JSON.parse(raw);
            return {
              pack: SOUNDPACKS[p.pack] ? p.pack : 'cozy',
              volume: typeof p.volume === 'number' ? p.volume : 0.7,
              dnd: Boolean(p.dnd),
              customFiles: p.customFiles || {}
            };
          }
        } catch {}
        return { pack: 'cozy', volume: 0.7, dnd: false, customFiles: {} };
      }

      hydrateFromCloud(cloudObj) {
        if (!cloudObj || typeof cloudObj !== 'object') return;
        this.settings = {
          pack: SOUNDPACKS[cloudObj.pack] ? cloudObj.pack : this.settings.pack,
          volume: typeof cloudObj.volume === 'number' ? cloudObj.volume : this.settings.volume,
          dnd: typeof cloudObj.dnd === 'boolean' ? cloudObj.dnd : this.settings.dnd,
          customFiles: { ...this.settings.customFiles, ...(cloudObj.customFiles || {}) }
        };
        try {
          localStorage.setItem('quaps_sound_v2', JSON.stringify(this.settings));
        } catch {}
        this.listeners.forEach((fn) => fn({ ...this.settings }));
      }

      save(syncCloud = true) {
        try {
          localStorage.setItem('quaps_sound_v2', JSON.stringify(this.settings));
        } catch {}
        if (syncCloud && this.userId) {
          syncUserSettingsToCloud(this.userId, {
            sound_settings: {
              pack: this.settings.pack,
              volume: this.settings.volume,
              dnd: this.settings.dnd,
              customFiles: this.settings.customFiles
            }
          });
        }
        this.listeners.forEach((fn) => fn({ ...this.settings }));
      }

      subscribe(fn) {
        this.listeners.add(fn);
        return () => this.listeners.delete(fn);
      }

      setPack(pack) {
        if (!SOUNDPACKS[pack]) return;
        this.settings.pack = pack;
        this.save(true);
      }

      setVolume(val) {
        this.settings.volume = Math.max(0, Math.min(1, val));
        this.save(true);
      }

      setDnd(val) {
        this.settings.dnd = Boolean(val);
        this.save(true);
      }

      setCustomSound(key, fileObj) {
        if (fileObj) {
          this.settings.customFiles[key] = fileObj;
        } else {
          delete this.settings.customFiles[key];
        }
        this.save(true);
      }

      getCtx() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      }

      async play(key, preview = false) {
        if (this.settings.dnd && !preview) return;
        if (this.settings.volume <= 0.01 && !preview) return;
        const vol = preview ? Math.max(0.45, this.settings.volume) : this.settings.volume;

        const custom = this.settings.customFiles[key];
        if (custom?.dataUrl) {
          try {
            const audio = new Audio(custom.dataUrl);
            audio.volume = vol;
            await audio.play();
            return;
          } catch {}
        }

        try {
          const ctx = this.getCtx();
          const now = ctx.currentTime;
          const pack = this.settings.pack || 'cozy';
          const defaultWave = pack === 'cozy' ? 'sine' : pack === 'cyber' ? 'triangle' : 'square';
          const ampScale = pack === 'cozy' ? 0.16 : pack === 'cyber' ? 0.2 : 0.11;

          const note = (freq, delay, dur, type = defaultWave, amp = 1) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now + delay);
            const attack = pack === 'cozy' ? 0.035 : 0.01;
            const peak = Math.max(0.001, vol * ampScale * amp);
            gain.gain.setValueAtTime(0.0001, now + delay);
            gain.gain.exponentialRampToValueAtTime(peak, now + delay + attack);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + delay);
            osc.stop(now + delay + dur + 0.03);
          };

          if (key === 'call_incoming') {
            note(523.25, 0, 0.18, defaultWave, 1);
            note(659.25, 0.18, 0.18, defaultWave, 0.95);
            note(783.99, 0.36, 0.28, defaultWave, 1);
          } else if (key === 'call_connected') {
            note(440, 0, 0.14, defaultWave, 0.9);
            note(659.25, 0.1, 0.24, defaultWave, 1);
          } else if (key === 'call_ended') {
            note(587.33, 0, 0.15, defaultWave, 0.85);
            note(392.0, 0.12, 0.26, defaultWave, 0.85);
          } else if (key === 'chat_mention') {
            note(587.33, 0, 0.14, defaultWave, 1);
            note(880.0, 0.11, 0.24, defaultWave, 1);
          } else if (key === 'error_alert') {
            note(240, 0, 0.18, 'sawtooth', 0.8);
            note(185, 0.16, 0.24, 'sawtooth', 0.8);
          } else if (key === 'easter_egg') {
            note(523.25, 0, 0.1, defaultWave, 1);
            note(659.25, 0.09, 0.1, defaultWave, 1);
            note(783.99, 0.18, 0.1, defaultWave, 1);
            note(1046.5, 0.27, 0.26, defaultWave, 1);
          } else {
            note(523.25, 0, 0.14, defaultWave, 0.9);
            note(659.25, 0.09, 0.2, defaultWave, 0.85);
          }
        } catch {}
      }
    }

Du bist QuapsSI — die taktische Kommando- und Community-Intelligenz von QuapsAttack.
Antworte klar, direkt, locker auf Augenhöhe und praxisnah ohne generische KI-Floskeln.
`;

    async function runQuapsSI(promptText, historyRows, userId) {
      const apiKey = QUAPSSI_EMBEDDED_KEY;
      const contents = [];
      for (const row of (historyRows || []).slice(-6)) {
        contents.push({ role: 'user', parts: [{ text: row.prompt }] });
        contents.push({ role: 'model', parts: [{ text: row.response }] });
      }
      contents.push({ role: 'user', parts: [{ text: promptText }] });

      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: QUAPSSI_PERSONALITY }] },
            contents,
            generationConfig: { temperature: 0.75, maxOutputTokens: 2048 }
          })
        }
      );

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Gemini API Fehler (${res.status}): ${txt}`);
      }

      const json = await res.json();
      const reply = json?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!reply) throw new Error('Leere Antwort von QuapsSI erhalten.');

      const { data, error } = await supabase
        .from('qupas_si_messages')
        .insert({ user_id: userId, prompt: promptText, response: reply })
        .select('*')
        .single();

      if (error) {
        return {
          id: 'local-' + Date.now(),
          user_id: userId,
          prompt: promptText,
          response: reply,
          created_at: new Date().toISOString()
        };
      }
      return data;
    }

        const file = e.target.files?.[0];
        if (!file || !file.type.startsWith('image/')) return;
        setUploadingAvatar(true);
        try {
          const ext = (file.name.split('.').pop() || 'png').replace(/[^a-zA-Z0-9]/g, '');
          const filePath = `avatars/${profile.id}_${Date.now()}.${ext}`;
          const { error: upErr } = await supabase.storage.from('vault').upload(filePath, file, { upsert: true });
          if (!upErr) {
            const { data: pub } = supabase.storage.from('vault').getPublicUrl(filePath);

              setAvatarUrl(pub.publicUrl);
              soundEngine.play('upload_success');
              onToast('Profilbild hochgeladen! Jetzt „Speichern“ klicken.');
              setUploadingAvatar(false);
              return;
            }
          }
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const scale = Math.min(1, 256 / Math.max(img.width, img.height));
              canvas.width = Math.round(img.width * scale);
              canvas.height = Math.round(img.height * scale);
              canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
              setAvatarUrl(canvas.toDataURL('image/webp', 0.85));
              setUploadingAvatar(false);
            };
            img.src = String(reader.result);
          };

    // =========================================================================
    // 10. WEBRTC CALL OVERLAY
    // =========================================================================
    function CallOverlay({ callState, setCallState, currentUser, signalChannel, onToast }) {
      const [muted, setMuted] = useState(false);
      const [camOff, setCamOff] = useState(!callState?.isVideo);
      const [elapsed, setElapsed] = useState(0);
      const localVideoRef = useRef(null);
      const remoteVideoRef = useRef(null);
      const remoteAudioRef = useRef(null);
      const pcRef = useRef(null);
      const localStreamRef = useRef(null);
      const pendingIceRef = useRef([]);

      useEffect(() => {
        if (!callState || callState.status !== 'connected') {
          setElapsed(0);
          return;
        }
        const t = setInterval(() => setElapsed((s) => s + 1), 1000);
        return () => clearInterval(t);
      }, [callState?.status]);

      const cleanupMedia = () => {
        pendingIceRef.current = [];
        if (localStreamRef.current) {
          localStreamRef.current.getTracks().forEach((tr) => tr.stop());
          localStreamRef.current = null;
        }
        if (pcRef.current) {
          pcRef.current.close();
          pcRef.current = null;
        }
      };

      const startPeer = async (isInitiator, targetUserId, isVideo) => {
        cleanupMedia();
        const prefs = getSavedMediaPrefs();
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            deviceId: prefs.audioInputId ? { exact: prefs.audioInputId } : undefined,
            echoCancellation: prefs.echoCancellation !== false,
            noiseSuppression: prefs.noiseSuppression !== false
          },
          video: isVideo
            ? { deviceId: prefs.videoInputId ? { exact: prefs.videoInputId } : undefined }
            : false
        });
        localStreamRef.current = stream;
        if (localVideoRef.current && isVideo) localVideoRef.current.srcObject = stream;

        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        pcRef.current = pc;
        stream.getTracks().forEach((tr) => pc.addTrack(tr, stream));

        pc.ontrack = (ev) => {
          const rs = ev.streams[0];
          if (!rs) return;
          if (remoteVideoRef.current) remoteVideoRef.current.srcObject = rs;
          if (remoteAudioRef.current) remoteAudioRef.current.srcObject = rs;
        };

        pc.onicecandidate = (ev) => {
          if (ev.candidate && signalChannel) {
            signalChannel.send({
              type: 'broadcast',
              event: 'call-signal',
              payload: { type: 'webrtc-ice', roomId: callState.roomId, fromUserId: currentUser.id, targetUserId, candidate: ev.candidate.toJSON() }
            });
          }
        };

        if (isInitiator) {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          signalChannel?.send({
            type: 'broadcast',
            event: 'call-signal',
            payload: { type: 'webrtc-offer', roomId: callState.roomId, fromUserId: currentUser.id, targetUserId, sdp: offer }
          });
        }
        return pc;
      };

      useEffect(() => {
        if (!callState) return;
        const onSig = async (e) => {
          const sig = e.detail;
          if (!sig || sig.roomId !== callState.roomId) return;
          if (sig.targetUserId && sig.targetUserId !== currentUser.id) return;

          if (sig.type === 'call-accept' && callState.status === 'outgoing') {
            soundEngine.play('call_connected');
            setCallState((prev) => (prev ? { ...prev, status: 'connected', peerUserId: sig.fromUserId } : null));
            await startPeer(true, sig.fromUserId, callState.isVideo);
          } else if (sig.type === 'call-reject' || sig.type === 'call-end') {
            soundEngine.play('call_ended');
            cleanupMedia();
            setCallState(null);
          } else if (sig.type === 'webrtc-offer') {
            const pc = pcRef.current || (await startPeer(false, sig.fromUserId, callState.isVideo));
            await pc.setRemoteDescription(new RTCSessionDescription(sig.sdp));
            for (const c of pendingIceRef.current) {
              try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch {}
            }
            pendingIceRef.current = [];
            const ans = await pc.createAnswer();
            await pc.setLocalDescription(ans);
            signalChannel?.send({
              type: 'broadcast',
              event: 'call-signal',
              payload: { type: 'webrtc-answer', roomId: callState.roomId, fromUserId: currentUser.id, targetUserId: sig.fromUserId, sdp: ans }
            });
          } else if (sig.type === 'webrtc-answer' && pcRef.current) {
            await pcRef.current.setRemoteDescription(new RTCSessionDescription(sig.sdp));
            for (const c of pendingIceRef.current) {
              try { await pcRef.current.addIceCandidate(new RTCIceCandidate(c)); } catch {}
            }
            pendingIceRef.current = [];
          } else if (sig.type === 'webrtc-ice' && sig.candidate) {
            if (pcRef.current?.remoteDescription) {
              try { await pcRef.current.addIceCandidate(new RTCIceCandidate(sig.candidate)); } catch {}
            } else {
              pendingIceRef.current.push(sig.candidate);
            }
          }
        };
        window.addEventListener('quaps-call-signal', onSig);
        return () => window.removeEventListener('quaps-call-signal', onSig);
      }, [callState, currentUser?.id]);

      useEffect(() => () => cleanupMedia(), []);

      if (!callState) return null;

      const accept = async () => {
        soundEngine.play('call_connected');
        setCallState((prev) => ({ ...prev, status: 'connected' }));
        signalChannel?.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: { type: 'call-accept', roomId: callState.roomId, fromUserId: currentUser.id, targetUserId: callState.peerUserId }
        });
        try {
          await startPeer(false, callState.peerUserId, callState.isVideo);
        } catch (err) {
          onToast('Medienzugriff fehlgeschlagen: ' + err.message);
        }
      };

      const hangup = () => {
        soundEngine.play('call_ended');
        signalChannel?.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: { type: callState.status === 'incoming' ? 'call-reject' : 'call-end', roomId: callState.roomId, fromUserId: currentUser.id, targetUserId: callState.peerUserId }
        });
        cleanupMedia();
        setCallState(null);
      };

      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');

      return React.createElement(
        'div',
        { className: 'modal-backdrop', style: { zIndex: 120 } },
        React.createElement(
          'div',
          { className: 'glass-card', style: { width: '100%', maxWidth: 520, padding: 26, textAlign: 'center' } },
          React.createElement('h2', { style: { fontSize: 20, fontWeight: 800, marginBottom: 6 } }, callState.roomName || callState.peerName),
          React.createElement('div', { style: { fontSize: 13, color: 'var(--text-muted)', marginBottom: 16 } },
            callState.status === 'incoming' ? `${callState.peerName} ruft an...` : callState.status === 'outgoing' ? `Rufe ${callState.peerName} an...` : `Verbunden · ${mins}:${secs}`
          ),
          React.createElement('audio', { ref: remoteAudioRef, autoPlay: true }),
          callState.isVideo && React.createElement(
            'div',
            { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 16 } },
            React.createElement('video', { ref: remoteVideoRef, autoPlay: true, playsInline: true, style: { width: '100%', height: 160, borderRadius: 12, background: '#07070d', objectFit: 'cover' } }),
            React.createElement('video', { ref: localVideoRef, autoPlay: true, playsInline: true, muted: true, style: { width: '100%', height: 160, borderRadius: 12, background: '#07070d', objectFit: 'cover' } })
          ),
          React.createElement(
            'div',
            { style: { display: 'flex', justifyContent: 'center', gap: 10, flexWrap: 'wrap' } },
            callState.status === 'incoming' && React.createElement('button', { className: 'btn-primary', style: { background: '#10b981' }, onClick: accept }, '✓ Annehmen'),
            callState.status === 'connected' && React.createElement('button', {
              className: 'btn-secondary',
              onClick: () => {
                const next = !muted;
                localStreamRef.current?.getAudioTracks().forEach((t) => (t.enabled = !next));
                setMuted(next);
              }
            }, muted ? '🔇 Stumm' : '🎤 Mikro'),
            callState.status === 'connected' && callState.isVideo && React.createElement('button', {
              className: 'btn-secondary',
              onClick: () => {
                const next = !camOff;
                localStreamRef.current?.getVideoTracks().forEach((t) => (t.enabled = !next));
                setCamOff(next);
              }
            }, camOff ? '📷 Aus' : '📹 Cam'),
            React.createElement('button', { className: 'btn-primary', onClick: hangup }, callState.status === 'incoming' ? '✕ Ablehnen' : '📞 Auflegen')
          )
        )
      );
    }

    // =========================================================================

            .from('chat_rooms')

            .select('*')

            setLoadingRooms(false);

                : (allMembers || []).filter((m) => m.room_id === room.id).map((m) => m.user_id);
              return { ...room, isMainGroup: isMain, memberIds: mIds };
            })
            .sort((a, b) => (a.isMainGroup && !b.isMainGroup ? -1 : !a.isMainGroup && b.isMainGroup ? 1 : 0));

          const targetId = enriched.some((r) => r.id === (preferRoomId || activeRoomId))

        if (!roomId) return;
        const { data, error } = await supabase.from('chat_messages').select('*').eq('room_id', roomId).order('created_at', { ascending: true });
        if (!error) setMessages(data || []);

      useEffect(() => {

      useEffect(() => {

        setEditingMsg(null);

            const newMsg = payload.new;
            if (newMsg.room_id === activeRoomId) {
              setMessages((prev) => (prev.some((m) => m.id === newMsg.id) ? prev : [...prev, newMsg]));
            }
            if (newMsg.sender_id !== currentUser.id) {
              const mentioned = currentProfile?.username && newMsg.content?.toLowerCase().includes('@' + currentProfile.username.toLowerCase());
              soundEngine.play(mentioned ? 'chat_mention' : 'chat_message');
              notifyDesktop(`QuapsAttack · ${profilesMap[newMsg.sender_id]?.username || 'Mitglied'}`, newMsg.content);
              if (newMsg.room_id !== activeRoomId) {
                setUnreadByRoom((prev) => {
                  const next = { ...prev, [newMsg.room_id]: (prev[newMsg.room_id] || 0) + 1 };
                  onUnreadChange(Object.values(next).reduce((a, b) => a + b, 0));

          })
          .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'chat_messages' }, (payload) => {

      const handleTypingInput = (val) => {

            .from('chat_rooms')

            .select('*')
            .single();

            .from('chat_room_members')
            .insert(uniqueMembers.map((uid) => ({ room_id: room.id, user_id: uid })));

          onToast(isGroupMode ? 'Gruppe erstellt!' : 'DM gestartet!');

    function SettingsStudioModule({ currentUserId, design, onChangeDesign, onToast }) {
      const [subTab, setSubTab] = useState('design');
      const [soundSettings, setSoundSettings] = useState(() => soundEngine.load());
      const [mediaPrefs, setMediaPrefs] = useState(() => getSavedMediaPrefs());
      const [audioInputs, setAudioInputs] = useState([]);
      const [videoInputs, setVideoInputs] = useState([]);
      const [audioOutputs, setAudioOutputs] = useState([]);
      const [micTesting, setMicTesting] = useState(false);
      const [micLevel, setMicLevel] = useState(0);
      const micStreamRef = useRef(null);
      const micRafRef = useRef(null);
      const micCtxRef = useRef(null);

      useEffect(() => {
        const unsub = soundEngine.subscribe((next) => setSoundSettings(next));
        navigator.mediaDevices?.enumerateDevices?.().then((devs) => {
          setAudioInputs(devs.filter((d) => d.kind === 'audioinput'));
          setVideoInputs(devs.filter((d) => d.kind === 'videoinput'));
          setAudioOutputs(devs.filter((d) => d.kind === 'audiooutput'));
        }).catch(() => {});
        return () => {
          unsub();
          cancelAnimationFrame(micRafRef.current);
          micStreamRef.current?.getTracks().forEach((t) => t.stop());
          micCtxRef.current?.close().catch(() => {});
        };
      }, []);

      const updatePref = (patch) => {
        const next = { ...mediaPrefs, ...patch };
        setMediaPrefs(next);
        saveMediaPrefs(next, currentUserId);
      };

      const toggleMicTest = async () => {
        if (micTesting) {
          cancelAnimationFrame(micRafRef.current);
          micStreamRef.current?.getTracks().forEach((t) => t.stop());
          micCtxRef.current?.close().catch(() => {});
          setMicTesting(false);
          setMicLevel(0);
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          micStreamRef.current = stream;
          const AC = window.AudioContext || window.webkitAudioContext;
          const ctx = new AC();
          micCtxRef.current = ctx;
          const analyser = ctx.createAnalyser();
          ctx.createMediaStreamSource(stream).connect(analyser);
          const arr = new Uint8Array(analyser.frequencyBinCount);
          setMicTesting(true);
          const loop = () => {
            analyser.getByteFrequencyData(arr);
            const avg = arr.reduce((a, b) => a + b, 0) / arr.length;
            setMicLevel(Math.min(100, Math.round((avg / 128) * 100)));
            micRafRef.current = requestAnimationFrame(loop);
          };
          loop();
        } catch (err) {
          onToast('Mikrofon-Fehler: ' + err.message);
        }
      };

      return React.createElement(
        'div',
        { className: 'glass-card', style: { flex: 1, minHeight: 0, padding: 18, display: 'flex', flexDirection: 'column', gap: 14 } },

          React.createElement('button', { className: `pill-tab ${subTab === 'devices' ? 'active' : ''}`, onClick: () => setSubTab('devices') }, '🎙️ Audio & Media')
        ),

        subTab === 'design' && React.createElement(
          'div',
          { className: 'nested-box', style: { padding: 16, display: 'flex', flexDirection: 'column', gap: 14 } },
          React.createElement('div', { style: { display: 'flex', gap: 10, flexWrap: 'wrap' } },
            ACCENT_PRESETS.map((p) => React.createElement('button', {
              key: p.hex,
              type: 'button',
              className: `swatch-btn ${design.accentHex === p.hex ? 'active' : ''}`,

            }))
          ),
          React.createElement('div', { style: { display: 'flex', gap: 8 } },
            ['night', 'cozy', 'cyber'].map((m) => React.createElement('button', {
              key: m,
              type: 'button',
              className: `pill-tab ${design.bgMood === m ? 'active' : ''}`,
              onClick: () => onChangeDesign({ ...design, bgMood: m })
            }, m))
          ),
          React.createElement('div', null,
            React.createElement('div', { style: { fontSize: 12, marginBottom: 4 } }, `Glass-Deckkraft: ${Math.round(design.glassOpacity * 100)}%`),
            React.createElement('input', { type: 'range', min: 0.5, max: 0.98, step: 0.01, value: design.glassOpacity, onChange: (e) => onChangeDesign({ ...design, glassOpacity: parseFloat(e.target.value) }) })
          )
        ),

        subTab === 'sounds' && React.createElement(
          'div',
          { className: 'custom-scroll', style: { flex: 1, display: 'flex', flexDirection: 'column', gap: 12 } },
          React.createElement(
            'div',
            { style: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10 } },
            Object.entries(SOUNDPACKS).map(([k, info]) => React.createElement(
              'div',
              { key: k, className: 'nested-box', style: { padding: 13, borderColor: soundSettings.pack === k ? 'var(--accent)' : undefined } },
              React.createElement('div', { style: { fontWeight: 800, marginBottom: 4 } }, info.name),
              React.createElement('div', { style: { fontSize: 12, color: 'var(--text-muted)', marginBottom: 8 } }, info.desc),
              React.createElement('button', {

          window.removeEventListener('click', closeMenu);
          window.removeEventListener('keydown', onEsc);
        };
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast((prev) => (prev === msg ? null : prev)), 3500);
      };

      const handleChangeDesign = (nextDesign) => {
        setDesign(nextDesign);
        applyDesignToDom(nextDesign);
        try { localStorage.setItem(DESIGN_KEY, JSON.stringify(nextDesign)); } catch {}
        if (session?.user?.id) {
          clearTimeout(cloudSaveTimerRef.current);
          cloudSaveTimerRef.current = setTimeout(() => {
            syncUserSettingsToCloud(session.user.id, { design_settings: nextDesign });
          }, 400);
        }
      };

      useEffect(() => {
        applyDesignToDom(design);
      }, [design]);

      const loadAllProfiles = async () => {
        const { data } = await supabase.from('profiles').select('*');
        if (data) {
          const map = {};
          for (const p of data) map[p.id] = p;
          setProfilesMap(map);
          if (session?.user?.id && map[session.user.id]) {
            const myProf = map[session.user.id];
            setCurrentProfile(myProf);
            if (myProf.design_settings && Object.keys(myProf.design_settings).length > 0) {
              setDesign((prev) => ({ ...prev, ...myProf.design_settings }));
            }
            if (myProf.sound_settings && Object.keys(myProf.sound_settings).length > 0) {
              soundEngine.hydrateFromCloud(myProf.sound_settings);
            }
            if (myProf.media_settings && Object.keys(myProf.media_settings).length > 0) {
              saveMediaPrefs(myProf.media_settings, null);
            }
          }
        }
      };

      useEffect(() => {
        supabase.auth.getSession().then(({ data }) => {
          setSession(data.session || null);
          setAuthChecked(true);
        });
        const { data: sub } = supabase.auth.onAuthStateChange((_ev, s) => setSession(s));
        return () => sub.subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (!session?.user) {
          setCurrentProfile(null);
          soundEngine.setUserId(null);
          return;
        }
        soundEngine.setUserId(session.user.id);
        loadAllProfiles();

        const sigChannel = supabase.channel('quaps-webrtc-signaling', { config: { broadcast: { self: false } } });
        sigChannel.on('broadcast', { event: 'call-signal' }, ({ payload }) => {
          if (!payload) return;
          if (payload.targetUserId && payload.targetUserId !== session.user.id) return;
          if (payload.type === 'call-invite') {
            setCallState({
              status: 'incoming',
              roomId: payload.roomId,
              roomName: payload.roomName,
              isGroup: payload.isGroup,
              isVideo: payload.isVideo,
              peerUserId: payload.fromUserId,
              peerName: payload.fromUsername
            });
          } else {
            window.dispatchEvent(new CustomEvent('quaps-call-signal', { detail: payload }));
          }
        }).subscribe();
        signalChannelRef.current = sigChannel;
        return () => supabase.removeChannel(sigChannel);
      }, [session?.user?.id]);

      const canManageRoles = isManagementRole(currentProfile?.role);
      const navItems = [
        { id: 'chat', label: '💬 Direkt & Gruppen', badge: unreadChatCount > 0 ? unreadChatCount : null },
        { id: 'pinboard', label: '📌 Pinnwand' },
        { id: 'calendar', label: '📅 Kalender' },
        { id: 'vault', label: '🗂️ Mediathek & Tresor' },
        { id: 'quapssi', label: '🤖 QuapsSI KI' },
        ...(canManageRoles ? [{ id: 'management', label: '👑 Management & Moderation' }] : []),
        { id: 'sounds', label: '🎨 Design, Sounds & Media' }
      ];

      return React.createElement(
        'div',
        { className: `app-shell ${design.bgMood === 'cozy' ? 'theme-cozy' : design.bgMood === 'cyber' ? 'theme-cyber' : ''} ${overdrive ? 'overdrive-mode' : ''} ${barrelRoll ? 'barrel-roll' : ''}` },
        React.createElement(
          'header',
          { className: 'top-bar' },
          React.createElement(
            'div',
            { className: 'brand-badge' },
            React.createElement('div', { className: 'brand-emblem' }, 'Q'),
            React.createElement('span', null, 'QUAPS', React.createElement('span', { className: 'gold-gradient-text' }, 'ATTACK'))
          ),
          session?.user && React.createElement(
            'div',
            { style: { display: 'flex', alignItems: 'center', gap: 10, fontSize: 12.5 } },
            React.createElement('span', { style: { fontWeight: 600 } }, currentProfile?.username || session.user.email),
            currentProfile?.role && React.createElement('span', { className: canManageRoles ? 'badge-gold' : 'badge-green' }, currentProfile.role)
          )
        ),

        !authChecked
          ? React.createElement('div', { style: { flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' } }, 'Lädt...')
          : !session?.user
          ? React.createElement(AuthView, { onToast: showToast })
          : React.createElement(
              'div',
              { className: 'main-layout' },
              React.createElement(
                'aside',
                { className: 'sidebar glass-card' },
                React.createElement(
                  'div',
                  { style: { display: 'flex', flexDirection: 'column', gap: 4 } },
                  navItems.map((item) => React.createElement(
                    'button',
                    { key: item.id, className: `nav-btn ${activeTab === item.id ? 'active' : ''}`, onClick: () => setActiveTab(item.id) },
                    React.createElement('span', null, item.label),
                    item.badge && React.createElement('span', { className: 'badge-red' }, item.badge)
                  ))
                ),
                React.createElement(
                  'div',
                  { className: 'nested-box', style: { padding: 12, display: 'flex', flexDirection: 'column', gap: 8 } },
                  React.createElement(
                    'div',
                    { style: { display: 'flex', alignItems: 'center', gap: 10 } },
                    React.createElement(AvatarBadge, { profile: currentProfile, size: 38 }),
                    React.createElement('div', { style: { minWidth: 0, flex: 1 } },
                      React.createElement('div', { style: { fontWeight: 700, fontSize: 13 } }, currentProfile?.username || 'Mitglied'),
                      React.createElement('div', { style: { fontSize: 11.5, color: 'var(--text-muted)' } }, currentProfile?.custom_status_text || 'Online')
                    )
                  ),
                  React.createElement(
                    'div',
                    { style: { display: 'flex', gap: 6 } },
                    React.createElement('button', { className: 'btn-secondary', style: { flex: 1, padding: '6px 8px' }, onClick: () => setShowProfileModal(true) }, '✏️ Profil'),
                    React.createElement('button', { className: 'btn-danger', onClick: async () => { await supabase.auth.signOut(); setSession(null); } }, 'Logout')
                  )
                )
              ),
              React.createElement(
                'main',
                { className: 'content-area' },
                activeTab === 'chat' && React.createElement(ChatModule, {
                  currentUser: session.user,
                  currentProfile,
                  profilesMap,
                  signalChannel: signalChannelRef.current,
                  setCallState,
                  onUnreadChange: setUnreadChatCount,
                  onOpenContextMenu: setContextMenu,
                  onEasterEgg: (t) => {
                    soundEngine.play('easter_egg', true);
                    if (t === 'overdrive') setOverdrive((p) => !p);
                    if (t === 'barrelroll') { setBarrelRoll(true); setTimeout(() => setBarrelRoll(false), 950); }
                  },
                  onToast: showToast
                }),
                activeTab === 'pinboard' && React.createElement(PinboardModule, { currentUser: session.user, currentProfile, profilesMap, onOpenContextMenu: setContextMenu, onToast: showToast }),
                activeTab === 'calendar' && React.createElement(CalendarModule, { currentUser: session.user, profilesMap, onToast: showToast }),
                activeTab === 'vault' && React.createElement(VaultModule, { currentUser: session.user, profilesMap, onToast: showToast }),
                activeTab === 'quapssi' && React.createElement(QuapsSIModule, { currentUser: session.user, onToast: showToast }),
                activeTab === 'management' && React.createElement(ManagementModule, { currentUser: session.user, currentProfile, profilesMap, onRefreshProfiles: loadAllProfiles, onToast: showToast }),
                activeTab === 'sounds' && React.createElement(SettingsStudioModule, { currentUserId: session.user.id, design, onChangeDesign: handleChangeDesign, onToast: showToast })
              )
            ),

        showProfileModal && currentProfile && React.createElement(ProfileModal, {
          profile: currentProfile,
          onClose: () => setShowProfileModal(false),
          onSaved: (u) => { setCurrentProfile(u); setProfilesMap((prev) => ({ ...prev, [u.id]: u })); },
          onToast: showToast
        }),

        callState && session?.user && React.createElement(CallOverlay, {
          callState,
          setCallState,
          currentUser: session.user,
          signalChannel: signalChannelRef.current,
          onToast: showToast
        }),

        React.createElement(ContextMenuPopup, { menuState: contextMenu, onClose: () => setContextMenu(null) }),
        toast && React.createElement('div', { className: 'toast-banner' }, toast)
      );
    }

    createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
