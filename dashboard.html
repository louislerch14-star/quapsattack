<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBARBEIT</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-green: #2ea043;
            --accent-blue: #58a6ff;
            --discord-purple: #5865f2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .maintenance-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            max-width: 550px;
            width: 100%;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* Status Header */
        .status-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .admin-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(210, 153, 34, 0.15);
            color: #d29922;
            border: 1px solid rgba(210, 153, 34, 0.4);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #d29922;
            border-radius: 50%;
            animation: pulseDot 1.5s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        p.desc {
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        /* Terminal Window */
        .terminal {
            background-color: #010409;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .terminal-header {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        .terminal-body {
            color: #7ee787;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 70px;
        }

        .log-line {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prefix {
            color: var(--accent-blue);
            user-select: none;
        }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 14px;
            background-color: #7ee787;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Discord Contact */
        .contact-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .contact-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.88rem;
            color: var(--text-main);
        }

        .discord-icon {
            width: 20px;
            height: 20px;
            fill: var(--discord-purple);
        }

        .discord-tag {
            color: var(--accent-blue);
            font-weight: 600;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <div class="status-header">
            <div class="admin-tag">
                <span>Lois_7</span>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span>
                In Wartung
            </div>
        </div>

        <h1>Web Admin arbeitet an der Seite</h1>
        <p class="desc">
            Ich schraube gerade im Hintergrund an den neusten Systemen und Features. Die Seite ist gleich wieder am Start!
        </p>

        <!-- Dynamic Dev Terminal -->
        <div class="terminal">
            <div class="terminal-header">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <div class="terminal-body">
                <div class="log-line">
                    <span class="prefix">system@lois7:~$</span>
                    <span id="typed-text"></span><span class="cursor"></span>
                </div>
            </div>
        </div>

        <!-- Discord Info -->
        <div class="contact-box">
            <div class="contact-info">
                <svg class="discord-icon" viewBox="0 0 127.14 96.36">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.92,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.92,96.12,53,91.08,65.69,84.69,65.69Z"/>
                </svg>
                <span>Wichtiges Anliegen?</span>
            </div>
            <span class="discord-tag">Schreib mir auf Discord</span>
        </div>
    </div>

    <script>
        // Realistische Log-Nachrichten, die nacheinander abgetippt werden
        const logs = [
            "git pull origin main",
            "npm run build",
            "updating backend routes...",
            "applying custom scripts...",
            "status: deploy pending..."
        ];

        let logIndex = 0;
        let charIndex = 0;
        const typedTextSpan = document.getElementById("typed-text");

        function typeLog() {
            if (charIndex < logs[logIndex].length) {
                typedTextSpan.textContent += logs[logIndex].charAt(charIndex);
                charIndex++;
                setTimeout(typeLog, 50);
            } else {
                setTimeout(eraseLog, 2000);
            }
        }

        function eraseLog() {
            if (charIndex > 0) {
                typedTextSpan.textContent = logs[logIndex].substring(0, charIndex - 1);
                charIndex--;
                setTimeout(eraseLog, 30);
            } else {
                logIndex = (logIndex + 1) % logs.length;
                setTimeout(typeLog, 400);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(typeLog, 500);
        });
    </script>
</body>
</html>
