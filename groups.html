<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>QuapsHub // Zentrale</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: sans-serif; padding: 40px; }
        .mc-input { display: block; width: 100%; margin: 10px 0; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; }
        .mc-action { padding: 15px; background: #004a99; color: #fff; border: none; cursor: pointer; width: 100%; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div style="max-width: 500px;">
        <h1>GRUPPEN ERSTELLEN</h1>
        <input type="text" id="g-name" class="mc-input" placeholder="Name">
        <input type="text" id="g-desc" class="mc-input" placeholder="Beschreibung">
        <input type="password" id="g-pass" class="mc-input" placeholder="Passwort">
        <button id="btn-save" class="mc-action">GRUPPE SPEICHERN</button>
    </div>

    <script>
        const supabase = supabase.createClient(
            'https://sdwelvinfbqxivvxnjkh.supabase.co', 
            'sb_publishable_p84c6F4Q0-uwjYoOujrMgw_0EdclXik'
        );

        document.getElementById('btn-save').addEventListener('click', async () => {
            const name = document.getElementById('g-name').value;
            const desc = document.getElementById('g-desc').value;
            const pass = document.getElementById('g-pass').value;

            console.log("Versuche zu speichern:", name);

            const { data, error } = await supabase.from('groups').insert([
                { name: name, description: desc, password: pass }
            ]);

            if (error) {
                alert("FEHLER: " + error.message);
                console.error(error);
            } else {
                alert("Erfolgreich gespeichert!");
                location.reload();
            }
        });
    </script>
</body>
</html>
