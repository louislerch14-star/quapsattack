<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>QuapsHub // Gruppen-Zentrale</title>
    <style>
        /* Quaps Attack Design Style */
        body { background: #0f0f0f; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; }
        .sidebar { width: 240px; background: #161616; height: 100vh; border-right: 1px solid #333; padding: 20px; }
        main { flex: 1; padding: 40px; overflow-y: auto; }
        h1 { font-size: 32px; margin-bottom: 5px; }
        h1 span { color: #ffcc00; }
        .mc-panel { background: #1a1a1a; border: 1px solid #333; padding: 20px; border-radius: 4px; margin-bottom: 20px; }
        .mc-panel-title { color: #ffcc00; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .mc-input { width: 100%; background: #0f0f0f; border: 1px solid #333; padding: 10px; color: #fff; margin-bottom: 10px; box-sizing: border-box; }
        .mc-action { background: #004a99; color: #fff; border: none; padding: 10px 20px; cursor: pointer; width: 100%; font-weight: bold; }
        .mc-action:hover { background: #0066cc; }
        .group-card { border: 1px solid #333; padding: 15px; margin-bottom: 10px; cursor: pointer; }
        .group-card:hover { border-color: #ffcc00; }
    </style>
</head>
<body>

    <!-- Sidebar aus deinem Design -->
    <nav class="sidebar">
        <div style="color: #ffcc00; font-weight: bold; margin-bottom: 20px;">QUAPS HUB // v2.6</div>
        <div onclick="window.location.href='index.html'" style="cursor: pointer; margin-bottom: 10px;">HOME</div>
        <div style="color: #00ffcc;">GRUPPEN-ZENTRALE</div>
    </nav>

    <main>
        <div class="hero">
            <h1>GRUPPEN<span>ZENTRALE</span></h1>
            <p>Koordiniere deine Teams und Projekte.</p>
        </div>

        <!-- Erstellungs-Panel -->
        <div class="mc-panel">
            <div class="mc-panel-title">NEUE GRUPPE ANLEGEN</div>
            <input type="text" id="g-name" class="mc-input" placeholder="Gruppen-Name...">
            <input type="text" id="g-desc" class="mc-input" placeholder="Ziel der Gruppe...">
            <button class="mc-action" onclick="createGroup()">▶ PROJEKT STARTEN</button>
        </div>

        <!-- Dashboard-Anzeige -->
        <div class="mc-panel">
            <div class="mc-panel-title">DEINE PROJEKTE</div>
            <div id="groups-container">
                <div class="group-card" onclick="enterGroup('SMP')">
                    <strong>Quaps SMP // Technik</strong><br>
                    <small>Status: Aktiv</small>
                </div>
            </div>
        </div>
    </main>

    <script>
        function createGroup() {
            const name = document.getElementById('g-name').value;
            alert("Gruppe " + name + " wurde initialisiert!");
            // Hier kommt später die Supabase-Anbindung rein
        }

        function enterGroup(id) {
            // Logik für das individuelle Gruppen-Dashboard
            window.location.href = "group-board.html?id=" + id;
        }
    </script>
</body>
</html>
