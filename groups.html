<div class="mc-panel">
    <div class="mc-panel-title" onclick="toggleCreate()">+ NEUE GRUPPE INITIALISIEREN</div>
    <div id="create-section" style="display: none;">
        <input type="text" id="g-name" class="mc-input" placeholder="Name">
        <input type="text" id="g-desc" class="mc-input" placeholder="Beschreibung">
        <input type="password" id="g-pass" class="mc-input" placeholder="Passwort">
        <input type="file" id="g-file" class="mc-input">
        <button class="mc-action" onclick="createGroup()">▶ PROJEKT STARTEN</button>
    </div>
</div>

<script>
    function toggleCreate() {
        const section = document.getElementById('create-section');
        section.style.display = (section.style.display === 'none') ? 'block' : 'none';
    }

    async function createGroup() {
        const name = document.getElementById('g-name').value;
        const file = document.getElementById('g-file').files[0];
        
        // Storage Upload
        const { data: imgData } = await supabase.storage.from('gruppen-logos').upload(`logo_${Date.now()}`, file);
        
        // Insert
        await supabase.from('groups').insert([{
            name: name,
            description: document.getElementById('g-desc').value,
            password: document.getElementById('g-pass').value,
            image_url: imgData.path
        }]);
        alert("Gruppe " + name + " aktiv!");
        location.reload();
    }
</script>
