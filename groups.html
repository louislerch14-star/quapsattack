<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>QuapsHub // Gruppen-Zentrale</title>
</head>
<body>

    <!-- Video Background bleibt konsistent mit index.html -->
    <div class="video-bg"><iframe src="..."></iframe></div>

    <!-- Sidebar & Layout kommen von deiner index.html -->
    <main>
        <div class="hero">
            <h1>GRUPPEN<span>ZENTRALE</span></h1>
            <p class="hero-sub">Erstelle Teams, verwalte Projekte und koordiniere dich mit deinen Partnern.</p>
        </div>

        <!-- Gruppen-Erstellung Panel -->
        <div class="mc-panel">
            <div class="mc-panel-title">NEUE GRUPPE ERSTELLEN</div>
            <label class="mc-label">GRUPPEN NAME</label>
            <input type="text" id="g-name" class="mc-input" placeholder="Projektname...">
            
            <label class="mc-label">LOGO HOCHLADEN</label>
            <div class="file-upload-wrapper">
                <label class="file-upload-label" id="file-label">DATEI AUSWÄHLEN</label>
                <input type="file" id="g-file" class="file-upload-input" onchange="updateName(this)">
            </div>
            
            <button class="mc-action" onclick="createGroup()" style="margin-top: 15px;">GRUPPE INITIALISIEREN</button>
        </div>

        <!-- Aktive Gruppen Grid -->
        <div class="download-grid" id="groups-container">
            <!-- Gruppenkarten laden hier rein -->
        </div>
    </main>

    <script>
        // Logik für Gruppen-Dashboard:
        // 1. Gruppe erstellen (Supabase insert)
        // 2. Gruppen-Dashboard (No-Code Editor für Todo-Listen & Infos)
        
        async function createGroup() {
            // Hier kommt deine Supabase Logik rein
            console.log("Gruppe wird in der Datenbank initialisiert...");
        }

        function updateName(input) {
            document.getElementById('file-label').innerText = input.files[0].name;
        }
    </script>
</body>
</html>
