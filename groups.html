<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Quaps Gruppen-Zentrale</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --panel: #14182d; --accent: #5865F2; }
    body { background: #0b0c10; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
    .nav { display: flex; gap: 10px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
    .group-card { background: var(--panel); border: 1px solid #333; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
    .btn { background: var(--accent); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    input { width: 100%; padding: 10px; margin: 5px 0; background: #1a1e35; border: 1px solid #444; color: white; border-radius: 4px; }
    .list-item { background: #1a1e35; padding: 10px; margin: 5px 0; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="nav">
    <button class="btn" onclick="showSection('overview')">Gruppen-Übersicht</button>
    <button class="btn" onclick="showSection('create')">Gruppe erstellen</button>
  </div>

  <div id="overview">
    <h1>Alle Gruppen</h1>
    <div id="groups-container"></div>
  </div>

  <div id="create" style="display:none;">
    <h1>Neue Gruppe erstellen</h1>
    <input type="text" id="name" placeholder="Name">
    <input type="text" id="desc" placeholder="Beschreibung">
    <input type="text" id="img" placeholder="Bild-URL">
    <input type="password" id="pass" placeholder="Passwort">
    <button class="btn" onclick="saveGroup()">Speichern</button>
  </div>

  <div id="editor" style="display:none;">
    <h2 id="active-group-name">Gruppe</h2>
    <input type="text" id="new-item" placeholder="Neues To-Do oder Item">
    <button class="btn" onclick="addItem()">Hinzufügen</button>
    <div id="items-list"></div>
  </div>

<script>
  // ERSETZE DURCH DEINE SUPABASE DATEN
  const supabase = supabase.createClient('DEINE_URL', 'DEIN_KEY');
  let currentGroupId = null;

  async function saveGroup() {
    await supabase.from('groups').insert([{ 
      name: document.getElementById('name').value,
      description: document.getElementById('desc').value,
      image_url: document.getElementById('img').value,
      password: document.getElementById('pass').value 
    }]);
    alert("Erstellt!");
    location.reload();
  }

  async function loadGroups() {
    const { data } = await supabase.from('groups').select('*');
    const container = document.getElementById('groups-container');
    container.innerHTML = data.map(g => `
      <div class="group-card">
        <h3>${g.name}</h3>
        <p>${g.description}</p>
        <button class="btn" onclick="joinGroup(${g.id}, '${g.password}', '${g.name}')">Beitreten</button>
      </div>
    `).join('');
  }

  function joinGroup(id, pass, name) {
    const input = prompt("Passwort:");
    if(input === pass) {
      currentGroupId = id;
      document.getElementById('overview').style.display = 'none';
      document.getElementById('create').style.display = 'none';
      document.getElementById('editor').style.display = 'block';
      document.getElementById('active-group-name').innerText = name;
      loadItems();
    } else { alert("Falsch!"); }
  }

  async function addItem() {
    const content = document.getElementById('new-item').value;
    await supabase.from('group_content').insert([{ group_id: currentGroupId, content, type: 'todo' }]);
    loadItems();
  }

  async function loadItems() {
    const { data } = await supabase.from('group_content').select('*').eq('group_id', currentGroupId);
    document.getElementById('items-list').innerHTML = data.map(i => `<div class="list-item">${i.content}</div>`).join('');
  }

  function showSection(s) {
    document.getElementById('overview').style.display = s === 'overview' ? 'block' : 'none';
    document.getElementById('create').style.display = s === 'create' ? 'block' : 'none';
  }

  loadGroups();
</script>
</body>
</html>
