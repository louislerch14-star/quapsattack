<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>QuapsHub // Zentrale</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; display: flex; }
        .sidebar { width: 260px; background: #161616; padding: 25px; height: 100vh; border-right: 1px solid #333; }
        .mc-input { width: 100%; background: #000; border: 1px solid #444; padding: 10px; color: #fff; margin-bottom: 10px; }
        .mc-action { background: #a8ff78; color: #000; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<nav class="sidebar">
    <h3>GRUPPEN ERSTELLEN</h3>
    <input type="text" id="g-name" class="mc-input" placeholder="Name">
    <input type="text" id="g-desc" class="mc-input" placeholder="Beschreibung">
    <input type="password" id="g-pass" class="mc-input" placeholder="Passwort">
    <button id="save-btn" class="mc-action">SPEICHERN</button>
</nav>

<main style="padding: 40px; flex: 1;">
    <div id="groups-list"></div>
</main>

<script>
    // WICHTIG: Hier muss ein Key rein, der mit "sb_" beginnt!
    const URL = "https://sdwelvinfbqxivvxnjkh.supabase.co";
    const KEY = "HIER_DEN_SB_KEY_EINFÜGEN"; 
    const supabase = supabase.createClient(URL, KEY);

    document.getElementById('save-btn').addEventListener('click', async () => {
        const { error } = await supabase.from('groups').insert([{
            name: document.getElementById('g-name').value,
            description: document.getElementById('g-desc').value,
            password: document.getElementById('g-pass').value
        }]);
        
        if (error) {
            alert("FEHLER: " + error.message);
            console.error(error);
        } else {
            alert("Erfolg!");
            location.reload();
        }
    });

    async function load() {
        const { data } = await supabase.from('groups').select('*');
        document.getElementById('groups-list').innerHTML = data.map(g => `<div>${g.name}</div>`).join('');
    }
    load();
</script>
</body>
</html>
