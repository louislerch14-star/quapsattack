<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>QuapsHub // Gruppen-Zentrale</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Kurze CSS-Ergänzung für das Upload-Design */
    .file-upload-label { border: 2px dashed var(--border); padding: 15px; text-align: center; display: block; cursor: pointer; color: var(--muted); }
    .file-upload-input { display: none; }
  </style>
</head>
<body>

  <nav class="sidebar">...</nav>

  <main>
    <div class="hero">
      <h1>GRUPPEN<span>ZENTRALE</span></h1>
    </div>

    <div class="mc-panel">
      <div class="mc-panel-title">NEUE GRUPPE ERSTELLEN</div>
      <input type="text" id="g-name" class="mc-input" placeholder="Gruppen-Name">
      <input type="text" id="g-desc" class="mc-input" placeholder="Beschreibung">
      <input type="password" id="g-pass" class="mc-input" placeholder="Passwort">
      
      <label class="file-upload-label" id="file-label" onclick="document.getElementById('g-file').click()">📁 LOGO HOCHLADEN</label>
      <input type="file" id="g-file" class="file-upload-input" onchange="document.getElementById('file-label').textContent=this.files[0].name">
      
      <button class="mc-action full" onclick="createGroup()">▶ GRUPPE STARTEN</button>
    </div>

    <div id="groups-container" class="download-grid"></div>
  </main>

  <script>
    const supabase = supabase.createClient('URL', 'KEY');

    async function createGroup() {
      const file = document.getElementById('g-file').files[0];
      const name = document.getElementById('g-name').value;
      
      // 1. Upload
      const { data: uploadData } = await supabase.storage.from('gruppen-logos').upload(`logo_${Date.now()}`, file);
      
      // 2. DB Insert
      await supabase.from('groups').insert([{
        name: name,
        description: document.getElementById('g-desc').value,
        password: document.getElementById('g-pass').value,
        image_url: uploadData.path
      }]);
      location.reload();
    }
  </script>
</body>
</html>
