<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>QuapsHub // Gruppen-Zentrale</title>
</head>
<body>

    <!-- VIDEO BACKGROUND -->
    <div class="video-bg"><iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&loop=1&controls=0&mute=1"></iframe></div>

    <!-- SIDEBAR (Hier exakt deinen Code aus index.html einfügen) -->
    <nav class="sidebar">
        <!-- Dein Sidebar-Logo & Buttons -->
    </nav>

    <!-- MAIN CONTENT -->
    <main>
        <div class="hero">
            <h1>GRUPPEN<span>ZENTRALE</span></h1>
            <p class="hero-sub">Erstelle Gruppen und arbeite mit deinem Team.</p>
        </div>

        <!-- PANEL: GRUPPE ERSTELLEN -->
        <div class="mc-panel">
            <div class="mc-panel-title">NEUE GRUPPE ANLEGEN</div>
            
            <label class="mc-label">GRUPPEN NAME</label>
            <input type="text" id="g-name" class="mc-input" placeholder="Name...">
            
            <label class="mc-label">BESCHREIBUNG</label>
            <input type="text" id="g-desc" class="mc-input" placeholder="Worum geht es hier?">
            
            <label class="mc-label">LOGO HOCHLADEN</label>
            <div class="file-upload-wrapper">
                <label class="file-upload-label" id="file-label">DATEI AUSWÄHLEN</label>
                <input type="file" id="g-file" class="file-upload-input" onchange="document.getElementById('file-label').innerText=this.files[0].name">
            </div>

            <button class="mc-action" style="width:100%; margin-top: 15px;" onclick="createGroup()">▶ GRUPPE ERSTELLEN</button>
        </div>

        <!-- PANEL: DEINE GRUPPEN -->
        <div class="mc-panel">
            <div class="mc-panel-title">DEINE GRUPPEN</div>
            <div id="groups-container">
                <!-- Hier werden die Gruppen mit JS geladen -->
            </div>
        </div>
    </main>

    <script>
        // Supabase Einbindung fehlt hier noch bei dir
        async function createGroup() {
            const name = document.getElementById('g-name').value;
            const desc = document.getElementById('g-desc').value;
            // Supabase Logic kommt hier rein...
            alert("Gruppe '" + name + "' wird erstellt!");
        }
    </script>
</body>
</html>
