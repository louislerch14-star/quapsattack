<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request | Quaps Evolved</title>
    <link rel="icon" type="image/x-icon" href="quaps-evoluted.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #00d4ff; 
            --card-bg: rgba(12, 12, 14, 0.9);
            --warning: #ffcc00;
        }

        body {
            margin: 0; 
            font-family: 'Outfit', sans-serif;
            background: #050507; 
            color: white;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            position: relative;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(5, 5, 7, 0.4), rgba(5, 5, 7, 0.4)), 
                        url('quaps-evoluted.jpg') center/cover no-repeat;
            z-index: -1;
            filter: brightness(1.2);
        }

        nav { padding: 30px; text-align: center; }
        nav a { color: #ccc; text-decoration: none; font-size: 0.8rem; font-weight: bold; letter-spacing: 1px; }
        nav a:hover { color: var(--accent); }

        .main-flex { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        
        .form-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 50px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 480px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h2 { font-size: 2.2rem; font-weight: 900; margin-bottom: 10px; text-align: center; letter-spacing: -1px; }
        .info-text { text-align: center; color: #888; font-size: 0.8rem; margin-bottom: 35px; }
        
        .important-note {
            background: rgba(255, 204, 0, 0.1);
            border-left: 4px solid var(--warning);
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 8px;
        }
        .important-note p {
            margin: 0;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #eee;
        }
        .important-note b { color: var(--warning); text-transform: uppercase; font-size: 0.75rem; display: block; margin-bottom: 5px; }

        label { display: block; font-size: 0.75rem; color: #aaa; text-transform: uppercase; margin-bottom: 8px; font-weight: bold; letter-spacing: 1px; }
        label span { color: var(--accent); margin-left: 3px; font-size: 1rem; }
        
        input, textarea {
            width: 100%; padding: 18px; background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; box-sizing: border-box;
            margin-bottom: 25px; transition: 0.3s; font-family: inherit;
        }

        input:focus, textarea:focus { border-color: var(--accent); outline: none; background: rgba(0, 0, 0, 0.6); }
        
        button {
            width: 100%; padding: 20px; background: var(--accent); color: #000;
            border: none; border-radius: 12px; font-weight: 900; text-transform: uppercase; cursor: pointer;
            transition: 0.3s; letter-spacing: 1px;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4); filter: brightness(1.1); }

        footer { 
            background: rgba(0, 0, 0, 0.8); 
            padding: 40px; 
            text-align: center; 
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .footer-logo { font-weight: 900; font-size: 1rem; margin-bottom: 5px; }
        .footer-logo span { color: var(--accent); }
        .copyright { color: #444; font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <nav>
        <a href="evoluted.html">← BACK TO PORTAL</a>
    </nav>

    <div class="main-flex">
        <div class="form-card">
            <h2>MOD REQUEST</h2>
            <p class="info-text">Felder mit <span>*</span> sind Pflichtfelder</p>

            <div class="important-note">
                <b>Wichtiger Hinweis:</b>
                <p>Falls du keinen Link hast, beschreibe die Mod bitte <u>sehr ausführlich</u> (Features, Ingame-Name), damit ich sie finden kann!</p>
            </div>
            
            <form id="modForm" action="https://formspree.io/f/xdabgyro" method="POST">
                <label>Minecraft Username <span>*</span></label>
                <input type="text" id="username" name="name" placeholder="Ingame Name" required>
                
                <label>Mod Title <span>*</span></label>
                <input type="text" id="modtitle" name="mod" placeholder="Name der Mod" required>
                
                <label>Official Link (Optional)</label>
                <input type="url" id="modlink" name="url" placeholder="CurseForge / Modrinth Link">
                
                <label>Description <span>*</span></label>
                <textarea id="description" name="desc" rows="5" placeholder="Beschreibe hier alles, was wichtig ist..." required></textarea>
                
                <button type="submit" id="submitBtn">Submit Request</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-logo">QUAPS ATTACK <span>OFFICIAL</span></div>
        <div class="copyright">&copy; 2026 OFFICIAL ENCRYPTED PORTAL</div>
    </footer>

    <script>
        const form = document.getElementById('modForm');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault(); // Stoppt Formspree kurz
            btn.disabled = true;
            btn.innerText = "SENDING...";

            const webhookUrl = "https://discord.com/api/webhooks/1501553557512523877/RbCh_J1zwgRZcn3q-TqU2Qzr4vuZp7m6bDjRELijH7qqVNI25Gc1VKXALiY7GdC9V50f";
            
            const name = document.getElementById('username').value;
            const mod = document.getElementById('modtitle').value;
            const link = document.getElementById('modlink').value || "Kein Link angegeben (Suche erforderlich)";
            const desc = document.getElementById('description').value;

            const discordMessage = {
                username: "EVOLVED MOD BOT",
                avatar_url: "https://quapsattack.airbusfan.de/quaps-evoluted.jpg",
                embeds: [{
                    title: "🚀 Neuer Mod-Vorschlag!",
                    color: 5763719,
                    fields: [
                        { name: "Spieler", value: "```" + name + "```", inline: true },
                        { name: "Mod-Name", value: "```" + mod + "```", inline: true },
                        { name: "Link / Status", value: link },
                        { name: "Beschreibung & Grund", value: desc }
                    ],
                    footer: { text: "Evolved Portal System" },
                    timestamp: new Date()
                }]
            };

            try {
                // Erst an Discord senden
                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(discordMessage)
                });

                // Dann an Formspree weiterleiten
                setTimeout(() => {
                    form.submit(); 
                }, 500);

            } catch (error) {
                // Bei Fehler trotzdem Formspree abschicken
                form.submit();
            }
        });
    </script>

</body>
</html>
