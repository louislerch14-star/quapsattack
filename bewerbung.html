<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuapsAttack - Server Bewerbung</title>
<style>
  body {
    background: radial-gradient(circle at center, #2c2c2c 0%, #1a1a1a 100%);
    color: #fff;
    font-family: 'Press Start 2P', 'Segoe UI', Arial, sans-serif; /* Minecraft-Vibe! */
    padding: 40px 20px;
    margin: 0;
    min-height: 100vh;
  }
  .apply-container {
    max-width: 600px;
    margin: 0 auto;
    background: rgba(20, 20, 20, 0.9);
    border: 4px solid #444;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.05);
  }
  h1 {
    color: #ffd700; /* Gold */
    text-align: center;
    margin-bottom: 30px;
    text-transform: uppercase;
    text-shadow: 3px 3px #000;
  }
  .form-group { margin-bottom: 25px; }
  label {
    display: block;
    color: #ffd700;
    margin-bottom: 10px;
    font-size: 0.7rem; /* Retro-Look */
  }
  .mc-input, .mc-textarea {
    width: 100%;
    padding: 15px;
    background: #000;
    border: 2px solid #555;
    color: #fff;
    border-radius: 4px;
    font-family: 'Segoe UI', sans-serif;
    font-size: 1rem;
    transition: 0.3s;
  }
  .mc-input:focus, .mc-textarea:focus {
    border-color: #ffd700;
    outline: none;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
  }
  .rules-box {
    background: #0d0d0d;
    border: 2px solid #333;
    padding: 15px;
    height: 120px;
    overflow-y: auto;
    margin-bottom: 20px;
    font-size: 0.8rem;
    color: #aaa;
    font-family: sans-serif;
  }
  .checkbox-group {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
    cursor: pointer;
  }
  .checkbox-group input { margin-right: 15px; transform: scale(1.4); }
  .mc-btn {
    width: 100%;
    background: #222;
    color: #555;
    border: 3px solid #444;
    padding: 18px;
    font-size: 0.8rem;
    cursor: not-allowed;
    text-transform: uppercase;
    font-family: 'Press Start 2P', sans-serif;
    transition: 0.3s;
  }
  .mc-btn.enabled {
    background: #5caf07;
    border-color: #73d216;
    color: #fff;
    cursor: pointer;
    text-shadow: 1px 1px #000;
  }
  .mc-btn.enabled:hover {
    background: #6cc408;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(115, 210, 22, 0.4);
  }
</style>
</head>
<body>

<div class="apply-container">
  <h1>📋 Server Bewerbung</h1>
  
  <form id="applyForm" onsubmit="submitApplication(event)">
    
    <div class="form-group">
      <label for="username">DEIN MINECRAFT USERNAME</label>
      <input type="text" id="username" class="mc-input" placeholder="z.B. Lois_7" required oninput="checkFormValidity()">
    </div>

    <div class="form-group">
      <label for="begruendung">WARUM MÖCHTEST DU MITZOCKEN?</label>
      <textarea id="begruendung" class="mc-textarea" rows="5" placeholder="Schreib eine kurze Begründung, warum wir dich auf den Server lassen sollten..." required oninput="checkFormValidity()"></textarea>
    </div>

    <hr style="border: 0; border-top: 1px solid #444; margin: 25px 0;">

    <label>📜 UNSERE SERVER REGELN</label>
    <div class="rules-box">
      <strong>1. Griefer Schutz:</strong> Das Griefen des Spawns ist strengstens untersagt.<br>
      <strong>2. Modifikationen:</strong> Hacks, X-Ray oder unfaire Clients führen zum sofortigen Bann.<br>
      <!--<strong>3. QA11 Extra:</strong> Schicke ein Bild von deiner Base und sie steht unter Grieferschutz.<br>-->
    </div>

    <label class="checkbox-group">
      <input type="checkbox" id="checkRules" onchange="checkFormValidity()">
      <span>Ich respektiere die Regeln und habe das Regelwerk oben aufmerksam gelesen._.</span>
    </label>

    <label class="checkbox-group">
      <input type="checkbox" id="checkPlayers" onchange="checkFormValidity()">
      <span>Ich respektiere alle Mitspieler und verhalte mich freundlich:)</span>
    </label>

    <label class="checkbox-group">
      <input type="checkbox" id="checkStealing" onchange="checkFormValidity()">
      <span>Ich schwöre, ich werde mich immer stets brav benehmen:|</span>
    </label>

    <label class="checkbox-group">
      <input type="checkbox" id="checkBetteln" onchange="checkFormValidity()">
      <span>Ich werde den Admin niemals nach Rechten (OP), Items oder anderen anbetteln;-;</span>
    </label>

    <button type="submit" id="submitBtn" class="mc-btn" disabled>Bewerbung absenden</button>
  </form>

  <div id="statusMessage" class="status-msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Deine Supabase Verbindungsdaten
  const SUPABASE_URL = "https://sdwelvinfbqxivvxnjkh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkd2VsdmluZmJxeGl2dnhuamtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDAxNjMsImV4cCI6MjA5NTQ3NjE2M30.aRc-rwNoZwx2vHS3tvvDkQr7t6el6ankRsgkldgHCBE";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Dein Discord Webhook für eingehende Bewerbungen
  const DISCORD_APPLY_WEBHOOK = "https://discord.com/api/webhooks/1509890063138295879/eo2gKT2ZKKCK27lO_Z55ZkGZcxsOuymexWtFJAMQqFJko3RyIwVOO2ZIobtiH7xyI9LR";

  // Audio-Objekt vorab initialisieren und laden
  const achievementAudio = new Audio('achievement.mp3');
  achievementAudio.volume = 0.5;
  achievementAudio.preload = 'auto';

  // Prüft ob Textfelder ausgefüllt UND alle 4 Checkboxen aktiv sind
  function checkFormValidity() {
    const username = document.getElementById('username').value.trim();
    const begruendung = document.getElementById('begruendung').value.trim();
    const c1 = document.getElementById('checkRules').checked;
    const c2 = document.getElementById('checkPlayers').checked;
    const c3 = document.getElementById('checkStealing').checked;
    const c4 = document.getElementById('checkBetteln').checked;
    
    const btn = document.getElementById('submitBtn');

    if (username && begruendung && c1 && c2 && c3 && c4) {
      btn.disabled = false;
      btn.classList.add('enabled');
    } else {
      btn.disabled = true;
      btn.classList.remove('enabled');
    }
  }

  // Sendet die Daten ab
  async function submitApplication(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value.trim();
    const begruendung = document.getElementById('begruendung').value.trim();
    const statusMsg = document.getElementById('statusMessage');
    const btn = document.getElementById('submitBtn');

    btn.disabled = true;
    btn.textContent = "... ÜBERTRAGE DATEN";

    // 1. In Supabase eintragen
    const { error } = await supabaseClient
      .from('bewerbungen')
      .insert([{ username: username, begruendung: begruendung }]);

    if (error) {
      statusMsg.style.background = "rgba(255, 85, 85, 0.2)";
      statusMsg.style.color = "#ff5555";
      statusMsg.style.border = "1px solid #ff5555";
      statusMsg.textContent = "Fehler beim Absenden! Bitte versuche es noch einmal.";
      statusMsg.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Bewerbung absenden";
    } else {
      
      // 2. Schick designte Embed-Nachricht an Discord senden
      const discordPayload = {
        username: "QuapsAttack Bewerbungs-Bot",
        avatar_url: "https://quapsattack.airbusfan.de/unnamed.jpg", // Greift auf dein Logo zu
        content: "📥 **Eine neue Server-Bewerbung ist eingegangen!**",
        embeds: [{
          title: "📋 Neue Spieler-Bewerbung",
          color: 16755200, // Schönes Gold/Orange (Hex: #ffaa00)
          fields: [
            {
              name: "👤 Minecraft Username",
              value: `\`${username}\``,
              inline: false
            },
            {
              name: "💬 Begründung / Warum ich mitzocken will",
              value: `>>> ${begruendung}`,
              inline: false
            },
            {
              name: "✅ Akzeptierte Bedingungen",
              value: "✔️ Regelwerk gelesen & akzeptiert\n✔️ Teammates respektieren\n✔️ Kein Diebstahl / Griefing\n✔️ Kein Betteln nach Rechten/Items",
              inline: false
            }
          ],
          timestamp: new Date().toISOString(),
          footer: {
            text: "QuapsHub Web-System",
            icon_url: "https://quapsattack.airbusfan.de/unnamed.jpg"
          }
        }]
      };

      try {
        await fetch(DISCORD_APPLY_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(discordPayload)
        });
      } catch (discordErr) {
        console.error("Discord Webhook Fehler:", discordErr);
      }

      // 3. Erfolgsmeldung anzeigen und Sound / Weiterleitung triggern
      statusMsg.style.background = "rgba(85, 255, 85, 0.2)";
      statusMsg.style.color = "#55ff55";
      statusMsg.style.border = "1px solid #55ff55";
      statusMsg.textContent = "✔ Bewerbung erfolgreich gesendet! Sound wird abgespielt...";
      statusMsg.style.display = "block";
      
      let redirected = false;
      
      // Event-Listener: Sobald der Sound fertig ist -> Weiterleitung!
      achievementAudio.onended = function() {
        if (!redirected) {
          redirected = true;
          window.location.href = 'index.html';
        }
      };

      try {
        achievementAudio.currentTime = 0;
        await achievementAudio.play();
      } catch (audioErr) {
        console.log("Audio konnte nicht automatisch abgespielt werden:", audioErr);
        // Fallback: Wenn der Browser blockiert, leiten wir nach 2.5 Sekunden normal weiter
        setTimeout(() => {
          if (!redirected) {
            redirected = true;
            window.location.href = 'index.html';
          }
        }, 2500);
      }
    }
  }
</script>
</body>
</html>
