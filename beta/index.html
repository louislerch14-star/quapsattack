<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuapsHub</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0a0a0a;
      --sidebar-bg: #0f0f0f;
      --text-main: #e0e0e0;
      --text-dim: #999999;
      --accent: #4a5568; /* Ein dezentes Grau-Blau */
      --active-bg: #1a1a1a;
      --border: #222222;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #121212 0%, #050505 100%);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar - Clean & Modern */
    .sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 30px 20px;
    }

    .sidebar-logo { margin-bottom: 40px; }
    .logo-text { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .logo-sub { font-size: 0.75rem; color: var(--text-dim); margin-top: 5px; }

    .mc-btn {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      text-align: left;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .mc-btn:hover { background: #161616; color: #fff; }
    .mc-btn.active { background: #1a1a1a; color: #fff; border: 1px solid var(--border); }

    /* Main Content */
    main { flex: 1; padding: 50px; overflow-y: auto; }
    .page { display: none; }
    .page.active { display: block; }
    
    .content-card {
      background: #0f0f0f;
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    h1 { font-size: 2rem; margin-bottom: 20px; }
    
    /* Buttons */
    .mc-action {
      background: #fff;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 15px;
    }
    .mc-action:hover { background: #e0e0e0; }

    /* Status Bar in der Sidebar */
    .sidebar-profile { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-text">QuapsHub</div>
      <div class="logo-sub">ATTACK EDITION // v2.6</div>
    </div>

    <button class="mc-btn active" onclick="showPage('home')" id="btn-home">Home</button>
    <button class="mc-btn" onclick="window.location.href='langeweile.html'" id="btn-langeweile">🕹 Langeweile?</button>
    <button class="mc-btn" onclick="window.location.href='chillcraft-index.html'" id="btn-chillcraft">Chillcraft</button>
    <button class="mc-btn" onclick="showPage('clips')" id="btn-clips">Clip-Archiv</button>
    <button class="mc-btn" onclick="showPage('upload')" id="btn-upload">Clip Upload</button>
    <button class="mc-btn" onclick="showPage('image-upload')" id="btn-image-upload">Bild Upload</button>
    <button class="mc-btn" onclick="showPage('downloads')" id="btn-downloads">Downloads</button>
    <button class="mc-btn" onclick="showPage('admin-apply')" id="btn-admin-apply">Bewerbungen</button>
    <button class="mc-btn" onclick="logout()" id="btn-logout" style="color: #ff6b6b;">Logout</button>

    <div class="sidebar-profile">
      <span id="sidebar-user-name" style="font-size: 0.8rem; color: var(--text-dim);">SPIELER</span>
    </div>
  </div>

  <main>
    <div id="home" class="page active">
      <h1>Willkommen, <span id="user-name-display">Spieler</span>.</h1>
      <div class="content-card">Dashboard ist bereit.</div>
    </div>

    <div id="clips" class="page"><h1>Clip Archiv</h1></div>
    <div id="upload" class="page"><h1>Clip Upload</h1></div>
    <div id="image-upload" class="page"><h1>Bild Upload</h1></div>
    <div id="downloads" class="page"><h1>Downloads</h1></div>
    <div id="admin-apply" class="page"><h1>Bewerbungen</h1></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</body>
</html>
