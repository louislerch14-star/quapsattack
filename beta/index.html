<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuapsHub</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
      --sidebar-bg: #121212;
      --text-main: #e0e0e0;
      --text-dim: #a0a0a0;
      --accent: #5c6bc0;
      --border: #2a2a2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Video Background (gedimmt) */
    .video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.05; pointer-events: none; }
    .video-bg iframe { width: 100%; height: 100%; object-fit: cover; }

    /* Saubere Sidebar */
    .sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .sidebar-logo { padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .logo-text { font-size: 1.2rem; font-weight: 600; color: #fff; }
    .logo-sub { font-size: 0.75rem; color: var(--text-dim); display: block; margin-top: 5px; }

    .mc-btn {
      width: 100%;
      padding: 12px 15px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      text-align: left;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .mc-btn:hover { background: #1a1a1a; color: #fff; }
    .mc-btn.active { background: var(--accent); color: #fff; }

    /* Main Content */
    main { flex: 1; padding: 40px; overflow-y: auto; }
    
    /* Karten-Style */
    .glass-card {
      background: #161616;
      border: 1px solid var(--border);
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
    }
    .mc-panel-title { font-size: 0.8rem; font-weight: 600; color: var(--text-dim); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* Input & Button */
    .mc-input { background: #0a0a0a; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; width: 100%; margin-bottom: 10px; }
    .mc-action { background: var(--accent); color: #fff; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .mc-action:hover { opacity: 0.9; }

  </style>
</head>
<body>

  </body>
</html>
