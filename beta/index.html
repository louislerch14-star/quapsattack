<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuapsHub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #a8ff78;
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --text: #ffffff;
      --muted: #888888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

    /* Layout */
    .sidebar { width: 250px; background: #111; border-right: 1px solid #333; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .content { flex: 1; padding: 40px; overflow-y: auto; }

    /* Sidebar Elemente */
    .logo { font-family: 'Press Start 2P', cursive; font-size: 1.2rem; margin-bottom: 20px; color: var(--primary); }
    .nav-btn { background: none; border: none; color: var(--text); padding: 10px; cursor: pointer; text-align: left; font-size: 1rem; width: 100%; transition: 0.3s; }
    .nav-btn:hover { color: var(--primary); }

    /* Farbwähler */
    .color-swapper { display: flex; gap: 10px; margin-top: auto; }
    .swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid #333; }

    /* Content Styling */
    h1 { font-family: 'Press Start 2P', cursive; font-size: 1.5rem; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .card { background: var(--panel); padding: 20px; border-radius: 10px; border: 1px solid #333; }

    .page { display: none; }
    .active { display: block; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">QUAPS HUB</div>
  <button class="nav-btn" onclick="showPage('home')">🏠 HOME</button>
  <button class="nav-btn" onclick="showPage('clips')">🎬 CLIPS</button>
  <button class="nav-btn" onclick="showPage('downloads')">💾 DOWNLOADS</button>
  <button class="nav-btn" onclick="showPage('apply')">📝 BEWERBUNGEN</button>
  
  <div class="color-swapper">
    <div class="swatch" style="background: #a8ff78;" onclick="setCol('#a8ff78')"></div>
    <div class="swatch" style="background: #44d4d4;" onclick="setCol('#44d4d4')"></div>
    <div class="swatch" style="background: #ff5555;" onclick="setCol('#ff5555')"></div>
  </div>
</aside>

<main class="content">
  <!-- Home Page -->
  <div id="home" class="page active">
    <h1>DASHBOARD</h1>
    <div class="card">
      <p>Willkommen zurück! Check die neuesten Clips im Archiv.</p>
    </div>
  </div>

  <!-- Clips Page -->
  <div id="clips" class="page">
    <h1>CLIP ARCHIV</h1>
    <div class="grid">
      <div class="card"><h3>Clip 01</h3><p>Mega Rasiert im Game</p></div>
      <div class="card"><h3>Clip 02</h3><p>Der Fail des Jahres</p></div>
      <div class="card"><h3>Clip 03</h3><p>Epic Win Moment</p></div>
    </div>
  </div>

  <!-- Downloads Page -->
  <div id="downloads" class="page">
    <h1>DOWNLOADS</h1>
    <div class="card">
      <p>Hier gibt es keine Downloads aktuell.</p>
    </div>
  </div>

  <!-- Apply Page -->
  <div id="apply" class="page">
    <h1>BEWERBUNGEN</h1>
    <div class="card">
      <p>Status: Keine offenen Bewerbungen.</p>
    </div>
  </div>
</main>

<script>
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function setCol(c) {
    document.documentElement.style.setProperty('--primary', c);
  }
</script>

</body>
</html>
