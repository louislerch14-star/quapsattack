<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuapsHub</title>
  
  <link rel="icon" type="image/jpeg" href="unnamed.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
  :root {
    --primary: #a8ff78;
    --diamond: #44d4d4;
    --gold:    #f5c518;
    --bg:      #0a0a0a;
    --panel:   #1a1a1a;
    --panel2:  #222222;
    --border:  #333333;
    --text:    #f0f0f0;
    --muted:   #aaaaaa;
    --trust-green: #00b67a;
    --paypol-blue: #003087;
  }

  /* Design-Update: Clean Dark Mode */
  body { font-family: 'VT323', monospace; background: var(--bg); color: var(--text); min-height: 100vh; }
  h1, h2, .mc-btn, .mc-action { font-family: 'Press Start 2P', monospace; text-transform: uppercase; }
  
  /* Farbwechsler Sidebar */
  .color-swapper { padding: 20px; display: flex; gap: 10px; justify-content: center; border-bottom: 2px solid var(--border); }
  .swatch { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid var(--border); }

  .sidebar { position: fixed; top: 0; left: 0; width: 240px; height: 100vh; background: var(--panel2); border-right: 2px solid var(--border); z-index: 100; display: flex; flex-direction: column; }
  .mc-btn { display: block; width: 100%; background: transparent; color: var(--muted); padding: 16px 20px; border: none; cursor: pointer; text-align: left; font-size: 0.6rem; border-left: 3px solid transparent; }
  .mc-btn.active { background: rgba(255,255,255,0.05); color: #fff; border-left-color: var(--primary); }
  
  main { margin-left: 240px; padding: 40px; }
  .page { display: none; }
  .page.active { display: block; }
  
  .mc-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 25px; margin-bottom: 20px; }
  .mc-input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); color: #fff; margin-bottom: 10px; border-radius: 8px; }
  .mc-action { background: var(--primary); color: #000; padding: 10px 20px; border: none; cursor: pointer; font-size: 0.5rem; font-weight: bold; border-radius: 6px; }
  
  /* Rest deines ursprünglichen Designs beibehalten für die Funktion */
  .mc-cookie-banner { position: fixed; bottom: 20px; right: 20px; background: #212121; padding: 15px; border: 2px solid #000; z-index: 1000; }
  .paypol-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; }
  .paypol-modal-overlay.show { display: flex; }
  </style>
</head>
<body>

<div class="sidebar">
  <div style="padding: 20px; font-family:'Press Start 2P'; color: var(--primary);">QUAPS HUB</div>
  
  <div class="color-swapper">
    <div class="swatch" style="background: #a8ff78;" onclick="document.documentElement.style.setProperty('--primary', '#a8ff78')"></div>
    <div class="swatch" style="background: #44d4d4;" onclick="document.documentElement.style.setProperty('--primary', '#44d4d4')"></div>
    <div class="swatch" style="background: #f5c518;" onclick="document.documentElement.style.setProperty('--primary', '#f5c518')"></div>
    <div class="swatch" style="background: #ff5555;" onclick="document.documentElement.style.setProperty('--primary', '#ff5555')"></div>
  </div>

  <button class="mc-btn active" onclick="showPage('home')" id="btn-home">HOME</button>
  <button class="mc-btn" onclick="showPage('upload')" id="btn-upload">CLIP UPLOAD</button>
  <button class="mc-btn" onclick="showPage('image-upload')" id="btn-image-upload">BILDER UPLOAD</button>
  <button class="mc-btn" onclick="showPage('downloads')" id="btn-downloads">DOWNLOADS</button>
  <button class="mc-btn" onclick="logout()">LOGOUT</button>
</div>

<main>
  <div id="home" class="page active">
    <h1>Moin, Spieler.</h1>
    <div class="mc-panel">
      <div id="pinnwand-box">Lade Pinnwand...</div>
      <input type="text" id="pinnwand-input" class="mc-input">
      <button onclick="postToPinnwand()" class="mc-action">SENDEN</button>
    </div>
  </div>

  <div id="upload" class="page">
    <h1>Clip einsenden</h1>
    <div class="mc-panel">
      <input type="text" id="uploaderName" class="mc-input" readonly>
      <input type="text" id="clipTitle" class="mc-input" placeholder="Titel">
      <input type="text" id="clipLink" class="mc-input" placeholder="Link">
      <button onclick="sendToDiscord()" id="submitBtn" class="mc-action">SENDEN</button>
      <div id="statusMsg" style="display:none; color:var(--primary);">Erfolgreich!</div>
    </div>
  </div>

  <div id="image-upload" class="page">
    <h1>Bilder Upload</h1>
    <div class="mc-panel">
      <input type="text" id="imageUploaderName" class="mc-input" readonly>
      <input type="text" id="imageDescription" class="mc-input" placeholder="Beschreibung">
      <input type="file" id="baseImageFile" class="mc-input" accept="image/*">
      <button onclick="sendImageToDiscord()" id="imgSubmitBtn" class="mc-action">BILD SENDEN</button>
      <div id="imgStatusMsg" style="display:none; color:var(--primary);">Bild gesendet!</div>
    </div>
  </div>

  <div id="downloads" class="page">
    <h1>Downloads</h1>
    <div class="mc-panel" id="download-list-container"></div>
  </div>
</main>

// DEINE FUNKTIONEN BLEIBEN HIER 1:1
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function sendImageToDiscord() {
  const name = document.getElementById('imageUploaderName').value;
  const description = document.getElementById('imageDescription').value;
  const fileInput = document.getElementById('baseImageFile');
  const btn = document.getElementById('imgSubmitBtn');
  const msg = document.getElementById('imgStatusMsg');

  if (fileInput.files.length === 0) { alert('Bild wählen!'); return; }
  btn.disabled = true;

  const formData = new FormData();
  const file = fileInput.files[0];
  formData.append('files[0]', file, `base_upload.${file.name.split('.').pop()}`);

  const payload = {
    username: 'QuapsHub Base-Schutz',
    embeds: [{
      title: '🖼 Neues Base-Bild',
      fields: [{ name: 'Spieler', value: name }, { name: 'Info', value: description }]
    }]
  };
  formData.append('payload_json', JSON.stringify(payload));

  await fetch(NEW_DISCORD_WEBHOOK, { method: 'POST', body: formData });
  msg.style.display = 'block';
  btn.disabled = false;
}

</body>
</html>
