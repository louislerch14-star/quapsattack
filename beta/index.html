<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUAPS HUB // DASHBOARD</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --primary: #a8ff78;
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --border: #333333;
      --text: #f0f0f0;
    }

    body { font-family: 'VT323', monospace; background: var(--bg); color: var(--text); margin: 0; display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar { width: 240px; background: #151515; border-right: 2px solid var(--border); padding: 20px; }
    .nav-btn { display: block; width: 100%; background: none; border: none; color: #fff; padding: 15px; text-align: left; cursor: pointer; font-family: 'Press Start 2P', sans-serif; font-size: 0.6rem; border-left: 3px solid transparent; }
    .nav-btn:hover, .nav-btn.active { border-left-color: var(--primary); background: rgba(168, 255, 120, 0.1); }

    /* Main */
    main { padding: 40px; flex: 1; }
    .page { display: none; }
    .page.active { display: block; }
    
    .panel { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .input-box { width: 100%; padding: 10px; background: #000; border: 1px solid var(--border); color: #fff; margin-bottom: 10px; }
    .action-btn { background: var(--primary); color: #000; padding: 10px 20px; border: none; cursor: pointer; font-weight: bold; }
    
    /* Link Style */
    .dl-link { display: inline-block; background: var(--primary); color: #000; padding: 10px 20px; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="sidebar">
  <h2 style="font-family:'Press Start 2P'; font-size: 1rem; color: var(--primary); margin-bottom: 30px;">QUAPS HUB</h2>
  <button class="nav-btn active" onclick="showPage('home')">HOME</button>
  <button class="nav-btn" onclick="showPage('downloads')">DOWNLOADS</button>
</div>

<main>
  <div id="home" class="page active">
    <h1>PINNWAND</h1>
    <div class="panel">
      <div id="pinnwand-output" style="margin-bottom: 20px; min-height: 100px;">Lade Nachrichten...</div>
      <input type="text" id="name-input" class="input-box" placeholder="Dein Name">
      <input type="text" id="msg-input" class="input-box" placeholder="Deine Nachricht">
      <button class="action-btn" onclick="postMessage()">POSTEN</button>
    </div>
  </div>

  <div id="downloads" class="page">
    <h1>DOWNLOADS</h1>
    <div class="panel">
      <h3>Quaps Attack Season 10</h3>
      <p>Hier gehts zum Download:</p><br>
      <a href="https://drive.google.com/file/d/18DLzMxDv_NbOSHvoSwV66zVyC049QcFl/view?usp=drive_link" target="_blank" class="dl-link">DOWNLOAD QA10 WELT</a>
    </div>
  </div>
</main>

<script>
  // 1. HIER DEINE DATEN REIN!
  const SUPABASE_URL = "https://sdwelvinfbqxivvxnjkh.supabase.co";
  const SUPABASE_ANON_KEY = "DEIN_ECHTER_ANON_KEY_HIER_REIN"; // NICHT das JWT verwenden!

  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
  }

  async function loadMessages() {
    try {
      const { data, error } = await supabase.from('pinnwand').select('*').order('created_at', { ascending: false });
      if (error) throw error;
      const box = document.getElementById('pinnwand-output');
      box.innerHTML = data.map(m => `<div style="margin-bottom:10px;"><b>${m.name}</b>: ${m.nachricht}</div>`).join('');
    } catch (e) {
      document.getElementById('pinnwand-output').innerHTML = "Fehler: " + e.message;
      console.error(e);
    }
  }

  async function postMessage() {
    const name = document.getElementById('name-input').value;
    const msg = document.getElementById('msg-input').value;
    if(!name || !msg) return alert("Beides ausfüllen, bro!");
    
    const { error } = await supabase.from('pinnwand').insert([{ name: name, nachricht: msg }]);
    if (error) alert("Fehler beim Senden: " + error.message);
    else {
      document.getElementById('msg-input').value = '';
      loadMessages();
    }
  }

  window.onload = loadMessages;
</script>

</body>
</html>
