<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuapsHub // V3</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
  :root {
    --primary: #a8ff78; /* Standard: Green */
    --bg-grad: linear-gradient(135deg, #121212 0%, #1a1a1a 100%);
    --panel: #1e1e1e;
    --text: #ffffff;
    --muted: #888888;
    --border: #333333;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-grad);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    background: #0d0d0d;
    border-right: 1px solid var(--border);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .logo { font-weight: 800; font-size: 1.5rem; margin-bottom: 20px; color: var(--primary); }

  .nav-btn {
    display: block;
    padding: 12px;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    transition: 0.3s;
    font-weight: 500;
  }
  .nav-btn:hover { background: var(--panel); color: #fff; }
  .nav-btn.active { background: var(--panel); color: var(--primary); border-color: var(--primary); }

  /* Color Switcher */
  .theme-box { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border); }
  .theme-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
  .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .color-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
  .color-dot:hover { transform: scale(1.1); }

  /* Content */
  main { flex: 1; padding: 40px; }
  .card {
    background: var(--panel);
    padding: 30px;
    border-radius: 16px;
    border: 1px solid var(--border);
  }
  h1 { font-weight: 800; margin-bottom: 10px; }
  p { color: var(--muted); margin-bottom: 20px; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">QUAPS HUB</div>
  
  <button class="nav-btn active" onclick="showPage('home')">🏠 Startseite</button>
  <button class="nav-btn" onclick="showPage('clips')">🎬 Clips</button>
  <button class="nav-btn" onclick="showPage('upload')">📤 Upload</button>
  
  <div class="theme-box">
    <div class="theme-label">Design Farbe</div>
    <div class="color-grid">
      <div class="color-dot" style="background: #a8ff78;" onclick="changeTheme('#a8ff78')"></div>
      <div class="color-dot" style="background: #44d4d4;" onclick="changeTheme('#44d4d4')"></div>
      <div class="color-dot" style="background: #f5c518;" onclick="changeTheme('#f5c518')"></div>
      <div class="color-dot" style="background: #ff5555;" onclick="changeTheme('#ff5555')"></div>
    </div>
  </div>
</div>

<main>
  <div id="home" class="page">
    <div class="card">
      <h1>Willkommen im QuapsHub</h1>
      <p>Hier geht's rund, bro. Check das neue, saubere Design ab!</p>
    </div>
  </div>
  
  <div id="clips" class="page" style="display:none;">
    <div class="card">
      <h1>Clip Archiv</h1>
      <p>Kein Pixel, nur purer Content.</p>
    </div>
  </div>

  <div id="upload" class="page" style="display:none;">
    <div class="card">
      <h1>Upload</h1>
      <p>Lade deinen Shit hier hoch.</p>
    </div>
  </div>
</main>

<script>
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).style.display = 'block';
    event.currentTarget.classList.add('active');
  }

  function changeTheme(color) {
    document.documentElement.style.setProperty('--primary', color);
  }
</script>

</body>
</html>
