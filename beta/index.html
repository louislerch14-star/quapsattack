<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuapsHub // Attack</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Gradient Background */
      --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      --sidebar-rgba: rgba(15, 15, 30, 0.8);
      --accent-color: #7b2cbf; /* Ein sattes Lila/Violett */
      --text-white: #ffffff;
      --text-muted: #a0a0c0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-white);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar - Schlicht & Coloriert */
    .sidebar {
      width: 260px;
      background: var(--sidebar-rgba);
      backdrop-filter: blur(15px);
      border-right: 1px solid rgba(255,255,255,0.1);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
    }

    .logo { margin-bottom: 50px; }
    .logo h2 { font-size: 1.5rem; letter-spacing: 2px; color: var(--text-white); }
    .logo span { font-size: 0.7rem; color: var(--accent-color); font-weight: 700; }

    .nav-btn {
      width: 100%;
      padding: 15px;
      margin-bottom: 10px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      text-align: left;
      font-size: 0.9rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .nav-btn.active {
      background: var(--accent-color);
      color: white;
      box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4);
    }

    main { flex: 1; padding: 50px; }
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="logo">
      <h2>QUAPS</h2>
      <span>ATTACK EDITION</span>
    </div>

    <button class="nav-btn active" onclick="showPage('home')" id="btn-home">Home</button>
    <button class="nav-btn" onclick="showPage('clips')" id="btn-clips">Clips & Upload</button>
    <button class="nav-btn" onclick="showPage('downloads')" id="btn-downloads">Downloads</button>
    <button class="nav-btn" onclick="showPage('admin-apply')" id="btn-admin-apply">Bewerbung</button>
    <button class="nav-btn" onclick="logout()" style="margin-top: auto; border: 1px solid rgba(255,50,50,0.3); color: #ff6b6b;">Logout</button>
  </div>

  <main>
    <div id="home" class="page active">
      <div class="card">
        <h1>Willkommen zurück.</h1>
        <p>Das Dashboard ist bereit.</p>
      </div>
    </div>
    </main>

  <script>
    // FÜGE DEINEN SCRIPT-BLOCK HIER EIN!
  </script>
</body>
</html>
