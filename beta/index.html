<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuapsHub // Attack Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a8ff78; /* Neon Grün */
            --bg: #050505;
            --surface: #0c0c0c;
            --surface-light: #161616;
            --text: #e0e0e0;
            --text-muted: #888888;
            --diamond: #44d4d4;
            --gold: #f5c518;
            --border: rgba(255, 255, 255, 0.08);
            --glow: rgba(168, 255, 120, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* Video Background */
        .video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.15; pointer-events: none; }
        .video-bg iframe { width: 100%; height: 100%; object-fit: cover; }

        /* Sidebar Design */
        .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; z-index: 10; }
        .sidebar-logo { padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .logo-text { font-family: 'Press Start 2P', monospace; font-size: 1.1rem; color: var(--primary); display: block; line-height: 1.6; }
        .logo-sub { font-size: 0.7rem; color: var(--text-muted); }
        
        .mc-btn { width: 100%; padding: 15px; background: transparent; border: 1px solid transparent; color: var(--text-muted); text-align: left; font-family: 'Press Start 2P', sans-serif; font-size: 0.6rem; cursor: pointer; transition: all 0.2s; border-radius: 8px; margin-bottom: 5px; }
        .mc-btn:hover { background: var(--surface-light); color: #fff; border-color: var(--border); }
        .mc-btn.active { color: var(--primary); background: rgba(168, 255, 120, 0.05); border-left: 3px solid var(--primary); }

        .sidebar-profile { margin-top: auto; display: flex; align-items: center; gap: 12px; padding-top: 20px; border-top: 1px solid var(--border); }
        .profile-avatar { width: 45px; height: 45px; border-radius: 4px; border: 2px solid var(--border); }
        .profile-name { font-weight: 800; font-size: 0.9rem; }
        .status-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; display: inline-block; margin-right: 5px; }

        /* Main Content */
        main { flex: 1; padding: 40px; overflow-y: auto; }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

        /* Panel Design */
        .glass-card { background: var(--surface); border: 1px solid var(--border); padding: 30px; border-radius: 12px; margin-bottom: 25px; transition: 0.3s; }
        .glass-card:hover { border-color: var(--glow); box-shadow: 0 0 20px var(--glow); }
        .mc-panel-title { font-family: 'Press Start 2P', monospace; font-size: 0.7rem; color: var(--primary); margin-bottom: 20px; letter-spacing: 1px; }

        /* Buttons & Actions */
        .mc-action { background: var(--primary); color: #000; font-family: 'Press Start 2P', sans-serif; font-size: 0.6rem; padding: 15px 25px; border: none; border-radius: 4px; cursor: pointer; font-weight: 800; }
        .mc-action:hover { filter: brightness(1.2); }

        /* Modals & Misc */
        .paypol-box { background: #111; border: 1px solid var(--border); border-radius: 16px; padding: 40px; max-width: 500px; }
        /* Hier kannst du dein CSS für die PayPol-Modals noch weiter verfeinern */
    </style>
</head>
<body>

    <div class="video-bg">
        <iframe src="https://www.youtube.com/embed/44MX1avl9JI?autoplay=1&mute=1&loop=1&playlist=44MX1avl9JI&controls=0&showinfo=0&rel=0&modestbranding=1" frameborder="0" allow="autoplay"></iframe>
    </div>

    <div class="sidebar">
        <div class="sidebar-logo">
            <span class="logo-text">QUAPS<br>HUB</span>
            <span class="logo-sub">ATTACK EDITION // v2.6</span>
        </div>

        <div class="sidebar-section">
            <button class="mc-btn active" onclick="showPage('home')" id="btn-home">&nbsp; HOME</button>
            <button class="mc-btn" onclick="window.location.href='langeweile.html'" id="btn-langeweile">&nbsp; 🕹 LANGEWEILE?</button>
            <button class="mc-btn" onclick="window.location.href='chillcraft-index.html'" id="btn-chillcraft">&nbsp; Chillcraft</button>
            <button class="mc-btn" onclick="showPage('clips')" id="btn-clips">&nbsp; CLIP-ARCHIV</button>
            <button class="mc-btn" onclick="showPage('upload')" id="btn-upload">&nbsp; CLIP UPLOAD</button>
            <button class="mc-btn" onclick="showPage('image-upload')" id="btn-image-upload" style="color: var(--diamond);">&nbsp; 🖼 BILDER UP-LOAD</button>
            <button class="mc-btn" onclick="showPage('downloads')" id="btn-downloads">&nbsp; WELTEN-DOWNLOADS</button>
            <button class="mc-btn" onclick="showPage('admin-apply')" id="btn-admin-apply">&nbsp; 📋 BEWERBUNGEN</button>
            <button class="mc-btn logout-btn" onclick="logout()">&nbsp; EXIT / LOGOUT</button>
        </div>

        <div class="sidebar-profile">
            <img src="unnamed.jpg" id="user-avatar" class="profile-avatar" alt="M" onerror="this.src='https://minecraft.wiki/images/Steves_Head_JE2_BE2.png'">
            <div class="profile-info">
                <span class="profile-name" id="sidebar-user-name">SPIELER</span>
                <div class="profile-status-wrapper">
                    <span class="status-dot"></span>
                    <span class="status-text" style="font-size: 0.7rem;">ONLINE</span>
                </div>
            </div>
        </div>
    </div>

    <main>
        <div id="home" class="page active">
            <h1>Moin, <span id="user-name-display">Spieler</span>.</h1>
        </div>
        </main>

</body>
</html>
