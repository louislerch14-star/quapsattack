<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUAPS HUB // REBUILT</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --primary: #a8ff78;
      --bg: #0a0a0a;
      --panel: rgba(26, 26, 26, 0.8);
      --border: #333333;
      --text: #f0f0f0;
      --muted: #aaaaaa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'VT323', monospace; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

    /* Video Background */
    .video-bg { position: fixed; inset: 0; z-index: -1; background: #000; }
    .video-bg iframe { position: absolute; top: 50%; left: 50%; width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; transform: translate(-50%, -50%); pointer-events: none; filter: brightness(0.12) saturate(0.3); }
    .video-bg::after { content: ''; position: absolute; inset: 0; background: rgba(10,10,10,0.8); }

    /* Sidebar */
    .sidebar { width: 240px; background: rgba(15, 15, 15, 0.95); border-right: 2px solid var(--border); display: flex; flex-direction: column; z-index: 100; }
    .sidebar-logo { padding: 30px 20px; border-bottom: 2px solid var(--border); text-align: center; }
    .logo-text { font-family: 'Press Start 2P'; font-size: 0.9rem; color: var(--primary); }
    
    .sidebar-section { padding: 20px 0; flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .mc-btn { display: block; width: 100%; background: transparent; color: var(--muted); padding: 15px 20px; border: none; cursor: pointer; text-align: left; font-family: 'Press Start 2P'; font-size: 0.5rem; border-left: 3px solid transparent; }
    .mc-btn:hover, .mc-btn.active { background: rgba(255,255,255,0.05); color: #fff; border-left-color: var(--primary); }

    /* Farbwechsler */
    .color-swapper { padding: 20px; border-top: 2px solid var(--border); display: flex; gap: 10px; justify-content: center; }
    .swatch { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid var(--border); }

    /* Main */
    main { margin-left: 240px; padding: 40px; flex: 1; }
    .page { display: none; }
    .page.active { display: block; }
    .mc-panel { background: var(--panel); border: 1px solid var(--border); padding: 25px; border-radius: 12px; margin-bottom: 20px; }
    .mc-action { background: var(--primary); color: #000; padding: 10px 20px; border: none; cursor: pointer; font-family: 'Press Start 2P'; font-size: 0.5rem; }
    .mc-input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); color: #fff; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="video-bg">
  <iframe src="https://www.youtube.com/embed/44MX1avl9JI?autoplay=1&mute=1&loop=1&playlist=44MX1avl9JI&controls=0" frameborder="0" allow="autoplay"></iframe>
</div>

<div class="sidebar">
  <div class="sidebar-logo"><span class="logo-text">QUAPS HUB</span></div>
  <div class="sidebar-section">
    <button class="mc-btn active" onclick="showPage('home')">HOME</button>
    <button class="mc-btn" onclick="showPage('downloads')">DOWNLOADS</button>
  </div>
  <div class="color-swapper">
    <div class="swatch" style="background: #a8ff78;" onclick="setCol('#a8ff78')"></div>
    <div class="swatch" style="background: #44d4d4;" onclick="setCol('#44d4d4')"></div>
    <div class="swatch" style="background: #f5c518;" onclick="setCol('#f5c518')"></div>
    <div class="swatch" style="background: #ff5555;" onclick="setCol('#ff5555')"></div>
  </div>
</div>

<main>
  <div id="home" class="page active">
    <h1>QUAPS PINNWAND</h1>
    <div class="mc-panel">
      <div id="pinnwand-box" style="margin-bottom: 15px; max-height: 200px; overflow-y: auto;">Lädt...</div>
      <input type="text" id="p-input" class="mc-input" placeholder="Nachricht schreiben...">
      <button onclick="postPinnwand()" class="mc-action">SENDEN</button>
    </div>
  </div>

  <div id="downloads" class="page">
    <h1>DOWNLOADS</h1>
    <div class="mc-panel">
      <h3>Season 10 Welt</h3>
      <button class="mc-action" onclick="alert('Download-Logik aktiv!')">DOWNLOAD STARTEN</button>
    </div>
  </div>
</main>

<script>
  // 1. SETUP
  const SUPABASE_URL = "DEINE_URL";
  const SUPABASE_ANON_KEY = "DEIN_KEY";
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 2. FUNKTIONEN
  function setCol(c) {
    document.documentElement.style.setProperty('--primary', c);
  }

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.mc-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');
  }

  async function loadPinnwand() {
    const { data } = await supabase.from('pinnwand').select('*').order('created_at', { ascending: false });
    const box = document.getElementById('pinnwand-box');
    box.innerHTML = data ? data.map(m => `<div><b>${m.name}</b>: ${m.nachricht}</div>`).join('') : "Leer.";
  }

  async function postPinnwand() {
    const text = document.getElementById('p-input').value;
    if(!text) return;
    await supabase.from('pinnwand').insert([{ name: 'Spieler', nachricht: text }]);
    document.getElementById('p-input').value = '';
    loadPinnwand();
  }

  window.onload = loadPinnwand;
</script>

</body>
</html>
