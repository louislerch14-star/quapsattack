async function loadPinnwand() {
  const { data, error } = await supabaseClient
    .from('pinnwand')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(30);

  if (error) {
    document.getElementById('pinnwand-box').innerHTML = `<div style="color: #ff5555;">Fehler beim Laden!</div>`;
    return;
  }

  const box = document.getElementById('pinnwand-box');
  if (data.length === 0) {
    box.innerHTML = `<div style="color: var(--muted); font-size: 1rem;">Noch keine Einträge.</div>`;
    return;
  }

  box.innerHTML = data.reverse().map(msg => `
    <div class="shoutbox-msg">
      <span class="msg-user">${escapeHtml(msg.name)}:</span>
      <span>${escapeHtml(msg.nachricht)}</span>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

async function loadBewerbungen() {
  const { data, error } = await supabaseClient
    .from('bewerbungen')
    .select('*')
    .order('created_at', { ascending: false });

  const box = document.getElementById('bewerbungen-liste-box');

  if (error) {
    box.innerHTML = `<div style="color: #ff5555;">Fehler beim Laden der Bewerbungen!</div>`;
    return;
  }

  if (!data || data.length === 0) {
    box.innerHTML = `<div style="color: var(--muted); font-size: 1rem;">Aktuell keine Bewerbungen vorhanden.</div>`;
    return;
  }

  box.innerHTML = data.map(apply => `
    <div style="padding: 15px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 8px;">
      <div style="font-family: 'Press Start 2P', monospace; font-size: 0.6rem; color: var(--gold); margin-bottom: 8px;">
        Spieler: ${escapeHtml(apply.username || 'Unbekannt')}
      </div>
      <div style="font-size: 1.1rem; color: #fff; white-space: pre-wrap;">
        ${escapeHtml(apply.begruendung || 'Keine Begründung angegeben.')}
      </div>
    </div>
  `).join('');
}

function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }

async function logout() { await supabaseClient.auth.signOut(); window.location.href = 'login.html'; }

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.mc-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('btn-' + id).classList.add('active');
  window.scrollTo(0, 0);
  setTimeout(initReveal, 50);

  /* ⌨ DYNAMISCHE DISCORD RICH PRESENCE ERWEITERUNG */
  if (window.electronAPI) {
    let rpcText = "Im Hauptmenü 📋"; // Standard-Text

    if (id === 'home') {
      rpcText = "Chillt in der Base 🏡";
    } else if (id === 'pinnwand') {
      rpcText = "Liest die Pinnwand 💬";
    } else if (id === 'bewerbungen' || id === 'bewerbung') {
      rpcText = "Schaut sich Bewerbungen an 📝";
    } else if (id === 'downloads') {
      rpcText = "Schaut sich Downloads an 📂";
    } else if (id === 'clips' || id === 'clip') {
      rpcText = "Reicht Videos ein 📹";
    } else if (id === 'bilder' || id === 'bild') {
      rpcText = "Beantragt Grieferschutz 🖼";
    } else if (id === 'projekte') {
      rpcText = "Plant Riesen-Projekte 🏗";
    } else {
      rpcText = "Erkundet Bereich: " + id.toUpperCase();
    }

    window.electronAPI.updateStatus(rpcText);
  }
}

function initReveal() {
  const els = document.querySelectorAll('.page.active [data-reveal]');
  const obs = new IntersectionObserver(entries => { entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('revealed'); }); }, { threshold: 0.1 });
  els.forEach(el => { el.classList.remove('revealed'); obs.observe(el); });
}

function togglePlay() {
  const audio = document.getElementById('communitySong');
  const btn   = document.getElementById('playBtn');
  const vis   = document.getElementById('visualizer');
  if (audio.paused) { audio.play(); btn.textContent = '⏸ SONG PAUSIEREN'; vis.classList.add('playing'); }
  else { audio.pause(); btn.textContent = '▶ SONG ABSPIELEN'; vis.classList.remove('playing'); }
}

    embeds: [{

      fields: [
        { name: 'Spieler', value: name, inline: true },

    btn.disabled = false;

    title: '🖼 Neues Base-Bild (Grieferschutz-Antrag)',
    color: 0x44d4d4,
    fields: [
      { name: 'Spieler', value: name, inline: true },
      { name: 'Info / Koordinaten', value: description || 'Keine Beschreibung angegeben.', inline: true }
    ],
    image: { 
      url: `attachment://${safeFileName}` 
    }
  };

  const payload = {
    username: 'QuapsHub Base-Schutz',
    embeds: [embed]
  };

  formData.append('payload_json', JSON.stringify(payload));

  try {
    await fetch(NEW_DISCORD_WEBHOOK, {
      method: 'POST',
      body: formData
    });
    
    msg.style.display = 'block';
    setTimeout(() => {
      msg.style.display = 'none'; 
      btn.textContent = '▶ BILD AN DISCORD SENDEN'; 
      btn.disabled = false;
      document.getElementById('imageDescription').value = ''; 
      document.getElementById('baseImageFile').value = '';
      document.getElementById('imgFileNameDisplay').style.display = 'none';
      document.getElementById('imgUploadLabel').textContent = '📁 Bild auswählen oder hierher ziehen';
      document.getElementById('imgUploadLabel').style.borderColor = 'var(--border)';
      showPage('home');
    }, 3000);
  } catch { 
    alert('Bilder-Übertragung fehlgeschlagen.'); 
    btn.textContent = '▶ BILD AN DISCORD SENDEN'; 
    btn.disabled = false; 
  }
