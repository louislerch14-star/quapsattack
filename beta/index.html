<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuapsHub // Attack Edition</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
  :root {
    --primary: #a8ff78;
    --primary-glow: rgba(168, 255, 120, 0.2);
    --diamond: #44d4d4;
    --gold: #f5c518;
    --bg: #050505;
    --panel-bg: rgba(20, 20, 20, 0.6);
    --panel-border: rgba(255, 255, 255, 0.1);
    --text: #e0e0e0;
    --text-muted: #888888;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top right, #1a2a1a, #050505);
    color: var(--text);
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ── SIDEBAR GLAS ── */
  .sidebar {
    position: fixed; top: 0; left: 0; width: 260px; height: 100vh;
    background: rgba(10, 10, 10, 0.8);
    backdrop-filter: blur(20px);
    border-right: 1px solid var(--panel-border);
    z-index: 100;
    display: flex; flex-direction: column;
  }

  .sidebar-logo {
    padding: 40px 20px;
    border-bottom: 1px solid var(--panel-border);
    text-align: center;
  }
  .logo-text { font-family: 'Press Start 2P', monospace; font-size: 0.9rem; color: var(--primary); display: block; }
  .logo-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; display: block; }

  .mc-btn {
    display: block; width: 100%; padding: 20px 25px;
    background: transparent; border: none; color: var(--text-muted);
    font-family: 'Press Start 2P', monospace; font-size: 0.5rem;
    text-align: left; cursor: pointer; transition: all 0.3s ease;
    border-left: 4px solid transparent;
  }
  .mc-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .mc-btn.active { color: var(--primary); background: rgba(168, 255, 120, 0.05); border-left-color: var(--primary); }

  /* ── MAIN CONTENT ── */
  main { margin-left: 260px; padding: 60px; }

  .mc-panel {
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 30px;
    transition: transform 0.3s ease;
  }
  .mc-panel:hover { border-color: rgba(255,255,255,0.2); }

  .mc-panel-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.6rem; color: var(--gold); margin-bottom: 20px;
    letter-spacing: 1px;
  }

  /* ── BUTTONS & ACTIONS ── */
  .mc-action {
    background: linear-gradient(135deg, var(--primary), #74cf48);
    color: #000;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.5rem; padding: 15px 30px;
    border-radius: 8px; cursor: pointer; border: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .mc-action:hover { transform: translateY(-2px); box-shadow: 0 5px 15px var(--primary-glow); }

  /* ── MOBILE ── */
  @media (max-width: 800px) {
    .sidebar { width: 100%; height: auto; position: relative; }
    main { margin-left: 0; padding: 20px; }
  }
  </style>
</head>
<body>

<!-- Hier kommt dein restlicher Body/Content hin (ich hab das CSS oben für dich optimiert, die IDs bleiben identisch!) -->

</body>
</html>
