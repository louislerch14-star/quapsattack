<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuapsHub // Attack Edition</title>
  
  <link rel="icon" type="image/jpeg" href="unnamed.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #a8ff78;
      --bg-start: #050505;
      --panel: rgba(255, 255, 255, 0.05);
      --text: #e0e0e0;
      --border: rgba(255, 255, 255, 0.1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Inter', sans-serif; 
      background: linear-gradient(135deg, #050505 0%, #a8ff7833 100%);
      background-attachment: fixed;
      color: var(--text); 
      overflow-x: hidden; 
      min-height: 100vh;
      transition: background 0.5s ease;
    }

    /* Sidebar */
    .sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100vh; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; z-index: 100; }
    .sidebar-logo { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); text-align: center; }
    .logo-text { font-weight: 800; font-size: 1.2rem; color: var(--primary); letter-spacing: 2px; }
    .logo-sub { font-size: 0.7rem; color: #666; margin-top: 5px; }
    
    .sidebar-section { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .mc-btn { background: transparent; color: #ccc; border: none; padding: 12px; text-align: left; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem; transition: 0.2s; border-radius: 8px; }
    .mc-btn:hover, .mc-btn.active { color: #fff; background: var(--primary); }
    
    /* Theme Picker */
    .theme-picker { padding: 15px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: center; }
    .color-dot { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
    .color-dot:hover { transform: scale(1.2); }

    /* Main Content */
    main { margin-left: 260px; padding: 40px; }
    .page { display: none; }
    .page.active { display: block; }

    /* UI Elements */
    .mc-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 15px; padding: 30px; margin-bottom: 20px; backdrop-filter: blur(10px); }
    .mc-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 15px; color: #fff; margin-bottom: 10px; border-radius: 8px; font-family: 'Inter', sans-serif; }
    .mc-action { background: var(--primary); color: #000; padding: 15px 30px; border: none; font-weight: 800; cursor: pointer; border-radius: 8px; font-size: 0.9rem; }
    
    h1 { margin-bottom: 20px; font-weight: 800; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-text">QUAPS HUB</div>
    <div class="logo-sub">ATTACK EDITION</div>
  </div>
  <div class="sidebar-section">
    <button class="mc-btn active" onclick="showPage('home')" id="btn-home">HOME</button>
    <button class="mc-btn" onclick="showPage('clips')" id="btn-clips">CLIP-ARCHIV</button>
    <button class="mc-btn" onclick="showPage('upload')" id="btn-upload">CLIP UPLOAD</button>
    <button class="mc-btn" onclick="showPage('image-upload')" id="btn-image-upload">BILDER UP-LOAD</button>
    <button class="mc-btn" onclick="logout()">EXIT</button>
  </div>
  
  <div class="theme-picker">
    <div class="color-dot" style="background: #a8ff78" onclick="setTheme('#a8ff78')"></div>
    <div class="color-dot" style="background: #ff7878" onclick="setTheme('#ff7878')"></div>
    <div class="color-dot" style="background: #78a8ff" onclick="setTheme('#78a8ff')"></div>
    <div class="color-dot" style="background: #f8e71c" onclick="setTheme('#f8e71c')"></div>
  </div>
</div>

<main>
  <div class="page active" id="home">
    <div class="mc-panel">
      <h1>Willkommen, <span id="user-name-display">SPIELER</span></h1>
      <div id="pinnwand-box" style="margin-top:20px;"></div>
      <input type="text" id="pinnwand-input" class="mc-input" placeholder="Schreib was an die Wand...">
      <button class="mc-action" onclick="postToPinnwand()">SENDEN</button>
    </div>
  </div>
  <!-- Weitere Pages hier einfügen... -->
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Theme Logik
  function setTheme(color) {
    document.documentElement.style.setProperty('--primary', color);
    // Gradient setzen (Farbe + 33 ist der Hex-Alpha-Wert)
    document.body.style.background = `linear-gradient(135deg, #050505 0%, ${color}33 100%)`;
    document.body.style.backgroundAttachment = "fixed";
    localStorage.setItem('userTheme', color);
  }

  function loadTheme() {
    const savedTheme = localStorage.getItem('userTheme');
    if (savedTheme) {
      setTheme(savedTheme);
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    loadTheme();
  });

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function logout() { window.location.href = 'login.html'; }
</script>
</body>
</html>
