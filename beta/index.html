<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuapsHub // Attack Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      --sidebar-rgba: rgba(0, 0, 0, 0.4);
      --accent-purple: #7b2cbf;
      --text-white: #ffffff;
      --paypal-blue: #003087;
      --paypal-action: #0070ba;
      --trust-green: #00b67a;
    }

    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-gradient); color: var(--text-white); margin: 0; display: flex; min-height: 100vh; overflow-x: hidden; }

    /* SIDEBAR */
    .sidebar { width: 280px; background: var(--sidebar-rgba); backdrop-filter: blur(15px); border-right: 1px solid rgba(255,255,255,0.1); padding: 30px; display: flex; flex-direction: column; }
    .sidebar-logo { margin-bottom: 40px; }
    .logo-text { font-size: 1.5rem; font-weight: 800; line-height: 1.2; }
    .logo-sub { color: var(--accent-purple); font-size: 0.7rem; font-weight: 700; }
    .mc-btn { width: 100%; padding: 14px; background: transparent; border: 1px solid transparent; color: #ccc; text-align: left; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-bottom: 5px; font-weight: 500; }
    .mc-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .mc-btn.active { background: var(--accent-purple); color: #fff; box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4); }

    /* MAIN */
    main { flex: 1; padding: 40px; overflow-y: auto; }
    .page { display: none; }
    .page.active { display: block; }
    .glass-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; backdrop-filter: blur(5px); margin-bottom: 20px; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-text">QUAPS<br>HUB</span>
      <span class="logo-sub">ATTACK EDITION // v2.6</span>
    </div>
    <button class="mc-btn active" onclick="showPage('home')" id="btn-home">HOME</button>
    <button class="mc-btn" onclick="showPage('clips')" id="btn-clips">CLIP-ARCHIV</button>
    <button class="mc-btn" onclick="logout()" style="color: #ff6b6b; margin-top: auto;">LOGOUT</button>
  </div>

  <main>
    <div id="home" class="page active">
        <h1>Dashboard</h1>
        <div class="glass-card">Willkommen zurück, Digger! Alles läuft.</div>
    </div>
    <div id="clips" class="page"><h1>Clips</h1></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://sdwelvinfbqxivvxnjkh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkd2VsdmluZmJxeGl2dnhuamtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDAxNjMsImV4cCI6MjA5NTQ3NjE2M30.aRc-rwNoZwx2vHS3tvvDkQr7t6el6ankRsgkldgHCBE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.mc-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.getElementById('btn-' + id).classList.add('active');
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
