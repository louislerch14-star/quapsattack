<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuapsHub // Attack Edition</title>
  
  <link rel="icon" type="image/jpeg" href="unnamed.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #a8ff78; --bg: #050505; --panel: #0f0f0f;
      --glass: rgba(255, 255, 255, 0.03); --text: #e0e0e0; --gold: #f5c518;
      --pp-blue: #003087; --pp-cyan: #009cde; --tp-green: #00b67a; --tp-text: #050f19;
      --border: #333333; --diamond: #44d4d4;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; }

    /* Video Background */
    .video-bg { position: fixed; inset: 0; z-index: -1; background: #000; }
    .video-bg iframe { position: absolute; top: 50%; left: 50%; width: 100vw; height: 100vh; transform: translate(-50%, -50%); filter: brightness(0.2); }
    
    /* Sidebar */
    .sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100vh; background: #000; border-right: 1px solid #222; padding: 20px; display: flex; flex-direction: column; z-index: 100; }
    .sidebar-logo { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #222; text-align: center; }
    .logo-text { font-family: 'Press Start 2P', sans-serif; font-size: 1rem; color: var(--primary); }
    .logo-sub { font-size: 0.6rem; color: #666; }
    .sidebar-section { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .mc-btn { background: transparent; color: #aaa; border: none; padding: 15px; text-align: left; cursor: pointer; font-family: 'Press Start 2P', sans-serif; font-size: 0.6rem; transition: 0.2s; }
    .mc-btn:hover, .mc-btn.active { color: var(--primary); background: rgba(168, 255, 120, 0.05); }
    
    /* Main Content */
    main { margin-left: 260px; padding: 40px; }
    .page { display: none; }
    .page.active { display: block; }

    /* UI Elements */
    .mc-panel { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 30px; margin-bottom: 20px; backdrop-filter: blur(10px); }
    .mc-input { width: 100%; background: #000; border: 1px solid var(--border); padding: 15px; color: #fff; margin-bottom: 10px; border-radius: 8px; }
    .mc-action { background: var(--primary); color: #000; padding: 15px 30px; border: none; font-family: 'Press Start 2P', sans-serif; cursor: pointer; border-radius: 8px; font-size: 0.7rem; }
    
    /* Modal */
    .paypol-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .paypol-modal-overlay.show { display: flex; }
    .paypol-box { background: #fff; color: #000; width: 440px; padding: 30px; border-radius: 12px; }
    .paypol-btn { width: 100%; background: var(--pp-blue); color: #fff; padding: 14px; border: none; border-radius: 25px; cursor: pointer; }
    
    /* Cookie Banner */
    .mc-cookie-banner { position: fixed; bottom: 20px; right: -400px; width: 350px; background: #1a1a1a; padding: 20px; border: 2px solid #333; transition: 0.6s; z-index: 1000; }
    .mc-cookie-banner.show { right: 20px; }
  </style>
</head>
<body>

<div class="video-bg">
  <iframe src="https://www.youtube.com/embed/44MX1avl9JI?autoplay=1&mute=1&loop=1&playlist=44MX1avl9JI&controls=0" frameborder="0" allow="autoplay"></iframe>
</div>

<div class="sidebar">
  <div class="sidebar-logo">
    <span class="logo-text">QUAPS<br>HUB</span>
    <span class="logo-sub">ATTACK EDITION // v2.6</span>
  </div>
  <div class="sidebar-section">
    <button class="mc-btn active" onclick="showPage('home')" id="btn-home">HOME</button>
    <button class="mc-btn" onclick="window.location.href='langeweile.html'" id="btn-langeweile">🕹 LANGEWEILE?</button>
    <button class="mc-btn" onclick="window.location.href='chillcraft-index.html'" id="btn-chillcraft">Chillcraft</button>
    <button class="mc-btn" onclick="showPage('clips')" id="btn-clips">CLIP-ARCHIV</button>
    <button class="mc-btn" onclick="showPage('upload')" id="btn-upload">CLIP UPLOAD</button>
    <button class="mc-btn" onclick="showPage('image-upload')" id="btn-image-upload">🖼 BILDER UP-LOAD</button>
    <button class="mc-btn" onclick="showPage('downloads')" id="btn-downloads">WELTEN-DOWNLOADS</button>
    <button class="mc-btn" onclick="showPage('admin-apply')" id="btn-admin-apply">📋 BEWERBUNGEN</button>
    <button class="mc-btn logout-btn" onclick="logout()">EXIT / LOGOUT</button>
  </div>
  <div class="sidebar-profile">
    <div class="profile-info">
      <span id="sidebar-user-name">SPIELER</span>
    </div>
  </div>
</div>

<main>
  <div class="page active" id="home">
    <div class="mc-panel">
      <h1>Willkommen <span id="user-name-display"></span></h1>
      <div id="pinnwand-box" style="margin-top:20px;"></div>
      <input type="text" id="pinnwand-input" class="mc-input" placeholder="Schreib was an die Wand...">
      <button class="mc-action" id="pinnwand-btn" onclick="postToPinnwand()">SENDEN</button>
    </div>
  </div>

  <div class="page" id="upload">
    <div class="mc-panel">
      <h1>Clip Upload</h1>
      <input type="hidden" id="uploaderName">
      <input type="text" id="clipTitle" class="mc-input" placeholder="Titel des Clips">
      <input type="text" id="clipLink" class="mc-input" placeholder="Link (YouTube/Twitch)">
      <button class="mc-action" id="submitBtn" onclick="sendToDiscord()">▶ AN DISCORD SENDEN</button>
      <div id="statusMsg" style="display:none; color:var(--primary); margin-top:10px;">Gesendet!</div>
    </div>
  </div>

  <div class="page" id="image-upload">
    <div class="mc-panel">
      <h1>Bilder Up-Load</h1>
      <input type="hidden" id="imageUploaderName">
      <input type="file" id="baseImageFile" onchange="previewImageFileName()" style="display:none;">
      <label for="baseImageFile" id="imgUploadLabel" class="mc-action" style="display:block; margin-bottom:20px;">📁 Bild auswählen</label>
      <div id="imgFileNameDisplay" style="margin-bottom:10px;"></div>
      <input type="text" id="imageDescription" class="mc-input" placeholder="Beschreibung / Koordinaten">
      <button class="mc-action" id="imgSubmitBtn" onclick="sendImageToDiscord()">▶ BILD SENDEN</button>
      <div id="imgStatusMsg" style="display:none; color:var(--primary); margin-top:10px;">Bild gesendet!</div>
    </div>
  </div>

  <div class="page" id="downloads">
    <h1>Welten-Downloads</h1>
    <div id="download-list-container"></div>
  </div>
</main>

<div class="mc-cookie-banner" id="cookie-banner">
  <p>Cookies? Ja, die fressen Creeper.</p>
  <button class="mc-action" onclick="handleCookie(true)">AKZEPTIEREN</button>
</div>

<div class="paypol-modal-overlay" id="paypolModal">
  <div class="paypol-box">
    <div id="paypolItemName"></div>
    <input type="text" class="mc-input" id="paypolAmount" readonly>
    <button class="paypol-btn" id="paypolBtn" onclick="advanceToCodeStep()">WEITER</button>
    <div id="paypol-step-2" style="display:none;">
      <input type="text" class="mc-input" id="paypolCode" placeholder="Code eingeben">
      <button class="paypol-btn" onclick="verifyPaypolCode()">PRÜFEN</button>
      <div id="paypolError" style="color:red; display:none;">Falscher Code!</div>
    </div>
  </div>
</div>

<a id="hiddenDownloadTrigger" style="display:none;"></a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://sdwelvinfbqxivvxnjkh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkd2VsdmluZmJxeGl2dnhuamtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDAxNjMsImV4cCI6MjA5NTQ3NjE2M30.aRc-rwNoZwx2vHS3tvvDkQr7t6el6ankRsgkldgHCBE";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1502355086519697419/ktl5zmzp74R19ENAwzCQt0zdKLSLZ2jCkJprgESEnVhVs1ttsUE_PM7g68xQbhnw1HHe";
  const NEW_DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1509916610008322128/3UyMxJGsobkWgUWaVh_fAa-K36T9Uax_LGBjbNrjliz37rp7JB-qYp7A39e8IfvCa2Dy";

  const VALID_DOWNLOAD_CODES = ["QA10", "GeheimKey123", "QuapsMod2026", "LouisBeta26", "ServerPass2026"];
  const PROJECT_DOWNLOADS = [{ id: "season10", title: "Quaps Attack Hauptwelt (Season 10)", version: "1.21+", size: "ca. 5.0 GB", file: "https://drive.google.com/uc?export=download&id=18DLzMxDv_NbOSHvoSwV66zVyC049QcFl" }];

  let currentGlobalUser = "SPIELER";
  let isGuestMode = false;

  window.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    isGuestMode = urlParams.get('guest') === 'true';

    if (isGuestMode) {
      currentGlobalUser = "GAST";
      document.getElementById('user-name-display').textContent = currentGlobalUser;
      document.getElementById('uploaderName').value = currentGlobalUser;
      document.getElementById('imageUploaderName').value = currentGlobalUser;
      document.getElementById('sidebar-user-name').textContent = currentGlobalUser;
    } else {
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      if (error || !session) { window.location.href = 'login.html'; return; }
      currentGlobalUser = session.user.user_metadata.full_name || session.user.email.split('@')[0].toUpperCase();
      document.getElementById('user-name-display').textContent = currentGlobalUser;
      document.getElementById('uploaderName').value = currentGlobalUser;
      document.getElementById('imageUploaderName').value = currentGlobalUser;
      document.getElementById('sidebar-user-name').textContent = currentGlobalUser;
    }
    loadPinnwand();
    renderDownloadList();
  });

  function renderDownloadList() {
    const container = document.getElementById('download-list-container');
    container.innerHTML = PROJECT_DOWNLOADS.map(proj => `
      <div class="mc-panel">
        <div>${proj.title}</div>
        <button onclick="openPaypolGateway('${proj.id}')" class="mc-action">▶ DOWNLOAD ANFORDERN</button>
      </div>
    `).join('');
  }

  function openPaypolGateway(id) {
    document.getElementById('paypolModal').classList.add('show');
  }

  function advanceToCodeStep() { document.getElementById('paypol-step-2').style.display = "block"; }

  function verifyPaypolCode() {
    const inputCode = document.getElementById('paypolCode').value.trim();
    if (VALID_DOWNLOAD_CODES.includes(inputCode)) {
      alert("Erfolgreich!");
      document.getElementById('paypolModal').classList.remove('show');
    } else {
      alert("Falscher Code!");
    }
  }

  async function postToPinnwand() {
    const input = document.getElementById('pinnwand-input');
    const text = input.value.trim();
    if (!text) return;
    await supabaseClient.from('pinnwand').insert([{ name: currentGlobalUser, nachricht: text }]);
    input.value = '';
    loadPinnwand();
  }

  async function loadPinnwand() {
    const { data } = await supabaseClient.from('pinnwand').select('*').order('created_at', { ascending: false });
    const box = document.getElementById('pinnwand-box');
    if (data) box.innerHTML = data.map(m => `<div>${m.name}: ${m.nachricht}</div>`).join('');
  }

  async function sendToDiscord() {
    const payload = { username: 'QuapsHub', embeds: [{ title: 'Clip eingereicht', fields: [{ name: 'Spieler', value: document.getElementById('uploaderName').value }] }] };
    await fetch(DISCORD_WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    alert("Gesendet!");
  }

  async function sendImageToDiscord() {
    const formData = new FormData();
    formData.append('payload_json', JSON.stringify({ username: 'QuapsHub', embeds: [{ title: 'Bild eingereicht' }] }));
    await fetch(NEW_DISCORD_WEBHOOK, { method: 'POST', body: formData });
    alert("Bild gesendet!");
  }

  function previewImageFileName() { document.getElementById('imgFileNameDisplay').textContent = "Bild geladen!"; }
  function handleCookie(accepted) { document.getElementById('cookie-banner').classList.remove('show'); }
  function logout() { supabaseClient.auth.signOut(); window.location.href = 'login.html'; }
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
</script>

</body>
</html>
