    // =========================================================================
    // 16. ROOT APP
    // =========================================================================
    const KONAMI_SEQ = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];

    function App() {
      const [session, setSession] = useState(null);
      const [authChecked, setAuthChecked] = useState(false);
      const [currentProfile, setCurrentProfile] = useState(null);
      const [profilesMap, setProfilesMap] = useState({});
      const [activeTab, setActiveTab] = useState('chat');
      const [unreadChatCount, setUnreadChatCount] = useState(0);
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [callState, setCallState] = useState(null);
      const [toast, setToast] = useState(null);
      const [design, setDesign] = useState(() => getSavedDesign());

      const [overdrive, setOverdrive] = useState(false);
      const [barrelRoll, setBarrelRoll] = useState(false);
      const [logoClicks, setLogoClicks] = useState(0);
      const [showSecretHud, setShowSecretHud] = useState(false);

      const signalChannelRef = useRef(null);
      const konamiIdxRef = useRef(0);

      useEffect(() => {
        applyDesignToDom(design);
        try {
          localStorage.setItem(DESIGN_KEY, JSON.stringify(design));
        } catch {}
      }, [design]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => {
          setToast((prev) => (prev === msg ? null : prev));
        }, 3800);
      };

      const triggerEasterEgg = (type) => {
        soundEngine.play('easter_egg', true);
        if (type === 'overdrive') {
          setOverdrive((prev) => {
            const next = !prev;
            showToast(next ? '⚡ OVERDRIVE-MODUS AKTIVIERT! Volle Energie!' : 'Overdrive-Modus deaktiviert.');
            return next;
          });
        } else if (type === 'barrelroll') {
          setBarrelRoll(true);
          showToast('🛩️ DO A BARREL ROLL!');
          setTimeout(() => setBarrelRoll(false), 950);
        }
      };

      useEffect(() => {
        const onKeyDown = (e) => {
          const expected = KONAMI_SEQ[konamiIdxRef.current];
          if (e.key.toLowerCase() === expected.toLowerCase()) {
            konamiIdxRef.current += 1;
            if (konamiIdxRef.current === KONAMI_SEQ.length) {
              konamiIdxRef.current = 0;
              triggerEasterEgg('overdrive');
            }
          } else {
            konamiIdxRef.current = 0;
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      const handleLogoClick = () => {
        const next = logoClicks + 1;
        if (next >= 5) {
          setLogoClicks(0);
          soundEngine.play('easter_egg', true);
          setShowSecretHud(true);
        } else {
          setLogoClicks(next);
        }
      };

      const loadAllProfiles = async () => {
        const { data } = await supabase.from('profiles').select('*');
        if (data) {
          const map = {};
          for (const p of data) map[p.id] = p;
          setProfilesMap(map);
          if (session?.user?.id && map[session.user.id]) {
            setCurrentProfile(map[session.user.id]);
          }
        }
      };

      useEffect(() => {
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission().catch(() => {});
        }

        supabase.auth.getSession().then(({ data }) => {
          setSession(data.session || null);
          setAuthChecked(true);
        });

        const { data: listener } = supabase.auth.onAuthStateChange((_event, nextSession) => {
          setSession(nextSession);
        });

        return () => listener.subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (!session?.user) {
          setCurrentProfile(null);
          return;
        }

        loadAllProfiles();
        supabase
          .from('profiles')
          .select('*')
          .eq('id', session.user.id)
          .single()
          .then(({ data }) => {
            if (data) setCurrentProfile(data);
          });

        const profChannel = supabase
          .channel('quaps-profiles-rt')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
            loadAllProfiles();
          })
          .subscribe();

        const sigChannel = supabase.channel('quaps-webrtc-signaling', {
          config: { broadcast: { self: false } }
        });

        sigChannel
          .on('broadcast', { event: 'call-signal' }, ({ payload }) => {
            if (!payload) return;
            if (payload.targetUserId && payload.targetUserId !== session.user.id) return;

            if (payload.type === 'call-invite') {
              notifyDesktop('Eingehender QuapsAttack Call', `${payload.fromUsername} ruft an...`);
              setCallState({
                status: 'incoming',
                roomId: payload.roomId,
                roomName: payload.roomName,
                isGroup: payload.isGroup,
                isVideo: payload.isVideo,
                peerUserId: payload.fromUserId,
                peerName: payload.fromUsername
              });
            } else {
              window.dispatchEvent(new CustomEvent('quaps-call-signal', { detail: payload }));
            }
          })
          .subscribe();

        signalChannelRef.current = sigChannel;

        return () => {
          supabase.removeChannel(profChannel);
          supabase.removeChannel(sigChannel);
        };
      }, [session?.user?.id]);

      const handleSignOut = async () => {
        await supabase.auth.signOut();
        setSession(null);
        showToast('Abgemeldet.');
      };

      const canManageRoles = isManagementRole(currentProfile?.role);

      const tabLabels = {
        chat: 'Direkt & Gruppen',
        pinboard: 'Pinnwand',
        calendar: 'Kalender',
        vault: 'Mediathek & Tresor',
        quapssi: 'QuapsSI Terminal',
        management: 'Management · Rollen',
        sounds: 'Design, Sounds & Media'
      };

      const statusDotColor =
        currentProfile?.custom_status === 'dnd'
          ? '#ef4444'
          : currentProfile?.custom_status === 'away'
          ? '#f5c518'
          : '#10b981';

      const navItems = [
        { id: 'chat', label: '💬 Direkt & Gruppen', badge: unreadChatCount > 0 ? unreadChatCount : null },
        { id: 'pinboard', label: '📌 Pinnwand' },
        { id: 'calendar', label: '📅 Kalender' },
        { id: 'vault', label: '🗂️ Mediathek & Tresor' },
        { id: 'quapssi', label: '🤖 QuapsSI KI' },
        ...(canManageRoles ? [{ id: 'management', label: '👑 Management & Rollen' }] : []),
        { id: 'sounds', label: '🎨 Design, Sounds & Media' }
      ];

      const moodClass =
        design.bgMood === 'cozy' ? 'theme-cozy' : design.bgMood === 'cyber' ? 'theme-cyber' : '';

      return React.createElement(
        'div',
        { className: `app-shell ${moodClass} ${overdrive ? 'overdrive-mode' : ''} ${barrelRoll ? 'barrel-roll' : ''}` },
        React.createElement(
          'header',
          { className: 'top-bar' },
          React.createElement(
            'div',
            { className: 'brand-badge', onClick: handleLogoClick, title: 'QuapsAttack Command Suite' },
            React.createElement('div', { className: 'brand-emblem' }, 'Q'),
            React.createElement('span', null,
              'QUAPS',
              React.createElement('span', { className: 'gold-gradient-text' }, 'ATTACK')
            ),
            React.createElement('span', { className: 'badge-gold' }, tabLabels[activeTab] || 'SUITE'),
            overdrive && React.createElement('span', { className: 'badge-red' }, '⚡ OVERDRIVE')
          ),
          session?.user && React.createElement(
            'div',
            { style: { display: 'flex', alignItems: 'center', gap: 10, fontSize: 12.5, color: 'var(--text-muted)' } },
            React.createElement('span', {
              style: { width: 8, height: 8, borderRadius: '50%', background: statusDotColor, display: 'inline-block' }
            }),
            React.createElement('span', { style: { color: '#fff', fontWeight: 600 } },
              currentProfile?.username || session.user.email
            ),
            currentProfile?.role && React.createElement(
              'span',
              { className: canManageRoles ? 'badge-gold' : 'badge-green' },
              currentProfile.role
            )
          )
        ),

        !authChecked
          ? React.createElement('div', { style: { flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-muted)' } }, 'Lade QuapsAttack...')
          : !session?.user
          ? React.createElement(AuthView, { onToast: showToast })
          : React.createElement(
              'div',
              { className: 'main-layout' },
              React.createElement(
                'aside',
                { className: 'sidebar glass-card' },
                React.createElement(
                  'div',
                  { style: { display: 'flex', flexDirection: 'column', gap: 4 } },
                  React.createElement('div', { style: { fontSize: 10.5, fontWeight: 700, letterSpacing: '0.08em', color: 'rgba(255,255,255,0.45)', padding: '4px 10px 6px' } }, 'MODULE'),
                  navItems.map((item) => React.createElement(
                    'button',
                    {
                      key: item.id,
                      className: `nav-btn ${activeTab === item.id ? 'active' : ''}`,
                      onClick: () => setActiveTab(item.id)
                    },
                    React.createElement('span', null, item.label),
                    item.badge && React.createElement('span', { className: 'badge-red' }, item.badge)
                  ))
                ),

                React.createElement(
                  'div',
                  { className: 'nested-box', style: { padding: 12, display: 'flex', flexDirection: 'column', gap: 8 } },
                  React.createElement(
                    'div',
                    { style: { display: 'flex', alignItems: 'center', gap: 10 } },
                    React.createElement(AvatarBadge, { profile: currentProfile, size: 40 }),
                    React.createElement(
                      'div',
                      { style: { minWidth: 0, flex: 1 } },
                      React.createElement('div', { style: { fontWeight: 700, fontSize: 13 } }, currentProfile?.username || 'Mitglied'),
                      React.createElement('div', { style: { fontSize: 11.5, color: 'var(--text-muted)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } },
                        currentProfile?.custom_status_text || 'Einsatzbereit'
                      )
                    )
                  ),
                  currentProfile?.personality_quote && React.createElement(
                    'div',
                    { style: { fontSize: 11.5, fontStyle: 'italic', color: 'rgba(255,255,255,0.65)', borderLeft: '2px solid #f5c518', paddingLeft: 8 } },
                    `„${currentProfile.personality_quote}“`
                  ),
                  React.createElement(
                    'div',
                    { style: { display: 'flex', gap: 6 } },
                    React.createElement('button', { className: 'btn-secondary', style: { flex: 1, padding: '6px 8px' }, onClick: () => setShowProfileModal(true) }, '✏️ Profil'),
                    React.createElement('button', { className: 'btn-danger', onClick: handleSignOut }, 'Logout')
                  )
                )
              ),

              React.createElement(
                'main',
                { className: 'content-area' },
                activeTab === 'chat' && React.createElement(ChatModule, {
                  currentUser: session.user,
                  currentProfile,
                  profilesMap,
                  signalChannel: signalChannelRef.current,
                  setCallState,
                  onUnreadChange: setUnreadChatCount,
                  onEasterEgg: triggerEasterEgg,
                  onToast: showToast
                }),
                activeTab === 'pinboard' && React.createElement(PinboardModule, {
                  currentUser: session.user,
                  profilesMap,
                  onToast: showToast
                }),
                activeTab === 'calendar' && React.createElement(CalendarModule, {
                  currentUser: session.user,
                  profilesMap,
                  onToast: showToast
                }),
                activeTab === 'vault' && React.createElement(VaultModule, {
                  currentUser: session.user,
                  profilesMap,
                  onToast: showToast
                }),
                activeTab === 'quapssi' && React.createElement(QuapsSIModule, {
                  currentUser: session.user,
                  onToast: showToast
                }),
                activeTab === 'management' && React.createElement(ManagementModule, {
                  currentUser: session.user,
                  currentProfile,
                  profilesMap,
                  onRefreshProfiles: loadAllProfiles,
                  onToast: showToast
                }),
                activeTab === 'sounds' && React.createElement(SettingsStudioModule, {
                  design,
                  onChangeDesign: setDesign,
                  onToast: showToast
                })
              )
            ),

        showProfileModal && currentProfile && React.createElement(ProfileModal, {
          profile: currentProfile,
          onClose: () => setShowProfileModal(false),
          onSaved: (updated) => {
            setCurrentProfile(updated);
            setProfilesMap((prev) => ({ ...prev, [updated.id]: updated }));
          },
          onToast: showToast
        }),

        callState && session?.user && React.createElement(CallOverlay, {
          callState,
          setCallState,
          currentUser: session.user,
          signalChannel: signalChannelRef.current,
          onToast: showToast
        }),

        showSecretHud && React.createElement(
          'div',
          { className: 'modal-backdrop', onClick: () => setShowSecretHud(false) },
          React.createElement(
            'div',
            { className: 'glass-card', style: { width: '100%', maxWidth: 440, padding: 24, textAlign: 'center' }, onClick: (e) => e.stopPropagation() },
            React.createElement('div', { className: 'badge-gold', style: { display: 'inline-block', marginBottom: 10 } }, 'SECRET REACTOR HUD'),
            React.createElement('h3', { style: { fontSize: 19, fontWeight: 800, marginBottom: 8 } }, '🕵️ QuapsAttack Secret Bunker'),
            React.createElement('p', { style: { fontSize: 13, color: 'var(--text-muted)', lineHeight: 1.5, marginBottom: 14 } },
              'Du hast das geheime Kommando-Menü entdeckt! Probiere auch den Konami-Code (↑↑↓↓←→←→BA) oder tippe /barrelroll im Chat.'
            ),
            React.createElement(
              'div',
              { style: { display: 'flex', justifyContent: 'center', gap: 10 } },
              React.createElement('button', { className: 'btn-primary', onClick: () => triggerEasterEgg('overdrive') }, '⚡ Overdrive umschalten'),
              React.createElement('button', { className: 'btn-secondary', onClick: () => setShowSecretHud(false) }, 'Schließen')
            )
          )
        ),

        toast && React.createElement('div', { className: 'toast-banner' }, toast)
      );
    }

    createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
