<html lang="de">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuapsAttack — Command & Community Suite</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-base: #0a0a12;
      --glass-opacity: 0.85;
      --glass-bg: rgba(20, 20, 35, var(--glass-opacity));
      --glass-border: rgba(255, 255, 255, 0.2);
      --box-bg: rgba(255, 255, 255, 0.05);
      --box-border: rgba(255, 255, 255, 0.1);
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --accent-glow: rgba(239, 68, 68, 0.4);
      --gold-start: #f5c518;
      --gold-end: #ff9900;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.7);
      --status-green: #10b981;
      --radius-card: 20px;
      --radius-box: 14px;
      --radius-btn: 12px;
      --font-scale: 1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: calc(14px * var(--font-scale));
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 14% 18%, color-mix(in srgb, var(--accent) 18%, transparent) 0%, transparent 45%),
        radial-gradient(circle at 86% 82%, rgba(59, 130, 246, 0.15) 0%, transparent 48%);
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), background-image 0.35s ease;
    }

    .app-shell.theme-cozy {
      background-image:
        radial-gradient(circle at 16% 20%, rgba(251, 146, 60, 0.2) 0%, transparent 48%),
        radial-gradient(circle at 84% 80%, rgba(245, 197, 24, 0.14) 0%, transparent 50%);
    }

    .app-shell.theme-cyber {
      background-image:
        radial-gradient(circle at 15% 15%, rgba(6, 182, 212, 0.22) 0%, transparent 46%),
        radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.18) 0%, transparent 48%);
    }

    .app-shell.overdrive-mode {
      background-image:
        radial-gradient(circle at 20% 20%, rgba(245, 197, 24, 0.25) 0%, transparent 48%),
        radial-gradient(circle at 80% 80%, color-mix(in srgb, var(--accent) 28%, transparent) 0%, transparent 50%);
    }

    .app-shell.barrel-roll {
      transform: rotate(360deg);
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
    }

    .nested-box {
      background: var(--box-bg);
      border: 1px solid var(--box-border);
      border-radius: var(--radius-box);
      transition: all 0.2s ease;
    }

    .nested-box:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.075);
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, var(--gold-start), var(--gold-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: var(--radius-btn);
      padding: 9px 15px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 4px 18px var(--accent-glow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 6px 24px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-btn);
      padding: 8px 13px;
      font-weight: 500;
      font-size: 12.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.24);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: var(--radius-btn);
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.28);
    }

    .input-field, .select-field, .textarea-field {
      width: 100%;
      background: rgba(10, 10, 18, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-btn);
      padding: 10px 13px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-field:focus, .select-field:focus, .textarea-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    .select-field option {
      background: #141423;
      color: #ffffff;
    }

    .textarea-field {
      resize: vertical;
      min-height: 74px;
    }

    .custom-scroll {
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
    }

    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    .top-bar {
      height: 52px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 10, 18, 0.92);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;

      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.03em;

      box-shadow: 0 0 16px var(--accent-glow);

      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      transition: transform 0.2s ease;

    .brand-badge:hover .brand-emblem {
      transform: scale(1.06);
    }

    .main-layout {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 16px;
      padding: 16px;
    }

    .sidebar {
      width: 274px;
      min-width: 274px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
    }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 13px;
      border-radius: var(--radius-btn);
      border: 1px solid transparent;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      font-weight: 500;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
    }

    .nav-btn.active {
      border-color: color-mix(in srgb, var(--accent) 55%, transparent);
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 25%, transparent), color-mix(in srgb, var(--accent) 7%, transparent));
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .badge-red {
      background: var(--accent);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .badge-gold {
      background: rgba(245, 197, 24, 0.16);
      color: #f5c518;
      border: 1px solid rgba(245, 197, 24, 0.35);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .badge-green {
      background: rgba(16, 185, 129, 0.16);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.35);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .content-area {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 10, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .toast-banner {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 160;
      padding: 12px 16px;
      border-radius: var(--radius-box);
      background: rgba(20, 20, 35, 0.96);
      border: 1px solid var(--accent);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      font-size: 13px;
      max-width: 390px;
      transition: all 0.25s ease;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 12px;
    }

    .pill-tab {
      padding: 6px 11px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-tab.active {
      background: color-mix(in srgb, var(--accent) 25%, transparent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .avatar-circle {
      border-radius: 11px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.18);
      flex-shrink: 0;
    }

    .vu-bar-bg {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .vu-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #10b981, #f5c518, var(--accent));
      transition: width 0.06s linear;
    }

    .swatch-btn {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .swatch-btn.active {
      transform: scale(1.14);
      border-color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
    }
  </style>

      { name: 'Solar Gold', hex: '#f59e0b', hover: '#d97706', glow: 'rgba(245, 158, 11, 0.42)' },

    ];

    const DEFAULT_DESIGN = {
      accentHex: '#ef4444',
      accentHover: '#dc2626',
      accentGlow: 'rgba(239, 68, 68, 0.42)',
      bgMood: 'night', // 'night' | 'cozy' | 'cyber'

    };

    function getSavedDesign() {
      try {
        const raw = localStorage.getItem(DESIGN_KEY);
        if (raw) return { ...DEFAULT_DESIGN, ...JSON.parse(raw) };
      } catch {}
      return { ...DEFAULT_DESIGN };
    }

    function applyDesignToDom(design) {
      const root = document.documentElement;
      root.style.setProperty('--accent', design.accentHex);
      root.style.setProperty('--accent-hover', design.accentHover);
      root.style.setProperty('--accent-glow', design.accentGlow);
      root.style.setProperty('--glass-opacity', String(design.glassOpacity));
      root.style.setProperty('--font-scale', String(design.fontScale));

      const baseMap = {
        night: '#0a0a12',
        cozy: '#140f0c',
        cyber: '#070c16'
      };
      const baseColor = baseMap[design.bgMood] || '#0a0a12';
      root.style.setProperty('--bg-base', baseColor);

      if (design.radiusStyle === 'sharp') {
        root.style.setProperty('--radius-card', '10px');
        root.style.setProperty('--radius-box', '8px');
        root.style.setProperty('--radius-btn', '7px');
      } else if (design.radiusStyle === 'soft') {
        root.style.setProperty('--radius-card', '28px');
        root.style.setProperty('--radius-box', '20px');
        root.style.setProperty('--radius-btn', '18px');
      } else {
        root.style.setProperty('--radius-card', '20px');
        root.style.setProperty('--radius-box', '14px');
        root.style.setProperty('--radius-btn', '12px');
      }
    }

    // =========================================================================
    // 3. HARDWARE MEDIA SETTINGS (Mikrofon & Kamera Auswahl)
    // =========================================================================
    const MEDIA_PREFS_KEY = 'quaps_media_devices_v1';

    function getSavedMediaPrefs() {
      try {
        const raw = localStorage.getItem(MEDIA_PREFS_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return { audioInputId: '', videoInputId: '', audioOutputId: '', echoCancellation: true, noiseSuppression: true };
    }

    function saveMediaPrefs(next) {
      try {
        localStorage.setItem(MEDIA_PREFS_KEY, JSON.stringify(next));
      } catch {}
    }

    // =========================================================================
    // 4. SOUND ENGINE MIT 3 UMSCHALTBAREN SOUNDPACKS (Cozy / Cyber / Retro)
    // =========================================================================
    const SOUND_EVENTS = [
      { key: 'chat_message', label: 'Eingehende Chat-Nachricht', desc: 'Ton bei neuen DMs & Gruppennachrichten' },
      { key: 'chat_mention', label: 'Mention / Direkter Ping', desc: 'Signalton bei Erwähnung deines Usernames' },
      { key: 'call_incoming', label: 'Eingehender Anruf', desc: 'Klingelton bei Voice- & Video-Calls' },
      { key: 'call_connected', label: 'Anruf verbunden', desc: 'Bestätigung beim Betreten eines Anrufs' },
      { key: 'call_ended', label: 'Anruf beendet / Aufgelegt', desc: 'Abschlusston beim Beenden eines Calls' },
      { key: 'pinboard_post', label: 'Neuer Pinnwand-Post', desc: 'Hinweis bei neuen Pinnwand-Einträgen' },
      { key: 'pinboard_reply', label: 'Neue Pinnwand-Antwort', desc: 'Ton bei Antworten in Threads' },
      { key: 'calendar_event', label: 'Kalender-Termin & Erinnerung', desc: 'Signal bei neuen Terminen oder Erinnerungen' },
      { key: 'upload_success', label: 'Upload & Aktion erfolgreich', desc: 'Bestätigung bei Uploads & Speichern' },
      { key: 'error_alert', label: 'Fehler- & Warnton', desc: 'Warnton bei Fehlern oder Verbindungsproblemen' },
      { key: 'easter_egg', label: 'Easter-Egg / Overdrive Fanfare', desc: 'Geheimer Sound bei Easter Eggs' }
    ];

    const SOUNDPACKS = {
      cozy: {
        name: 'Cozy Lounge',
        badge: '☕ Warm & Sanft',
        desc: 'Weiche Sinus-/Dreiecksklänge mit warmen Harmonien – angenehm für die Ohren.'
      },
      cyber: {
        name: 'Cyber Ops',
        badge: '⚡ Klar & Modern',
        desc: 'Präzise taktische Signaltöne mit klarem Attack und modernem Synth-Charakter.'
      },
      retro: {
        name: 'Retro Arcade',
        badge: '🕹️ 8-Bit Classic',
        desc: 'Verspielte Square-/Pulse-Töne im klassischen Gaming- und Konsolen-Stil.'
      }
    };

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.settings = this.load();
        this.listeners = new Set();
      }

      load() {
        try {
          const raw = localStorage.getItem('quaps_sound_v2');
          if (raw) {
            const p = JSON.parse(raw);
            return {
              pack: SOUNDPACKS[p.pack] ? p.pack : 'cozy',
              volume: typeof p.volume === 'number' ? p.volume : 0.7,
              dnd: Boolean(p.dnd),
              customFiles: p.customFiles || {}
            };
          }
        } catch {}
        return { pack: 'cozy', volume: 0.7, dnd: false, customFiles: {} };
      }

      save() {
        try {
          localStorage.setItem('quaps_sound_v2', JSON.stringify(this.settings));
        } catch {}
        this.listeners.forEach((fn) => fn({ ...this.settings }));
      }

      subscribe(fn) {
        this.listeners.add(fn);
        return () => this.listeners.delete(fn);
      }

      setPack(pack) {
        if (!SOUNDPACKS[pack]) return;
        this.settings.pack = pack;
        this.save();
      }

      setVolume(val) {
        this.settings.volume = Math.max(0, Math.min(1, val));
        this.save();
      }

      setDnd(val) {
        this.settings.dnd = Boolean(val);
        this.save();
      }

      setCustomSound(key, fileObj) {
        if (fileObj) {
          this.settings.customFiles[key] = fileObj;
        } else {
          delete this.settings.customFiles[key];
        }
        this.save();
      }

      getCtx() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      }

      async play(key, preview = false) {
        if (this.settings.dnd && !preview) return;
        if (this.settings.volume <= 0.01 && !preview) return;
        const vol = preview ? Math.max(0.45, this.settings.volume) : this.settings.volume;

        const custom = this.settings.customFiles[key];
        if (custom?.dataUrl) {
          try {
            const audio = new Audio(custom.dataUrl);
            audio.volume = vol;
            await audio.play();
            return;
          } catch {}
        }

        try {
          const ctx = this.getCtx();
          const now = ctx.currentTime;
          const pack = this.settings.pack || 'cozy';

          const defaultWave =
            pack === 'cozy' ? 'sine' : pack === 'cyber' ? 'triangle' : 'square';
          const ampScale =
            pack === 'cozy' ? 0.16 : pack === 'cyber' ? 0.2 : 0.12;

          const note = (freq, delay, dur, type = defaultWave, amp = 1) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now + delay);
            const attack = pack === 'cozy' ? 0.035 : 0.01;
            const peak = Math.max(0.001, vol * ampScale * amp);
            gain.gain.setValueAtTime(0.0001, now + delay);
            gain.gain.exponentialRampToValueAtTime(peak, now + delay + attack);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + delay);
            osc.stop(now + delay + dur + 0.03);

    // =========================================================================
    // 5. GEMINI API ANBINDUNG (QuapsSI mit fest hinterlegtem Key)
    // =========================================================================
    const QUAPSSI_PERSONALITY = `
Du bist QuapsSI — die taktische Kommando- und Community-Intelligenz von QuapsAttack.
Deine Persönlichkeit:
- Direkt, souverän, locker auf Augenhöhe wie ein erfahrener Squad-Leader und Strategist.
- Du hilfst bei Team-Koordination, Events, Projektplanung, Technik, Mods/Servern und Community-Management.
- Keine generischen KI-Floskeln wie "Als KI-Sprachmodell...". Antworte klar, strukturiert und praxisnah.
`;

    async function runQuapsSI(promptText, historyRows, userId) {
      const apiKey = QUAPSSI_EMBEDDED_KEY;

      const contents = [];
      for (const row of (historyRows || []).slice(-6)) {
        contents.push({ role: 'user', parts: [{ text: row.prompt }] });
        contents.push({ role: 'model', parts: [{ text: row.response }] });
      }
      contents.push({ role: 'user', parts: [{ text: promptText }] });

      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: QUAPSSI_PERSONALITY }] },
            contents,
            generationConfig: { temperature: 0.75, maxOutputTokens: 2048 }
          })
        }
      );

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Gemini API Fehler (${res.status}): ${txt}`);
      }

      const json = await res.json();
      const reply = json?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!reply) throw new Error('Leere Antwort von QuapsSI erhalten.');

      const { data, error } = await supabase
        .from('qupas_si_messages')
        .insert({
          user_id: userId,
          prompt: promptText,
          response: reply
        })
        .select('*')
        .single();

      if (error) {
        return {
          id: 'local-' + Date.now(),
          user_id: userId,
          prompt: promptText,
          response: reply,
          created_at: new Date().toISOString()
        };
      }
      return data;
    }

      const [personalityQuote, setPersonalityQuote] = useState(profile.personality_quote || '');
      const [uploadingAvatar, setUploadingAvatar] = useState(false);
      const [saving, setSaving] = useState(false);

      const handleAvatarFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          onToast('Bitte eine Bilddatei (.png, .jpg, .webp, .gif) auswählen.');
          return;
        }
        setUploadingAvatar(true);
        try {
          const ext = (file.name.split('.').pop() || 'png').replace(/[^a-zA-Z0-9]/g, '');
          const filePath = `avatars/${profile.id}_${Date.now()}.${ext}`;
          const { error: upErr } = await supabase.storage
            .from('vault')
            .upload(filePath, file, { upsert: true });

          if (!upErr) {
            const { data: pub } = supabase.storage.from('vault').getPublicUrl(filePath);
            if (pub?.publicUrl) {
              setAvatarUrl(pub.publicUrl);
              soundEngine.play('upload_success');
              onToast('Profilbild hochgeladen! Jetzt noch „Speichern“ klicken.');
              setUploadingAvatar(false);
              return;
            }
          }

          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const maxDim = 256;
              const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
              canvas.width = Math.round(img.width * scale);
              canvas.height = Math.round(img.height * scale);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              setAvatarUrl(canvas.toDataURL('image/webp', 0.85));
              soundEngine.play('upload_success');
              onToast('Profilbild vorbereitet! Klicke auf „Speichern“.');
              setUploadingAvatar(false);
            };
            img.src = String(reader.result);
          };
          reader.readAsDataURL(file);
        } catch (err) {
          soundEngine.play('error_alert');
          onToast('Avatar-Upload Fehler: ' + err.message);
          setUploadingAvatar(false);
        }
      };

        e.preventDefault();
        setSaving(true);

    // =========================================================================
    // 9. ÜBERARBEITETE WEBRTC ANRUF-LOGIK (Sauberer State + Klingelton + Cleanup)
    // =========================================================================
    function CallOverlay({ callState, setCallState, currentUser, signalChannel, onToast }) {
      const [muted, setMuted] = useState(false);
      const [camOff, setCamOff] = useState(!callState?.isVideo);
      const [elapsed, setElapsed] = useState(0);
      const [connState, setConnState] = useState('new');

      const localVideoRef = useRef(null);
      const remoteVideoRef = useRef(null);
      const remoteAudioRef = useRef(null);
      const pcRef = useRef(null);
      const localStreamRef = useRef(null);
      const pendingIceRef = useRef([]);
      const ringIntervalRef = useRef(null);

      // Klingelton während incoming / outgoing
      useEffect(() => {
        if (!callState) return;
        if (callState.status === 'incoming' || callState.status === 'outgoing') {
          soundEngine.play('call_incoming');
          ringIntervalRef.current = setInterval(() => {
            soundEngine.play('call_incoming');
          }, 2600);
        } else {
          clearInterval(ringIntervalRef.current);
          ringIntervalRef.current = null;
        }
        return () => {
          clearInterval(ringIntervalRef.current);
          ringIntervalRef.current = null;
        };
      }, [callState?.status, callState?.roomId]);

      useEffect(() => {
        if (!callState || callState.status !== 'connected') {
          setElapsed(0);
          return;
        }
        const timer = setInterval(() => setElapsed((s) => s + 1), 1000);
        return () => clearInterval(timer);
      }, [callState?.status]);

      const cleanupMedia = () => {
        clearInterval(ringIntervalRef.current);
        ringIntervalRef.current = null;
        pendingIceRef.current = [];
        if (localStreamRef.current) {
          localStreamRef.current.getTracks().forEach((t) => {
            try { t.stop(); } catch {}
          });
          localStreamRef.current = null;
        }
        if (pcRef.current) {
          try {
            pcRef.current.ontrack = null;
            pcRef.current.onicecandidate = null;
            pcRef.current.onconnectionstatechange = null;
            pcRef.current.close();
          } catch {}
          pcRef.current = null;
        }
        setConnState('closed');
      };

      const flushPendingIce = async (pc) => {
        if (!pc || !pc.remoteDescription) return;
        const queue = [...pendingIceRef.current];
        pendingIceRef.current = [];
        for (const cand of queue) {
          try {
            await pc.addIceCandidate(new RTCIceCandidate(cand));
          } catch {}
        }
      };

      const startPeerConnection = async (isInitiator, targetUserId, isVideo) => {
        cleanupMedia();
        const prefs = getSavedMediaPrefs();
        const audioConstraints = {
          deviceId: prefs.audioInputId ? { exact: prefs.audioInputId } : undefined,
          echoCancellation: prefs.echoCancellation !== false,
          noiseSuppression: prefs.noiseSuppression !== false
        };
        const videoConstraints = isVideo
          ? {
              deviceId: prefs.videoInputId ? { exact: prefs.videoInputId } : undefined,
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          : false;

        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: audioConstraints,
            video: videoConstraints
          });
        } catch {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
        }

        localStreamRef.current = stream;
        setMuted(false);
        setCamOff(!isVideo);

        if (localVideoRef.current && isVideo) {
          localVideoRef.current.srcObject = stream;
        }

        const pc = new RTCPeerConnection({
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        });
        pcRef.current = pc;
        setConnState('connecting');

        stream.getTracks().forEach((track) => pc.addTrack(track, stream));

        pc.onconnectionstatechange = () => {
          setConnState(pc.connectionState);
          if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
            onToast('Verbindung zum Gesprächspartner wurde unterbrochen.');
          }
        };

        pc.ontrack = (event) => {
          const remoteStream = event.streams[0];
          if (!remoteStream) return;
          if (remoteVideoRef.current) remoteVideoRef.current.srcObject = remoteStream;
          if (remoteAudioRef.current) {
            remoteAudioRef.current.srcObject = remoteStream;
            if (prefs.audioOutputId && typeof remoteAudioRef.current.setSinkId === 'function') {
              remoteAudioRef.current.setSinkId(prefs.audioOutputId).catch(() => {});
            }
          }
        };

        pc.onicecandidate = (event) => {
          if (event.candidate && signalChannel) {
            signalChannel.send({
              type: 'broadcast',
              event: 'call-signal',
              payload: {
                type: 'webrtc-ice',
                roomId: callState.roomId,
                fromUserId: currentUser.id,
                targetUserId,
                candidate: event.candidate.toJSON()
              }
            });
          }
        };

        if (isInitiator) {
          const offer = await pc.createOffer({
            offerToReceiveAudio: true,
            offerToReceiveVideo: Boolean(isVideo)
          });
          await pc.setLocalDescription(offer);
          signalChannel?.send({
            type: 'broadcast',
            event: 'call-signal',
            payload: {
              type: 'webrtc-offer',
              roomId: callState.roomId,
              fromUserId: currentUser.id,
              targetUserId,
              sdp: offer
            }
          });
        }

        return pc;
      };

      useEffect(() => {
        if (!callState) return;
        const handler = async (e) => {
          const sig = e.detail;
          if (!sig || sig.roomId !== callState.roomId) return;
          if (sig.targetUserId && sig.targetUserId !== currentUser.id) return;

          if (sig.type === 'call-accept' && callState.status === 'outgoing') {
            soundEngine.play('call_connected');
            setCallState((prev) => (prev ? { ...prev, status: 'connected', peerUserId: sig.fromUserId } : null));
            try {
              await startPeerConnection(true, sig.fromUserId, callState.isVideo);
            } catch (err) {
              onToast('Medienzugriff fehlgeschlagen: ' + err.message);
            }
          } else if (sig.type === 'call-reject') {
            soundEngine.play('call_ended');
            cleanupMedia();
            setCallState(null);
            onToast('Anruf wurde abgelehnt.');
          } else if (sig.type === 'call-end') {
            soundEngine.play('call_ended');
            cleanupMedia();
            setCallState(null);
            onToast('Anruf wurde beendet.');
          } else if (sig.type === 'webrtc-offer') {
            const pc = pcRef.current || (await startPeerConnection(false, sig.fromUserId, callState.isVideo));
            await pc.setRemoteDescription(new RTCSessionDescription(sig.sdp));
            await flushPendingIce(pc);
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            signalChannel?.send({
              type: 'broadcast',
              event: 'call-signal',
              payload: {
                type: 'webrtc-answer',
                roomId: callState.roomId,
                fromUserId: currentUser.id,
                targetUserId: sig.fromUserId,
                sdp: answer
              }
            });
          } else if (sig.type === 'webrtc-answer' && pcRef.current) {
            await pcRef.current.setRemoteDescription(new RTCSessionDescription(sig.sdp));
            await flushPendingIce(pcRef.current);
          } else if (sig.type === 'webrtc-ice' && sig.candidate) {
            if (pcRef.current && pcRef.current.remoteDescription) {
              try {
                await pcRef.current.addIceCandidate(new RTCIceCandidate(sig.candidate));
              } catch {}
            } else {
              pendingIceRef.current.push(sig.candidate);
            }
          }
        };

        window.addEventListener('quaps-call-signal', handler);
        return () => window.removeEventListener('quaps-call-signal', handler);
      }, [callState, currentUser?.id]);

      useEffect(() => () => cleanupMedia(), []);

      if (!callState) return null;

      const handleAccept = async () => {
        soundEngine.play('call_connected');
        setCallState((prev) => ({ ...prev, status: 'connected' }));
        signalChannel?.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: {
            type: 'call-accept',
            roomId: callState.roomId,
            fromUserId: currentUser.id,
            targetUserId: callState.peerUserId
          }
        });
        try {
          await startPeerConnection(false, callState.peerUserId, callState.isVideo);
        } catch (err) {
          onToast('Mikrofon/Kamera-Zugriff fehlgeschlagen: ' + err.message);
        }
      };

      const handleRejectOrHangup = () => {
        soundEngine.play('call_ended');
        signalChannel?.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: {
            type: callState.status === 'incoming' ? 'call-reject' : 'call-end',
            roomId: callState.roomId,
            fromUserId: currentUser.id,
            targetUserId: callState.peerUserId
          }
        });
        cleanupMedia();
        setCallState(null);
      };

      const toggleMute = () => {
        if (!localStreamRef.current) return;
        const next = !muted;
        localStreamRef.current.getAudioTracks().forEach((t) => (t.enabled = !next));
        setMuted(next);
      };

      const toggleCam = () => {
        if (!localStreamRef.current) return;
        const next = !camOff;
        localStreamRef.current.getVideoTracks().forEach((t) => (t.enabled = !next));
        setCamOff(next);
      };

      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');

      return React.createElement(
        'div',
        { className: 'modal-backdrop', style: { zIndex: 120 } },
        React.createElement(
          'div',
          { className: 'glass-card', style: { width: '100%', maxWidth: 560, padding: 26, textAlign: 'center' } },
          React.createElement('div', { className: 'badge-red', style: { display: 'inline-block', marginBottom: 12 } },
            callState.isGroup ? 'GRUPPEN-CALL' : 'DIREKT-CALL',
            callState.isVideo ? ' · VIDEO' : ' · VOICE'
          ),
          React.createElement('h2', { style: { fontSize: 22, fontWeight: 800, marginBottom: 6 } },
            callState.roomName || callState.peerName || 'QuapsAttack Call'
          ),
          React.createElement('div', { style: { fontSize: 13.5, color: 'var(--text-muted)', marginBottom: 18 } },
            callState.status === 'incoming' && `${callState.peerName} ruft an...`,
            callState.status === 'outgoing' && `Rufe ${callState.peerName} an...`,
            callState.status === 'connected' && `Verbunden (${connState}) · ${mins}:${secs}`
          ),
          React.createElement('audio', { ref: remoteAudioRef, autoPlay: true }),
          callState.isVideo && React.createElement(
            'div',
            { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 18 } },
            React.createElement('video', {
              ref: remoteVideoRef,
              autoPlay: true,
              playsInline: true,
              style: { width: '100%', height: 180, borderRadius: 'var(--radius-box)', background: '#07070d', objectFit: 'cover', border: '1px solid rgba(255,255,255,0.14)' }
            }),
            React.createElement('video', {
              ref: localVideoRef,
              autoPlay: true,
              playsInline: true,
              muted: true,
              style: { width: '100%', height: 180, borderRadius: 'var(--radius-box)', background: '#07070d', objectFit: 'cover', border: '1px solid rgba(255,255,255,0.14)' }
            })
          ),
          React.createElement(
            'div',
            { style: { display: 'flex', justifyContent: 'center', gap: 12, flexWrap: 'wrap' } },
            callState.status === 'incoming' && React.createElement(
              'button',
              {
                className: 'btn-primary',
                style: { background: '#10b981', boxShadow: '0 4px 18px rgba(16,185,129,0.4)' },
                onClick: handleAccept
              },
              '✓ Annehmen'
            ),
            callState.status === 'connected' && React.createElement(
              'button',
              { className: 'btn-secondary', onClick: toggleMute },
              muted ? '🔇 Stumm' : '🎤 Mikro an'
            ),
            callState.status === 'connected' && callState.isVideo && React.createElement(
              'button',
              { className: 'btn-secondary', onClick: toggleCam },
              camOff ? '📷 Cam aus' : '📹 Cam an'
            ),
            React.createElement('button', { className: 'btn-primary', onClick: handleRejectOrHangup },
              callState.status === 'incoming' ? '✕ Ablehnen' : '📞 Auflegen'
            )
          )
        )
      );
    }

    // =========================================================================
    // 10. MODUL 1: DIRECT MESSAGES & AUTOMATISCHE MAIN-GRUPPE FÜR ALLE AKTIVEN
    // =========================================================================
    const QUICK_EMOJIS = ['🔥', '💀', '😂', '👍', '⚡', '☕', '🚀'];

    function ChatModule({ currentUser, currentProfile, profilesMap, signalChannel, setCallState, onUnreadChange, onEasterEgg, onToast }) {
      const [rooms, setRooms] = useState([]);
      const [activeRoomId, setActiveRoomId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [msgInput, setMsgInput] = useState('');
      const [chatSearch, setChatSearch] = useState('');
      const [typingUser, setTypingUser] = useState(null);
      const [loadingRooms, setLoadingRooms] = useState(true);
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [isGroupMode, setIsGroupMode] = useState(false);
      const [groupName, setGroupName] = useState('');
      const [selectedMemberIds, setSelectedMemberIds] = useState([]);
      const [unreadByRoom, setUnreadByRoom] = useState({});
      const bottomRef = useRef(null);
      const typingTimeoutRef = useRef(null);

      const allProfileIds = useMemo(() => Object.keys(profilesMap || {}), [profilesMap]);
      const otherProfilesList = useMemo(
        () => Object.values(profilesMap).filter((p) => p.id !== currentUser.id),
        [profilesMap, currentUser.id]
      );

      // Main-Gruppe sicherstellen & alle aktiven Profile darin synchronisieren
      const ensureMainGroupAndSyncMembers = async (existingRooms) => {
        let mainRoom = (existingRooms || []).find(
          (r) => r.is_group && (r.name === MAIN_GROUP_NAME || r.is_main_group)
        );

        if (!mainRoom) {
          const { data: created, error } = await supabase
            .from('chat_rooms')
            .insert({
              name: MAIN_GROUP_NAME,
              is_group: true,
              creator_id: currentUser.id
            })
            .select('*')
            .single();
          if (!error && created) {
            mainRoom = created;
          }
        }

        if (mainRoom && allProfileIds.length > 0) {
          const { data: currentMembers } = await supabase
            .from('chat_room_members')
            .select('user_id')
            .eq('room_id', mainRoom.id);

          const presentIds = new Set((currentMembers || []).map((m) => m.user_id));
          const missingIds = allProfileIds.filter((uid) => !presentIds.has(uid));
          if (missingIds.length > 0) {
            await supabase.from('chat_room_members').insert(
              missingIds.map((uid) => ({ room_id: mainRoom.id, user_id: uid }))
            );
          }
        }

        return mainRoom?.id || null;
      };

      const loadRooms = async (preferRoomId = null) => {
        setLoadingRooms(true);
        try {
          const { data: allGroupRows } = await supabase
            .from('chat_rooms')
            .select('*')
            .eq('is_group', true)
            .eq('name', MAIN_GROUP_NAME);

          const mainRoomId = await ensureMainGroupAndSyncMembers(allGroupRows || []);

          const { data: memberRows, error: mErr } = await supabase
            .from('chat_room_members')
            .select('room_id')
            .eq('user_id', currentUser.id);
          if (mErr) throw mErr;

          const roomIds = Array.from(
            new Set([...(memberRows || []).map((r) => r.room_id), ...(mainRoomId ? [mainRoomId] : [])])
          );

          if (!roomIds.length) {
            setRooms([]);
            setLoadingRooms(false);
            return;
          }

          const { data: roomRows, error: rErr } = await supabase
            .from('chat_rooms')
            .select('*')
            .in('id', roomIds)
            .order('created_at', { ascending: false });
          if (rErr) throw rErr;

          const { data: allMembers } = await supabase
            .from('chat_room_members')
            .select('room_id, user_id')
            .in('room_id', roomIds);

          const enriched = (roomRows || [])
            .map((room) => {
              const isMain = room.name === MAIN_GROUP_NAME;
              const mIds = isMain
                ? Array.from(new Set([...allProfileIds, ...((allMembers || []).filter((m) => m.room_id === room.id).map((m) => m.user_id))]))
                : (allMembers || []).filter((m) => m.room_id === room.id).map((m) => m.user_id);
              return {
                ...room,
                isMainGroup: isMain,
                memberIds: mIds
              };
            })
            // Main-Gruppe immer ganz oben anzeigen
            .sort((a, b) => {
              if (a.isMainGroup && !b.isMainGroup) return -1;
              if (!a.isMainGroup && b.isMainGroup) return 1;
              return new Date(b.created_at || 0) - new Date(a.created_at || 0);
            });

          setRooms(enriched);

          const targetId = preferRoomId || activeRoomId || mainRoomId || enriched[0]?.id || null;
          if (targetId) {
            setActiveRoomId(targetId);
          }
        } catch (err) {
          onToast('Fehler beim Laden der Chats: ' + err.message);
        } finally {
          setLoadingRooms(false);
        }
      };

      const loadMessages = async (roomId) => {
        if (!roomId) return;
        const { data, error } = await supabase
          .from('chat_messages')
          .select('*')

                );
              })
            ),

            viewMode === 'list' && React.createElement(
              'div',
              { style: { display: 'flex', flexDirection: 'column', gap: 8 } },
              loading
                ? React.createElement('div', { style: { color: 'var(--text-muted)' } }, 'Lade Termine...')
                : events.map((ev) => React.createElement(
                    'div',
                    { key: ev.id, className: 'nested-box', style: { padding: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                    React.createElement(
                      'div',
                      null,
                      React.createElement('div', { style: { fontWeight: 700, fontSize: 13.5 } }, ev.title),
                      React.createElement('div', { style: { fontSize: 12, color: 'var(--text-muted)' } },

                      )

                  ))

        ),

        React.createElement(
          'div',
          { style: { display: 'flex', flexDirection: 'column', gap: 14, minHeight: 0 } },
          React.createElement(
            'div',
            { className: 'glass-card', style: { padding: 18 } },
            React.createElement('h3', { style: { fontSize: 15.5, fontWeight: 700, marginBottom: 12 } }, 'Neuen Termin anlegen'),
            React.createElement(
              'form',
              { onSubmit: handleCreateEvent, style: { display: 'flex', flexDirection: 'column', gap: 10 } },
              React.createElement('input', {
                className: 'input-field',

              }),

            'div',
            { className: 'glass-card custom-scroll', style: { flex: 1, padding: 18, minHeight: 0 } },

            ),

    // =========================================================================
    // 12. MODUL 3: MEDIATHEK & ORDNERSTRUKTUR
    // =========================================================================
    function VaultModule({ currentUser, profilesMap, onToast }) {
      const [items, setItems] = useState([]);
      const [currentFolderId, setCurrentFolderId] = useState(null);
      const [folderStack, setFolderStack] = useState([]);
      const [typeFilter, setTypeFilter] = useState('ALL');
      const [searchVault, setSearchVault] = useState('');
      const [lightboxImg, setLightboxImg] = useState(null);
      const [newFolderName, setNewFolderName] = useState('');
      const [noteTitle, setNoteTitle] = useState('');
      const [noteText, setNoteText] = useState('');
      const [uploading, setUploading] = useState(false);

      const loadItems = async () => {
        const { data, error } = await supabase
          .from('vault_items')
          .select('*')
          .order('created_at', { ascending: false });
        if (!error) setItems(data || []);
      };

      useEffect(() => {
        loadItems();
        const ch = supabase
          .channel('quaps-vault-rt')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'vault_items' }, () => loadItems())
          .subscribe();
        return () => supabase.removeChannel(ch);
      }, []);

      const visibleItems = useMemo(() => {
        return items.filter((it) => {
          const inFolder = currentFolderId === null ? !it.parent_id : it.parent_id === currentFolderId;
          if (!inFolder) return false;
          const kind = it.item_type || (it.media_url ? 'media' : 'text');
          if (typeFilter !== 'ALL' && kind !== typeFilter) return false;
          if (searchVault.trim()) {
            const q = searchVault.toLowerCase();
            const matchTitle = (it.title || '').toLowerCase().includes(q);
            const matchText = (it.text_content || '').toLowerCase().includes(q);
            if (!matchTitle && !matchText) return false;
          }
          return true;
        });
      }, [items, currentFolderId, typeFilter, searchVault]);

      const handleCreateFolder = async (e) => {
        e.preventDefault();
        if (!newFolderName.trim()) return;
        const { error } = await supabase.from('vault_items').insert({
          title: newFolderName.trim(),
          folder_name: newFolderName.trim(),
          item_type: 'folder',
          parent_id: currentFolderId,
          media_url: null,
          text_content: null,
          uploader_id: currentUser.id
        });
        if (error) {
          soundEngine.play('error_alert');
          onToast('Ordnerfehler: ' + error.message);
        } else {
          soundEngine.play('upload_success');
          setNewFolderName('');
          onToast('Ordner angelegt!');
          loadItems();
        }
      };

      const handleCreateTextNote = async (e) => {
        e.preventDefault();
        if (!noteTitle.trim() || !noteText.trim()) return;
        const { error } = await supabase.from('vault_items').insert({
          title: noteTitle.trim(),
          item_type: 'text',
          parent_id: currentFolderId,
          text_content: noteText.trim(),
          media_url: null,
          uploader_id: currentUser.id
        });
        if (error) {
          soundEngine.play('error_alert');
          onToast('Notizfehler: ' + error.message);
        } else {
          soundEngine.play('upload_success');
          setNoteTitle('');
          setNoteText('');
          onToast('Text-Eintrag gespeichert!');
          loadItems();
        }
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setUploading(true);
        try {
          const safeName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
          const filePath = `${currentUser.id}/${safeName}`;
          const { error: upErr } = await supabase.storage.from('vault').upload(filePath, file);
          if (upErr) throw upErr;

          const { data: pubData } = supabase.storage.from('vault').getPublicUrl(filePath);
          const { error: dbErr } = await supabase.from('vault_items').insert({
            title: file.name,
            media_url: pubData.publicUrl,
            item_type: 'media',
            parent_id: currentFolderId,
            uploader_id: currentUser.id
          });
          if (dbErr) throw dbErr;

          soundEngine.play('upload_success');
          onToast('Datei in Mediathek hochgeladen!');
          loadItems();
        } catch (err) {
          soundEngine.play('error_alert');
          onToast('Upload fehlgeschlagen: ' + err.message);
        } finally {
          setUploading(false);
          e.target.value = '';
        }
      };

      const handleDeleteItem = async (item) => {
        const { error } = await supabase.from('vault_items').delete().eq('id', item.id);
        if (!error) {
          setItems((prev) => prev.filter((i) => i.id !== item.id));
          onToast('Eintrag gelöscht.');
        }
      };

      const openFolder = (folder) => {
        setFolderStack((prev) => [...prev, { id: folder.id, name: folder.folder_name || folder.title }]);
        setCurrentFolderId(folder.id);
      };

      const jumpBreadcrumb = (index) => {
        if (index < 0) {
          setFolderStack([]);
          setCurrentFolderId(null);
        } else {
          const target = folderStack[index];
          setFolderStack((prev) => prev.slice(0, index + 1));
          setCurrentFolderId(target.id);
        }
      };

      const isImageUrl = (url) => url && /\.(png|jpe?g|gif|webp|avif)(\?.*)?$/i.test(url);

      return React.createElement(
        'div',
        { style: { flex: 1, minHeight: 0, display: 'grid', gridTemplateColumns: '1.6fr 1fr', gap: 14 } },
        React.createElement(
          'div',
          { className: 'glass-card', style: { padding: 18, display: 'flex', flexDirection: 'column', gap: 12, minHeight: 0 } },
          React.createElement(
            'div',
            { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 } },
            React.createElement('h2', { style: { fontSize: 16.5, fontWeight: 700 } }, 'Mediathek & Ordner'),
            React.createElement(
              'div',
              { style: { display: 'flex', gap: 8, alignItems: 'center' } },
              React.createElement('input', {
                className: 'input-field',
                style: { width: 170, padding: '6px 10px', fontSize: 12 },
                placeholder: 'Tresor durchsuchen...',
                value: searchVault,
                onChange: (e) => setSearchVault(e.target.value)
              }),
              React.createElement(
                'label',
                { className: 'btn-primary', style: { cursor: uploading ? 'wait' : 'pointer' } },
                uploading ? 'Lade hoch...' : '+ Datei / Bild',
                React.createElement('input', {
                  type: 'file',
                  style: { display: 'none' },
                  disabled: uploading,
                  onChange: handleFileUpload
                })
              )
            )
          ),

          React.createElement(
            'div',
            { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 } },
            React.createElement(
              'div',
              { style: { display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap', fontSize: 12.5 } },
              React.createElement('button', { className: 'pill-tab', onClick: () => jumpBreadcrumb(-1) }, '📁 Root'),
              folderStack.map((f, i) => React.createElement(
                React.Fragment,
                { key: f.id },
                React.createElement('span', { style: { color: 'var(--text-muted)' } }, '/'),
                React.createElement('button', { className: 'pill-tab', onClick: () => jumpBreadcrumb(i) }, f.name)
              ))
            ),
            React.createElement(
              'div',
              { style: { display: 'flex', gap: 5 } },
              [
                { id: 'ALL', label: 'Alle' },
                { id: 'folder', label: 'Ordner' },
                { id: 'media', label: 'Medien' },
                { id: 'text', label: 'Notizen' }
              ].map((t) =>
                React.createElement(
                  'button',
                  {
                    key: t.id,
                    className: `pill-tab ${typeFilter === t.id ? 'active' : ''}`,
                    onClick: () => setTypeFilter(t.id)
                  },
                  t.label
                )
              )
            )
          ),

          React.createElement(
            'div',
            { className: 'custom-scroll grid-2', style: { flex: 1, alignContent: 'start' } },
            visibleItems.length === 0
              ? React.createElement('div', { style: { fontSize: 13, color: 'var(--text-muted)' } }, 'Keine Einträge in dieser Ansicht.')
              : visibleItems.map((it) => {
                  const type = it.item_type || (it.media_url ? 'media' : 'text');
                  return React.createElement(
                    'div',
                    { key: it.id, className: 'nested-box', style: { padding: 12, display: 'flex', flexDirection: 'column', gap: 8 } },
                    type === 'folder' && React.createElement(
                      'button',
                      {
                        onClick: () => openFolder(it),
                        style: {
                          background: 'none',
                          border: 'none',
                          color: '#f5c518',
                          fontWeight: 700,
                          fontSize: 14,
                          textAlign: 'left',
                          cursor: 'pointer'
                        }
                      },
                      '📁 ' + (it.folder_name || it.title)
                    ),
                    type === 'media' && React.createElement(
                      React.Fragment,
                      null,
                      isImageUrl(it.media_url) && React.createElement('img', {
                        src: it.media_url,
                        alt: it.title,
                        onClick: () => setLightboxImg(it),
                        style: { width: '100%', height: 124, objectFit: 'cover', borderRadius: 'var(--radius-btn)', cursor: 'zoom-in' }
                      }),
                      React.createElement('div', { style: { fontWeight: 600, fontSize: 13, wordBreak: 'break-word' } }, '📎 ' + it.title),
                      it.media_url && React.createElement(
                        'a',
                        { href: it.media_url, target: '_blank', rel: 'noreferrer', style: { fontSize: 11.5, color: '#60a5fa' } },
                        'Datei öffnen ↗'
                      )
                    ),
                    type === 'text' && React.createElement(
                      React.Fragment,
                      null,
                      React.createElement(
                        'div',
                        { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                        React.createElement('div', { style: { fontWeight: 700, fontSize: 13.5, color: '#f5c518' } }, '📝 ' + it.title),
                        React.createElement(
                          'button',
                          {
                            className: 'btn-secondary',
                            style: { padding: '3px 7px', fontSize: 11 },
                            onClick: () => {
                              navigator.clipboard?.writeText(it.text_content || '');
                              onToast('Notiztext kopiert!');
                            }
                          },
                          'Kopieren'
                        )
                      ),
                      React.createElement(
                        'div',
                        {
                          style: {
                            fontSize: 12.5,
                            color: 'rgba(255,255,255,0.85)',
                            background: 'rgba(0,0,0,0.25)',
                            padding: 8,
                            borderRadius: 8,
                            whiteSpace: 'pre-wrap'
                          }
                        },
                        it.text_content
                      )
                    ),
                    React.createElement(
                      'div',
                      { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 'auto', paddingTop: 6 } },
                      React.createElement('span', { style: { fontSize: 11, color: 'var(--text-muted)' } },
                        profilesMap[it.uploader_id]?.username || 'Mitglied'
                      ),
                      it.uploader_id === currentUser.id && React.createElement(
                        'button',
                        { className: 'btn-danger', onClick: () => handleDeleteItem(it) },
                        'Löschen'
                      )
                    )
                  );
                })
          )
        ),

        React.createElement(
          'div',
          { style: { display: 'flex', flexDirection: 'column', gap: 14, minHeight: 0 } },
          React.createElement(
            'div',
            { className: 'glass-card', style: { padding: 18 } },
            React.createElement('h3', { style: { fontSize: 15, fontWeight: 700, marginBottom: 10 } }, 'Neuen Ordner erstellen'),
            React.createElement(
              'form',
              { onSubmit: handleCreateFolder, style: { display: 'flex', gap: 8 } },
              React.createElement('input', {
                className: 'input-field',
                placeholder: 'Ordnername (z. B. Blueprints / Screenshots)',
                value: newFolderName,
                onChange: (e) => setNewFolderName(e.target.value)
              }),
              React.createElement('button', { type: 'submit', className: 'btn-secondary' }, '+ Ordner')
            )
          ),

          React.createElement(
            'div',
            { className: 'glass-card', style: { padding: 18, flex: 1, display: 'flex', flexDirection: 'column' } },
            React.createElement('h3', { style: { fontSize: 15, fontWeight: 700, marginBottom: 10 } }, 'Reinen Text-Eintrag / Notiz anlegen'),
            React.createElement(
              'form',
              { onSubmit: handleCreateTextNote, style: { display: 'flex', flexDirection: 'column', gap: 10, flex: 1 } },
              React.createElement('input', {
                className: 'input-field',
                placeholder: 'Notiz-Titel',
                value: noteTitle,
                onChange: (e) => setNoteTitle(e.target.value),
                required: true
              }),
              React.createElement('textarea', {
                className: 'textarea-field',
                style: { flex: 1 },
                placeholder: 'Text, Koordinaten, Code-Notizen oder Briefing schreiben...',
                value: noteText,
                onChange: (e) => setNoteText(e.target.value),
                required: true
              }),
              React.createElement('button', { type: 'submit', className: 'btn-primary' }, 'Notiz speichern')
            )
          )
        ),

        lightboxImg && React.createElement(
          'div',
          { className: 'modal-backdrop', onClick: () => setLightboxImg(null) },
          React.createElement(
            'div',
            { className: 'glass-card', style: { maxWidth: '86vw', maxHeight: '88vh', padding: 16, textAlign: 'center' }, onClick: (e) => e.stopPropagation() },
            React.createElement('img', {
              src: lightboxImg.media_url,
              alt: lightboxImg.title,
              style: { maxWidth: '80vw', maxHeight: '72vh', borderRadius: 'var(--radius-box)', objectFit: 'contain' }
            }),
            React.createElement(
              'div',
              { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 10 } },
              React.createElement('span', { style: { fontWeight: 700, fontSize: 13.5 } }, lightboxImg.title),
              React.createElement('button', { className: 'btn-secondary', onClick: () => setLightboxImg(null) }, 'Schließen')
            )
          )
        )
      );
    }

    // =========================================================================
    // 13. MODUL 4: PINNWAND
    // =========================================================================
    const REACTION_EMOJIS = ['🔥', '👍', '⚡', '🎯'];

    function PinboardModule({ currentUser, profilesMap, onToast }) {
      const [posts, setPosts] = useState([]);
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');
      const [category, setCategory] = useState('Allgemein');
      const [status, setStatus] = useState('Aktiv');
      const [coordinates, setCoordinates] = useState('');
      const [editingPostId, setEditingPostId] = useState(null);
      const [openThreadId, setOpenThreadId] = useState(null);
      const [replies, setReplies] = useState([]);
      const [replyText, setReplyText] = useState('');

      const loadPosts = async () => {
        const { data, error } = await supabase
          .from('pinboard_posts')
          .select('*')
          .order('pinned', { ascending: false })
          .order('created_at', { ascending: false });
        if (!error) setPosts(data || []);
      };

      const loadReplies = async (postId) => {
        const { data } = await supabase
          .from('pinboard_replies')
          .select('*')
          .eq('post_id', postId)
          .order('created_at', { ascending: true });
        setReplies(data || []);
      };

      useEffect(() => {
        loadPosts();
        const ch = supabase
          .channel('quaps-pinboard-rt')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pinboard_posts' }, (p) => {
            loadPosts();
            if (p.new?.author_id !== currentUser.id) {
              soundEngine.play('pinboard_post');
              onToast('Neuer Pinnwand-Beitrag!');
            }
          })
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pinboard_posts' }, () => loadPosts())
          .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'pinboard_posts' }, () => loadPosts())
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pinboard_replies' }, (p) => {
            if (p.new?.post_id === openThreadId) loadReplies(openThreadId);
            if (p.new?.author_id !== currentUser.id) {
              soundEngine.play('pinboard_reply');
            }
          })
          .subscribe();
        return () => supabase.removeChannel(ch);
      }, [openThreadId]);

      useEffect(() => {
        if (openThreadId) loadReplies(openThreadId);
      }, [openThreadId]);

      const startEditPost = (post) => {
        setEditingPostId(post.id);
        setTitle(post.title || '');
        setContent(post.content || '');
        setCategory(post.category || 'Allgemein');
        setStatus(post.status || 'Aktiv');
        setCoordinates(post.coordinates || '');
      };

    // =========================================================================
    // 15. MODUL 6: AUDIO, VIDEO, 3 SOUNDPACKS & DESIGN-CUSTOMIZER
    // =========================================================================
    function SettingsStudioModule({ design, onChangeDesign, onToast }) {
      const [subTab, setSubTab] = useState('design');
      const [soundSettings, setSoundSettings] = useState(() => soundEngine.load());

      const [mediaPrefs, setMediaPrefs] = useState(() => getSavedMediaPrefs());
      const [audioInputs, setAudioInputs] = useState([]);
      const [videoInputs, setVideoInputs] = useState([]);
      const [audioOutputs, setAudioOutputs] = useState([]);

      const [micTesting, setMicTesting] = useState(false);
      const [micLevel, setMicLevel] = useState(0);
      const [echoRecording, setEchoRecording] = useState(false);
      const micStreamRef = useRef(null);
      const micRafRef = useRef(null);
      const micAudioCtxRef = useRef(null);

      const [camTesting, setCamTesting] = useState(false);
      const camVideoRef = useRef(null);
      const camStreamRef = useRef(null);

      useEffect(() => {
        const unsub = soundEngine.subscribe((next) => setSoundSettings(next));
        refreshDevices();
        return () => {
          unsub();
          stopMicTest();
          stopCamTest();
        };
      }, []);

      const refreshDevices = async () => {
        try {
          if (!navigator.mediaDevices?.enumerateDevices) return;
          const devs = await navigator.mediaDevices.enumerateDevices();
          setAudioInputs(devs.filter((d) => d.kind === 'audioinput'));
          setVideoInputs(devs.filter((d) => d.kind === 'videoinput'));
          setAudioOutputs(devs.filter((d) => d.kind === 'audiooutput'));
        } catch {}
      };

      const updatePref = (patch) => {
        const next = { ...mediaPrefs, ...patch };
        setMediaPrefs(next);
        saveMediaPrefs(next);
      };

      const stopMicTest = () => {
        cancelAnimationFrame(micRafRef.current);
        if (micStreamRef.current) {
          micStreamRef.current.getTracks().forEach((t) => t.stop());
          micStreamRef.current = null;
        }
        if (micAudioCtxRef.current) {
          micAudioCtxRef.current.close().catch(() => {});
          micAudioCtxRef.current = null;
        }
        setMicTesting(false);
        setMicLevel(0);
      };

      const startMicTest = async () => {
        stopMicTest();
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              deviceId: mediaPrefs.audioInputId ? { exact: mediaPrefs.audioInputId } : undefined,
              echoCancellation: mediaPrefs.echoCancellation !== false,
              noiseSuppression: mediaPrefs.noiseSuppression !== false
            }
          });
          micStreamRef.current = stream;
          await refreshDevices();

          const AC = window.AudioContext || window.webkitAudioContext;
          const ctx = new AC();
          micAudioCtxRef.current = ctx;
          const src = ctx.createMediaStreamSource(stream);
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 256;
          src.connect(analyser);

          const dataArr = new Uint8Array(analyser.frequencyBinCount);
          setMicTesting(true);

          const tick = () => {
            analyser.getByteFrequencyData(dataArr);
            let sum = 0;
            for (let i = 0; i < dataArr.length; i++) sum += dataArr[i];
            const avg = sum / dataArr.length;
            setMicLevel(Math.min(100, Math.round((avg / 128) * 100)));
            micRafRef.current = requestAnimationFrame(tick);
          };
          tick();
        } catch (err) {
          soundEngine.play('error_alert');
          onToast('Mikrofon konnte nicht gestartet werden: ' + err.message);
        }
      };

      const runEchoCheck = async () => {
        if (echoRecording) return;
        setEchoRecording(true);
        onToast('🎙️ Sprich jetzt 4 Sekunden in dein Mikrofon...');
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              deviceId: mediaPrefs.audioInputId ? { exact: mediaPrefs.audioInputId } : undefined,
              echoCancellation: mediaPrefs.echoCancellation !== false,
              noiseSuppression: mediaPrefs.noiseSuppression !== false
            }
          });
          const recorder = new MediaRecorder(stream);
          const chunks = [];
          recorder.ondataavailable = (e) => {
            if (e.data.size > 0) chunks.push(e.data);
          };
          recorder.onstop = () => {
            stream.getTracks().forEach((t) => t.stop());
            const blob = new Blob(chunks, { type: 'audio/webm' });
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            if (mediaPrefs.audioOutputId && typeof audio.setSinkId === 'function') {
              audio.setSinkId(mediaPrefs.audioOutputId).catch(() => {});
            }
            audio.onended = () => URL.revokeObjectURL(url);
            audio.play().catch(() => {});
            setEchoRecording(false);
            onToast('🔊 Spiele deine Testaufnahme ab!');
          };
          recorder.start();
          setTimeout(() => {
            if (recorder.state !== 'inactive') recorder.stop();
          }, 4000);
        } catch (err) {
          setEchoRecording(false);
          onToast('Echo-Test fehlgeschlagen: ' + err.message);
        }
      };

      const stopCamTest = () => {
        if (camStreamRef.current) {
          camStreamRef.current.getTracks().forEach((t) => t.stop());
          camStreamRef.current = null;
        }
        if (camVideoRef.current) {
          camVideoRef.current.srcObject = null;
        }
        setCamTesting(false);
      };

      const startCamTest = async () => {
        stopCamTest();
        try {
