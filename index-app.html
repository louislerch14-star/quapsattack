  <style>
    :root {
      --bg-base: #0a0a12;
      --glass-bg: rgba(20, 20, 35, 0.85);
      --glass-border: rgba(255, 255, 255, 0.2);
      --box-bg: rgba(255, 255, 255, 0.05);
      --box-border: rgba(255, 255, 255, 0.1);
      --accent-red: #ef4444;
      --accent-red-glow: rgba(239, 68, 68, 0.4);
      --gold-start: #f5c518;
      --gold-end: #ff9900;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.7);
      --status-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      background-color: #0a0a12;
      background-image:
        radial-gradient(circle at 14% 18%, rgba(239, 68, 68, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 86% 82%, rgba(59, 130, 246, 0.15) 0%, transparent 48%);
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
    }

    .nested-box {
      background: var(--box-bg);
      border: 1px solid var(--box-border);
      border-radius: 14px;
      transition: all 0.2s ease;
    }

    .nested-box:hover {
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.075);
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, var(--gold-start), var(--gold-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn-primary {
      background: var(--accent-red);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px;
      padding: 9px 15px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 4px 18px var(--accent-red-glow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-primary:hover:not(:disabled) {
      background: #dc2626;
      box-shadow: 0 6px 24px rgba(239, 68, 68, 0.55);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 8px 13px;
      font-weight: 500;
      font-size: 12.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.24);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.28);
    }

    .input-field, .select-field, .textarea-field {
      width: 100%;
      background: rgba(10, 10, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 13px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-field:focus, .select-field:focus, .textarea-field:focus {
      border-color: var(--accent-red);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
    }

    .select-field option {
      background: #141423;
      color: #ffffff;
    }

    .textarea-field {
      resize: vertical;
      min-height: 76px;
    }

    .custom-scroll {
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);

    .main-layout {
      flex: 1;

    .sidebar {
      width: 272px;

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 13px;
      border-radius: 13px;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(255, 255, 255, 0.72);
      font-weight: 500;
      font-size: 13.5px;

      transition: all 0.2s ease;

    .nav-btn:hover {

    .nav-btn.active {

    .badge-red {

      font-weight: 700;

      border-radius: 999px;

    .badge-gold {
      background: rgba(245, 197, 24, 0.16);
      color: #f5c518;
      border: 1px solid rgba(245, 197, 24, 0.35);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;

    }

    .badge-green {

      border: 1px solid rgba(16, 185, 129, 0.35);
      font-size: 10.5px;

    .content-area {
      flex: 1;
      min-width: 0;

      flex-direction: column;
      gap: 14px;
    }

    .modal-backdrop {

      background: rgba(5, 5, 10, 0.78);
      backdrop-filter: blur(8px);

      justify-content: center;

    .toast-banner {

      right: 20px;
      z-index: 150;

      border-radius: 14px;
      background: rgba(20, 20, 35, 0.95);

      max-width: 360px;

    .grid-2 {

    .pill-tab {
      padding: 6px 12px;

      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);

    // =========================================================================
    // 2. CUSTOM SOUND MANAGER (Web Audio API + Austauschbare Custom Audio Files)

    const SOUND_EVENTS = [
      { key: 'chat_message', label: 'Eingehende Chat-Nachricht', desc: 'Ton bei neuen DMs & Gruppennachrichten' },
      { key: 'chat_mention', label: 'Mention / Direkter Ping', desc: 'Signalton bei Erwähnung deines Usernames' },

      { key: 'upload_success', label: 'Upload & Aktion erfolgreich', desc: 'Bestätigung bei Uploads & Speichern' },

    ];

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.settings = this.load();
        this.listeners = new Set();
      }

      load() {
        try {
          const raw = localStorage.getItem('quaps_sound_v1');
          if (raw) {
            const p = JSON.parse(raw);
            return {
              volume: typeof p.volume === 'number' ? p.volume : 0.75,
              dnd: Boolean(p.dnd),
              customFiles: p.customFiles || {}
            };
          }
        } catch {}
        return { volume: 0.75, dnd: false, customFiles: {} };
      }

      save() {
        try {
          localStorage.setItem('quaps_sound_v1', JSON.stringify(this.settings));
        } catch {}
        this.listeners.forEach((fn) => fn({ ...this.settings }));
      }

      subscribe(fn) {
        this.listeners.add(fn);
        return () => this.listeners.delete(fn);
      }

      setVolume(val) {
        this.settings.volume = Math.max(0, Math.min(1, val));
        this.save();
      }

      setDnd(val) {
        this.settings.dnd = Boolean(val);
        this.save();
      }

      setCustomSound(key, fileObj) {
        if (fileObj) {
          this.settings.customFiles[key] = fileObj;
        } else {
          delete this.settings.customFiles[key];
        }
        this.save();
      }

      getCtx() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      }

      async play(key, preview = false) {
        if (this.settings.dnd && !preview) return;
        if (this.settings.volume <= 0.01 && !preview) return;
        const vol = preview ? Math.max(0.45, this.settings.volume) : this.settings.volume;

        const custom = this.settings.customFiles[key];
        if (custom?.dataUrl) {
          try {
            const audio = new Audio(custom.dataUrl);
            audio.volume = vol;
            await audio.play();
            return;
          } catch {}
        }

        try {
          const ctx = this.getCtx();
          const now = ctx.currentTime;
          const tone = (freq, delay, dur, type = 'sine', amp = 0.22) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now + delay);
            gain.gain.setValueAtTime(0.0001, now + delay);
            gain.gain.exponentialRampToValueAtTime(Math.max(0.001, vol * amp), now + delay + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + delay);
            osc.stop(now + delay + dur + 0.02);
          };

          switch (key) {
            case 'chat_message':
              tone(640, 0, 0.11, 'triangle', 0.22);
              tone(880, 0.07, 0.15, 'sine', 0.2);
              break;
            case 'chat_mention':
              tone(784, 0, 0.1, 'triangle', 0.28);
              tone(1046.5, 0.09, 0.12, 'triangle', 0.28);
              tone(1318.5, 0.18, 0.22, 'sine', 0.25);
              break;
            case 'call_incoming':
              tone(523.25, 0, 0.15, 'sine', 0.3);
              tone(659.25, 0.15, 0.15, 'sine', 0.3);
              tone(783.99, 0.3, 0.22, 'triangle', 0.3);
              tone(1046.5, 0.52, 0.28, 'sine', 0.28);
              break;
            case 'call_connected':
              tone(440, 0, 0.12, 'sine', 0.25);
              tone(659.25, 0.1, 0.22, 'triangle', 0.26);
              break;
            case 'call_ended':
              tone(587.33, 0, 0.14, 'sine', 0.24);
              tone(392.0, 0.13, 0.24, 'sine', 0.22);
              break;
            case 'pinboard_post':
              tone(523.25, 0, 0.1, 'triangle', 0.22);
              tone(698.46, 0.09, 0.18, 'sine', 0.22);
              break;
            case 'pinboard_reply':
              tone(659.25, 0, 0.09, 'sine', 0.2);
              tone(880, 0.08, 0.15, 'triangle', 0.2);
              break;
            case 'calendar_event':
              tone(880, 0, 0.11, 'sine', 0.24);
              tone(1174.66, 0.12, 0.18, 'triangle', 0.24);
              break;
            case 'upload_success':
              tone(523.25, 0, 0.09, 'sine', 0.22);
              tone(783.99, 0.08, 0.18, 'triangle', 0.24);
              break;
            case 'error_alert':
              tone(196, 0, 0.18, 'sawtooth', 0.18);
              tone(146.83, 0.15, 0.24, 'sawtooth', 0.18);
              break;
          }
        } catch {}
      }
    }

    const soundEngine = new SoundEngine();

    function notifyDesktop(title, body) {
      if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
        try {
          new Notification(title, { body, silent: true });
        } catch {}
      }
    }

    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    }

    function formatDateTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
        ' · ' +
        d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    }

    // =========================================================================
    // 3. GEMINI API ANBINDUNG (QuapsSI) + SPEICHERUNG IN qupas_si_messages
    // =========================================================================
    const QUAPSSI_PERSONALITY = `
Du bist QuapsSI — die taktische Kommando- und Community-KI von QuapsAttack.
Deine Persönlichkeit:
- Direkt, souverän, locker auf Augenhöhe wie ein erfahrener Squad-Leader und Strategist.
- Du hilfst bei Team-Koordination, Events, Projektplanung, Technik, Mods/Servern und Community-Management.
- Keine generischen KI-Floskeln wie "Als KI-Sprachmodell...". Antworte klar, strukturiert und praxisnah.
`;

    async function runQuapsSI(promptText, historyRows, userId, customKey) {
      const apiKey =
        (customKey || '').trim() ||
        (localStorage.getItem('quaps_gemini_key') || '').trim() ||
        (window.GEMINI_API_KEY || '').trim();

      if (!apiKey) {
        throw new Error(
          'Kein GEMINI_API_KEY hinterlegt. Gib deinen Gemini API Key oben im QuapsSI-Key-Feld ein.'
        );
      }

      const contents = [];
      for (const row of (historyRows || []).slice(-6)) {
        contents.push({ role: 'user', parts: [{ text: row.prompt }] });
        contents.push({ role: 'model', parts: [{ text: row.response }] });
      }
      contents.push({ role: 'user', parts: [{ text: promptText }] });

      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: QUAPSSI_PERSONALITY }] },
            contents,
            generationConfig: { temperature: 0.75, maxOutputTokens: 2048 }
          })
        }
      );

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Gemini API Fehler (${res.status}): ${txt}`);
      }

      const json = await res.json();
      const reply = json?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!reply) throw new Error('Leere Antwort von QuapsSI erhalten.');

      const { data, error } = await supabase
        .from('qupas_si_messages')
        .insert({
          user_id: userId,
          prompt: promptText,
          response: reply
        })
        .select('*')
        .single();

      if (error) {
        console.warn('Speichern in qupas_si_messages fehlgeschlagen:', error.message);
        return {
          id: 'local-' + Date.now(),
          user_id: userId,
          prompt: promptText,
          response: reply,
          created_at: new Date().toISOString()
        };
      }
      return data;
    }

    // =========================================================================
    // 4. AUTH SCREEN
    // =========================================================================
    function AuthView({ onToast }) {
      const [mode, setMode] = useState('login');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState('');

      const handleAuth = async (e) => {
        e.preventDefault();
        setErr('');
        setLoading(true);
        try {
          if (mode === 'login') {
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            soundEngine.play('upload_success');
            onToast('Willkommen zurück bei QuapsAttack!');
          } else {
            if (!username.trim()) throw new Error('Bitte einen Benutzernamen eingeben.');
            const { data, error } = await supabase.auth.signUp({
              email,
              password,
              options: { data: { username: username.trim() } }
            });
            if (error) throw error;
            if (data.user) {
              await supabase.from('profiles').upsert({
                id: data.user.id,
                username: username.trim(),
                role: 'Member',
                custom_status: 'online',
                custom_status_text: 'Neu im Squad'
              });
            }
            soundEngine.play('upload_success');
            onToast('Account erstellt! Falls E-Mail-Bestätigung aktiv ist, kurz Postfach prüfen.');
          }
        } catch (error) {
          soundEngine.play('error_alert');
          setErr(error.message || 'Login/Registrierung fehlgeschlagen.');
        } finally {
          setLoading(false);
        }
      };

      return React.createElement(
        'div',
        {
          style: {
            flex: 1,
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: 24
          }
        },
        React.createElement(
          'div',
          { className: 'glass-card', style: { width: '100%', maxWidth: 420, padding: 30 } },
          React.createElement(
            'div',
            { style: { display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 } },
            React.createElement('div', { className: 'brand-emblem', style: { width: 42, height: 42, fontSize: 18 } }, 'Q'),
            React.createElement(
              'div',
              null,
              React.createElement('h1', { style: { fontSize: 22, fontWeight: 800 } },
                'QUAPS',

    // =========================================================================
    // 6. WEBRTC CALL OVERLAY (Audio & Video über Supabase Realtime Signaling)
    // =========================================================================
    function CallOverlay({ callState, setCallState, currentUser, currentProfile, signalChannel, onToast }) {
      const [muted, setMuted] = useState(false);
      const [camOff, setCamOff] = useState(!callState?.isVideo);
      const [elapsed, setElapsed] = useState(0);

      const localVideoRef = useRef(null);
      const remoteVideoRef = useRef(null);
      const remoteAudioRef = useRef(null);
      const pcRef = useRef(null);
      const localStreamRef = useRef(null);

      // Anrufdauer zählen sobald verbunden
      useEffect(() => {
        if (!callState || callState.status !== 'connected') {
          setElapsed(0);
          return;
        }
        const timer = setInterval(() => setElapsed((s) => s + 1), 1000);
        return () => clearInterval(timer);
      }, [callState?.status]);

      const cleanupMedia = () => {
        if (localStreamRef.current) {
          localStreamRef.current.getTracks().forEach((t) => t.stop());
          localStreamRef.current = null;
        }
        if (pcRef.current) {
          pcRef.current.close();
          pcRef.current = null;
        }
      };

      const startPeerConnection = async (isInitiator, targetUserId, isVideo) => {
        cleanupMedia();
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: isVideo ? { width: 1280, height: 720 } : false
        });
        localStreamRef.current = stream;
        if (localVideoRef.current && isVideo) {
          localVideoRef.current.srcObject = stream;
        }

        const pc = new RTCPeerConnection({
          iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });
        pcRef.current = pc;

        stream.getTracks().forEach((track) => pc.addTrack(track, stream));

        pc.ontrack = (event) => {
          const remoteStream = event.streams[0];
          if (remoteVideoRef.current) {
            remoteVideoRef.current.srcObject = remoteStream;
          }
          if (remoteAudioRef.current) {
            remoteAudioRef.current.srcObject = remoteStream;
          }
        };

        pc.onicecandidate = (event) => {
          if (event.candidate && signalChannel) {
            signalChannel.send({
              type: 'broadcast',
              event: 'call-signal',
              payload: {
                type: 'webrtc-ice',
                roomId: callState.roomId,
                fromUserId: currentUser.id,
                targetUserId,
                candidate: event.candidate.toJSON()
              }
            });
          }
        };

        if (isInitiator) {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          signalChannel?.send({
            type: 'broadcast',
            event: 'call-signal',
            payload: {
              type: 'webrtc-offer',
              roomId: callState.roomId,
              fromUserId: currentUser.id,
              targetUserId,
              sdp: offer
            }
          });
        }
      };

      // Externe WebRTC-Signale verarbeiten
      useEffect(() => {
        if (!callState) return;
        const handler = async (e) => {
          const sig = e.detail;
          if (!sig || sig.roomId !== callState.roomId) return;
          if (sig.targetUserId && sig.targetUserId !== currentUser.id) return;

          if (sig.type === 'call-accept' && callState.status === 'outgoing') {
            soundEngine.play('call_connected');
            setCallState((prev) => (prev ? { ...prev, status: 'connected' } : null));
            await startPeerConnection(true, sig.fromUserId, callState.isVideo);
          } else if (sig.type === 'call-reject' || sig.type === 'call-end') {
            soundEngine.play('call_ended');
            cleanupMedia();
            setCallState(null);
            onToast('Anruf wurde beendet.');
          } else if (sig.type === 'webrtc-offer' && pcRef.current) {
            await pcRef.current.setRemoteDescription(new RTCSessionDescription(sig.sdp));
            const answer = await pcRef.current.createAnswer();
            await pcRef.current.setLocalDescription(answer);
            signalChannel?.send({
              type: 'broadcast',
              event: 'call-signal',
              payload: {
                type: 'webrtc-answer',
                roomId: callState.roomId,
                fromUserId: currentUser.id,
                targetUserId: sig.fromUserId,
                sdp: answer
              }
            });
          } else if (sig.type === 'webrtc-answer' && pcRef.current) {
            await pcRef.current.setRemoteDescription(new RTCSessionDescription(sig.sdp));
          } else if (sig.type === 'webrtc-ice' && pcRef.current && sig.candidate) {
            try {
              await pcRef.current.addIceCandidate(new RTCIceCandidate(sig.candidate));
            } catch {}
          }
        };

        window.addEventListener('quaps-call-signal', handler);
        return () => window.removeEventListener('quaps-call-signal', handler);
      }, [callState, currentUser?.id]);

      if (!callState) return null;

      const handleAccept = async () => {
        soundEngine.play('call_connected');
        setCallState((prev) => ({ ...prev, status: 'connected' }));
        signalChannel?.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: {
            type: 'call-accept',
            roomId: callState.roomId,
            fromUserId: currentUser.id,
            targetUserId: callState.peerUserId
          }
        });
        try {
          await startPeerConnection(false, callState.peerUserId, callState.isVideo);
        } catch (err) {
          onToast('Mikrofon/Kamera-Zugriff fehlgeschlagen: ' + err.message);
        }
      };

      const handleRejectOrHangup = () => {
        soundEngine.play('call_ended');
        signalChannel?.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: {
            type: callState.status === 'incoming' ? 'call-reject' : 'call-end',
            roomId: callState.roomId,
            fromUserId: currentUser.id,
            targetUserId: callState.peerUserId
          }
        });
        cleanupMedia();
        setCallState(null);
      };

      const toggleMute = () => {
        if (!localStreamRef.current) return;
        const next = !muted;
        localStreamRef.current.getAudioTracks().forEach((t) => (t.enabled = !next));
        setMuted(next);
      };

      const toggleCam = () => {
        if (!localStreamRef.current) return;
        const next = !camOff;
        localStreamRef.current.getVideoTracks().forEach((t) => (t.enabled = !next));
        setCamOff(next);
      };

      const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');

      return React.createElement(
        'div',
        { className: 'modal-backdrop', style: { zIndex: 120 } },
        React.createElement(
          'div',
          { className: 'glass-card', style: { width: '100%', maxWidth: 560, padding: 26, textAlign: 'center' } },
          React.createElement('div', { className: 'badge-red', style: { display: 'inline-block', marginBottom: 12 } },
            callState.isGroup ? 'GRUPPEN-CALL' : 'DIREKT-CALL',
            callState.isVideo ? ' · VIDEO' : ' · VOICE'
          ),
          React.createElement('h2', { style: { fontSize: 22, fontWeight: 800, marginBottom: 6 } },
            callState.roomName || callState.peerName || 'QuapsAttack Call'
          ),
          React.createElement('div', { style: { fontSize: 13.5, color: 'var(--text-muted)', marginBottom: 18 } },
            callState.status === 'incoming' && `${callState.peerName} ruft an...`,
            callState.status === 'outgoing' && `Rufe ${callState.peerName} an...`,
            callState.status === 'connected' && `Verbunden · ${mins}:${secs}`
          ),
          React.createElement('audio', { ref: remoteAudioRef, autoPlay: true }),
          callState.isVideo && React.createElement(
            'div',
            { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 18 } },
            React.createElement('video', {
              ref: remoteVideoRef,
              autoPlay: true,
              playsInline: true,
              style: { width: '100%', height: 180, borderRadius: 14, background: '#07070d', objectFit: 'cover', border: '1px solid rgba(255,255,255,0.14)' }
            }),
            React.createElement('video', {
              ref: localVideoRef,
              autoPlay: true,
              playsInline: true,
              muted: true,
              style: { width: '100%', height: 180, borderRadius: 14, background: '#07070d', objectFit: 'cover', border: '1px solid rgba(255,255,255,0.14)' }
            })
          ),
          React.createElement(
            'div',
            { style: { display: 'flex', justifyContent: 'center', gap: 12, flexWrap: 'wrap' } },
            callState.status === 'incoming' && React.createElement(
              'button',
              {
                className: 'btn-primary',
                style: { background: '#10b981', boxShadow: '0 4px 18px rgba(16,185,129,0.4)' },
                onClick: handleAccept
              },
              '✓ Annehmen'
            ),
            callState.status === 'connected' && React.createElement(
              'button',
              { className: 'btn-secondary', onClick: toggleMute },
              muted ? '🔇 Stumm' : '🎤 Mikro an'
            ),
            callState.status === 'connected' && callState.isVideo && React.createElement(
              'button',
              { className: 'btn-secondary', onClick: toggleCam },
              camOff ? '📷 Cam aus' : '📹 Cam an'
            ),
            React.createElement('button', { className: 'btn-primary', onClick: handleRejectOrHangup },
              callState.status === 'incoming' ? '✕ Ablehnen' : '📞 Auflegen'
            )
          )
        )
      );
    }

    // =========================================================================
    // 7. MODUL 1: DIRECT MESSAGES & GRUPPEN-CHATS + ANRUFE
    // =========================================================================
    function ChatModule({ currentUser, currentProfile, profilesMap, signalChannel, setCallState, onUnreadChange, onToast }) {
      const [rooms, setRooms] = useState([]);
      const [activeRoomId, setActiveRoomId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [msgInput, setMsgInput] = useState('');
      const [loadingRooms, setLoadingRooms] = useState(true);
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [isGroupMode, setIsGroupMode] = useState(false);
      const [groupName, setGroupName] = useState('');
      const [selectedMemberIds, setSelectedMemberIds] = useState([]);
      const [unreadByRoom, setUnreadByRoom] = useState({});
      const bottomRef = useRef(null);

      const allProfilesList = useMemo(
        () => Object.values(profilesMap).filter((p) => p.id !== currentUser.id),
        [profilesMap, currentUser.id]
      );

      const loadRooms = async () => {
        setLoadingRooms(true);
        try {
          const { data: memberRows, error: mErr } = await supabase
            .from('chat_room_members')
            .select('room_id')
            .eq('user_id', currentUser.id);
          if (mErr) throw mErr;

          const roomIds = (memberRows || []).map((r) => r.room_id);
          if (!roomIds.length) {
            setRooms([]);
            setLoadingRooms(false);
            return;
          }

          const { data: roomRows, error: rErr } = await supabase
            .from('chat_rooms')
            .select('*')
            .in('id', roomIds)
            .order('created_at', { ascending: false });
          if (rErr) throw rErr;

          const { data: allMembers } = await supabase
            .from('chat_room_members')
            .select('room_id, user_id')
            .in('room_id', roomIds);

          const enriched = (roomRows || []).map((room) => ({
            ...room,
            memberIds: (allMembers || []).filter((m) => m.room_id === room.id).map((m) => m.user_id)
          }));

          setRooms(enriched);
          if (!activeRoomId && enriched.length > 0) {
            setActiveRoomId(enriched[0].id);
          }
        } catch (err) {
          onToast('Fehler beim Laden der Chats: ' + err.message);
        } finally {
          setLoadingRooms(false);
        }
      };

      const loadMessages = async (roomId) => {
        if (!roomId) return;
        const { data, error } = await supabase
          .from('chat_messages')
          .select('*')
          .eq('room_id', roomId)
          .order('created_at', { ascending: true });
        if (!error) {
          setMessages(data || []);
        }
      };

      useEffect(() => {
        loadRooms();
      }, [currentUser.id]);

      useEffect(() => {
        if (activeRoomId) {
          loadMessages(activeRoomId);
          setUnreadByRoom((prev) => {
            const next = { ...prev, [activeRoomId]: 0 };
            const total = Object.values(next).reduce((a, b) => a + b, 0);
            onUnreadChange(total);
            return next;
          });
        }
      }, [activeRoomId]);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      // Realtime Subscription für chat_messages
      useEffect(() => {
        const channel = supabase
          .channel('quaps-chat-realtime')
          .on(
            'postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'chat_messages' },
            (payload) => {
              const newMsg = payload.new;
              if (newMsg.room_id === activeRoomId) {
                setMessages((prev) => (prev.some((m) => m.id === newMsg.id) ? prev : [...prev, newMsg]));
              }
              if (newMsg.sender_id !== currentUser.id) {
                const mentioned =
                  currentProfile?.username &&
                  newMsg.content?.toLowerCase().includes('@' + currentProfile.username.toLowerCase());
                soundEngine.play(mentioned ? 'chat_mention' : 'chat_message');
                const senderName = profilesMap[newMsg.sender_id]?.username || 'Mitglied';
                notifyDesktop(`QuapsAttack · ${senderName}`, newMsg.content);

                if (newMsg.room_id !== activeRoomId) {
                  setUnreadByRoom((prev) => {
                    const next = { ...prev, [newMsg.room_id]: (prev[newMsg.room_id] || 0) + 1 };
                    const total = Object.values(next).reduce((a, b) => a + b, 0);
                    onUnreadChange(total);
                    return next;
                  });
                }
              }
            }
          )
          .on(
            'postgres_changes',
            { event: 'DELETE', schema: 'public', table: 'chat_messages' },
            (payload) => {
              setMessages((prev) => prev.filter((m) => m.id !== payload.old.id));
            }
          )
          .subscribe();

        return () => {
          supabase.removeChannel(channel);
        };
      }, [activeRoomId, currentUser.id, currentProfile?.username, profilesMap]);

      const getRoomTitle = (room) => {
        if (room.is_group) return room.name || 'Gruppenraum';
        const otherId = (room.memberIds || []).find((id) => id !== currentUser.id);
        return profilesMap[otherId]?.username || 'Direct Message';
      };

      const handleCreateRoom = async (e) => {
        e.preventDefault();
        if (!selectedMemberIds.length) {
          onToast('Bitte mindestens ein Mitglied auswählen.');
          return;
        }
        try {
          const { data: room, error: rErr } = await supabase
            .from('chat_rooms')
            .insert({
              name: isGroupMode ? (groupName.trim() || 'Squad-Gruppe') : null,
              is_group: isGroupMode,
              creator_id: currentUser.id
            })
            .select('*')
            .single();
          if (rErr) throw rErr;

          const uniqueMembers = Array.from(new Set([currentUser.id, ...selectedMemberIds]));
          const memberInserts = uniqueMembers.map((uid) => ({
            room_id: room.id,
            user_id: uid
          }));
          const { error: mErr } = await supabase.from('chat_room_members').insert(memberInserts);
          if (mErr) throw mErr;

          soundEngine.play('upload_success');
          setShowCreateModal(false);
          setGroupName('');
          setSelectedMemberIds([]);
          await loadRooms();
          setActiveRoomId(room.id);
          onToast(isGroupMode ? 'Gruppenraum erstellt!' : 'Direct Message gestartet!');
        } catch (err) {
          soundEngine.play('error_alert');
          onToast('Fehler beim Erstellen: ' + err.message);
        }
      };

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!msgInput.trim() || !activeRoomId) return;
        const text = msgInput.trim();
        setMsgInput('');
        const { error } = await supabase.from('chat_messages').insert({
          room_id: activeRoomId,
          sender_id: currentUser.id,
          content: text
        });
        if (error) {
          soundEngine.play('error_alert');
          onToast('Senden fehlgeschlagen: ' + error.message);
        }
      };

      const handleDeleteMessage = async (msgId) => {
        const { error } = await supabase.from('chat_messages').delete().eq('id', msgId);
        if (error) {
          onToast('Löschen nicht möglich: ' + error.message);
        } else {
          setMessages((prev) => prev.filter((m) => m.id !== msgId));
        }
      };

      const activeRoom = rooms.find((r) => r.id === activeRoomId);

      const handleStartCall = (isVideo) => {
        if (!activeRoom) return;
        const peerId = (activeRoom.memberIds || []).find((id) => id !== currentUser.id);
        const peerName = profilesMap[peerId]?.username || 'Mitglied';
        soundEngine.play('call_incoming');
        signalChannel?.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: {
            type: 'call-invite',
            roomId: activeRoom.id,
            roomName: getRoomTitle(activeRoom),
            isGroup: Boolean(activeRoom.is_group),
            isVideo,
            fromUserId: currentUser.id,
            fromUsername: currentProfile?.username || 'Agent',
            targetUserId: peerId
          }
        });
        setCallState({
          status: 'outgoing',
          roomId: activeRoom.id,
          roomName: getRoomTitle(activeRoom),
          isGroup: Boolean(activeRoom.is_group),
          isVideo,
          peerUserId: peerId,
          peerName
        });
      };

      return React.createElement(
        'div',
        { style: { flex: 1, minHeight: 0, display: 'grid', gridTemplateColumns: '300px 1fr', gap: 14 } },
        // Linke Spalte: Räume & DMs
        React.createElement(
          'div',
          { className: 'glass-card', style: { padding: 14, display: 'flex', flexDirection: 'column', gap: 10, minHeight: 0 } },
          React.createElement(
            'div',
            { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
            React.createElement('h2', { style: { fontSize: 15, fontWeight: 700 } }, 'Chats & Räume'),
            React.createElement('button', {
              className: 'btn-primary',
              style: { padding: '6px 10px', fontSize: 12 },
              onClick: () => setShowCreateModal(true)
            }, '+ Neu')
          ),
          React.createElement(
            'div',
            { className: 'custom-scroll', style: { flex: 1, display: 'flex', flexDirection: 'column', gap: 6 } },
            loadingRooms
              ? React.createElement('div', { style: { fontSize: 12.5, color: 'var(--text-muted)', padding: 8 } }, 'Lade Räume...')
              : rooms.length === 0
              ? React.createElement('div', { style: { fontSize: 12.5, color: 'var(--text-muted)', padding: 8 } }, 'Noch keine Chats. Klick auf „+ Neu“!')
              : rooms.map((room) => {
                  const isSel = room.id === activeRoomId;
                  const unread = unreadByRoom[room.id] || 0;
                  return React.createElement(
                    'button',
                    {
                      key: room.id,
                      onClick: () => setActiveRoomId(room.id),
                      className: 'nested-box',
                      style: {
                        padding: '10px 12px',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'space-between',
                        cursor: 'pointer',
                        color: '#fff',
                        borderColor: isSel ? 'rgba(239,68,68,0.55)' : undefined,
                        background: isSel ? 'rgba(239,68,68,0.14)' : undefined
                      }
                    },
                    React.createElement(
                      'div',
                      { style: { textAlign: 'left', minWidth: 0 } },
                      React.createElement('div', { style: { fontWeight: 600, fontSize: 13 } },
                        (room.is_group ? '👥 ' : '💬 ') + getRoomTitle(room)
                      ),
                      React.createElement('div', { style: { fontSize: 11, color: 'var(--text-muted)' } },
                        `${(room.memberIds || []).length} Mitglieder`
                      )
                    ),
                    unread > 0 && React.createElement('span', { className: 'badge-red' }, unread)
                  );
                })
          )
        ),

        // Rechte Spalte: Nachrichten & Call-Buttons
        React.createElement(
          'div',
          { className: 'glass-card', style: { padding: 16, display: 'flex', flexDirection: 'column', minHeight: 0 } },
          !activeRoom
            ? React.createElement(
                'div',
                { style: { flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-muted)' } },
                'Wähle links einen Chat oder erstelle eine neue DM / Gruppe.'
              )
            : React.createElement(
                React.Fragment,
                null,
                // Chat Header
                React.createElement(
                  'div',
                  {
                    style: {
                      display: 'flex',
                      justifyContent: 'space-between',
                      alignItems: 'center',
                      paddingBottom: 12,
                      borderBottom: '1px solid rgba(255,255,255,0.08)'
                    }
                  },
                  React.createElement(
                    'div',
                    null,
                    React.createElement('h3', { style: { fontSize: 16, fontWeight: 700 } }, getRoomTitle(activeRoom)),
                    React.createElement('div', { style: { fontSize: 11.5, color: 'var(--text-muted)' } },
                      'Mitglieder: ' +
                        (activeRoom.memberIds || [])
                          .map((id) => profilesMap[id]?.username || 'User')
                          .join(', ')
                    )
                  ),
                  React.createElement(
                    'div',
                    { style: { display: 'flex', gap: 8 } },
                    React.createElement('button', { className: 'btn-secondary', onClick: () => handleStartCall(false) }, '📞 Voice'),
                    React.createElement('button', { className: 'btn-primary', onClick: () => handleStartCall(true) }, '📹 Video')
                  )
                ),

                // Nachrichtenliste
                React.createElement(
                  'div',
                  { className: 'custom-scroll', style: { flex: 1, padding: '14px 4px', display: 'flex', flexDirection: 'column', gap: 10 } },
                  messages.map((m) => {
                    const author = profilesMap[m.sender_id] || {};
                    const isMine = m.sender_id === currentUser.id;
                    return React.createElement(
                      'div',
                      {
                        key: m.id,
                        className: 'nested-box',
                        style: {
                          padding: '10px 13px',
                          alignSelf: isMine ? 'flex-end' : 'flex-start',
                          maxWidth: '75%',
                          borderColor: isMine ? 'rgba(239,68,68,0.35)' : undefined
                        }
                      },
                      React.createElement(
                        'div',
                        { style: { display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 } },
                        React.createElement('span', { style: { fontWeight: 700, fontSize: 12.5, color: isMine ? '#fca5a5' : '#f5c518' } },
                          author.username || 'Mitglied'
                        ),
                        author.role && React.createElement('span', { className: 'badge-gold' }, author.role),
                        React.createElement('span', { style: { fontSize: 10.5, color: 'var(--text-muted)' } }, formatTime(m.created_at)),
                        isMine && React.createElement(
                          'button',
                          {
                            onClick: () => handleDeleteMessage(m.id),
                            title: 'Nachricht löschen',
                            style: { background: 'none', border: 'none', color: 'rgba(255,255,255,0.4)', cursor: 'pointer', fontSize: 11 }
                          },
                          '🗑'
                        )
                      ),
                      React.createElement('div', { style: { fontSize: 13.5, lineHeight: 1.45, whiteSpace: 'pre-wrap' } }, m.content)
                    );
                  }),
                  React.createElement('div', { ref: bottomRef })
                ),

                // Eingabeformular
                React.createElement(
                  'form',
                  { onSubmit: handleSendMessage, style: { display: 'flex', gap: 10, paddingTop: 10, borderTop: '1px solid rgba(255,255,255,0.08)' } },
                  React.createElement('input', {
                    className: 'input-field',
                    placeholder: `Nachricht an ${getRoomTitle(activeRoom)} schreiben (@username für Mention)...`,
                    value: msgInput,
                    onChange: (e) => setMsgInput(e.target.value)
                  }),
                  React.createElement('button', { type: 'submit', className: 'btn-primary' }, 'Senden')
                )
              )
        ),

        // Modal: Neue DM oder Gruppe erstellen
        showCreateModal && React.createElement(
          'div',
          { className: 'modal-backdrop', onClick: () => setShowCreateModal(false) },
          React.createElement(
            'div',
            { className: 'glass-card', style: { width: '100%', maxWidth: 440, padding: 24 }, onClick: (e) => e.stopPropagation() },
            React.createElement('h3', { style: { fontSize: 17, fontWeight: 700, marginBottom: 14 } }, 'Neuen Chat / Gruppe starten'),
            React.createElement(
              'form',
              { onSubmit: handleCreateRoom, style: { display: 'flex', flexDirection: 'column', gap: 12 } },
              React.createElement(
                'label',
                { style: { display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, cursor: 'pointer' } },
                React.createElement('input', {
                  type: 'checkbox',
                  checked: isGroupMode,
                  onChange: (e) => setIsGroupMode(e.target.checked)
                }),
                'Als Gruppenraum anlegen'
              ),
              isGroupMode && React.createElement('input', {
                className: 'input-field',
                placeholder: 'Gruppenname (z. B. Squad Alpha)',
                value: groupName,
                onChange: (e) => setGroupName(e.target.value)
              }),
              React.createElement('div', { style: { fontSize: 12, color: 'var(--text-muted)' } }, 'Mitglieder auswählen:'),
              React.createElement(
                'div',
                { className: 'custom-scroll', style: { maxHeight: 190, display: 'flex', flexDirection: 'column', gap: 6 } },
                allProfilesList.map((p) => {
                  const checked = selectedMemberIds.includes(p.id);
                  return React.createElement(
                    'label',
                    {
                      key: p.id,
                      className: 'nested-box',
                      style: { padding: '8px 11px', display: 'flex', alignItems: 'center', gap: 9, cursor: 'pointer', fontSize: 13 }
                    },
                    React.createElement('input', {
                      type: isGroupMode ? 'checkbox' : 'radio',
                      name: 'dmPeer',
                      checked,
                      onChange: () => {
                        if (isGroupMode) {
                          setSelectedMemberIds((prev) =>
                            prev.includes(p.id) ? prev.filter((id) => id !== p.id) : [...prev, p.id]
                          );
                        } else {
                          setSelectedMemberIds([p.id]);
                        }
                      }
                    }),
                    React.createElement('span', { style: { fontWeight: 600 } }, p.username),
                    p.role && React.createElement('span', { className: 'badge-gold' }, p.role)
                  );
                })
              ),
              React.createElement(
                'div',
                { style: { display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 8 } },
                React.createElement('button', { type: 'button', className: 'btn-secondary', onClick: () => setShowCreateModal(false) }, 'Abbrechen'),

    }

    // =========================================================================
    // 8. MODUL 2: KALENDER (Monat / Woche / Liste + Tagesdetail + CRUD)
    // =========================================================================
    function CalendarModule({ currentUser, profilesMap, onToast }) {
      const [events, setEvents] = useState([]);
      const [viewMode, setViewMode] = useState('month'); // month | week | list
      const [cursorDate, setCursorDate] = useState(() => new Date());
      const [selectedDayStr, setSelectedDayStr] = useState(() => new Date().toISOString().slice(0, 10));
      const [title, setTitle] = useState('');
      const [description, setDescription] = useState('');
      const [eventDate, setEventDate] = useState(() => new Date().toISOString().slice(0, 10));
      const [loading, setLoading] = useState(true);

      const loadEvents = async () => {
        setLoading(true);
        const { data, error } = await supabase
          .from('calendar_events')
          .select('*')
          .order('event_date', { ascending: true });
        if (!error) setEvents(data || []);
        setLoading(false);
      };

      useEffect(() => {
        loadEvents();
        const ch = supabase
          .channel('quaps-calendar-rt')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'calendar_events' }, (payload) => {
            loadEvents();
            if (payload.eventType === 'INSERT' && payload.new?.creator_id !== currentUser.id) {
              soundEngine.play('calendar_event');
              onToast('Neuer Kalender-Termin: ' + (payload.new?.title || 'Event'));
            }
          })
          .subscribe();
        return () => supabase.removeChannel(ch);
      }, []);

      const normalizeDay = (ev) => {
        if (ev.event_day) return String(ev.event_day).slice(0, 10);
        return String(ev.event_date || '').slice(0, 10);
      };

      const handleCreateEvent = async (e) => {
        e.preventDefault();
        if (!title.trim()) return;
        const { error } = await supabase.from('calendar_events').insert({
          title: title.trim(),
          description: description.trim() || null,
          event_date: eventDate,
          event_day: eventDate,
          creator_id: currentUser.id
        });
        if (error) {
          soundEngine.play('error_alert');
          onToast('Termin konnte nicht erstellt werden: ' + error.message);
        } else {
          soundEngine.play('calendar_event');
          setTitle('');
          setDescription('');
          setSelectedDayStr(eventDate);
          onToast('Termin gespeichert!');
          loadEvents();
        }
      };

      const handleDeleteEvent = async (id) => {
        const { error } = await supabase.from('calendar_events').delete().eq('id', id);
        if (!error) {
          setEvents((prev) => prev.filter((ev) => ev.id !== id));
          onToast('Termin gelöscht.');
        }
      };

      const dayEvents = events.filter((ev) => normalizeDay(ev) === selectedDayStr);

      // Monatsraster berechnen
      const year = cursorDate.getFullYear();
      const month = cursorDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const startOffset = (firstDay.getDay() + 6) % 7; // Montag = 0
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const monthCells = [];
      for (let i = 0; i < startOffset; i++) monthCells.push(null);
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        monthCells.push({ day: d, iso });
      }

      return React.createElement(
        'div',
        { style: { flex: 1, minHeight: 0, display: 'grid', gridTemplateColumns: '1.55fr 1fr', gap: 14 } },
        // Links: Kalenderansicht
        React.createElement(
          'div',
          { className: 'glass-card', style: { padding: 18, display: 'flex', flexDirection: 'column', gap: 14, minHeight: 0 } },
          React.createElement(
            'div',
            { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 } },
            React.createElement(
              'div',
              { style: { display: 'flex', alignItems: 'center', gap: 10 } },
              React.createElement('button', {
                className: 'btn-secondary',
                onClick: () => setCursorDate(new Date(year, month - 1, 1))
              }, '‹'),
              React.createElement('h2', { style: { fontSize: 17, fontWeight: 700 } },
                cursorDate.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' })
              ),
              React.createElement('button', {
                className: 'btn-secondary',
                onClick: () => setCursorDate(new Date(year, month + 1, 1))
              }, '›')
            ),
            React.createElement(
              'div',
              { style: { display: 'flex', gap: 6 } },
              ['month', 'week', 'list'].map((m) =>
                React.createElement(
                  'button',
                  {
                    key: m,
                    className: `pill-tab ${viewMode === m ? 'active' : ''}`,
                    onClick: () => setViewMode(m)
                  },
                  m === 'month' ? 'Monat' : m === 'week' ? 'Woche' : 'Liste'
                )
              )
            )
          ),

          React.createElement(
            'div',
            { className: 'custom-scroll', style: { flex: 1 } },
            viewMode === 'month' && React.createElement(
              'div',
              { style: { display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 6 } },
              ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map((wd) =>
                React.createElement(
                  'div',
                  { key: wd, style: { textAlign: 'center', fontSize: 11.5, fontWeight: 700, color: 'var(--text-muted)', paddingBottom: 4 } },
                  wd
                )
              ),
              monthCells.map((cell, idx) => {
                if (!cell) return React.createElement('div', { key: 'empty-' + idx });
                const count = events.filter((e) => normalizeDay(e) === cell.iso).length;
                const isSelected = cell.iso === selectedDayStr;
                return React.createElement(
                  'button',
                  {
                    key: cell.iso,
                    onClick: () => {
                      setSelectedDayStr(cell.iso);
                      setEventDate(cell.iso);
                    },
                    className: 'nested-box',
                    style: {
                      minHeight: 68,
                      padding: 8,
                      textAlign: 'left',
                      cursor: 'pointer',
                      color: '#fff',
                      borderColor: isSelected ? '#ef4444' : undefined,
                      background: isSelected ? 'rgba(239,68,68,0.16)' : undefined
                    }
                  },
                  React.createElement('div', { style: { fontWeight: 700, fontSize: 13 } }, cell.day),
                  count > 0 && React.createElement(
                    'div',
                    { style: { marginTop: 6, fontSize: 10.5, color: '#f5c518', fontWeight: 600 } },
                    `${count} Termin${count > 1 ? 'e' : ''}`
                  )
                );
              })
            ),

            viewMode === 'week' && React.createElement(
              'div',
              { style: { display: 'flex', flexDirection: 'column', gap: 8 } },
              Array.from({ length: 7 }).map((_, i) => {
                const base = new Date(selectedDayStr + 'T12:00:00');
                base.setDate(base.getDate() - ((base.getDay() + 6) % 7) + i);
                const iso = base.toISOString().slice(0, 10);
                const evs = events.filter((e) => normalizeDay(e) === iso);
                return React.createElement(
                  'div',
                  { key: iso, className: 'nested-box', style: { padding: 12 } },
                  React.createElement('div', { style: { fontWeight: 700, fontSize: 13, marginBottom: 4 } },
                    base.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit' })
                  ),
                  evs.length === 0
                    ? React.createElement('div', { style: { fontSize: 12, color: 'var(--text-muted)' } }, 'Keine Termine')
                    : evs.map((ev) => React.createElement('div', { key: ev.id, style: { fontSize: 12.5, color: '#f5c518' } }, '• ' + ev.title))
                );
              })
            ),

            viewMode === 'list' && React.createElement(
              'div',
              { style: { display: 'flex', flexDirection: 'column', gap: 8 } },
              loading
                ? React.createElement('div', { style: { color: 'var(--text-muted)' } }, 'Lade Termine...')
                : events.map((ev) => React.createElement(
                    'div',
                    { key: ev.id, className: 'nested-box', style: { padding: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                    React.createElement(
                      'div',
                      null,
                      React.createElement('div', { style: { fontWeight: 700, fontSize: 13.5 } }, ev.title),
                      React.createElement('div', { style: { fontSize: 12, color: 'var(--text-muted)' } },
                        normalizeDay(ev) + ' · von ' + (profilesMap[ev.creator_id]?.username || 'Mitglied')
                      )
                    ),
                    React.createElement('button', { className: 'btn-danger', onClick: () => handleDeleteEvent(ev.id) }, 'Löschen')
                  ))
            )
          )
        ),

        // Rechts: Neuer Termin & Tagesdetail
        React.createElement(
          'div',
          { style: { display: 'flex', flexDirection: 'column', gap: 14, minHeight: 0 } },
          React.createElement(
            'div',
            { className: 'glass-card', style: { padding: 18 } },
            React.createElement('h3', { style: { fontSize: 15.5, fontWeight: 700, marginBottom: 12 } }, 'Neuen Termin anlegen'),
            React.createElement(
              'form',
              { onSubmit: handleCreateEvent, style: { display: 'flex', flexDirection: 'column', gap: 10 } },
              React.createElement('input', {
                className: 'input-field',
                placeholder: 'Titel (z. B. Squad Briefing / Event)',
                value: title,
                onChange: (e) => setTitle(e.target.value),
                required: true
              }),
              React.createElement('input', {
                className: 'input-field',
                type: 'date',
                value: eventDate,
                onChange: (e) => setEventDate(e.target.value),
                required: true
              }),
              React.createElement('textarea', {
                className: 'textarea-field',
                placeholder: 'Beschreibung / Details...',
                value: description,
                onChange: (e) => setDescription(e.target.value)
              }),
              React.createElement('button', { type: 'submit', className: 'btn-primary' }, '+ Termin speichern')
            )
          ),

          React.createElement(
            'div',
            { className: 'glass-card custom-scroll', style: { flex: 1, padding: 18, minHeight: 0 } },
            React.createElement('h3', { style: { fontSize: 15, fontWeight: 700, marginBottom: 10 } },
              'Tagesansicht · ' + selectedDayStr
            ),
            dayEvents.length === 0
              ? React.createElement('div', { style: { fontSize: 12.5, color: 'var(--text-muted)' } }, 'Für diesen Tag sind keine Termine eingetragen.')
              : React.createElement(
                  'div',
                  { style: { display: 'flex', flexDirection: 'column', gap: 8 } },
                  dayEvents.map((ev) => React.createElement(
                    'div',
                    { key: ev.id, className: 'nested-box', style: { padding: 12 } },
                    React.createElement(
                      'div',
                      { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 } },
                      React.createElement('span', { style: { fontWeight: 700, fontSize: 13.5 } }, ev.title),
                      React.createElement('button', { className: 'btn-danger', onClick: () => handleDeleteEvent(ev.id) }, '✕')
                    ),
                    ev.description && React.createElement('p', { style: { fontSize: 12.5, color: 'var(--text-muted)', marginBottom: 6 } }, ev.description),
                    React.createElement('div', { style: { fontSize: 11, color: '#f5c518' } },
                      'Erstellt von ' + (profilesMap[ev.creator_id]?.username || 'Mitglied')
                    )
                  ))
                )
          )
        )
      );
    }

    // =========================================================================
    // 9. MODUL 3: MEDIATHEK & ORDNERSTRUKTUR (vault_items: Ordner, Medien, Text)
    // =========================================================================
    function VaultModule({ currentUser, profilesMap, onToast }) {
      const [items, setItems] = useState([]);
      const [currentFolderId, setCurrentFolderId] = useState(null);
      const [folderStack, setFolderStack] = useState([]); // [{ id, name }]
      const [newFolderName, setNewFolderName] = useState('');
      const [noteTitle, setNoteTitle] = useState('');
      const [noteText, setNoteText] = useState('');
      const [uploading, setUploading] = useState(false);

      const loadItems = async () => {
        const { data, error } = await supabase
          .from('vault_items')
          .select('*')
          .order('created_at', { ascending: false });
        if (!error) setItems(data || []);
      };

      useEffect(() => {
        loadItems();
        const ch = supabase
          .channel('quaps-vault-rt')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'vault_items' }, () => loadItems())
          .subscribe();
        return () => supabase.removeChannel(ch);
      }, []);

      const visibleItems = useMemo(() => {
        return items.filter((it) => {
          if (currentFolderId === null) {
            return !it.parent_id;
          }
          return it.parent_id === currentFolderId;
        });
      }, [items, currentFolderId]);

      const handleCreateFolder = async (e) => {
        e.preventDefault();
        if (!newFolderName.trim()) return;
        const { error } = await supabase.from('vault_items').insert({
          title: newFolderName.trim(),
          folder_name: newFolderName.trim(),
          item_type: 'folder',
          parent_id: currentFolderId,
          media_url: null,
          text_content: null,
          uploader_id: currentUser.id
        });
        if (error) {
          soundEngine.play('error_alert');
          onToast('Ordnerfehler: ' + error.message);
        } else {
          soundEngine.play('upload_success');
          setNewFolderName('');
          onToast('Ordner angelegt!');
          loadItems();
        }
      };

      const handleCreateTextNote = async (e) => {
        e.preventDefault();
        if (!noteTitle.trim() || !noteText.trim()) return;
        const { error } = await supabase.from('vault_items').insert({
          title: noteTitle.trim(),
          item_type: 'text',
          parent_id: currentFolderId,
          text_content: noteText.trim(),
          media_url: null,
          uploader_id: currentUser.id
        });
        if (error) {
          soundEngine.play('error_alert');
          onToast('Notizfehler: ' + error.message);
        } else {
          soundEngine.play('upload_success');
          setNoteTitle('');
          setNoteText('');
          onToast('Text-Eintrag gespeichert!');
          loadItems();
        }
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setUploading(true);
        try {
          const safeName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
          const filePath = `${currentUser.id}/${safeName}`;
          const { error: upErr } = await supabase.storage.from('vault').upload(filePath, file);
          if (upErr) throw upErr;

          const { data: pubData } = supabase.storage.from('vault').getPublicUrl(filePath);
          const { error: dbErr } = await supabase.from('vault_items').insert({
            title: file.name,
            media_url: pubData.publicUrl,
            item_type: 'media',
            parent_id: currentFolderId,
            uploader_id: currentUser.id
          });
          if (dbErr) throw dbErr;

          soundEngine.play('upload_success');
          onToast('Datei in Mediathek hochgeladen!');
          loadItems();
        } catch (err) {
          soundEngine.play('error_alert');
          onToast('Upload fehlgeschlagen: ' + err.message);
        } finally {
          setUploading(false);
          e.target.value = '';
        }
      };

      const handleDeleteItem = async (item) => {
        const { error } = await supabase.from('vault_items').delete().eq('id', item.id);
        if (!error) {
          setItems((prev) => prev.filter((i) => i.id !== item.id));
          onToast('Eintrag gelöscht.');
        }
      };

      const openFolder = (folder) => {
        setFolderStack((prev) => [...prev, { id: folder.id, name: folder.folder_name || folder.title }]);
        setCurrentFolderId(folder.id);
      };

      const jumpBreadcrumb = (index) => {
        if (index < 0) {
          setFolderStack([]);
          setCurrentFolderId(null);
        } else {
          const target = folderStack[index];
          setFolderStack((prev) => prev.slice(0, index + 1));
          setCurrentFolderId(target.id);
        }
      };

      const isImageUrl = (url) => url && /\.(png|jpe?g|gif|webp|avif)(\?.*)?$/i.test(url);

      return React.createElement(
        'div',
        { style: { flex: 1, minHeight: 0, display: 'grid', gridTemplateColumns: '1.6fr 1fr', gap: 14 } },
        // Links: Ordner & Dateien
        React.createElement(
          'div',
          { className: 'glass-card', style: { padding: 18, display: 'flex', flexDirection: 'column', gap: 12, minHeight: 0 } },
          React.createElement(
            'div',
            { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 } },
            React.createElement('h2', { style: { fontSize: 16.5, fontWeight: 700 } }, 'Mediathek & Ordner'),
            React.createElement(
              'label',
              { className: 'btn-primary', style: { cursor: uploading ? 'wait' : 'pointer' } },
              uploading ? 'Lade hoch...' : '+ Datei / Bild hochladen',
              React.createElement('input', {
                type: 'file',
                style: { display: 'none' },
                disabled: uploading,
                onChange: handleFileUpload
              })
            )
          ),

          // Breadcrumb Pfad
          React.createElement(
            'div',
            { style: { display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap', fontSize: 12.5 } },
            React.createElement(
              'button',
              { className: 'pill-tab', onClick: () => jumpBreadcrumb(-1) },
              '📁 Root'
            ),
            folderStack.map((f, i) => React.createElement(
              React.Fragment,
              { key: f.id },
              React.createElement('span', { style: { color: 'var(--text-muted)' } }, '/'),
              React.createElement('button', { className: 'pill-tab', onClick: () => jumpBreadcrumb(i) }, f.name)
            ))
          ),

          // Items Grid
          React.createElement(
            'div',
            { className: 'custom-scroll grid-2', style: { flex: 1, alignContent: 'start' } },
            visibleItems.length === 0
              ? React.createElement('div', { style: { fontSize: 13, color: 'var(--text-muted)' } }, 'Dieser Ordner ist leer.')
              : visibleItems.map((it) => {
                  const type = it.item_type || (it.media_url ? 'media' : 'text');
                  return React.createElement(
                    'div',
                    { key: it.id, className: 'nested-box', style: { padding: 12, display: 'flex', flexDirection: 'column', gap: 8 } },
                    type === 'folder' && React.createElement(
                      'button',
                      {
                        onClick: () => openFolder(it),
                        style: {
                          background: 'none',
                          border: 'none',
                          color: '#f5c518',
                          fontWeight: 700,
                          fontSize: 14,
                          textAlign: 'left',
                          cursor: 'pointer'
                        }
                      },
                      '📁 ' + (it.folder_name || it.title)
                    ),
                    type === 'media' && React.createElement(
                      React.Fragment,
                      null,
                      isImageUrl(it.media_url) && React.createElement('img', {
                        src: it.media_url,
                        alt: it.title,
                        style: { width: '100%', height: 120, objectFit: 'cover', borderRadius: 10 }
                      }),
                      React.createElement('div', { style: { fontWeight: 600, fontSize: 13, wordBreak: 'break-word' } }, '📎 ' + it.title),
                      it.media_url && React.createElement(
                        'a',
                        { href: it.media_url, target: '_blank', rel: 'noreferrer', style: { fontSize: 11.5, color: '#60a5fa' } },
                        'Datei öffnen ↗'
                      )
                    ),
                    type === 'text' && React.createElement(
                      React.Fragment,
                      null,
                      React.createElement('div', { style: { fontWeight: 700, fontSize: 13.5, color: '#f5c518' } }, '📝 ' + it.title),
                      React.createElement(
                        'div',
                        {
                          style: {
                            fontSize: 12.5,
                            color: 'rgba(255,255,255,0.85)',
                            background: 'rgba(0,0,0,0.25)',
                            padding: 8,
                            borderRadius: 8,
                            whiteSpace: 'pre-wrap'
                          }
                        },
                        it.text_content
                      )
                    ),
                    React.createElement(
                      'div',
                      { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 'auto', paddingTop: 6 } },
                      React.createElement('span', { style: { fontSize: 11, color: 'var(--text-muted)' } },
                        profilesMap[it.uploader_id]?.username || 'Mitglied'
                      ),
                      it.uploader_id === currentUser.id && React.createElement(
                        'button',
                        { className: 'btn-danger', onClick: () => handleDeleteItem(it) },
                        'Löschen'
                      )
                    )
                  );
                })
          )
        ),

        // Rechts: Ordner anlegen & Text-Notiz erstellen
        React.createElement(
          'div',
          { style: { display: 'flex', flexDirection: 'column', gap: 14, minHeight: 0 } },
          React.createElement(
            'div',
            { className: 'glass-card', style: { padding: 18 } },
            React.createElement('h3', { style: { fontSize: 15, fontWeight: 700, marginBottom: 10 } }, 'Neuen Ordner erstellen'),
            React.createElement(
              'form',
              { onSubmit: handleCreateFolder, style: { display: 'flex', gap: 8 } },
              React.createElement('input', {
                className: 'input-field',
                placeholder: 'Ordnername (z. B. Blueprints / Screenshots)',
                value: newFolderName,
                onChange: (e) => setNewFolderName(e.target.value)
              }),
              React.createElement('button', { type: 'submit', className: 'btn-secondary' }, '+ Ordner')
            )
          ),

          React.createElement(
            'div',
            { className: 'glass-card', style: { padding: 18, flex: 1, display: 'flex', flexDirection: 'column' } },
            React.createElement('h3', { style: { fontSize: 15, fontWeight: 700, marginBottom: 10 } }, 'Reinen Text-Eintrag / Notiz anlegen'),
            React.createElement(

              { onSubmit: handleCreateTextNote, style: { display: 'flex', flexDirection: 'column', gap: 10, flex: 1 } },

                placeholder: 'Notiz-Titel',
                value: noteTitle,

              }),

                className: 'textarea-field',
                style: { flex: 1 },

                value: noteText,

                required: true
