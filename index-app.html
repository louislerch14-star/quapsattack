          )
        )
      );
    }

    // =========================================================================
    // 10. MODUL 4: PINNWAND (pinboard_posts & pinboard_replies)
    // =========================================================================
    const REACTION_EMOJIS = ['🔥', '👍', '⚡', '🎯'];

    function PinboardModule({ currentUser, profilesMap, onToast }) {
      const [posts, setPosts] = useState([]);
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');
      const [category, setCategory] = useState('Allgemein');
      const [status, setStatus] = useState('Aktiv');
      const [coordinates, setCoordinates] = useState('');
      const [openThreadId, setOpenThreadId] = useState(null);
      const [replies, setReplies] = useState([]);
      const [replyText, setReplyText] = useState('');

      const loadPosts = async () => {
        const { data, error } = await supabase
          .from('pinboard_posts')
          .select('*')
          .order('pinned', { ascending: false })
          .order('created_at', { ascending: false });
        if (!error) setPosts(data || []);
      };

      const loadReplies = async (postId) => {
        const { data } = await supabase
          .from('pinboard_replies')
          .select('*')
          .eq('post_id', postId)
          .order('created_at', { ascending: true });
        setReplies(data || []);
      };

      useEffect(() => {
        loadPosts();
        const ch = supabase
          .channel('quaps-pinboard-rt')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pinboard_posts' }, (p) => {
            loadPosts();
            if (p.new?.author_id !== currentUser.id) {
              soundEngine.play('pinboard_post');
              onToast('Neuer Pinnwand-Beitrag!');
            }
          })
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pinboard_posts' }, () => loadPosts())
          .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'pinboard_posts' }, () => loadPosts())
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pinboard_replies' }, (p) => {
            if (p.new?.post_id === openThreadId) loadReplies(openThreadId);
            if (p.new?.author_id !== currentUser.id) {
              soundEngine.play('pinboard_reply');
            }
          })
          .subscribe();
        return () => supabase.removeChannel(ch);
      }, [openThreadId]);

      useEffect(() => {
        if (openThreadId) loadReplies(openThreadId);
      }, [openThreadId]);

      const handleCreatePost = async (e) => {
        e.preventDefault();
        if (!content.trim()) return;
        const { error } = await supabase.from('pinboard_posts').insert({
          author_id: currentUser.id,
          title: title.trim() || null,
          content: content.trim(),
          category,
          status,
          coordinates: coordinates.trim() || null,
          pinned: false,
          reactions: {},
          reply_count: 0
        });
        if (error) {
          soundEngine.play('error_alert');
          onToast('Post-Fehler: ' + error.message);
        } else {
          soundEngine.play('pinboard_post');
          setTitle('');
          setContent('');
          setCoordinates('');
          onToast('Beitrag gepostet!');
          loadPosts();
        }
      };

      const togglePin = async (post) => {
        await supabase.from('pinboard_posts').update({ pinned: !post.pinned }).eq('id', post.id);
        loadPosts();
      };

      const deletePost = async (postId) => {
        await supabase.from('pinboard_posts').delete().eq('id', postId);
        if (openThreadId === postId) setOpenThreadId(null);
        loadPosts();
      };

      const toggleReaction = async (post, emoji) => {
        const current = { ...(post.reactions || {}) };
        const users = new Set(current[emoji] || []);
        if (users.has(currentUser.id)) {
          users.delete(currentUser.id);
        } else {
          users.add(currentUser.id);
        }
        current[emoji] = Array.from(users);
        await supabase.from('pinboard_posts').update({ reactions: current }).eq('id', post.id);
        loadPosts();
      };

      const handleAddReply = async (e) => {
        e.preventDefault();
        if (!replyText.trim() || !openThreadId) return;
        const post = posts.find((p) => p.id === openThreadId);
        const { error } = await supabase.from('pinboard_replies').insert({
          post_id: openThreadId,
          author_id: currentUser.id,
          content: replyText.trim()
        });
        if (!error) {
          await supabase
            .from('pinboard_posts')
            .update({ reply_count: (post?.reply_count || 0) + 1 })
            .eq('id', openThreadId);
          setReplyText('');
          loadReplies(openThreadId);
          loadPosts();
        }
      };

      const filteredPosts = posts.filter((p) => {
        if (filterCategory !== 'ALL' && p.category !== filterCategory) return false;
        if (filterStatus !== 'ALL' && p.status !== filterStatus) return false;
        return true;
      });

      return React.createElement(
        'div',
        { style: { flex: 1, minHeight: 0, display: 'grid', gridTemplateColumns: '1.5fr 1fr', gap: 14 } },
        // Links: Filter & Pinnwand-Posts
        React.createElement(
          'div',
          { className: 'glass-card', style: { padding: 18, display: 'flex', flexDirection: 'column', gap: 12, minHeight: 0 } },
          React.createElement(
            'div',
            { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 } },
            React.createElement('h2', { style: { fontSize: 16.5, fontWeight: 700 } }, 'Pinnwand'),
            React.createElement(
              'div',
              { style: { display: 'flex', gap: 8 } },
              React.createElement(
                'select',
                { className: 'select-field', style: { width: 'auto', padding: '6px 10px' }, value: filterCategory, onChange: (e) => setFilterCategory(e.target.value) },
                React.createElement('option', { value: 'ALL' }, 'Alle Kategorien'),
                React.createElement('option', { value: 'Allgemein' }, 'Allgemein'),
                React.createElement('option', { value: 'Einsatz' }, 'Einsatz'),
                React.createElement('option', { value: 'Technik' }, 'Technik'),
                React.createElement('option', { value: 'Event' }, 'Event')
              ),
              React.createElement(
                'select',
                { className: 'select-field', style: { width: 'auto', padding: '6px 10px' }, value: filterStatus, onChange: (e) => setFilterStatus(e.target.value) },
                React.createElement('option', { value: 'ALL' }, 'Alle Status'),
                React.createElement('option', { value: 'Aktiv' }, 'Aktiv'),
                React.createElement('option', { value: 'Erledigt' }, 'Erledigt'),
                React.createElement('option', { value: 'Wichtig' }, 'Wichtig')
              )
            )
          ),

          React.createElement(
            'div',
            { className: 'custom-scroll', style: { flex: 1, display: 'flex', flexDirection: 'column', gap: 10 } },
            filteredPosts.map((p) => {
              const author = profilesMap[p.author_id] || {};
              return React.createElement(
                'div',
                {
                  key: p.id,
                  className: 'nested-box',
                  style: {
                    padding: 14,
                    borderColor: p.pinned ? 'rgba(245, 197, 24, 0.45)' : undefined
                  }
                },
                React.createElement(
                  'div',
                  { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8, marginBottom: 6, flexWrap: 'wrap' } },
                  React.createElement(
                    'div',
                    { style: { display: 'flex', alignItems: 'center', gap: 8 } },
                    p.pinned && React.createElement('span', { className: 'badge-gold' }, '📌 ANGEPINNT'),
                    React.createElement('span', { style: { fontWeight: 700, fontSize: 13 } }, author.username || 'Mitglied'),
                    React.createElement('span', { className: 'badge-green' }, p.category || 'Allgemein'),
                    React.createElement('span', { className: 'badge-red' }, p.status || 'Aktiv')
                  ),
                  React.createElement(
                    'div',
                    { style: { display: 'flex', gap: 6 } },
                    React.createElement('button', { className: 'btn-secondary', style: { padding: '4px 8px', fontSize: 11 }, onClick: () => togglePin(p) }, p.pinned ? 'Lösen' : 'Anpinnen'),
                    p.author_id === currentUser.id && React.createElement('button', { className: 'btn-danger', onClick: () => deletePost(p.id) }, '✕')
                  )
                ),
                p.title && React.createElement('h4', { style: { fontSize: 14.5, fontWeight: 700, marginBottom: 4 } }, p.title),
                React.createElement('p', { style: { fontSize: 13, lineHeight: 1.5, marginBottom: 8, whiteSpace: 'pre-wrap' } }, p.content),
                p.coordinates && React.createElement(
                  'div',
                  { style: { fontSize: 11.5, color: '#f5c518', marginBottom: 8 } },
                  '📍 Koordinaten: ' + p.coordinates
                ),
                React.createElement(
                  'div',
                  { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 } },
                  React.createElement(
                    'div',
                    { style: { display: 'flex', gap: 6 } },
                    REACTION_EMOJIS.map((em) => {
                      const list = (p.reactions && p.reactions[em]) || [];
                      const active = list.includes(currentUser.id);
                      return React.createElement(
                        'button',
                        {
                          key: em,
                          onClick: () => toggleReaction(p, em),
                          style: {
                            padding: '3px 8px',
                            borderRadius: 8,
                            border: active ? '1px solid #ef4444' : '1px solid rgba(255,255,255,0.12)',
                            background: active ? 'rgba(239,68,68,0.2)' : 'rgba(255,255,255,0.05)',
                            color: '#fff',
                            fontSize: 12,
                            cursor: 'pointer'
                          }
                        },
                        `${em} ${list.length || ''}`
                      );
                    })
                  ),
                  React.createElement(
                    'button',
                    {
                      className: 'btn-secondary',
                      style: { padding: '5px 10px', fontSize: 12 },
                      onClick: () => setOpenThreadId(p.id)
                    },
                    `💬 Antworten (${p.reply_count || 0})`
                  )
                )
              );
            })
          )
        ),

        // Rechts: Neuer Post + Thread-Antworten
        React.createElement(
          'div',
          { style: { display: 'flex', flexDirection: 'column', gap: 14, minHeight: 0 } },
          React.createElement(
            'div',
            { className: 'glass-card', style: { padding: 18 } },
            React.createElement('h3', { style: { fontSize: 15, fontWeight: 700, marginBottom: 10 } }, 'Neuen Pinnwand-Beitrag erstellen'),
            React.createElement(
              'form',
              { onSubmit: handleCreatePost, style: { display: 'flex', flexDirection: 'column', gap: 9 } },
              React.createElement('input', {
                className: 'input-field',
                placeholder: 'Titel (optional)',
                value: title,
                onChange: (e) => setTitle(e.target.value)
              }),
              React.createElement(
                'div',
                { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 } },
                React.createElement(
                  'select',
                  { className: 'select-field', value: category, onChange: (e) => setCategory(e.target.value) },
                  React.createElement('option', { value: 'Allgemein' }, 'Allgemein'),
                  React.createElement('option', { value: 'Einsatz' }, 'Einsatz'),
                  React.createElement('option', { value: 'Technik' }, 'Technik'),
                  React.createElement('option', { value: 'Event' }, 'Event')
                ),
                React.createElement(
                  'select',
                  { className: 'select-field', value: status, onChange: (e) => setStatus(e.target.value) },
                  React.createElement('option', { value: 'Aktiv' }, 'Aktiv'),
                  React.createElement('option', { value: 'Wichtig' }, 'Wichtig'),
                  React.createElement('option', { value: 'Erledigt' }, 'Erledigt')
                )
              ),
              React.createElement('input', {
                className: 'input-field',
                placeholder: 'Koordinaten (optional, z. B. X: 120 Z: -450)',
                value: coordinates,
                onChange: (e) => setCoordinates(e.target.value)
              }),
              React.createElement('textarea', {
                className: 'textarea-field',
                placeholder: 'Was gibt es zu berichten?',
                value: content,
                onChange: (e) => setContent(e.target.value),
                required: true
              }),
              React.createElement('button', { type: 'submit', className: 'btn-primary' }, 'Anheften & Posten')
            )
          ),

          React.createElement(
            'div',
            { className: 'glass-card', style: { padding: 18, flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 } },
            React.createElement('h3', { style: { fontSize: 15, fontWeight: 700, marginBottom: 10 } },
              openThreadId ? 'Thread-Antworten' : 'Wähle einen Beitrag für Antworten'
            ),
            openThreadId
              ? React.createElement(
                  React.Fragment,
                  null,
                  React.createElement(
                    'div',
                    { className: 'custom-scroll', style: { flex: 1, display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 10 } },
                    replies.length === 0
                      ? React.createElement('div', { style: { fontSize: 12.5, color: 'var(--text-muted)' } }, 'Noch keine Antworten.')
                      : replies.map((r) => React.createElement(
                          'div',
                          { key: r.id, className: 'nested-box', style: { padding: 10 } },
                          React.createElement('div', { style: { fontWeight: 700, fontSize: 12, color: '#f5c518', marginBottom: 3 } },
                            (profilesMap[r.author_id]?.username || 'Mitglied') + ' · ' + formatTime(r.created_at)
                          ),
                          React.createElement('div', { style: { fontSize: 13 } }, r.content)
                        ))
                  ),
                  React.createElement(
                    'form',
                    { onSubmit: handleAddReply, style: { display: 'flex', gap: 8 } },
                    React.createElement('input', {
                      className: 'input-field',
                      placeholder: 'Antwort schreiben...',
                      value: replyText,
                      onChange: (e) => setReplyText(e.target.value)
                    }),
                    React.createElement('button', { type: 'submit', className: 'btn-primary' }, 'Antworten')
                  )
                )
              : React.createElement('div', { style: { fontSize: 12.5, color: 'var(--text-muted)' } }, 'Klicke bei einem Post auf „Antworten“, um den Thread zu öffnen.')
          )
        )
      );
    }

    // =========================================================================
    // 11. MODUL 5: QUAPSSI KI-TERMINAL (Gemini API + qupas_si_messages)
    // =========================================================================
    function QuapsSIModule({ currentUser, onToast }) {
      const [messages, setMessages] = useState([]);
      const [prompt, setPrompt] = useState('');
      const [apiKeyInput, setApiKeyInput] = useState(() => localStorage.getItem('quaps_gemini_key') || '');
      const [sending, setSending] = useState(false);
      const bottomRef = useRef(null);

      const loadHistory = async () => {
        const { data, error } = await supabase
          .from('qupas_si_messages')
          .select('*')
          .eq('user_id', currentUser.id)
          .order('created_at', { ascending: true });
        if (!error) setMessages(data || []);
      };

      useEffect(() => {
        loadHistory();
      }, [currentUser.id]);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const saveKey = () => {
        localStorage.setItem('quaps_gemini_key', apiKeyInput.trim());
        onToast('Gemini API Key lokal gespeichert.');
      };

      const handleAsk = async (e) => {
        e.preventDefault();
        if (!prompt.trim() || sending) return;
        const q = prompt.trim();
        setPrompt('');
        setSending(true);
        try {
          const savedRow = await runQuapsSI(q, messages, currentUser.id, apiKeyInput);
          setMessages((prev) => [...prev, savedRow]);
          soundEngine.play('upload_success');
        } catch (err) {
          soundEngine.play('error_alert');
          onToast(err.message);
        } finally {
          setSending(false);
        }
      };

      return React.createElement(
        'div',
        { className: 'glass-card', style: { flex: 1, minHeight: 0, padding: 18, display: 'flex', flexDirection: 'column', gap: 12 } },
        React.createElement(
          'div',
          { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 10, paddingBottom: 10, borderBottom: '1px solid rgba(255,255,255,0.08)' } },
          React.createElement(
            'div',
            null,
            React.createElement('h2', { style: { fontSize: 17, fontWeight: 800 } },
              'Quaps',
              React.createElement('span', { className: 'gold-gradient-text' }, 'SI'),
              ' · Taktische KI'
            ),
            React.createElement('div', { style: { fontSize: 12, color: 'var(--text-muted)' } },
              'Verlauf wird automatisch in qupas_si_messages gespeichert'
            )
          ),
          React.createElement(
            'div',
            { style: { display: 'flex', gap: 8, alignItems: 'center' } },
            React.createElement('input', {
              className: 'input-field',
              type: 'password',
              style: { width: 230, padding: '7px 11px', fontSize: 12 },
              placeholder: 'GEMINI_API_KEY (AIza...)',
              value: apiKeyInput,
              onChange: (e) => setApiKeyInput(e.target.value)
            }),
            React.createElement('button', { className: 'btn-secondary', onClick: saveKey }, 'Key sichern')
          )
        ),

        React.createElement(
          'div',
          { className: 'custom-scroll', style: { flex: 1, display: 'flex', flexDirection: 'column', gap: 12, paddingRight: 4 } },
          messages.length === 0 && React.createElement(
            'div',
            { className: 'nested-box', style: { padding: 16, color: 'var(--text-muted)', fontSize: 13 } },
            'QuapsSI steht bereit. Frag mich nach Taktik, Event-Planung, Technik oder Codes.'
          ),
          messages.map((m) => React.createElement(
            React.Fragment,
            { key: m.id },
            React.createElement(
              'div',
              {
                className: 'nested-box',
                style: { alignSelf: 'flex-end', maxWidth: '78%', padding: '10px 14px', borderColor: 'rgba(239,68,68,0.35)' }
              },
              React.createElement('div', { style: { fontSize: 11, color: '#fca5a5', fontWeight: 700, marginBottom: 3 } }, 'DU'),
              React.createElement('div', { style: { fontSize: 13.5, whiteSpace: 'pre-wrap' } }, m.prompt)
            ),
            React.createElement(
              'div',
              {
                className: 'nested-box',
                style: { alignSelf: 'flex-start', maxWidth: '82%', padding: '12px 15px', borderColor: 'rgba(245,197,24,0.28)' }
              },
              React.createElement('div', { style: { fontSize: 11, color: '#f5c518', fontWeight: 800, marginBottom: 4 } },
                'QUAPSSI · ' + formatTime(m.created_at)
              ),
              React.createElement('div', { style: { fontSize: 13.5, lineHeight: 1.55, whiteSpace: 'pre-wrap' } }, m.response)
            )
          )),
          React.createElement('div', { ref: bottomRef })
        ),

        React.createElement(
          'form',
          { onSubmit: handleAsk, style: { display: 'flex', gap: 10, paddingTop: 10, borderTop: '1px solid rgba(255,255,255,0.08)' } },
          React.createElement('input', {
            className: 'input-field',
            placeholder: 'Befehl oder Frage an QuapsSI senden...',
            value: prompt,
            onChange: (e) => setPrompt(e.target.value),
            disabled: sending
          }),
          React.createElement('button', { type: 'submit', className: 'btn-primary', disabled: sending },
            sending ? 'Denkt...' : 'Senden'
          )
        )
      );
    }

    // =========================================================================
    // 12. MODUL 6: CUSTOM SOUND-SYSTEM (Lautstärke, DND, Custom Files, Test)
    // =========================================================================
    function SoundSettingsModule({ onToast }) {
      const [settings, setSettings] = useState(() => soundEngine.load());

      useEffect(() => {
        return soundEngine.subscribe((next) => setSettings(next));
      }, []);

      const handleCustomFileChange = (key, file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          soundEngine.setCustomSound(key, {
            fileName: file.name,
            dataUrl: String(reader.result)
          });
          onToast(`Custom Sound für „${key}“ hinterlegt (${file.name}).`);
        };
        reader.readAsDataURL(file);
      };

      return React.createElement(
        'div',
        { className: 'glass-card', style: { flex: 1, minHeight: 0, padding: 18, display: 'flex', flexDirection: 'column', gap: 14 } },
        React.createElement(
          'div',
          { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 } },
          React.createElement(
            'div',
            null,
            React.createElement('h2', { style: { fontSize: 17, fontWeight: 700 } }, 'Custom Sound-System'),
            React.createElement('div', { style: { fontSize: 12, color: 'var(--text-muted)' } },
              'Eigene Audio-Dateien (.mp3, .wav, .ogg) pro Event festlegen oder integrierte QuapsAttack-Töne nutzen'
            )
          ),
          React.createElement(
            'div',
            { style: { display: 'flex', alignItems: 'center', gap: 14 } },
            React.createElement(
              'label',
              { style: { display: 'flex', alignItems: 'center', gap: 7, fontSize: 13, cursor: 'pointer' } },
              React.createElement('input', {
                type: 'checkbox',
                checked: settings.dnd,
                onChange: (e) => soundEngine.setDnd(e.target.checked)
              }),
              'Nicht stören (DND)'
            ),
            React.createElement(
              'div',
              { style: { display: 'flex', alignItems: 'center', gap: 8 } },
              React.createElement('span', { style: { fontSize: 12, color: 'var(--text-muted)' } },
                `Lautstärke: ${Math.round(settings.volume * 100)}%`
              ),
              React.createElement('input', {
                type: 'range',
                min: 0,
                max: 1,
                step: 0.05,
                value: settings.volume,
                onChange: (e) => soundEngine.setVolume(parseFloat(e.target.value))
              })
            )
          )
        ),

        React.createElement(
          'div',
          { className: 'custom-scroll', style: { flex: 1, display: 'flex', flexDirection: 'column', gap: 8 } },
          SOUND_EVENTS.map((ev) => {
            const custom = settings.customFiles[ev.key];
            return React.createElement(
              'div',
              {
                key: ev.key,
                className: 'nested-box',
                style: {
                  padding: '12px 14px',
                  display: 'flex',
                  justifyContent: 'space-between',
                  alignItems: 'center',
                  gap: 12,
                  flexWrap: 'wrap'
                }
              },
              React.createElement(
                'div',
                null,
                React.createElement('div', { style: { fontWeight: 700, fontSize: 13.5 } }, ev.label),
                React.createElement('div', { style: { fontSize: 12, color: 'var(--text-muted)' } }, ev.desc),
                custom && React.createElement(
                  'div',
                  { style: { fontSize: 11.5, color: '#10b981', marginTop: 3 } },
                  '✓ Eigene Datei: ' + custom.fileName
                )
              ),
              React.createElement(
                'div',
                { style: { display: 'flex', gap: 8, alignItems: 'center' } },
                React.createElement(
                  'button',
                  { className: 'btn-secondary', onClick: () => soundEngine.play(ev.key, true) },
                  '▶ Test'
                ),
                React.createElement(
                  'label',
                  { className: 'btn-secondary', style: { cursor: 'pointer' } },
                  'Datei wählen',
                  React.createElement('input', {
                    type: 'file',
                    accept: 'audio/*',
                    style: { display: 'none' },
                    onChange: (e) => handleCustomFileChange(ev.key, e.target.files?.[0])
                  })
                ),
                custom && React.createElement(
                  'button',
                  { className: 'btn-danger', onClick: () => soundEngine.setCustomSound(ev.key, null) },
                  'Reset'
                )
              )
            );
          })
        )
      );
    }

    // =========================================================================
    // 13. ROOT APP
    // =========================================================================
    function App() {
      const [session, setSession] = useState(null);
      const [authChecked, setAuthChecked] = useState(false);
      const [currentProfile, setCurrentProfile] = useState(null);
      const [profilesMap, setProfilesMap] = useState({});
      const [activeTab, setActiveTab] = useState('chat');
      const [unreadChatCount, setUnreadChatCount] = useState(0);
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [callState, setCallState] = useState(null);
      const [toast, setToast] = useState(null);
      const signalChannelRef = useRef(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => {
          setToast((prev) => (prev === msg ? null : prev));
        }, 3800);
      };

      const loadAllProfiles = async () => {
        const { data } = await supabase.from('profiles').select('*');
        if (data) {
          const map = {};
          for (const p of data) map[p.id] = p;
          setProfilesMap(map);
        }
      };

      useEffect(() => {
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission().catch(() => {});
        }

        supabase.auth.getSession().then(({ data }) => {
          setSession(data.session || null);
          setAuthChecked(true);
        });

        const { data: listener } = supabase.auth.onAuthStateChange((_event, nextSession) => {
          setSession(nextSession);
        });

        return () => listener.subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (!session?.user) {
          setCurrentProfile(null);
          return;
        }

        loadAllProfiles();
        supabase
          .from('profiles')
          .select('*')
          .eq('id', session.user.id)
          .single()
          .then(({ data }) => {
            if (data) setCurrentProfile(data);
          });

        // Realtime Signaling Channel für WebRTC Voice/Video Calls
        const sigChannel = supabase.channel('quaps-webrtc-signaling', {
          config: { broadcast: { self: false } }
        });

        sigChannel
          .on('broadcast', { event: 'call-signal' }, ({ payload }) => {
            if (!payload) return;
            if (payload.targetUserId && payload.targetUserId !== session.user.id) return;

            if (payload.type === 'call-invite') {
              soundEngine.play('call_incoming');
              notifyDesktop('Eingehender QuapsAttack Call', `${payload.fromUsername} ruft an...`);
              setCallState({
                status: 'incoming',
                roomId: payload.roomId,
                roomName: payload.roomName,
                isGroup: payload.isGroup,
                isVideo: payload.isVideo,
                peerUserId: payload.fromUserId,
                peerName: payload.fromUsername
              });
            } else {
              window.dispatchEvent(new CustomEvent('quaps-call-signal', { detail: payload }));
            }
          })
          .subscribe();

        signalChannelRef.current = sigChannel;

        return () => {
          supabase.removeChannel(sigChannel);
        };
      }, [session?.user?.id]);

      const handleSignOut = async () => {
        await supabase.auth.signOut();
        setSession(null);
        showToast('Abgemeldet.');
      };

      const tabLabels = {
        chat: 'Direkt & Gruppen',
        pinboard: 'Pinnwand',
        calendar: 'Kalender',
        vault: 'Mediathek & Tresor',
        quapssi: 'QuapsSI Terminal',
        sounds: 'Sound-System'
      };

      const statusDotColor =
        currentProfile?.custom_status === 'dnd'
          ? '#ef4444'
          : currentProfile?.custom_status === 'away'
          ? '#f5c518'
          : '#10b981';

      return React.createElement(
        'div',
        { className: 'app-shell' },
        // Top Header Bar
        React.createElement(
          'header',
          { className: 'top-bar' },
          React.createElement(
            'div',
            { className: 'brand-badge' },
            React.createElement('div', { className: 'brand-emblem' }, 'Q'),
            React.createElement('span', null,
              'QUAPS',
              React.createElement('span', { className: 'gold-gradient-text' }, 'ATTACK')
            ),
            React.createElement('span', { className: 'badge-gold' }, tabLabels[activeTab] || 'SUITE')
          ),
          session?.user && React.createElement(
            'div',
            { style: { display: 'flex', alignItems: 'center', gap: 10, fontSize: 12.5, color: 'var(--text-muted)' } },
            React.createElement('span', {
              style: { width: 8, height: 8, borderRadius: '50%', background: statusDotColor, display: 'inline-block' }
            }),
            React.createElement('span', { style: { color: '#fff', fontWeight: 600 } },
              currentProfile?.username || session.user.email
            ),
            currentProfile?.role && React.createElement('span', { className: 'badge-green' }, currentProfile.role)
          )
        ),

        // Body
        !authChecked
          ? React.createElement('div', { style: { flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-muted)' } }, 'Lade QuapsAttack...')
          : !session?.user
          ? React.createElement(AuthView, { onToast: showToast })
          : React.createElement(
              'div',
              { className: 'main-layout' },
              // Sidebar
              React.createElement(
                'aside',
                { className: 'sidebar glass-card' },
                React.createElement(
                  'div',
                  { style: { display: 'flex', flexDirection: 'column', gap: 5 } },
                  React.createElement('div', { style: { fontSize: 10.5, fontWeight: 700, letterSpacing: '0.08em', color: 'rgba(255,255,255,0.45)', padding: '4px 10px 6px' } }, 'MODULE'),
                  [
                    { id: 'chat', label: '💬 Direkt & Gruppen', badge: unreadChatCount > 0 ? unreadChatCount : null },
                    { id: 'pinboard', label: '📌 Pinnwand' },
                    { id: 'calendar', label: '📅 Kalender' },
                    { id: 'vault', label: '🗂️ Mediathek & Tresor' },
                    { id: 'quapssi', label: '🤖 QuapsSI KI' },
                    { id: 'sounds', label: '🔊 Custom Sounds' }
                  ].map((item) => React.createElement(
                    'button',
                    {
                      key: item.id,
                      className: `nav-btn ${activeTab === item.id ? 'active' : ''}`,
                      onClick: () => setActiveTab(item.id)
                    },
                    React.createElement('span', null, item.label),
                    item.badge && React.createElement('span', { className: 'badge-red' }, item.badge)
                  ))
                ),

                // Profilkarte unten in der Sidebar
                React.createElement(
                  'div',
                  { className: 'nested-box', style: { padding: 12, display: 'flex', flexDirection: 'column', gap: 8 } },
                  React.createElement(
                    'div',
                    { style: { display: 'flex', alignItems: 'center', gap: 10 } },
                    currentProfile?.avatar_url
                      ? React.createElement('img', {
                          src: currentProfile.avatar_url,
                          alt: currentProfile.username,
                          style: { width: 38, height: 38, borderRadius: 11, objectFit: 'cover' }
                        })
                      : React.createElement(
                          'div',
                          {
                            style: {
                              width: 38,
                              height: 38,
                              borderRadius: 11,
                              background: 'linear-gradient(135deg, #ef4444, #7f1d1d)',
                              display: 'flex',
                              alignItems: 'center',
                              justifyContent: 'center',
                              fontWeight: 800
                            }
                          },
                          (currentProfile?.username || 'Q').slice(0, 2).toUpperCase()
                        ),
                    React.createElement(
                      'div',
                      { style: { minWidth: 0, flex: 1 } },
                      React.createElement('div', { style: { fontWeight: 700, fontSize: 13 } }, currentProfile?.username || 'Mitglied'),
                      React.createElement('div', { style: { fontSize: 11.5, color: 'var(--text-muted)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } },
                        currentProfile?.custom_status_text || 'Einsatzbereit'
                      )
                    )
                  ),
                  currentProfile?.personality_quote && React.createElement(
                    'div',
                    { style: { fontSize: 11.5, fontStyle: 'italic', color: 'rgba(255,255,255,0.65)', borderLeft: '2px solid #f5c518', paddingLeft: 8 } },
                    `„${currentProfile.personality_quote}“`
                  ),
                  React.createElement(
                    'div',
                    { style: { display: 'flex', gap: 6 } },
                    React.createElement('button', { className: 'btn-secondary', style: { flex: 1, padding: '6px 8px' }, onClick: () => setShowProfileModal(true) }, '✏️ Profil'),
                    React.createElement('button', { className: 'btn-danger', onClick: handleSignOut }, 'Logout')
                  )
                )
              ),

              // Hauptbereich
              React.createElement(
                'main',
                { className: 'content-area' },
                activeTab === 'chat' && React.createElement(ChatModule, {
                  currentUser: session.user,
                  currentProfile,
                  profilesMap,
                  signalChannel: signalChannelRef.current,
                  setCallState,
                  onUnreadChange: setUnreadChatCount,
                  onToast: showToast
                }),
                activeTab === 'pinboard' && React.createElement(PinboardModule, {
                  currentUser: session.user,
                  profilesMap,
                  onToast: showToast
                }),
                activeTab === 'calendar' && React.createElement(CalendarModule, {
                  currentUser: session.user,
                  profilesMap,
                  onToast: showToast
                }),
                activeTab === 'vault' && React.createElement(VaultModule, {
                  currentUser: session.user,
                  profilesMap,
                  onToast: showToast
                }),
                activeTab === 'quapssi' && React.createElement(QuapsSIModule, {
                  currentUser: session.user,
                  onToast: showToast
                }),
                activeTab === 'sounds' && React.createElement(SoundSettingsModule, {
                  onToast: showToast
                })
              )
            ),

        // Modals & Overlays
        showProfileModal && currentProfile && React.createElement(ProfileModal, {
          profile: currentProfile,
          onClose: () => setShowProfileModal(false),
          onSaved: (updated) => {
            setCurrentProfile(updated);
            setProfilesMap((prev) => ({ ...prev, [updated.id]: updated }));
          },
          onToast: showToast
        }),

        callState && session?.user && React.createElement(CallOverlay, {
          callState,
          setCallState,
          currentUser: session.user,
          currentProfile,
          signalChannel: signalChannelRef.current,
          onToast: showToast
        }),

        toast && React.createElement('div', { className: 'toast-banner' }, toast)
      );
    }

    createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
