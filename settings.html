<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konto-Einstellungen</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #3b82f6;
    }
    .user-info {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #aaa;
      text-align: center;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #aaa;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
      margin-top: 10px;
    }
    button:hover {
      background: #2563eb;
    }
    .btn-secondary {
      background: #333;
      margin-top: 10px;
    }
    .btn-secondary:hover {
      background: #444;
    }
    .strength-meter {
      height: 6px;
      width: 100%;
      background: #333;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    .strength-bar {
      height: 100%;
      width: 0%;
      background: #ef4444;
      transition: width 0.3s, background-color 0.3s;
    }
    .requirements {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
      padding-left: 18px;
    }
    .requirements li {
      margin-bottom: 4px;
    }
    .requirements li.valid {
      color: #22c55e;
    }
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .message.error {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      display: block;
    }
    .message.success {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      display: block;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Einstellungen ⚙️</h2>
  
  <div class="user-info">
    Eingeloggt als: <br><strong id="user-email" style="color: #fff;">Lade...</strong>
  </div>

  <div class="input-group">
    <label for="new-password">Neues Passwort</label>
    <input type="password" id="new-password" placeholder="••••••••" required>
    
    <!-- Stärke-Balken -->
    <div class="strength-meter">
      <div id="strength-bar" class="strength-bar"></div>
    </div>

    <!-- Kriterien-Liste -->
    <ul class="requirements">
      <li id="req-length">Mindestens 8 Zeichen</li>
      <li id="req-upper">Ein Großbuchstabe</li>
      <li id="req-number">Eine Zahl</li>
      <li id="req-special">Ein Sonderzeichen (!@#$%^&*)</li>
    </ul>
  </div>

  <button id="btn-update-password">Passwort aktualisieren</button>
  <button id="btn-back" class="btn-secondary">Zurück zum Dashboard</button>

  <div id="status-msg" class="message"></div>
</div>

<script>
  // Supabase Initialisierung
  const SUPABASE_URL = 'https://xibaufkxapezpuvszpxf.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpYmF1Zmt4YXBlenB1dnN6cHhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjEwNzUsImV4cCI6MjEwMzkzNzA3NX0.Tv3IKj95iBsGy5TGTosb7mMT-d_sySuu7QZ4RpNhB5E';
  
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const userEmail = document.getElementById('user-email');
  const passwordInput = document.getElementById('new-password');
  const btnUpdatePassword = document.getElementById('btn-update-password');
  const btnBack = document.getElementById('btn-back');
  const statusMsg = document.getElementById('status-msg');

  const strengthBar = document.getElementById('strength-bar');
  const reqLength = document.getElementById('req-length');
  const reqUpper = document.getElementById('req-upper');
  const reqNumber = document.getElementById('req-number');
  const reqSpecial = document.getElementById('req-special');

  // Session-Prüfung beim Laden der Seite
  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session }, error } = await supabaseClient.auth.getSession();

    if (error || !session) {
      // Nicht eingeloggt -> Zurück zum Login
      window.location.href = 'login-.html';
      return;
    }

    userEmail.innerText = session.user.email;
  });

  // Live Passwort-Stärke-Prüfung
  passwordInput.addEventListener('input', () => {
    const val = passwordInput.value;
    let score = 0;

    const hasLength = val.length >= 8;
    const hasUpper = /[A-Z]/.test(val);
    const hasNumber = /[0-9]/.test(val);
    const hasSpecial = /[^A-Za-z0-9]/.test(val);

    reqLength.classList.toggle('valid', hasLength);
    reqUpper.classList.toggle('valid', hasUpper);
    reqNumber.classList.toggle('valid', hasNumber);
    reqSpecial.classList.toggle('valid', hasSpecial);

    if (hasLength) score++;
    if (hasUpper) score++;
    if (hasNumber) score++;
    if (hasSpecial) score++;

    switch(score) {
      case 0:
        strengthBar.style.width = '0%';
        strengthBar.style.backgroundColor = '#ef4444';
        break;
      case 1:
        strengthBar.style.width = '25%';
        strengthBar.style.backgroundColor = '#ef4444';
        break;
      case 2:
        strengthBar.style.width = '50%';
        strengthBar.style.backgroundColor = '#f59e0b';
        break;
      case 3:
        strengthBar.style.width = '75%';
        strengthBar.style.backgroundColor = '#eab308';
        break;
      case 4:
        strengthBar.style.width = '100%';
        strengthBar.style.backgroundColor = '#22c55e';
        break;
    }
  });

  // Passwort aktualisieren
  btnUpdatePassword.addEventListener('click', async () => {
    const newPassword = passwordInput.value;

    if (newPassword.length < 8) {
      showStatus('Das Passwort muss mindestens 8 Zeichen lang sein.', 'error');
      return;
    }

    btnUpdatePassword.disabled = true;
    btnUpdatePassword.innerText = 'Aktualisiere...';

    const { error } = await supabaseClient.auth.updateUser({
      password: newPassword
    });

    if (error) {
      showStatus('Fehler: ' + error.message, 'error');
      btnUpdatePassword.disabled = false;
      btnUpdatePassword.innerText = 'Passwort aktualisieren';
    } else {
      showStatus('Passwort erfolgreich geändert! 🎉', 'success');
      passwordInput.value = '';
      strengthBar.style.width = '0%';
      btnUpdatePassword.disabled = false;
      btnUpdatePassword.innerText = 'Passwort aktualisieren';
    }
  });

  // Zurück-Button Event
  btnBack.addEventListener('click', () => {
    window.location.href = 'dashboard.html';
  });

  function showStatus(text, type) {
    statusMsg.innerText = text;
    statusMsg.className = `message ${type}`;
  }
</script>

</body>
</html>
