<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Wartungsarbeiten</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle Animated Background Grid */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        /* Glowing Orbs in Background */
        .glow-1, .glow-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            z-index: 1;
            animation: float 8s ease-in-out infinite alternate;
        }

        .glow-1 {
            background: #00d2ff;
            top: 20%;
            left: 20%;
        }

        .glow-2 {
            background: #9d00ff;
            bottom: 20%;
            right: 20%;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.1); }
        }

        /* Main Card Container */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 45px 35px;
            max-width: 520px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animated Spinner Icon */
        .spinner-box {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top-color: #00d2ff;
            border-right-color: #00d2ff;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }

        .circle-inner {
            position: absolute;
            width: 70%;
            height: 70%;
            border: 3px solid transparent;
            border-bottom-color: #9d00ff;
            border-left-color: #9d00ff;
            border-radius: 50%;
            animation: spinReverse 1s linear infinite;
        }

        .admin-badge {
            font-size: 22px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinReverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* Typography */
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #00d2ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #a0aec0;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .highlight {
            color: #ffffff;
            font-weight: 600;
        }

        /* Progress Bar */
        .progress-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 30px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #9d00ff);
            border-radius: 10px;
            width: 0%;
            animation: load 3s ease-in-out infinite;
        }

        @keyframes load {
            0% { width: 5%; }
            50% { width: 75%; }
            100% { width: 98%; }
        }

        /* Discord Contact Box */
        .discord-box {
            background: rgba(88, 101, 242, 0.1);
            border: 1px solid rgba(88, 101, 242, 0.3);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #ffffff;
        }

        .discord-box:hover {
            background: rgba(88, 101, 242, 0.2);
            border-color: rgba(88, 101, 242, 0.6);
            transform: translateY(-2px);
        }

        .discord-icon {
            width: 24px;
            height: 24px;
            fill: #5865F2;
        }

        .discord-text {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .discord-text span {
            color: #5865F2;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="container">
        <div class="spinner-box">
            <div class="circle-outer"></div>
            <div class="circle-inner"></div>
            <div class="admin-badge">⚡</div>
        </div>

        <h1>Web Admin Lois_7</h1>
        <p>
            Arbeitet gerade an den neusten Sachen und macht die Website noch besser! 🛠️<br>
            Bitte hab einen kurzen Moment Geduld.
        </p>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <div class="discord-box">
            <svg class="discord-icon" viewBox="0 0 127.14 96.36">

            </svg>
            <div class="discord-text">
                Wichtiges Anliegen? Schreib mir auf <span>Discord</span>!
            </div>
        </div>
    </div>

</body>
</html>
