<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="icon" type="image/png" href="unnamed.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quaps Attack Login | Community Hub</title>
    <meta name="description" content="Melde dich beim Quaps Attack Community Hub an, um Clips zu sehen und die Hymne zu hören.">
    <meta name="keywords" content="quapsattack login, quaps attack, minecraft hub">
    
    <meta property="og:title" content="Quaps Attack Login">
    <meta property="og:description" content="Sicherer Login für die Quaps Attack Community.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #a8ff78; /* Frisches XP-Grün */
            --gold: #f5c518;
            --bg: #0a0a0a;
            --panel: #1a1a1a;
            --border: #333333;
            --text: #f0f0f0;
            --muted: #aaaaaa;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'VT323', monospace;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-size: 1.3rem;
            overflow: hidden;
        }

        /* ── BACKGROUND & OVERLAY ── */
        .background-image {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at center, #111 0%, #050505 100%);
        }

        .login-overlay {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 1;
        }

        .login-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            transition: 0.3s;
        }
        .login-card:hover {
            border-color: rgba(255,255,255,0.1);
        }

        .logo-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.1rem;
            color: var(--primary);
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        /* ── FORMS & INPUTS ── */
        .mc-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.45rem;
            color: var(--gold);
            display: block;
            text-align: left;
            margin-bottom: 6px;
        }

        input {
            display: block;
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 10px;
            color: #fff;
            margin-bottom: 18px;
            font-family: inherit;
            font-size: 1.1rem;
            transition: 0.2s;
        }
        input:focus {
            border-color: var(--primary);
            outline: none;
            background: rgba(0,0,0,0.7);
        }

        button {
            display: block;
            width: 100%;
            background: #222222;
            color: var(--primary);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: 0.2s;
        }
        button:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .secondary-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 0.9rem;
            text-decoration: underline;
            margin-top: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .secondary-btn:hover { color: #fff; background: transparent; }

        .guest-btn {
            color: #ff5555;
            margin-top: 16px;
            font-size: 0.95rem;
            text-decoration: none;
            border: 1px dashed rgba(255, 85, 85, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
            transition: 0.2s;
        }
        .guest-btn:hover {
            color: #ff7777;
            background: rgba(255, 85, 85, 0.1);
            border-color: #ff5555;
        }

        .divider {
            margin: 25px 0;
            color: #333;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.4rem;
            letter-spacing: 2px;
        }

        /* ── GOOGLE BUTTON & PIXEL LOGO ── */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #44d4d4;
        }

        .pixel-google-icon {
            width: 18px;
            height: 18px;
            position: relative;
            background: transparent;
            box-shadow: 
                4px 0px 0 #ea4335, 6px 0px 0 #ea4335, 8px 0px 0 #ea4335, 10px 0px 0 #ea4335, 12px 0px 0 #ea4335,
                2px 2px 0 #ea4335, 14px 2px 0 #ea4335,
                0px 4px 0 #ea4335, 0px 6px 0 #ea4335, 0px 8px 0 #4285f4, 0px 10px 0 #4285f4, 0px 12px 0 #fabc05,
                2px 14px 0 #fabc05,
                4px 16px 0 #34a853, 6px 16px 0 #34a853, 8px 16px 0 #34a853, 10px 16px 0 #34a853, 12px 16px 0 #34a853,
                14px 14px 0 #34a853,
                16px 12px 0 #4285f4, 16px 10px 0 #4285f4, 16px 8px 0 #4285f4,
                14px 8px 0 #4285f4, 12px 8px 0 #4285f4, 10px 8px 0 #4285f4, 8px 8px 0 #4285f4;
            transform: scale(1.1);
            margin-right: 4px;
        }

        #message {
            margin-top: 15px;
            font-size: 1rem;
            min-height: 24px;
            line-height: 1.4;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="background-image"></div>

    <div class="login-overlay">
        <div class="login-card">
            
            <h1 class="logo-text" id="formTitle">QUAPS LOGIN!</h1>
            
            <form id="authForm">
                <label class="mc-label">E-Mail Adresse</label>
                <input type="email" id="email" placeholder="agent@quaps.de" required>
                
                <label class="mc-label">Passwort</label>
                <input type="password" id="password" placeholder="••••••••" required>
                
                <button type="submit" id="loginBtn">LOGIN // MAIL</button>
                <button type="button" id="signUpSubmitBtn" class="hidden">REGISTER ACCOUNT</button>
            </form>

            <button class="secondary-btn" id="switchToRegisterBtn">Noch kein Account? Registrieren</button>
            <button class="secondary-btn hidden" id="switchToLoginBtn">Bereits registriert? Zum Login</button>

            <div id="googleSection">
                <div class="divider">--------- OR ---------</div>
                <button class="google-btn" id="googleBtn">
                    <div class="pixel-google-icon"></div>
                    SIGN IN WITH GOOGLE
                </button>
            </div>

            <div id="guestSection">
                <button class="secondary-btn guest-btn" id="guestBtn">Weiter ohne Account ☹ (Eingeschränkte Features)</button>
            </div>

            <div id="message"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://sdwelvinfbqxivvxnjkh.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkd2VsdmluZmJxeGl2dnhuamtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDAxNjMsImV4cCI6MjA5NTQ3NjE2M30.aRc-rwNoZwx2vHS3tvvDkQr7t6el6ankRsgkldgHCBE";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const authForm = document.getElementById('authForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const formTitle = document.getElementById('formTitle');
        
        const loginBtn = document.getElementById('loginBtn');
        const signUpSubmitBtn = document.getElementById('signUpSubmitBtn');
        
        const switchToRegisterBtn = document.getElementById('switchToRegisterBtn');
        const switchToLoginBtn = document.getElementById('switchToLoginBtn');
        const googleSection = document.getElementById('googleSection');
        const googleBtn = document.getElementById('googleBtn');
        const guestBtn = document.getElementById('guestBtn');
        const messageDiv = document.getElementById('message');

        function showMessage(text, isError = true) {
            messageDiv.style.color = isError ? "#ff4d4d" : "#a8ff78";
            messageDiv.textContent = text;
        }

        // ── KLICK AUF "REGISTRIEREN" (ANSICHT WECHSELN) ──
        switchToRegisterBtn.addEventListener('click', () => {
            showMessage("");
            formTitle.textContent = "QUAPS REGISTRATION!";
            
            // Login & Google & Gast weg
            loginBtn.classList.add('hidden');
            googleSection.classList.add('hidden');
            guestBtn.classList.add('hidden');
            switchToRegisterBtn.classList.add('hidden');
            
            // Registrierungs-Button da
            signUpSubmitBtn.classList.remove('hidden');
            switchToLoginBtn.classList.remove('hidden');
        });

        // ── KLICK AUF "ZUM LOGIN" (ANSICHT WECHSELN) ──
        switchToLoginBtn.addEventListener('click', () => {
            showMessage("");
            formTitle.textContent = "QUAPS LOGIN!";
            
            // Registrierungs-Button weg
            signUpSubmitBtn.classList.add('hidden');
            switchToLoginBtn.classList.add('hidden');
            
            // Login & Google & Gast wieder da
            loginBtn.classList.remove('hidden');
            googleSection.classList.remove('hidden');
            guestBtn.classList.remove('hidden');
            switchToRegisterBtn.classList.remove('hidden');
        });

        // ── 1. LOGIN AUSFÜHREN ──
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showMessage("");

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: emailInput.value,
                password: passwordInput.value,
            });

            if (error) {
                if (error.message.includes("Email not confirmed")) {
                    showMessage("Bitte bestätige zuerst deine E-Mail-Adresse!");
                } else {
                    showMessage(error.message);
                }
            } else {
                showMessage("Login erfolgreich! Weiterleitung...", false);
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            }
        });

        // ── 2. REGISTRIERUNG AUSFÜHREN ──
        signUpSubmitBtn.addEventListener('click', async () => {
            showMessage("");

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage("Bitte trage E-Mail und Passwort ein.");
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    emailRedirectTo: window.location.origin + '/index.html'
                }
            });

            if (error) {
                showMessage(error.message);
            } else {
                if (data.user && data.session === null) {
                    showMessage("Registrierung erfolgreich! Bitte überprüfe dein E-Mail-Postfach.", false);
                    emailInput.value = "";
                    passwordInput.value = "";
                } else {
                    showMessage("Account direkt erstellt und eingeloggt! Weiterleitung...", false);
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                }
            }
        });

        // ── 3. GOOGLE LOGIN AUSFÜHREN ──
        googleBtn.addEventListener('click', async () => {
            showMessage("");
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/index.html'
                }
            });
            if (error) showMessage("Google Login Fehler: " + error.message);
        });

        // ── 4. GAST-MODUS (WEITER OHNE ACCOUNT) ──
        guestBtn.addEventListener('click', () => {
            showMessage("Gast-Modus aktiviert. Lade Hub... ☹", false);
            setTimeout(() => {
                // Leitet an die Hauptseite weiter mit dem Parameter ?guest=true
                window.location.href = 'index.html?guest=true';
            }, 1000);
        });
    </script>
</body>
</html>
