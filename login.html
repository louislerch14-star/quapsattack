<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="icon" type="image/png" href="unnamed.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quaps Attack Login | Community Hub</title>
    <meta name="description" content="Melde dich beim Quaps Attack Community Hub an, um Clips zu sehen und die Hymne zu hören.">
    <meta name="keywords" content="quapsattack login, quaps attack, minecraft hub">
    
    <meta property="og:title" content="Quaps Attack Login">
    <meta property="og:description" content="Sicherer Login für die Quaps Attack Community.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #a8ff78; /* Frisches XP-Grün */
            --gold: #f5c518;
            --bg: #0a0a0a;
            --panel: #1a1a1a;
            --border: #333333;
            --text: #f0f0f0;
            --muted: #aaaaaa;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'VT323', monospace;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-size: 1.3rem;
            overflow: hidden;
        }

        /* ── BACKGROUND & OVERLAY ── */
        .background-image {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at center, #111 0%, #050505 100%);
        }

        .login-overlay {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 1;
        }

        .login-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            transition: 0.3s;
        }
        .login-card:hover {
            border-color: rgba(255,255,255,0.1);
        }

        .logo-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.1rem;
            color: var(--primary);
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        /* ── FORMS & INPUTS ── */
        .mc-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.45rem;
            color: var(--gold);
            display: block;
            text-align: left;
            margin-bottom: 6px;
        }

        input {
            display: block;
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 10px;
            color: #fff;
            margin-bottom: 18px;
            font-family: inherit;
            font-size: 1.1rem;
            transition: 0.2s;
        }
        input:focus {
            border-color: var(--primary);
            outline: none;
            background: rgba(0,0,0,0.7);
        }

        button {
            display: block;
            width: 100%;
            background: #222222;
            color: var(--primary);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: 0.2s;
        }
        button:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .secondary-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 0.9rem;
            text-decoration: underline;
            margin-top: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .secondary-btn:hover { color: #fff; background: transparent; }

        .divider {
            margin: 25px 0;
            color: #333;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.4rem;
            letter-spacing: 2px;
        }

        /* ── GOOGLE BUTTON & PIXEL LOGO ── */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #44d4d4;
        }

        /* Pixel-Art Google G komplett aus Box-Shadows gebaut */
        .pixel-google-icon {
            width: 18px;
            height: 18px;
            position: relative;
            background: transparent;
            /* Definiert das verpixelte "G" im Grid */
            box-shadow: 
                /* Oben */
                4px 0px 0 #ea4335, 6px 0px 0 #ea4335, 8px 0px 0 #ea4335, 10px 0px 0 #ea4335, 12px 0px 0 #ea4335,
                2px 2px 0 #ea4335, 14px 2px 0 #ea4335,
                /* Links */
                0px 4px 0 #ea4335, 0px 6px 0 #ea4335, 0px 8px 0 #4285f4, 0px 10px 0 #4285f4, 0px 12px 0 #fabc05,
                2px 14px 0 #fabc05,
                /* Unten */
                4px 16px 0 #34a853, 6px 16px 0 #34a853, 8px 16px 0 #34a853, 10px 16px 0 #34a853, 12px 16px 0 #34a853,
                14px 14px 0 #34a853,
                /* Rechts & Mitte (Balken) */
                16px 12px 0 #4285f4, 16px 10px 0 #4285f4, 16px 8px 0 #4285f4,
                14px 8px 0 #4285f4, 12px 8px 0 #4285f4, 10px 8px 0 #4285f4, 8px 8px 0 #4285f4;
            transform: scale(1.1);
            margin-right: 4px;
        }

        #message {
            margin-top: 15px;
            font-size: 1rem;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="background-image"></div>

    <div class="login-overlay">
        <div class="login-card">
            <h1 class="logo-text">QUAPS ATTACK!</h1>
            
            <form id="loginForm">
                <label class="mc-label">E-Mail Adresse</label>
                <input type="email" id="email" placeholder="agent@quaps.de" required>
                
                <label class="mc-label">Passwort</label>
                <input type="password" id="password" placeholder="••••••••" required>
                
                <button type="submit">LOGIN // MAIL</button>
            </form>

            <button class="secondary-btn" id="registerBtn">Noch kein Account? Registrieren</button>

            <div class="divider">--------- OR ---------</div>

            <button class="google-btn" id="googleBtn">
                <div class="pixel-google-icon"></div>
                SIGN IN WITH GOOGLE
            </button>

            <div id="message"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://aklhszhwwyvrwprdefhz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_f6E_FUr75feDBx-X7zWfVQ_2FCuMxx2";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const googleBtn = document.getElementById('googleBtn');
        const registerBtn = document.getElementById('registerBtn');
        const messageDiv = document.getElementById('message');

        function showMessage(text, isError = true) {
            messageDiv.style.color = isError ? "#ff4d4d" : "#a8ff78";
            messageDiv.textContent = text;
        }

        // 1. E-Mail Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showMessage("");

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: emailInput.value,
                password: passwordInput.value,
            });

            if (error) {
                showMessage(error.message);
            } else {
                showMessage("Login erfolgreich! Weiterleitung...", false);
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            }
        });

        // 2. E-Mail Registrierung
        registerBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            showMessage("");

            if (!emailInput.value || !passwordInput.value) {
                showMessage("Bitte E-Mail und Passwort eingeben.");
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({
                email: emailInput.value,
                password: passwordInput.value,
            });

            if (error) {
                showMessage(error.message);
            } else {
                showMessage("Account erstellt! Du kannst dich jetzt einloggen.", false);
            }
        });

        // 3. Google OAuth Login
        googleBtn.addEventListener('click', async () => {
            showMessage("");
            
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/index.html'
                }
            });

            if (error) {
                showMessage("Google Login fehlgeschlagen: " + error.message);
            }
        });
    </script>
</body>
</html>
