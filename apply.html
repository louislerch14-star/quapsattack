<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quaps Attack | Recruitment</title>
    <link rel="icon" type="image/png" href="unnamed.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d4ff;
            --bg-dark: #050506;
            --card-glass: rgba(20, 20, 25, 0.85);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #888888;
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-system {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(5,5,6,0.7) 0%, rgba(5,5,6,1) 90%), 
                        url('unnamed.jpg') center/cover no-repeat;
            z-index: -1;
            filter: blur(8px);
            transform: scale(1.1);
        }

        /* Formular Container */
        .apply-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            width: 100%;
        }

        .apply-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border-glass);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }

        h1 { font-weight: 900; font-size: 2.2rem; margin: 0; text-align: center; letter-spacing: -1px; }
        p.subtitle { color: var(--primary); text-align: center; text-transform: uppercase; letter-spacing: 3px; font-size: 0.75rem; margin-bottom: 35px; font-weight: 600; }

        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

        input, select, textarea {
            width: 100%;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus, textarea:focus { 
            border-color: var(--primary); 
            background: rgba(0,212,255,0.05);
        }

        select option { background: #0a0a0c; color: white; }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: black;
            border: none;
            border-radius: 14px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .submit-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 25px rgba(0,212,255,0.4);
        }

        .back-link { display: block; text-align: center; margin-top: 25px; color: #444; text-decoration: none; font-size: 0.8rem; font-weight: 600; }
        .back-link:hover { color: var(--primary); }

        /* Footer Styling */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border-glass);
            background: rgba(0, 0, 0, 0.4);
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .footer-info {
            color: var(--text-dim);
            font-size: 0.75rem;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .footer-logo {
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: white;
        }

        .footer-logo span {
            color: var(--primary);
            background: rgba(0, 212, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 5px;
            font-size: 0.8rem;
        }

        .copyright {
            color: #444;
            font-size: 0.7rem;
            line-height: 1.6;
        }

        .version-tag {
            color: #222;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="bg-system"></div>

    <div class="apply-wrapper">
        <div class="apply-container">
            <h1>JOIN US</h1>
            <p class="subtitle">Operations Recruitment</p>

            <form action="https://formspree.io/f/xdabgyro" method="POST">
                
                <div class="form-group">
                    <label>Zuweisung</label>
                    <select name="Projekt-Ziel" required>
                        <option value="" disabled selected>Wähle ein Projekt...</option>
                        <option value="QuapsAttack">QuapsAttack (Vanilla)</option>
                        <option value="Evolution">QuapsEvolution (Modded)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Identity (Username)</label>
                    <input type="text" name="Discord-ID" placeholder="Steve123" required>
                </div>

                <div class="form-group">
                    <label>Warum willst du beitreten?</label>
                    <textarea name="Bewerbungstext" placeholder="Deine Nachricht...(min 3 Sätze)" required style="min-height: 100px; resize: none;"></textarea>
                </div>

                <input type="hidden" name="_subject" value="Neue Agenten-Bewerbung!">
                <input type="hidden" name="_next" value="https://quapsattack.airbusfan.de/index.html">

                <button type="submit" class="submit-btn">Bewerbung übermitteln</button>
            </form>

            <a href="index.html" class="back-link">ABBRUCH & ZURÜCK</a>
        </div>
    </div>

    <footer>
        <div class="footer-info">QUAPS ATTACK // 2026 OFFICIAL ENCRYPTED PORTAL</div>

        <div class="footer-logo">QUAPS ATTACK <span>OFFICIAL</span></div>
        
        <div class="copyright">
            &copy; 2026 Quaps Attack Studio. All rights reserved. <br>
            <span class="version-tag">Evolved v1.0 // Modded Environment</span>
        </div>
    </footer>

</body>
</html>
