<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmeldung & Registrierung</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #3b82f6;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #aaa;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }
    button:hover {
      background: #2563eb;
    }
    .strength-meter {
      height: 6px;
      width: 100%;
      background: #333;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    .strength-bar {
      height: 100%;
      width: 0%;
      background: #ef4444;
      transition: width 0.3s, background-color 0.3s;
    }
    .requirements {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
      padding-left: 18px;
    }
    .requirements li {
      margin-bottom: 4px;
    }
    .requirements li.valid {
      color: #22c55e;
    }
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .message.error {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      display: block;
    }
    .message.success {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      display: block;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- PHASE 1: E-Mail eingeben für Bestätigung -->
  <div id="phase-email">
    <h2>Registrieren</h2>
    <p style="font-size: 13px; color: #aaa; text-align: center;">Gib deine E-Mail ein, um einen Bestätigungslink zu erhalten.</p>
    <div class="input-group">
      <label for="email">E-Mail Adresse</label>
      <input type="email" id="email" placeholder="deine@email.de" required>
    </div>
    <button id="btn-send-email">Bestätigungs-E-Mail senden</button>
  </div>

  <!-- PHASE 2: Passwort festlegen (wird erst sichtbar nach Klick in der E-Mail) -->
  <div id="phase-password" class="hidden">
    <h2>Passwort festlegen</h2>
    <p style="font-size: 13px; color: #aaa; text-align: center;">E-Mail erfolgreich bestätigt! Wähle jetzt dein Passwort.</p>
    <div class="input-group">
      <label for="password">Neues Passwort</label>
      <input type="password" id="password" placeholder="••••••••" required>
      
      <!-- Stärke-Balken -->
      <div class="strength-meter">
        <div id="strength-bar" class="strength-bar"></div>
      </div>

      <!-- Kriterien-Liste -->
      <ul class="requirements">
        <li id="req-length">Mindestens 8 Zeichen</li>
        <li id="req-upper">Ein Großbuchstabe</li>
        <li id="req-number">Eine Zahl</li>
        <li id="req-special">Ein Sonderzeichen (!@#$%^&*)</li>
      </ul>
    </div>
    <button id="btn-set-password">Passwort speichern & Einloggen</button>
  </div>

  <div id="status-msg" class="message"></div>
</div>

<script>
  // Supabase Initialisierung
  const SUPABASE_URL = 'DEINE_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'DEIN_SUPABASE_ANON_KEY';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const phaseEmail = document.getElementById('phase-email');
  const phasePassword = document.getElementById('phase-password');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const btnSendEmail = document.getElementById('btn-send-email');
  const btnSetPassword = document.getElementById('btn-set-password');
  const statusMsg = document.getElementById('status-msg');

  const strengthBar = document.getElementById('strength-bar');
  const reqLength = document.getElementById('req-length');
  const reqUpper = document.getElementById('req-upper');
  const reqNumber = document.getElementById('req-number');
  const reqSpecial = document.getElementById('req-special');

  // 1. Prüfen, ob der User über den Bestätigungs-Link in der E-Mail auf die Seite kam
  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabase.auth.getSession();
    
    // Wenn eine Session existiert (durch Klick auf den E-Mail Link), schalten wir auf Passwort-Eingabe um
    if (session) {
      phaseEmail.classList.add('hidden');
      phasePassword.classList.remove('hidden');
    }
  });

  // 2. Bestätigungs-E-Mail anfordern (OTP / Magic Link)
  btnSendEmail.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    if (!email) {
      showStatus('Bitte gib eine gültige E-Mail ein.', 'error');
      return;
    }

    btnSendEmail.disabled = true;
    btnSendEmail.innerText = 'Sende E-Mail...';

    const { error } = await supabase.auth.signInWithOtp({
      email: email,
      options: {
        emailRedirectTo: window.location.href // Leitet nach Klick in der Mail zurück auf diese Seite
      }
    });

    if (error) {
      showStatus('Fehler: ' + error.message, 'error');
      btnSendEmail.disabled = false;
      btnSendEmail.innerText = 'Bestätigungs-E-Mail senden';
    } else {
      showStatus('Bestätigungs-E-Mail gesendet! Prüfe dein Postfach.', 'success');
      btnSendEmail.innerText = 'E-Mail gesendet ✓';
    }
  });

  // 3. Live Passwort-Stärke-Prüfung
  passwordInput.addEventListener('input', () => {
    const val = passwordInput.value;
    let score = 0;

    // Kriterien checken
    const hasLength = val.length >= 8;
    const hasUpper = /[A-Z]/.test(val);
    const hasNumber = /[0-9]/.test(val);
    const hasSpecial = /[^A-Za-z0-9]/.test(val);

    reqLength.classList.toggle('valid', hasLength);
    reqUpper.classList.toggle('valid', hasUpper);
    reqNumber.classList.toggle('valid', hasNumber);
    reqSpecial.classList.toggle('valid', hasSpecial);

    if (hasLength) score++;
    if (hasUpper) score++;
    if (hasNumber) score++;
    if (hasSpecial) score++;

    // Balken anpassen & Farben vergeben
    switch(score) {
      case 0:
        strengthBar.style.width = '0%';
        strengthBar.style.backgroundColor = '#ef4444';
        break;
      case 1:
        strengthBar.style.width = '25%';
        strengthBar.style.backgroundColor = '#ef4444'; // Rot
        break;
      case 2:
        strengthBar.style.width = '50%';
        strengthBar.style.backgroundColor = '#f59e0b'; // Gelb
        break;
      case 3:
        strengthBar.style.width = '75%';
        strengthBar.style.backgroundColor = '#eab308'; // Gelb-Grün
        break;
      case 4:
        strengthBar.style.width = '100%';
        strengthBar.style.backgroundColor = '#22c55e'; // Grün
        break;
    }
  });

  // 4. Passwort nach E-Mail-Bestätigung speichern
  btnSetPassword.addEventListener('click', async () => {
    const password = passwordInput.value;

    if (password.length < 8) {
      showStatus('Das Passwort muss mindestens 8 Zeichen lang sein.', 'error');
      return;
    }

    btnSetPassword.disabled = true;
    btnSetPassword.innerText = 'Speichere Passwort...';

    const { error } = await supabase.auth.updateUser({
      password: password
    });

    if (error) {
      showStatus('Fehler: ' + error.message, 'error');
      btnSetPassword.disabled = false;
      btnSetPassword.innerText = 'Passwort speichern & Einloggen';
    } else {
      showStatus('Erfolgreich! Du wirst weitergeleitet...', 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1500);
    }
  });

  function showStatus(text, type) {
    statusMsg.innerText = text;
    statusMsg.className = `message ${type}`;
  }
</script>

</body>
</html>
