<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anmeldung & Registrierung</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .tabs {
      display: flex;
      border-bottom: 2px solid #333;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s, border-bottom 0.2s;
    }
    .tab-btn.active {
      color: #3b82f6;
      border-bottom: 2px solid #3b82f6;
      margin-bottom: -2px;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #aaa;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }
    button:hover {
      background: #2563eb;
    }
    .btn-secondary {
      background: transparent;
      border: none;
      color: #3b82f6;
      margin-top: 10px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }
    .btn-secondary:hover {
      color: #60a5fa;
    }
    .strength-meter {
      height: 6px;
      width: 100%;
      background: #333;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    .strength-bar {
      height: 100%;
      width: 0%;
      background: #ef4444;
      transition: width 0.3s, background-color 0.3s;
    }
    .requirements {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
      padding-left: 18px;
    }
    .requirements li {
      margin-bottom: 4px;
    }
    .requirements li.valid {
      color: #22c55e;
    }
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .message.error {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      display: block;
    }
    .message.success {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      display: block;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Tabs für Umschalten zwischen Login & Registrieren -->
  <div class="tabs" id="tab-header">
    <button class="tab-btn active" id="tab-login-btn">Anmelden</button>
    <button class="tab-btn" id="tab-register-btn">Registrieren</button>
  </div>

  <!-- TAB 1: NORMALES ANMELDEN (Mit Passwort) -->
  <div id="view-login">
    <div class="input-group">
      <label for="login-email">E-Mail Adresse</label>
      <input type="email" id="login-email" placeholder="deine@email.de" required>
    </div>
    <div class="input-group">
      <label for="login-password">Passwort</label>
      <input type="password" id="login-password" placeholder="••••••••" required>
    </div>
    <button id="btn-login">Einloggen</button>
    <div style="text-align: center; margin-top: 10px;">
      <button id="btn-forgot-pw" class="btn-secondary">Passwort vergessen?</button>
    </div>
  </div>

  <!-- TAB 2 - PHASE 1: REGISTRIEREN (E-Mail senden) -->
  <div id="view-register" class="hidden">
    <p style="font-size: 13px; color: #aaa; text-align: center; margin-top: 0;">Gib deine E-Mail ein, um einen Bestätigungslink zu erhalten.</p>
    <div class="input-group">
      <label for="reg-email">E-Mail Adresse</label>
      <input type="email" id="reg-email" placeholder="deine@email.de" required>
    </div>
    <button id="btn-send-email">Bestätigungs-E-Mail senden</button>
  </div>

  <!-- TAB 2 - PHASE 2: PASSWORT FESTLEGEN (Nach Mail-Klick) -->
  <div id="view-set-password" class="hidden">
    <h3 style="margin-top: 0; text-align: center; color: #3b82f6;">Neues Passwort festlegen</h3>
    <p style="font-size: 13px; color: #aaa; text-align: center;">E-Mail verifiziert! Wähle jetzt dein Passwort.</p>
    <div class="input-group">
      <label for="new-password">Passwort</label>
      <input type="password" id="new-password" placeholder="••••••••" required>
      
      <div class="strength-meter">
        <div id="strength-bar" class="strength-bar"></div>
      </div>

      <ul class="requirements">
        <li id="req-length">Mindestens 8 Zeichen</li>
        <li id="req-upper">Ein Großbuchstabe</li>
        <li id="req-number">Eine Zahl</li>
        <li id="req-special">Ein Sonderzeichen (!@#$%^&*)</li>
      </ul>
    </div>
    <button id="btn-save-password">Passwort speichern & Einloggen</button>
  </div>

  <div id="status-msg" class="message"></div>
</div>

<script>
  const SUPABASE_URL = 'https://xibaufkxapezpuvszpxf.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpYmF1Zmt4YXBlenB1dnN6cHhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjEwNzUsImV4cCI6MjEwMzkzNzA3NX0.Tv3IKj95iBsGy5TGTosb7mMT-d_sySuu7QZ4RpNhB5E';
  
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Tab Elemente
  const tabHeader = document.getElementById('tab-header');
  const tabLoginBtn = document.getElementById('tab-login-btn');
  const tabRegisterBtn = document.getElementById('tab-register-btn');
  const viewLogin = document.getElementById('view-login');
  const viewRegister = document.getElementById('view-register');
  const viewSetPassword = document.getElementById('view-set-password');

  // Input & Button Elemente
  const loginEmail = document.getElementById('login-email');
  const loginPassword = document.getElementById('login-password');
  const btnLogin = document.getElementById('btn-login');
  const btnForgotPw = document.getElementById('btn-forgot-pw');

  const regEmail = document.getElementById('reg-email');
  const btnSendEmail = document.getElementById('btn-send-email');

  const newPassword = document.getElementById('new-password');
  const btnSavePassword = document.getElementById('btn-save-password');
  const statusMsg = document.getElementById('status-msg');

  const strengthBar = document.getElementById('strength-bar');
  const reqLength = document.getElementById('req-length');
  const reqUpper = document.getElementById('req-upper');
  const reqNumber = document.getElementById('req-number');
  const reqSpecial = document.getElementById('req-special');

  // 1. Tab-Umschaltung
  tabLoginBtn.addEventListener('click', () => {
    tabLoginBtn.classList.add('active');
    tabRegisterBtn.classList.remove('active');
    viewLogin.classList.remove('hidden');
    viewRegister.classList.add('hidden');
    viewSetPassword.classList.add('hidden');
    hideStatus();
  });

  tabRegisterBtn.addEventListener('click', () => {
    tabRegisterBtn.classList.add('active');
    tabLoginBtn.classList.remove('active');
    viewRegister.classList.remove('hidden');
    viewLogin.classList.add('hidden');
    viewSetPassword.classList.add('hidden');
    hideStatus();
  });

  // 2. Automatischer Check nach E-Mail-Link-Klick
  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    
    if (session) {
      // Wenn der User über einen E-Mail Link auf die Seite kam
      tabHeader.classList.add('hidden');
      viewLogin.classList.add('hidden');
      viewRegister.classList.add('hidden');
      viewSetPassword.classList.remove('hidden');
    }
  });

  // 3. Normaler Login mit E-Mail & Passwort
  btnLogin.addEventListener('click', async () => {
    const email = loginEmail.value.trim();
    const password = loginPassword.value;

    if (!email || !password) {
      showStatus('Bitte E-Mail und Passwort eingeben.', 'error');
      return;
    }

    btnLogin.disabled = true;
    btnLogin.innerText = 'Logge ein...';

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      showStatus('Anmeldung fehlgeschlagen: ' + error.message, 'error');
      btnLogin.disabled = false;
      btnLogin.innerText = 'Einloggen';
    } else {
      showStatus('Erfolgreich eingeloggt! Weiterleitung...', 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1000);
    }
  });

  // 4. Passwort Vergessen Link
  btnForgotPw.addEventListener('click', async () => {
    const email = loginEmail.value.trim();
    if (!email) {
      showStatus('Trage oben deine E-Mail ein und klicke dann erneut auf "Passwort vergessen?".', 'error');
      return;
    }

    btnForgotPw.disabled = true;
    btnForgotPw.innerText = 'Sende Reset-Link...';

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.href
    });

    if (error) {
      showStatus('Fehler: ' + error.message, 'error');
      btnForgotPw.disabled = false;
      btnForgotPw.innerText = 'Passwort vergessen?';
    } else {
      showStatus('Reset-Link wurde an deine E-Mail gesendet!', 'success');
      btnForgotPw.innerText = 'Link gesendet ✓';
    }
  });

  // 5. Registrierung: E-Mail senden
  btnSendEmail.addEventListener('click', async () => {
    const email = regEmail.value.trim();
    if (!email) {
      showStatus('Bitte gib eine gültige E-Mail ein.', 'error');
      return;
    }

    btnSendEmail.disabled = true;
    btnSendEmail.innerText = 'Sende E-Mail...';

    const { error } = await supabaseClient.auth.signInWithOtp({
      email: email,
      options: {
        emailRedirectTo: window.location.href
      }
    });

    if (error) {
      showStatus('Fehler: ' + error.message, 'error');
      btnSendEmail.disabled = false;
      btnSendEmail.innerText = 'Bestätigungs-E-Mail senden';
    } else {
      showStatus('Bestätigungs-E-Mail gesendet! Prüfe dein Postfach.', 'success');
      btnSendEmail.innerText = 'E-Mail gesendet ✓';
    }
  });

  // 6. Passwort-Stärke-Prüfung
  newPassword.addEventListener('input', () => {
    const val = newPassword.value;
    let score = 0;

    const hasLength = val.length >= 8;
    const hasUpper = /[A-Z]/.test(val);
    const hasNumber = /[0-9]/.test(val);
    const hasSpecial = /[^A-Za-z0-9]/.test(val);

    reqLength.classList.toggle('valid', hasLength);
    reqUpper.classList.toggle('valid', hasUpper);
    reqNumber.classList.toggle('valid', hasNumber);
    reqSpecial.classList.toggle('valid', hasSpecial);

    if (hasLength) score++;
    if (hasUpper) score++;
    if (hasNumber) score++;
    if (hasSpecial) score++;

    switch(score) {
      case 0: strengthBar.style.width = '0%'; strengthBar.style.backgroundColor = '#ef4444'; break;
      case 1: strengthBar.style.width = '25%'; strengthBar.style.backgroundColor = '#ef4444'; break;
      case 2: strengthBar.style.width = '50%'; strengthBar.style.backgroundColor = '#f59e0b'; break;
      case 3: strengthBar.style.width = '75%'; strengthBar.style.backgroundColor = '#eab308'; break;
      case 4: strengthBar.style.width = '100%'; strengthBar.style.backgroundColor = '#22c55e'; break;
    }
  });

  // 7. Passwort nach Mail-Klick festlegen
  btnSavePassword.addEventListener('click', async () => {
    const password = newPassword.value;

    if (password.length < 8) {
      showStatus('Das Passwort muss mindestens 8 Zeichen lang sein.', 'error');
      return;
    }

    btnSavePassword.disabled = true;
    btnSavePassword.innerText = 'Speichere Passwort...';

    const { error } = await supabaseClient.auth.updateUser({
      password: password
    });

    if (error) {
      showStatus('Fehler: ' + error.message, 'error');
      btnSavePassword.disabled = false;
      btnSavePassword.innerText = 'Passwort speichern & Einloggen';
    } else {
      showStatus('Erfolgreich! Du wirst weitergeleitet...', 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1500);
    }
  });

  function showStatus(text, type) {
    statusMsg.innerText = text;
    statusMsg.className = `message ${type}`;
  }

  function hideStatus() {
    statusMsg.className = 'message hidden';
  }
</script>

</body>
</html>
